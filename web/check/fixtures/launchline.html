<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="a"></div><div id="b"></div>
<script type="module">
// The command a project's next launch runs: the stream's plumbing folded into
// one word, the project's own values underlined, the contour's dashed.
import { h, render } from "preact";
import { LaunchLine, drift, onStream } from "/src/ui/launchline.js";
import { ownLabel } from "/src/ui/own.js";

const stream = { words: [{ text: "claude" },
    ...["-p", "--input-format", "stream-json", "--verbose"].map((text) => ({ text, key: "transport", layer: "project" })),
    { text: "-n" }, { text: "person" },
    { text: "--effort", key: "effort", layer: "contour" }, { text: "high", key: "effort", layer: "contour" }],
    then: [{ text: "remote control on", key: "remoteControl", layer: "project" }, { text: "go", key: "intent", layer: "project" }] };
const tmux = { words: [{ text: "claude" }, { text: "-n" }, { text: "aacpanel" },
    { text: "--remote-control", key: "remoteControl", layer: "project" }, { text: "aacpanel", key: "remoteControl", layer: "project" }] };
render(h(LaunchLine, { line: stream }), document.getElementById("a"));
render(h(LaunchLine, { line: tmux }), document.getElementById("b"));

window.done = (async () => {
    await new Promise((r) => setTimeout(r, 50));
    const words = (id) => [...document.querySelectorAll(`#${id} .lw`)].map((w) => w.textContent);
    // Where the value of each word came from, as the line marks it.
    const layers = (id) => [...document.querySelectorAll(`#${id} .lw`)].map((w) => w.dataset.layer);
    return {
        stream: words("a"), tmux: words("b"), streamLayers: layers("a"), tmuxLayers: layers("b"),
        then: (document.querySelector("#a .lthen") || {}).textContent || "",
        tmuxThen: Boolean(document.querySelector("#b .lthen")),
        onStream: [onStream(stream), onStream(tmux), onStream(null)],
        drift: [
            ...drift(stream, { session: "person", transport: "", model: "claude-fable-5-1" }),
            ...drift({ words: [{ text: "claude" }, { text: "--model", key: "model" }, { text: "opus", key: "model" }] },
                { session: "api", transport: null, model: "claude-fable-5-1" }),
            ...drift(tmux, { session: "aacpanel", transport: null, model: "claude-sonnet-5" }),
        ],
        labels: [{ key: "transport", value: "stream" }, { key: "remoteControl", value: false }, { key: "contextCap", value: 70 },
              { key: "intent", value: "" }, { key: "model", value: "sonnet" },
              { key: "effort", value: "xhigh" }, { key: "codexEffort", value: "xhigh" },
              { key: "codexModel", value: "gpt-6" }, { key: "transport", value: "tmux" },
              { key: "codexTransport", value: "tmux" }].map(ownLabel),
    };
})();
</script>
