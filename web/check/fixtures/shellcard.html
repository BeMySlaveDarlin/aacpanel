<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The chat screen the panel ships, over a fake host: a command typed after "!"
// into a session on the stream and into one in tmux, what goes out for
// each, and the card the stream session's command gets in the feed — going
// out, running, and over once the transcript brings its output.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const items = [
    { role: "me", pos: 20, text: "run the checks", at: new Date(Date.now() - 60000).toISOString() },
    { role: "ai", pos: 40, text: "The checks are green.", at: new Date(Date.now() - 55000).toISOString() },
];

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
let sends = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") {
        const body = JSON.parse((init && init.body) || "{}");
        sends.push({ kind: body.kind, text: (body.params || {}).text || "", messageId: (body.params || {}).messageId || "" });
        await new Promise((r) => setTimeout(r, 300));
        if ((body.params || {}).text === "make deploy") {
            return new Response("session demo is closing and takes no more input", { status: 502 });
        }
        return json({ logged: true });
    }
    return new Response("", { status: 404 });
};
// The live feed: the page keeps the stream open, and the fixture writes into
// it what the transcript would bring.
let feed = null;
window.EventSource = class {
    constructor() { this.readyState = 1; this.listeners = {}; feed = this; }
    addEventListener(type, fn) { (this.listeners[type] ||= []).push(fn); }
    close() { this.readyState = 2; }
};
const bring = (more) => (feed.listeners.chat || []).forEach((fn) => fn({ data: JSON.stringify({ items: more }) }));

const exec = { available: true };
const idle = { pct: 12.4, tokens: 124000, limit: 1000000, tokensIn: 124000, tokensOut: 8000, status: "idle" };

function Page({ name, first }) {
    const [live] = useState(first);
    return h(Chat, { name, id: `${name}-1`, live, exec, onBack: () => {}, onUsage: () => {} });
}

const root = document.getElementById("root");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function mount(name, first) {
    render(null, root);
    sends = [];
    feed = null;
    render(h(ToastHost, null, h(GateHost, null, h(Page, { name, first }))), root);
    for (let i = 0; i < 60 && !(document.querySelector(".composer textarea") && feed); i += 1) await sleep(50);
    await sleep(150);
}

const write = (text) => {
    const area = document.querySelector(".composer textarea");
    area.value = text;
    area.dispatchEvent(new Event("input", { bubbles: true }));
};
const tap = () => document.querySelector(".composer .iconbtn.accent").click();

// cards reads the command cards of the feed, in order: the command, where it
// stands and in which tone, the output under it and why it did not start. A
// card is its head and what follows it in the feed up to the next head.
const cards = () => {
    const out = [];
    for (const el of document.querySelectorAll(".chatfeed .mshell, .chatfeed .mshellout, .chatfeed .mshellerr, .chatfeed .mwait")) {
        if (el.matches(".mshell")) {
            const at = el.querySelector(".mshellat");
            out.push({
                command: el.querySelector(".mshellcmd").textContent,
                stands: at ? at.textContent.replace(/\s+/g, " ").trim() : "",
                tone: at ? at.className.replace("mshellat", "").trim() : "",
                output: "",
                failed: "",
            });
            continue;
        }
        const card = out[out.length - 1];
        if (!card) continue;
        if (el.matches(".mshellout")) card.output = el.textContent;
        if (el.matches(".mwait")) card.failed = el.textContent.trim();
    }
    return out;
};

async function onTheStream() {
    await mount("demo", { ...idle, transport: "stream" });
    const bubbles = () => document.querySelectorAll(".chatfeed .msg.me").length;
    const before = bubbles();
    write("! git status");
    await sleep(60);
    const title = document.querySelector(".composer .iconbtn.accent").getAttribute("title");
    tap();
    await sleep(80);
    const going = cards();
    await sleep(400);
    const started = cards();
    await sleep(1100);
    const running = cards();

    // The command ends: the host's transcript brings the command and its
    // output, and the card the page drew gives way to it.
    const out = Array.from({ length: 14 }, (_, i) => `line ${i + 1}`).join("\n");
    bring([
        { role: "shell", pos: 60, text: "git status", code: 0, at: new Date().toISOString() },
        { role: "shellout", pos: 60, text: out, command: "git status", code: 0, at: new Date().toISOString() },
    ]);
    await sleep(200);
    const ended = cards();
    const more = document.querySelector(".chatfeed .mshellmore");
    const moreText = more ? more.textContent.replace(/\s+/g, " ").trim() : "";
    if (more) more.click();
    await sleep(250);
    const sheet = document.querySelector(".sheet.on .shellsheet");
    const whole = {
        open: Boolean(sheet),
        command: sheet ? (sheet.querySelector(".mshellcmd") || { textContent: "" }).textContent : "",
        lines: sheet ? sheet.querySelector(".shellwhole").textContent.split("\n").length : 0,
    };
    const close = document.querySelector(".sheet.on .sheetclose, .sheet.on [aria-label='close']");
    if (close) close.click();
    await sleep(200);

    // The same command again: the run before it is in the feed already, and
    // it is not this one's end.
    write("!git status");
    await sleep(60);
    tap();
    await sleep(500);
    const again = cards();

    // A command the host does not take says why, on its card.
    write("! make deploy");
    await sleep(60);
    tap();
    await sleep(500);
    const refused = cards();

    return { title, going, started, running, ended, moreText, whole, again, refused,
             sends: sends.slice(), bubbles: bubbles() - before };
}

async function inAConsole() {
    await mount("term", { ...idle, transport: "console" });
    write("! git status");
    await sleep(60);
    tap();
    await sleep(500);
    return { sends: sends.slice(), cards: cards().length,
             bubbles: Array.from(document.querySelectorAll(".chatfeed .msg.me")).map((b) => b.textContent.trim())
                 .filter((text) => text !== "run the checks") };
}

window.done = (async () => {
    await document.fonts.ready;
    return { stream: await onTheStream(), console: await inAConsole() };
})();
</script>
