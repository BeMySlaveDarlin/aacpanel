<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The chat screen of a live session whose directory is too long for a line:
// where the directory and the tokens in and out stand.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const items = [{ role: "me", pos: 10, text: "where are we", at: new Date().toISOString() },
               { role: "ai", pos: 20, text: "In the project.", at: new Date().toISOString() }];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: 10, last: 20, total: 2, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const cwd = "/home/owner/Projects/Side/service/a-rather-long-group/and-a-subgroup/aacpanel";
const live = { status: "idle", pct: 12.4, tokens: 124000, limit: 1000000, tokensIn: 124000, tokensOut: 8000,
               cwd, lastRequestAt: new Date(Date.now() - 120000).toISOString() };
render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="aacpanel" id="s1" live=${live} exec=${{ available: true }} onBack=${() => {}} onUsage=${() => {}} />`)),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const round = (n) => Math.round(n);

window.done = (async () => {
    await document.fonts.ready;
    for (let i = 0; i < 50 && !document.querySelector(".composer textarea"); i++) await sleep(100);
    await sleep(300);
    const out = {};
    const head = document.querySelector(".chathead");
    out.headUse = Boolean(head && head.querySelector(".deckuse"));
    // Where the session works stands in the line under the name: the home as
    // a tilde, and a path too long for the line cut at its start, so its end
    // — the project — stays in sight on the line of the state.
    const path = head && head.querySelector(".chatpath");
    out.headPath = path ? path.textContent.trim() : "";
    if (path) {
        const box = path.getBoundingClientRect();
        const text = path.querySelector("bdi").firstChild;
        const range = document.createRange();
        range.setStart(text, text.length - 1);
        range.setEnd(text, text.length);
        const last = range.getBoundingClientRect();
        out.headPathCut = path.scrollWidth > path.clientWidth;
        out.headTailShown = last.width > 0 && last.left >= box.left - 1 && last.right <= box.right + 1;
        const word = head.querySelector(".talkword").getBoundingClientRect();
        out.headPathOnLine = Math.abs((box.top + box.bottom) / 2 - (word.top + word.bottom) / 2) < 4;
    }
    out.deck = Boolean(document.querySelector(".deck"));
    const use = document.querySelector(".deck .deckuse");
    out.deckUse = Boolean(use);
    if (use) {
        const deck = document.querySelector(".deck").getBoundingClientRect();
        const box = use.getBoundingClientRect();
        out.deckUseLeftGap = round(box.left - deck.left);
        out.deckUseFirst = document.querySelector(".deck").firstElementChild === use;
    }
    // On a wide screen the chips of what is in flight stand at the right end
    // of the composer's band: how many, how tall beside the model's words.
    const band = document.querySelector(".composer .cstrip");
    const work = band && band.querySelector(".cwork");
    out.stripChips = work ? work.querySelectorAll(".wchip").length : 0;
    if (work) {
        const chip = work.querySelector(".wchip").getBoundingClientRect();
        const words = band.querySelector(".pkchip");
        out.stripChipTall = round(chip.height);
        out.stripWordsTall = words ? round(words.getBoundingClientRect().height) : 0;
        out.stripChipsRight = round(band.getBoundingClientRect().right - work.getBoundingClientRect().right);
    }
    out.wide = document.documentElement.scrollWidth > innerWidth || innerWidth > visualViewport.width + 1;
    const more = document.querySelector(".phead .pmore");
    if (more) {
        more.click();
        for (let i = 0; i < 30 && !document.querySelector(".tools .toolwhere"); i++) await sleep(100);
        const where = document.querySelector(".tools .toolwhere");
        if (where) {
            out.pathText = where.textContent;
            out.cut = where.scrollWidth > where.clientWidth;
        }
    }
    return out;
})();
</script>
