<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The chat screen of a live session whose directory is too long for a line:
// where the directory and the tokens in and out stand.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const items = [{ role: "me", pos: 10, text: "where are we", at: new Date().toISOString() },
               { role: "ai", pos: 20, text: "In the project.", at: new Date().toISOString() }];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: 10, last: 20, total: 2, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const cwd = "/home/owner/Projects/Pets/service/a-rather-long-group/and-a-subgroup/aacpanel";
const live = { status: "idle", pct: 12.4, tokens: 124000, limit: 1000000, tokensIn: 124000, tokensOut: 8000,
               cwd, lastRequestAt: new Date(Date.now() - 120000).toISOString() };
render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="aacpanel" id="s1" live=${live} exec=${{ available: true }} onBack=${() => {}} onUsage=${() => {}} />`)),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const round = (n) => Math.round(n);
// rectOf returns where a piece of the path is drawn.
const rectOf = (node, text) => {
    const at = node.textContent.indexOf(text);
    if (at < 0) return null;
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    const t = walker.nextNode();
    const range = document.createRange();
    range.setStart(t, at);
    range.setEnd(t, at + text.length);
    return range.getBoundingClientRect();
};

window.done = (async () => {
    await document.fonts.ready;
    for (let i = 0; i < 50 && !document.querySelector(".composer textarea"); i++) await sleep(100);
    await sleep(300);
    const out = {};
    const head = document.querySelector(".chathead");
    out.headUse = Boolean(head && head.querySelector(".deckuse"));
    const path = document.querySelector(".chathead .chatpath");
    out.path = Boolean(path);
    out.deck = Boolean(document.querySelector(".deck"));
    const use = document.querySelector(".deck .deckuse");
    out.deckUse = Boolean(use);
    if (use) {
        const deck = document.querySelector(".deck").getBoundingClientRect();
        const box = use.getBoundingClientRect();
        out.deckUseLeftGap = round(box.left - deck.left);
        out.deckUseFirst = document.querySelector(".deck").firstElementChild === use;
    }
    if (path) {
        const line = path.querySelector(".chatpathtext");
        const box = line.getBoundingClientRect();
        out.pathText = line.textContent;
        out.cut = line.scrollWidth > line.clientWidth;
        const end = rectOf(line, "aacpanel");
        const start = rectOf(line, "~/Projects");
        out.endShown = Boolean(end) && end.right <= box.right + 1 && end.left >= box.left - 1;
        out.startHidden = Boolean(start) && start.left < box.left - 1;
        out.lineHeight = round(box.height);
        out.headRight = round(head.getBoundingClientRect().right);
        out.pathRight = round(box.right);
        path.click();
        await sleep(100);
        const whole = path.querySelector(".chatpathtext");
        out.wholeText = whole.textContent;
        out.wholeCut = whole.scrollWidth > whole.clientWidth;
        out.wholeHeight = round(whole.getBoundingClientRect().height);
    }
    return out;
})();
</script>
