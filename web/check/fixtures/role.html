<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} .deskshell{position:static;height:420px} .dkbody{height:420px} #phone{width:390px} #chat{height:700px;display:flex;flex-direction:column}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="dkbody" id="desk"></div></div>
<div id="phone"></div>
<div class="deskshell"><div class="dkbody"><aside class="dkleft"></aside><section class="dkcenter dkchat" id="chat"></section></div></div>
<script type="module">
// The lists keep the role in the tools and show the checklist on the card.
// The session tools name the role next to Rename; its sheet counts, saves
// and clears the role without asking a second time.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { LiveLines } from "/src/screens/sessions/blocks.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sent = [];
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [{ role: "ai", pos: 1, text: "Migrations are in review." }], first: 1, last: 1, total: 1, moreBefore: false, state: null });
    if (u.startsWith("/api/session/switch")) return json({ to: "console" });
    if (u.startsWith("/api/session/window")) return json({ state: "none" });
    if (u === "/api/actions" && init && init.method === "POST") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "ok", logged: true });
    }
    return new Response("", { status: 404 });
});
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const lead = "The lead of the project: picks the next task from the queue, reviews what the other sessions hand over and merges it to main, never writes migrations itself";
const split = "The database split and its migrations";
const base = { contour: 4, transport: "stream", cwd: "/srv/shop", model: "claude-opus-5-5" };
const sessions = [
    { ...base, session: "shop", sessionId: "s1", status: "busy", pct: 41, role: lead, checklist: { items: [{ text: "Review the branch and the changes to all the migrations before handing the work to the next session", status: "active" }] } },
    { ...base, session: "shop-db-split", sessionId: "s2", status: "idle", pct: 12, role: split, checklist: { items: [{ text: "Read the schema", status: "done" }, { text: "Run migrations", status: "active" }] } },
    { ...base, session: "shop-queue-watch", sessionId: "s3", status: "idle", pct: 7 },
];
const exec = { available: true, kinds: ["session.close", "session.restart", "session.rename", "session.role", "session.switch", "session.send"] };
const profileMap = [{ id: 4, profile: "Acme", name: "Acme", groups: [] }];
render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: 1, sessions, profileMap, limits: null }, limits: null,
    current: "", onPick() {}, picks: [], setPicks() {}, onNames() {}, onOrder() {}, exec, wait: null,
}))), document.getElementById("desk"));
render(h(ToastHost, null, h(GateHost, null, html`
    <section class="pjblock"><${LiveLines} list=${sessions} notes=${null} wait=${null} onOpen=${() => {}} exec=${exec} /></section>
`)), document.getElementById("phone"));
const chat = document.getElementById("chat");
const talk = (s) => render(h(ToastHost, null, h(GateHost, null, h(Chat, {
    name: s.session, id: s.sessionId, live: s, exec, snapshot: { sessions }, onBack() {}, onUsage() {},
}))), chat);

const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const until = async (ok, what, ms = 4000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => requestAnimationFrame(r));
    if (!ok()) throw new Error(`the screen did not come to ${what}: ${text(document.querySelector(".dkpanel")) || text(chat).slice(0, 300)}`);
};
// rows reads the checklist between the state and the facts, and checks
// the whole card for the role, even if it moved to another element.
const rows = (root, row, name, checklist, state, after) => [...root.querySelectorAll(row)].map((r) => {
    const line = r.querySelector(checklist);
    const role = sessions.find((s) => s.session === text(r.querySelector(name)))?.role;
    const box = line && line.getBoundingClientRect();
    const said = r.querySelector(state).getBoundingClientRect();
    const next = r.querySelector(after);
    return {
        name: text(r.querySelector(name)),
        role: role && text(r).includes(role) ? role : null,
        checklist: text(line),
        cut: Boolean(line) && line.scrollWidth > line.clientWidth + 1,
        oneLine: !line || box.height < 2 * parseFloat(getComputedStyle(line).fontSize),
        placed: !line || (box.top >= said.bottom - 1 && (!next || box.bottom <= next.getBoundingClientRect().top + 1)),
    };
});
const sheet = () => document.querySelector(".sheet.on .rolefield")?.closest(".cmdsheet");
const field = () => document.querySelector(".sheet.on .rolefield");
const buttons = () => [...sheet().querySelectorAll(".btnrow .btn")];
const typeInto = async (value) => {
    field().value = value;
    field().dispatchEvent(new Event("input", { bubbles: true }));
    await quiet();
};
// openRole opens the session button of the conversation and presses the line
// of the role in its panel, and says what the panel listed.
const openRole = async () => {
    await until(() => chat.querySelector(".dkplace"), "the session button");
    // The button is pressed once the screen has bound what answers it.
    await quiet();
    chat.querySelector(".dkplace").click();
    await until(() => [...document.querySelectorAll(".dkpanel .toollabel")].some((l) => text(l) === "Role…"), "the line of the role");
    const labels = [...document.querySelectorAll(".dkpanel .toollabel")].map(text);
    const line = [...document.querySelectorAll(".dkpanel .toolrow")].find((r) => text(r.querySelector(".toollabel")) === "Role…");
    const note = text(line.querySelector(".toolnote"));
    const clamped = getComputedStyle(line.querySelector(".toolnote")).webkitLineClamp;
    line.click();
    await until(() => field(), "the sheet of the role");
    return { labels, note, clamped };
};

window.done = (async () => {
    await document.fonts.ready;
    await quiet();
    const out = {};
    out.desk = rows(document.getElementById("desk"), ".dksess.dklive", ".dkname", ".dkchecklist", ".dksay", ".dkdetail");
    // A phone's card is read whole for the words of its role.
    out.phone = [...document.getElementById("phone").querySelectorAll(".pjcard")].map((card) => {
        const name = text(card.querySelector(".pjsess"));
        const role = (sessions.find((s) => s.session === name) || {}).role;
        return { name, role: role && text(card).includes(role.replace(/\s+/g, " ").trim()) ? role : null };
    });

    talk(sessions[1]);
    const panel = await openRole();
    out.labels = panel.labels;
    out.note = panel.note;
    out.clamped = panel.clamped;
    out.title = text(sheet().querySelector(".cmdhead"));
    out.value = field().value;
    out.count = text(sheet().querySelector(".rolecount"));
    out.buttons = buttons().map(text);
    out.sameOff = buttons().pop().disabled;
    await typeInto("é".repeat(501));
    out.longOff = buttons().pop().disabled;
    out.longSays = text(sheet().querySelector(".rolecount"));
    out.longWarn = sheet().querySelector(".rolecount").classList.contains("stpwarn");
    await typeInto("🙂".repeat(500));
    out.astralOff = buttons().pop().disabled;
    await typeInto("  The migrations of the history tables  \n");
    out.goodOff = buttons().pop().disabled;
    buttons().pop().click();
    await until(() => sent.length === 1 && !field(), "the role saved and the sheet closed");

    await openRole();
    buttons().find((b) => text(b) === "Clear").click();
    await until(() => sent.length === 2 && !field(), "the role cleared and the sheet closed");

    talk(sessions[2]);
    await quiet();
    const none = await openRole();
    out.noneNote = none.note;
    out.noneValue = field().value;
    out.noneButtons = buttons().map(text);
    out.sent = sent.map((b) => `${b.kind}:${b.target}:${JSON.stringify(b.params)}`);
    out.confirmation = Boolean(document.querySelector('.sheet.on[aria-label="action confirmation"]'));
    return out;
})();
</script>
