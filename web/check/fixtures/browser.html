<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body,#root{height:100%;margin:0}.browser-view{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="root"></div>
<script type="module">
import { render } from "preact";
import { html } from "/src/html.js";
import { BrowserViewer } from "/src/screens/browser/viewer.js";
import { Nav } from "/src/ui/nav.js";
import { knows } from "/src/exec.js";

const until = async (condition) => {
    for (let n = 0; n < 300; n++) {
        if (condition()) return;
        await new Promise(requestAnimationFrame);
    }
    throw new Error("The browser fixture did not settle");
};
const wide = innerWidth > 800;
const inputs = [], requests = [], objects = new Set();
const near = "https://near.example";
let source, jpeg, made = 0, revoked = 0;
const makeObject = URL.createObjectURL.bind(URL);
const freeObject = URL.revokeObjectURL.bind(URL);
URL.createObjectURL = (blob) => {
    const url = makeObject(blob);
    objects.add(url);
    made++;
    return url;
};
URL.revokeObjectURL = (url) => {
    if (!objects.delete(url)) throw new Error("An image URL was freed twice");
    revoked++;
    freeObject(url);
};
window.fetch = async (address, init) => {
    const url = new URL(address, location.href);
    if (url.origin !== near || new Headers(init.headers).get("Authorization") !== "Bearer fixture-device") {
        throw new Error("A browser request bypassed the selected endpoint or its device token");
    }
    requests.push(url.pathname);
    if (url.pathname === "/api/browser/input") inputs.push(...JSON.parse(init.body).events);
    else if (url.pathname === "/api/browser/frame") return new Response(jpeg, { headers: {"Content-Type":"image/jpeg"} });
    else if (url.pathname !== "/api/browser/size") throw new Error(`Unexpected browser request: ${url}`);
    return new Response("{}", { status: 200 });
};
window.EventSource = class extends EventTarget {
    constructor(address) {
        super();
        const url = new URL(address, location.href);
        if (url.origin !== near || url.searchParams.get("token") !== "fixture-device") {
            throw new Error("The stream bypassed the selected endpoint or its query token");
        }
        source = this;
        queueMicrotask(() => {
            this.emit("ready", { id: "fixture-view" });
            this.emit("state", {
                tabs: [{id:"tab-a",title:"A quiet place to read",url:"https://example.com/reading"},
                    {id:"tab-b",title:"Notes",url:"about:blank"}],
                current: "tab-a", back: true, forward: false,
            });
            this.frame(1);
        });
    }
    emit(type, body) { this.dispatchEvent(new MessageEvent(type, { data: JSON.stringify(body) })); }
    frame(sequence) {
        this.emit("frame", { sequence, generation: 1, size: { width: wide ? 1300 : 390, height: wide ? 720 : 700 } });
    }
    close() { this.closed = true; }
};
const router = await import("/src/api.js");
router.install();
router.use({ base: near, via: "lan", token: "fixture-device" });

window.done = (async () => {
    // The viewer and router run unchanged. The page image belongs to this
    // fixture; real CDP rendering and input are exercised in the Go package.
    const canvas = document.createElement("canvas");
    canvas.width = wide ? 1300 : 390;
    canvas.height = wide ? 720 : 700;
    const g = canvas.getContext("2d");
    g.fillStyle = "#f5f0e6"; g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = "#263c36"; g.font = "16px Georgia"; g.fillText("FIELD NOTES", 28, 52);
    g.font = "38px Georgia"; g.fillText("A quiet place", 28, 125); g.fillText("to read.", 28, 169);
    g.fillStyle = "#6a746b"; g.font = "17px Georgia"; g.fillText("Pages, ideas and things worth keeping.", 28, 218);
    g.fillStyle = "#d3dfce"; g.fillRect(28, 252, canvas.width - 56, 190);
    g.fillStyle = "#263c36"; g.font = "21px Georgia"; g.fillText("An afternoon outdoors", 46, 303);
    g.font = "16px Georgia"; g.fillText("A small collection of field observations.", 46, 340);
    g.fillStyle = "#a1b698"; g.beginPath(); g.arc(canvas.width - 95, 391, 72, 0, Math.PI * 2); g.fill();
    jpeg = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", .7));

    const root = document.getElementById("root");
    render(html`<${Nav} current="host" onSelect=${()=>{}} browser=${false} />`, root);
    await until(() => document.querySelector(".tabs"));
    const hidden = !document.querySelector(".tabs").textContent.includes("Browser") && knows({available:true}, "term.start");
    render(html`<${BrowserViewer} profile=${{id:"b-0123456789abcdef",name:"Personal"}}
        limits=${{width:2560,height:2560,dpr:2,pixels:6000000}} wide=${wide} onBack=${()=>{}} />`, root);
    await until(() => document.querySelector(".browser-viewport img").naturalWidth > 0);
    const picture = document.querySelector(".browser-viewport img");
    const first = picture.src;
    source.frame(2);
    await until(() => picture.src !== first && picture.complete && revoked === 1);
    await document.fonts.ready;
    const viewport = document.querySelector(".browser-viewport");
    const box = picture.getBoundingClientRect();
    const outer = viewport.getBoundingClientRect();
    const ratio = Math.abs(box.width / box.height - canvas.width / canvas.height) < .002;
    // DOM events drive the component; native Chrome drag/swipe is checked
    // separately. Synthetic pointers have no browser capture registration.
    viewport.setPointerCapture = () => {};
    const pointer = (type, pointerType, x, y) => viewport.dispatchEvent(new PointerEvent(type, {
        pointerType, pointerId: 1, clientX: box.left + box.width * x,
        clientY: box.top + box.height * y, bubbles: true, cancelable: true,
    }));
    pointer("pointermove", "mouse", .25, .5);
    pointer("pointerdown", "touch", .3, .6);
    pointer("pointermove", "touch", .6, .6);
    pointer("pointerup", "touch", .6, .6);
    const field = document.querySelector(".browser-keyboard textarea");
    field.dispatchEvent(new CompositionEvent("compositionstart", { bubbles: true }));
    field.value = "Hello 🦊";
    field.dispatchEvent(new InputEvent("input", { bubbles: true, isComposing: true, data: field.value }));
    field.dispatchEvent(new CompositionEvent("compositionend", { bubbles: true, data: field.value }));
    field.dispatchEvent(new InputEvent("input", { bubbles: true, data: "Hello 🦊" }));
    field.dispatchEvent(new KeyboardEvent("keydown", { key:"Backspace", bubbles:true, cancelable:true }));
    const pasteKey = new KeyboardEvent("keydown", {key:"v", ctrlKey:true, bubbles:true, cancelable:true});
    viewport.dispatchEvent(pasteKey);
    const clipboard = new DataTransfer();
    clipboard.setData("text/plain", "Desktop paste");
    viewport.dispatchEvent(new ClipboardEvent("paste", {clipboardData:clipboard, bubbles:true, cancelable:true}));
    field.value = "Phone paste";
    field.dispatchEvent(new InputEvent("input", {bubbles:true, inputType:"insertFromPaste", data:field.value}));
    document.querySelector('[aria-label="New tab"]').click();
    await until(() => inputs.some(input => input.kind === "new-tab"));
    const hover = inputs.find(input => input.kind === "mouse" && input.phase === "move");
    const result = {
        hidden, ratio, paste: !pasteKey.defaultPrevented,
        hover: hover && Math.abs(hover.x - canvas.width * .25) < .1 && Math.abs(hover.y - canvas.height * .5) < .1,
        touch: inputs.filter(input => input.kind === "touch").map(input => input.phase),
        text: inputs.filter(input => input.kind === "text").map(input => input.text),
        keys: inputs.filter(input => input.kind === "key").map(input => input.key),
        frames: requests.filter(path => path === "/api/browser/frame").length,
        width: outer.width, height: outer.height, overflow: document.documentElement.scrollWidth > innerWidth,
    };
    document.body.dataset.ready = "true";
    if (new URLSearchParams(location.search).has("shot")) await new Promise(() => {});
    render(null, root);
    await until(() => source.closed && objects.size === 0);
    result.released = made === 2 && revoked === made;
    router.use();
    return result;
})();
</script>
