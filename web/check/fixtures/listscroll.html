<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The phone's list of a contour, long enough to scroll and with its limits
// over it, scrolled down past them; a conversation opened from a card on the
// screen and closed with its back button. Once on a pager of two contours,
// where the list scrolls in its page, and once with a single contour, where
// it scrolls in the body. The card pressed is measured against the top of
// the list before the conversation and after it.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Sessions } from "/src/screens/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const now = Math.floor(Date.now() / 1000);
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 + 1800 });
const window5 = (profile, contour) => ({ profile, contour, ageSec: 30, fiveHour: part(40, 1), sevenDay: part(70, 100) });
const run = (session, contour) => ({ session, sessionId: `${session}-id`, status: "idle", transport: "stream",
    pct: 12, tokens: 100000, limit: 1000000, cwd: `/srv/${session}`, model: "claude-opus-5-5", contour });
const exec = { available: true, kinds: ["session.send"] };
const wait = { opening: () => [], of: () => null };
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
const frames = async (n) => { for (let i = 0; i < n; i += 1) await frame(); };
const until = async (ok) => {
    for (let i = 0; i < 100 && !ok(); i += 1) await sleep(30);
    return ok();
};
const CARDS = 14;
const list = () => document.querySelector(".pfpage") || document.querySelector(".body");
const cards = () => list().querySelectorAll(".pjcard");
const cardOf = (label) => document.querySelector(`.pjcard .pjopen[aria-label="${label}"]`);
const offset = (el) => Math.round(el.getBoundingClientRect().top - list().getBoundingClientRect().top);

// trip scrolls the list down by, opens the conversation of a card in the
// middle of the screen, goes back once the conversation has come to rest, as
// a person would, and says where the card stood each time.
async function trip(snapshot, by) {
    render(h(ToastHost, null, h(GateHost, null, html`<${Sessions} snapshot=${snapshot} error=${null} ageSec=${1}
        exec=${exec} wait=${wait} faults=${[]} onLayer=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => cards().length === CARDS)) throw new Error("the list did not draw its cards");
    const scroller = list();
    scroller.scrollTop = by;
    await frames(6);
    const box = scroller.getBoundingClientRect();
    const card = [...list().querySelectorAll(".pjcard .pjopen")].find((b) => {
        const r = b.getBoundingClientRect();
        return r.top > box.top + box.height / 3 && r.bottom < box.bottom - box.height / 3;
    });
    const label = card.getAttribute("aria-label");
    const left = { scroller: scroller.className, scrollTop: Math.round(scroller.scrollTop), card: offset(card),
        tucked: Boolean(document.querySelector(".pflimits.tucked")) };
    card.click();
    const back = () => document.querySelector('.pback[aria-label="to sessions"]');
    const opened = await until(() => back() && !document.querySelector(".pjcard"));
    await frames(4);
    back().click();
    const returned = await until(() => cards().length === CARDS);
    if (!returned) {
        throw new Error(`back from ${label}: the conversation is still open (${Boolean(back())}), ` +
            `${document.querySelectorAll(".pjcard").length} cards in the document`);
    }
    // The step back the conversation took in the history lands: no entry of
    // the conversation is left over the list.
    const settled = await until(() => !history.state);
    await frames(6);
    const again = list();
    const out = { label, left, opened, returned, settled, back: { scroller: again.className, scrollTop: Math.round(again.scrollTop),
        card: cardOf(label) ? offset(cardOf(label)) : -1, tucked: Boolean(document.querySelector(".pflimits.tucked")) } };
    render(null, root);
    return out;
}

window.done = (async () => {
    await document.fonts.ready;
    localStorage.removeItem("aacpanel.sessions.profile");
    const two = [{ id: 4, profile: "Acme", name: "Acme", groups: [] }, { id: 3, profile: "personal", name: "personal", groups: [] }];
    const pager = await trip({ at: 1, profileMap: two, limits: { contours: [window5("Acme", 4), window5("personal", 3)] },
        sessions: Array.from({ length: CARDS }, (_, i) => run(`shop${i}`, 4)).concat([run("notes", 3)]) }, 600);
    const one = [{ id: 5, profile: "solo", name: "solo", groups: [] }];
    const body = await trip({ at: 1, profileMap: one, limits: { contours: [window5("solo", 5)] },
        sessions: Array.from({ length: CARDS }, (_, i) => run(`blog${i}`, 5)) }, 600);
    return { pager, body };
})();
</script>
