<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="phone"></div>
<div id="desk"></div>
<div class="shell"><div class="body" id="chat"></div></div>
<script type="module">
// A listener without the terminal route: /api/term answers 404. The phone
// menu, the sections of the wide screen and the conversation carry nothing of
// the terminals — no item, no section, no button — even with an executor that
// knows the actions and a shell that kept the terminals as its last tab.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { MobileShell } from "/src/mobile/shell.js";
import { DesktopShell } from "/src/desktop/shell.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

localStorage.setItem("aacpanel.tab", "terminals");
localStorage.setItem("aacpanel.desktop.place", JSON.stringify({ section: "terminals", from: "", chat: null }));

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
let answered = 0;
window.fetch = async (url) => {
    const u = String(url);
    if (u === "/api/term" || u.startsWith("/api/term")) {
        answered += 1;
        return new Response("404 page not found", { status: 404 });
    }
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u.startsWith("/api/profiles")) return json({ profiles: [] });
    if (u.startsWith("/api/usage/")) return json({ error: "usage is not collected here" }, 503);
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["term.start", "term.close", "term.rename", "term.console", "session.send"] };
const live = { session: "shop", sessionId: "s1", transport: "stream", status: "idle", pct: 12.4, tokensIn: 1000,
    tokensOut: 100, cwd: "/srv/proj/shop", lastRequestAt: new Date().toISOString(),
    project: { id: 11, name: "shop", path: "/srv/proj/shop" } };
const snapshot = { at: 1, hostName: "helios", sessions: [live], profileMap: [], limits: null, host: { home: "/home/u" } };
const wait = { opening: () => [], of: () => null };
const alerts = { kind: "ready", alerts: [], older: [], reload: () => {} };
const shared = {
    snapshot, tree: { stacks: [], running: 0, total: 0 }, treeError: null, hostError: null, ageSec: 1, history: [],
    faults: [], alerts, openAlerts: 0, exec, onRefresh: () => {}, wait, conn: { kind: "live" }, theme: "space",
    onTheme: () => {}, updateReady: false, updating: false, onApplyUpdate: () => {}, installable: false, onInstall: () => {},
    route: { here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }, jump: null, onJumped: () => {},
};
const wrap = (node) => h(ToastHost, null, h(GateHost, null, node));
render(wrap(h(MobileShell, shared)), document.getElementById("phone"));
render(wrap(h(DesktopShell, shared)), document.getElementById("desk"));
render(wrap(html`<${Chat} name="shop" id="s1" live=${live} wait=${wait} exec=${exec}
    onBack=${() => {}} onUsage=${() => {}} onTerm=${() => {}} />`), document.getElementById("chat"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await sleep(30);
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    const out = {};
    try {
        await document.fonts.ready;
        // Three askers of the route: the phone shell, the wide shell, the conversation.
        await until(() => answered >= 3 && document.querySelector("#chat .deck"));
        await sleep(300);
        const phone = document.getElementById("phone");
        out.nav = Array.from(phone.querySelectorAll("nav.tabs > button")).map(text);
        out.tab = localStorage.getItem("aacpanel.tab");
        out.sections = Array.from(document.querySelectorAll("#desk .dkibs .dkib")).map((b) => b.getAttribute("aria-label"));
        out.deskAt = (JSON.parse(localStorage.getItem("aacpanel.desktop.place") || "{}") || {}).section || "";
        out.deck = Boolean(document.querySelector("#chat .deck"));
        out.button = Boolean(document.querySelector("#chat .tjump"));
        out.emptyScreen = Boolean(document.querySelector(".tpage, .dkterms, .dkterm"));
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
