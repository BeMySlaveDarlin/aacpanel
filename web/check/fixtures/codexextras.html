<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The feed of a codex thread that looked at a picture, searched the web,
// waited, heard a hook and exchanged messages with an agent, as the collector
// folds agent/testdata/codex-extras.jsonl: one run of calls of their kinds —
// a message whose words travel encrypted among them — and the last answer of
// the agent a letter from it. The run opens the calls by their kind.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { rows } from "/src/screens/chat/feed.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const call = (name, arg, seq, pos, use) => ({ name, arg, seq, at: ago(20 - seq), pos, index: 0, use });
const items = [
    { pos: 517, at: ago(21), role: "me", text: "Check the login screen", cut: false },
    { pos: 899, at: ago(20), role: "tools", kind: "files", run: 899,
      calls: [call("ViewImage", "/srv/site/shots/login.png", 0, 899, "view-1")] },
    { pos: 1267, at: ago(19), role: "tools", kind: "web", run: 899, calls: [
        call("WebSearch", "oauth pkce flow", 1, 1267, "ws-1"),
        call("WebSearch", "https://example.org/pkce", 2, 1972, "ws-2"),
        call("WebSearch", "verifier in https://example.org/pkce", 3, 2400, "ws-3")] },
    { pos: 2888, at: ago(17), role: "tools", kind: "time", run: 899, calls: [
        call("Sleep", "30 s", 4, 2888, "call_sleep_1"), call("Sleep", "3 min", 5, 3882, "call_sleep_2")] },
    { pos: 4252, at: ago(15), role: "tools", kind: "hook", run: 899,
      calls: [call("subagent-stop hook", "Check the agents before you answer.", 6, 4252, "hook-1")] },
    { pos: 4814, at: ago(14), role: "tools", kind: "agents", run: 899, calls: [
        call("Letter", "from checker", 7, 4814, "am_message_13"), call("Letter", "to checker", 8, 5461, "am_message_15")] },
    { pos: 6108, at: ago(12), role: "mail", from: "checker", source: "agent",
      text: "The login screen keeps the token in the page.", cut: false },
    { pos: 6562, at: ago(11), role: "ai", text: "The token leaks.", cut: false },
];

const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length,
                      moreBefore: false, state: { tasks: [], agents: [] } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.close"] };
const thread = {
    session: "codex-0000abcd", sessionId: PARENT, profile: "acme", agent: "codex", transport: "stream",
    status: "idle", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/site",
};
setLiveSessions([thread]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    await document.fonts.ready;
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => root.querySelector(".chatfeed .mletter"))) throw new Error("the letter of the agent did not come");
    await settled();
    const letter = root.querySelector(".chatfeed .mletter");
    return {
        runs: rows(items).filter((r) => r.role === "toolrow").map((r) => r.groups.map((g) => g.kind)),
        letter: {
            label: text(letter.querySelector(".sentlabel")),
            who: text(letter.querySelector(".mletterwho")),
            body: text(letter.querySelector(".mletterbody")),
        },
    };
})();
</script>
