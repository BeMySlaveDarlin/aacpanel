<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="root"></div>
<script type="module">
// An answer with addresses set in bold, in italics, as a link inside bold and
// inside code: every one but the code is a link a tap follows. Then markdown
// links one by one, as models write them: a path to a file with a space before
// it and without, a web address and a scheme the panel does not follow.
import { render } from "preact";
import { html } from "/src/html.js";
import { render as md } from "/src/md.js";

const text = "Open **http://192.168.1.20:8093/board.html** and *https://b.example/y*, "
    + "then **read [the notes](https://c.example/z)**; the code `http://d.example/code` stays code.";
const links = ["[a]( /abs/x.md)", "[a](/abs/x.md)", "[a](https://x)", "[a](javascript:x)"];
render(html`
    <div id="said">${md(text)}</div>
    ${links.map((l) => html`<div class="link">${md(l)}</div>`)}
`, document.getElementById("root"));
window.done = (async () => {
    const said = document.getElementById("said");
    return {
        links: Array.from(said.querySelectorAll("a")).map((a) => a.getAttribute("href")),
        inBold: Array.from(said.querySelectorAll("b a")).length,
        inItalic: Array.from(said.querySelectorAll("i a")).length,
        codeLinked: Boolean(said.querySelector("code a")),
        // What each link became, and the file a tap on it opens: the feed
        // takes the path from the .path the tap landed in.
        each: Array.from(document.querySelectorAll(".link p")).map((p) => {
            const el = p.firstElementChild;
            const hit = el && el.closest(".path");
            return {
                text: p.textContent,
                tag: el ? el.tagName.toLowerCase() : "",
                href: (el && el.getAttribute("href")) || "",
                opens: hit ? hit.dataset.path : "",
            };
        }),
    };
})();
</script>
