<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="root"></div>
<script type="module">
// An answer with addresses set in bold, in italics, as a link inside bold and
// inside code: every one but the code is a link a tap follows.
import { render } from "preact";
import { html } from "/src/html.js";
import { render as md } from "/src/md.js";

const text = "Open **http://192.168.1.20:8093/board.html** and *https://b.example/y*, "
    + "then **read [the notes](https://c.example/z)**; the code `http://d.example/code` stays code.";
render(html`<div>${md(text)}</div>`, document.getElementById("root"));
window.done = (async () => {
    const root = document.getElementById("root");
    return {
        links: Array.from(root.querySelectorAll("a")).map((a) => a.getAttribute("href")),
        inBold: Array.from(root.querySelectorAll("b a")).length,
        inItalic: Array.from(root.querySelectorAll("i a")).length,
        codeLinked: Boolean(root.querySelector("code a")),
    };
})();
</script>
