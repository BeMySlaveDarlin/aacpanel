<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The terminal button under the composer of a conversation. The session works
// in a directory inside its project: the button goes to the terminal of the
// project typed into last when there is one, and starts one at the root of
// the project when there is none.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const now = Math.floor(Date.now() / 1000);
const T = (id, place, activity) => ({ id, place, label: place.split("/").pop(), name: "zsh", command: "zsh",
    activity: now - activity, created: now - 9000, clients: 0 });
let terms = [
    T("t-a", "/srv/proj/api", 10),
    T("t-old", "/srv/proj/shop", 900),
    T("t-last", "/srv/proj/shop", 60),
    T("t-mid", "/srv/proj/shop", 300),
];
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u === "/api/term") return json({ available: true });
    if (u === "/api/terms") return json({ terms });
    if (u === "/api/actions" && init && init.method === "POST") {
        const body = JSON.parse(init.body);
        asked.push(body);
        if (body.kind === "term.start") {
            terms = [...terms, T("t-new", body.params.place, 0)];
            return json({ ok: true, detail: "", logged: true, id: "t-new" });
        }
        return json({ ok: true, detail: "", logged: true });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "term.start"] };
const wait = { of: () => null, opening: () => [] };
const live = { session: "shop", sessionId: "s1", transport: "stream", status: "idle", pct: 12.4,
    tokensIn: 153000, tokensOut: 606, cwd: "/srv/proj/shop/web", lastRequestAt: new Date().toISOString(),
    project: { id: 11, name: "shop", path: "/srv/proj/shop", group: "Side" } };
const sent = [];
render(h(ToastHost, null, h(GateHost, null, html`
    <${Chat} name="shop" id="s1" live=${live} wait=${wait} exec=${exec}
             onBack=${() => {}} onUsage=${() => {}} onTerm=${(target) => sent.push(target)} />
`)), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await sleep(30);
    }
    return fn();
};

window.done = (async () => {
    const out = {};
    try {
        await document.fonts.ready;
        const button = await until(() => document.querySelector(".deck .tjump"));
        out.button = Boolean(button);
        if (!button) return out;

        button.click();
        await until(() => sent.length === 1);
        out.existing = { went: sent[0] || null, asked: asked.map((a) => a.kind) };

        // The project has no terminal any more: the button starts one at its root.
        terms = terms.filter((t) => t.place !== "/srv/proj/shop");
        document.querySelector(".deck .tjump").click();
        await until(() => sent.length === 2);
        out.none = { went: sent[1] || null, asked: asked.map((a) => ({ kind: a.kind, target: a.target, place: a.params.place })) };
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
