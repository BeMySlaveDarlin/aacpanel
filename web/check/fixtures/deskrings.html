<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div id="root"></div></div>
<script type="module">
import { h, render } from "preact";
import { ContourLimits } from "/src/desktop/sessions.js";
import { quiet } from "/check/fixtures/quiet.js";

const now = Date.now();
Date.now = () => now;
const at = (sec) => now / 1000 + sec;
const M = 60, H = 3600, D = 86400;
const pairs = [
    [{ pct: 20, resetsAt: at(2 * H + 13 * M) }, { pct: 60, resetsAt: at(4 * D + 3 * H) }],
    [{ pct: 59, resetsAt: at(59 * M + 30) }, { pct: 84, resetsAt: at(23 * H + 10 * M) }],
    [{ pct: 85, resetsAt: at(30) }, { pct: 90, resetsAt: at(36 * H) }],
    [{ pct: 99, resetsAt: at(-90) }, { pct: 41 }],
    [{ pct: 0 }, { pct: 100, resetsAt: at(46 * M + 20) }],
    [{ pct: 99.5 }, { pct: 105 }],
];
const contours = pairs.map(([fiveHour, sevenDay], i) => ({
    profile: `c${i}`, contour: i + 1, ageSec: 30, fiveHour, sevenDay,
}));
contours.push({ profile: "old", contour: 7, ageSec: 30, fiveHour: { pct: 9 },
    codex: { ageSec: 3600, reached: true, sevenDay: { pct: 100 } } });
contours.push({ profile: "no-week", contour: 8, codex: { ageSec: 30, windows: [], reached: true } });
contours.push({ profile: "half-week", contour: 10, ageSec: 30, fiveHour: { pct: 5 },
    codex: { ageSec: 30, fiveHour: { pct: 7 } } });
contours.push({ profile: "providers", contour: 9, ageSec: 30, sevenDay: { pct: 12 },
    codex: { ageSec: 30, sevenDay: { pct: 22 } }, gemini: { ageSec: 30, sevenDay: { pct: 32 } },
    other: { ageSec: 30, sevenDay: { pct: 42 } } });
const limits = { contours };
render(h("div", null, [...contours.map((contour) => h("footer", { class: "dkstatus", key: contour.profile, id: contour.profile },
    h(ContourLimits, { limits, name: contour.profile, profiles: [] }))),
    h("footer", { class: "dkstatus", id: "empty" }, h(ContourLimits, { limits, name: "empty", profiles: [] })),
]), document.getElementById("root"));

const text = (el) => el ? el.textContent.replace(/\s+/g, " ").trim() : "";
const details = async (section, index) => {
    document.querySelectorAll(`#${section} .limit-reading`)[index].click();
    await quiet();
    const pop = text(document.querySelector(".limit-popover"));
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    await quiet();
    return pop;
};
window.done = (async () => {
    await quiet();
    const readings = contours.slice(0, pairs.length).flatMap((contour) =>
        [...document.querySelectorAll(`#${contour.profile} .limit-reading`)].map((r) => ({
            value: text(r.querySelector(".limit-percent")), label: r.title,
            left: text(r.querySelector(".limit-left")), agent: r.dataset.agent, vendor: r.closest(".limit-chip-group").querySelector(".limit-vendor")?.dataset.agent,
            chip: r.classList.contains("limit-chip"),
            tone: ["ok", "warn", "crit"].find((tone) => r.classList.contains(tone)),
        })));
    return {
        readings,
        wrongMode: Boolean(document.querySelector(".dklimitrow :is(legend, .limit-ring, .limit-mini, .limit-minitrack, .limit-group-age)")),
        providers: [...document.querySelectorAll("#providers .limit-chip")].map((r) => r.dataset.agent),
        groups: [...document.querySelectorAll("#providers .limit-chip-group")].map((group) => ({
            agent: group.dataset.agent, label: group.getAttribute("aria-label"), role: group.getAttribute("role"),
            windows: [...group.querySelectorAll(".limit-reading")].map((r) => r.getAttribute("aria-label")),
            icon: Boolean(group.querySelector(".limit-vendor svg path")?.getAttribute("d")),
        })),
        details: [await details("c2", 0), await details("c2", 1)],
        past: [await details("c3", 0), await details("c3", 1)],
        stale: {
            vendors: [...document.querySelectorAll("#old .limit-chip-group.old")].map((r) => r.dataset.agent),
            ages: [...document.querySelectorAll("#old .limit-group-age")].map(text),
            notes: [...document.querySelectorAll("#old .limits-note")].map(text),
            details: await details("old", 0),
        },
        noWeek: text(document.querySelector("#no-week")),
        noWeekNote: document.querySelector("#no-week .dklimitnone").title,
        halfWeek: text(document.querySelector("#half-week .dklimitnone")),
        empty: text(document.querySelector("#empty")),
    };
})();
</script>
