<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="deskshell"><header class="dktop"><div class="dktopright"><div id="root"></div><div id="blank"></div></div></header></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The load gauges of the top bar over a host with a busy processor, room in
// memory and one disk nearly full among four.
import { h, render } from "preact";
import { HeadLoad } from "/src/desktop/load.js";

const snapshot = {
    host: {
        cpuPct: 74.4,
        mem: { pct: 23.1 },
        disks: [
            { mount: "/", pct: 19.2 },
            { mount: "/boot/efi", pct: 0.9 },
            { mount: "/mnt/data", pct: 11.2 },
            { mount: "/mnt/storage", pct: 93.6 },
        ],
    },
};

let opened = 0;
render(h(HeadLoad, { snapshot, onOpen: () => { opened++; } }), document.getElementById("root"));

const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());

(async () => {
    await new Promise((r) => setTimeout(r, 200));
    const chips = Array.from(document.querySelectorAll(".dkgauge"));
    const before = {
        names: text(".dkgauge-n"),
        values: text(".dkgauge-v"),
        tones: chips.map((c) => c.className.replace("dkgauge", "").trim()),
        // The reading is the fill of the chip itself, not a bar beside it.
        fills: chips.map((c) => Math.round(parseFloat(c.style.getPropertyValue("--fill")) || 0)),
        bars: document.querySelectorAll(".dkgauge-bar").length,
        // The row must stay on one line whatever the numbers are.
        rows: new Set(Array.from(document.querySelectorAll(".dkgauge")).map((g) => Math.round(g.getBoundingClientRect().top))).size,
        tips: Array.from(document.querySelectorAll(".dkgauge")).map((g) => g.getAttribute("data-tip")),
    };

    document.querySelector(".dkload").click();
    await new Promise((r) => setTimeout(r, 100));

    // A host the agent has not reported on yet draws nothing rather than zeros.
    // It is drawn beside the first, not over it: a fixture is also the picture
    // of the thing, and a picture of an empty bar shows nothing.
    render(h(HeadLoad, { snapshot: {}, onOpen: () => {} }), document.getElementById("blank"));
    await new Promise((r) => setTimeout(r, 120));

    window.done = { before, opened,
        blank: document.querySelectorAll("#blank .dkgauge").length };
})();
</script>
