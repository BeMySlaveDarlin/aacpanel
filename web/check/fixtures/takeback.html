<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The local row gives way to the feed while its owner still holds the input.
// Reload has no local state. Queue-only updates settle delivery and withdrawal
// even when no new transcript record arrives. Codex's outbox precedes its rollout.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { queuedRows } from "/src/screens/chat/feed.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const root = document.getElementById("root");
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const sent = [];
const png = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="), (c) => c.charCodeAt(0));
const started = Date.now() - 60000;
const at = (n) => new Date(started + n * 1000).toISOString();
let items = [], messages = [], withdrawn = [], source = null, refuse = false;
const state = () => ({ tasks: [], agents: [], queue: { messages, withdrawn } });
const emit = (kind, body) => source.dispatchEvent(new MessageEvent(kind, { data: JSON.stringify(body) }));
const fetchData = window.fetch.bind(window);
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u.startsWith("data:")) return fetchData(url, init);
    if (u.startsWith("/api/chat/image?")) return new Response(new Blob([png], { type: "image/png" }));
    if (u.startsWith("/api/chat?")) return json({ items, first: items[0]?.pos ?? 0,
        last: items.at(-1)?.pos ?? 0, total: items.length, moreBefore: false, state: state() });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        const body = JSON.parse(init.body);
        sent.push(body);
        if (body.kind === "session.unqueue" && refuse) {
            return json({ error: "the message is already delivered: acme has read it", logged: true }, 502);
        }
        return json({ logged: true, ok: true, detail: "ok" });
    }
    return new Response("", { status: 404 });
});
window.EventSource = class extends EventTarget {
    constructor() { super(); this.readyState = 1; source = this; }
    close() { this.readyState = 2; }
};
const exec = { available: true, kinds: ["session.send", "session.file", "session.unqueue", "session.stop"] };
const count = () => root.querySelectorAll(".mqueue").length;
const queued = () => root.querySelectorAll(".msg.queued").length;
const until = async (ok) => {
    const end = performance.now() + 3000;
    while (!ok() && performance.now() < end) await new Promise(requestAnimationFrame);
    if (!ok()) throw new Error("the screen did not reach the expected state");
};
const open = async (agent) => {
    render(null, root);
    source = null;
    const live = { status: "busy", transport: "stream", agent, pct: 12.4, cwd: "/srv/proj", sessionId: "s1" };
    render(h(ToastHost, null, h(GateHost, null,
        html`<${Chat} name="acme" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    await until(() => source && root.querySelector("textarea"));
};
const write = async (text) => {
    const area = root.querySelector("textarea");
    area.value = text;
    area.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => {
        const send = root.querySelector("button.iconbtn.accent");
        return send && !send.disabled;
    });
    root.querySelector("button.iconbtn.accent").click();
    await until(() => count() === 1);
};
const waiting = (agent, id, text, n = 1) => {
    messages = [{ messageId: id, since: at(n), ...(agent === "codex" ? { text } : { fingerprint: "hash-" + n }) }];
    if (agent !== "codex") items.push({ role: "me", text, pos: n * 10, at: at(n + 1), state: "queued", fingerprint: "hash-" + n });
};
const update = async () => {
    emit("state", state());
    emit("chat", { items, total: items.length });
    await quiet();
};

window.preview = async (agent) => {
    items = []; withdrawn = [];
    waiting(agent, "preview-input", "Run the browser checks before the deploy.");
    await open(agent);
};
window.done = (async () => {
    await document.fonts.ready;
    const results = [];
    for (const agent of ["claude", "codex"]) {
        items = []; messages = []; withdrawn = []; refuse = false;
        const start = sent.length;
        await open(agent);
        await write("run the e2e suite too");
        const id = sent.at(-1).params.messageId;
        const out = { agent, local: count() === 1 };
        waiting(agent, id, "run the e2e suite too");
        await update();
        out.transition = count() === 1 && queued() === 1 && root.querySelectorAll(".msg.me").length === 1;
        await open(agent);
        out.reload = count() === 1 && queued() === 1 && !root.textContent.includes("Nothing has been said");
        if (agent === "claude") {
            items = items.map((item) => ({ ...item, state: undefined }));
            await update();
        }
        out.ownerWins = count() === 1 && queued() === 1;
        const edit = root.querySelector(".mqueue .btn");
        if (edit) edit.click();
        await quiet();
        out.edit = root.querySelector("textarea").value === "run the e2e suite too" && count() === 0;
        messages = []; withdrawn = ["hash-1"];
        await update();
        out.withdrawn = count() === 0 && queued() === 0
            && (agent === "codex" || Boolean(root.querySelector(".msg.withdrawn")));

        items = []; messages = []; withdrawn = [];
        waiting(agent, "delivered-input", "and then deploy", 3);
        await open(agent);
        refuse = true;
        root.querySelector(".mqueue")?.querySelectorAll(".btn")[1].click();
        await quiet();
        out.race = (root.querySelector(".mqueuefail")?.textContent || "").includes("already delivered");
        messages = [];
        if (agent === "codex") items.push({ role: "me", text: "and then deploy", pos: 30, at: at(4) });
        // Claude's stale transcript still says queued; only the owner changed.
        await update();
        out.delivered = count() === 0 && queued() === 0 && root.querySelectorAll(".msg.me").length === 1;
        out.sent = sent.slice(start);
        results.push(out);
    }
    const row = { role: "me", text: "same", pos: 10, at: at(2), state: "queued", fingerprint: "same-hash" };
    const queue = { messages: [{ messageId: "one", since: at(1), fingerprint: "same-hash" }], withdrawn: [] };
    const duplicates = queuedRows([row, { ...row, pos: 20 }], queue);
    const before = queuedRows([{ ...row, at: at(0) }], queue);
    const file = queuedRows([{ ...row, text: "caption\n/srv/files/shot.png" }], queue);
    const repeated = queuedRows([{ ...row, state: "withdrawn" }], { ...queue, withdrawn: ["same-hash"] });
    const attachments = [];
    for (const agent of ["claude", "codex"]) {
        for (const caption of ["inspect this", ""]) {
            items = []; messages = []; withdrawn = []; refuse = false;
            await open(agent);
            const data = new DataTransfer();
            data.items.add(new File([png], "shot.png", { type: "image/png" }));
            if (caption) data.items.add(new File(["notes"], "notes.txt", { type: "text/plain" }));
            const area = root.querySelector("textarea");
            area.dispatchEvent(new ClipboardEvent("paste", { clipboardData: data, bubbles: true, cancelable: true }));
            await until(() => root.querySelectorAll(".clipoff").length === (caption ? 2 : 1));
            area.value = caption;
            area.dispatchEvent(new Event("input", { bubbles: true }));
            await quiet();
            root.querySelector(".sendbtn").click();
            const loaded = () => root.querySelector(".chatfeed .mshot img")?.naturalWidth > 0;
            await until(() => loaded() && root.querySelector(".chatfeed .mstamp")?.textContent === "queued");
            const visible = () => ({ rows: root.querySelectorAll(".chatfeed .feedrow.r-me").length,
                pictures: root.querySelectorAll(".chatfeed .mshot img").length,
                files: Array.from(root.querySelectorAll(".chatfeed .mfhanded .mfname")).map((el) => el.textContent.trim()),
                queued: root.querySelector(".chatfeed .mstamp")?.textContent === "queued" });
            const out = { agent, caption, local: visible() };
            const image = "/srv/files/20261009-120007-ab12cd-shot.png";
            const note = caption ? "/srv/files/20261009-120007-cd34ef-notes.txt" : "";
            const shots = [{ upload: image.split("/").pop(), path: image, media: "image/png" }];
            const files = note ? [{ path: note, name: "notes.txt" }] : [];
            const text = [caption, note, image].filter(Boolean).join("\n");
            messages = [{ messageId: "", since: at(1), ...(agent === "codex"
                ? { text: [caption, note].filter(Boolean).join("\n"), images: [image], shots, files }
                : { fingerprint: "file-hash" }) }];
            if (agent === "claude") items = [{ role: "me", pos: 10, at: at(2), text, shots, files,
                state: "queued", fingerprint: "file-hash" }];
            await update();
            await until(loaded);
            out.waiting = visible();
            await open(agent);
            await until(loaded);
            out.reload = visible();
            messages = [];
            items = [{ role: "me", pos: 10, at: at(2), text, shots, files, fingerprint: "file-hash" }];
            await update();
            await until(loaded);
            out.delivered = visible();
            attachments.push(out);
        }
    }
    await window.preview("claude");
    return { results, attachments, ambiguous: duplicates.every((r) => !r.messageId), old: !before[0].messageId,
        file: file[0].messageId === "one", repeated: repeated[0].messageId === "one" && repeated[0].state === "queued" };
})();
</script>
