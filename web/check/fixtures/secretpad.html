<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A session on the stream asked for two secrets: a token whose file the host
// already keeps from an earlier question, and a file of a database it has not
// seen. The card of the token opens the notepad with the session's template;
// what is typed and then dropped by closing the sheet is gone, and what is
// typed and saved leaves the browser once — in the body of secret.put — and
// rests nowhere in the page. The list the host answers says which card has
// been filled in since it was asked. Two more were answered before: one
// filled in, whose card says where its file went, and one refused with a
// reason; what the panel told the session of either is not drawn under them.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { stampText } from "/src/screens/chat/labels.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const DIR = "/home/u/.local/state/aacpanel/secrets";
const MARK = "ghp_Q7marker4f1d9e";
const template = "# https://github.com/settings/tokens — a classic token with repo\nGH_TOKEN=\n";
const smsTemplate = "# the second code of the SMS\nSMS_CODE=\n";
const ssoTemplate = "SSO_PASSWORD=\n";
const items = [
    { role: "me", text: "deploy it", at: "2026-01-01T08:59:00Z", pos: 1 },
    { role: "secret", use: "toolu_s1", name: "github-token", title: "A token for the GitHub CLI",
      template, at: "2026-01-01T09:00:00Z", pos: 2 },
    { role: "secret", use: "toolu_s2", name: "evirma-db.env", title: "The database of the stand",
      template: "DB_USER=\nDB_PASSWORD=\n", at: "2026-01-01T09:01:00Z", pos: 3 },
    { role: "secret", use: "toolu_s3", name: "sms-code", title: "The second code of the SMS, 6 digits",
      template: smsTemplate, at: "2025-12-31T10:00:00Z", pos: 4 },
    { role: "me", text: `The secret "sms-code" is saved: ${DIR}/sms-code (0600, 1 line). (act ${"3".repeat(32)}). Keys: SMS_CODE. Use it by its path and never read or print it: whatever you read goes into the transcript.`,
      at: "2025-12-31T10:05:00Z", pos: 5 },
    { role: "secret", use: "toolu_s4", name: "stand-sso", title: "The SSO password of the stand",
      template: ssoTemplate, at: "2025-12-31T11:00:00Z", pos: 6 },
    { role: "me", text: `The person won't give the secret "stand-sso" (act ${"4".repeat(32)}).\n\nTheir reason:\nNot on this machine.\n\nDo not ask for it again; go on without it or say what it blocks.`,
      at: "2025-12-31T11:05:00Z", pos: 7 },
];
const older = "2025-12-31T12:00:00Z";
const later = "2026-01-02T08:00:00Z";
const server = { secrets: [{ name: "github-token", bytes: 41, at: older }] };
const acts = items.filter(i => i.role === "secret").map((item, n) => ({ id: String(n + 1).repeat(32), kind: "secret", title: item.title, state: "open", created: item.at, body: { name: item.name, template: item.template } }));
items.filter(i => i.role === "secret").forEach((item, n) => { item.id = acts[n].id; });
Object.assign(acts[2], { state: "answered", closed: "2025-12-31T10:05:00Z", answer: { path: `${DIR}/sms-code` } });
Object.assign(acts[3], { state: "declined", closed: "2025-12-31T11:05:00Z", answer: { note: "Not on this machine." } });
const requests = [];
const sent = [];

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    const u = String(url);
    const body = (init && typeof init.body === "string") ? init.body : "";
    requests.push({ url: u, method: (init && init.method) || "GET", body });
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: 3, total: items.length, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/acts?")) return json({ acts });
    if (u === "/api/secrets") return json({ dir: DIR, secrets: server.secrets });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        const got = JSON.parse(body || "{}");
        sent.push(got);
        if (got.kind === "secret.put") {
            server.secrets = [{ name: got.params.name, bytes: got.params.text.length, at: later }];
        }
        return json({ logged: true, ok: true, detail: `saved ${got.params.name} (41 bytes) and told helios` });
    }
    return json({});
});
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "secret.put", "secret.drop"] };
const session = { session: "helios", sessionId: "s1", status: "idle", transport: "stream", pct: 12.4, tokens: 124000,
    limit: 1000000, cwd: "/srv/proj", model: "claude-opus-5-5", effort: "xhigh", mode: "auto", profile: "personal" };
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 4000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await sleep(25);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const pad = () => document.querySelector(".actform .cmdsheet");
const field = () => (pad() ? pad().querySelector("textarea") : null);
const cards = () => Array.from(root.querySelectorAll(".feedrow.r-secret .msecret"));
const fill = (n) => cards()[n].querySelector(".skfill").click();
const head = (n) => text(cards()[n].querySelector(".sentlabel"));
const typeInto = async (el, value) => {
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles: true }));
    await quiet();
};
const button = (word) => Array.from(pad().querySelectorAll(".btnrow .btn")).find((b) => text(b) === word);
const mask = () => (field().classList.contains("masked") ? "masked" : "plain");
const eye = () => pad().querySelector(".skeye");

// stored lists every place of the page's storage that holds the marker: a
// key or a value of either storage, or a database by its name.
const stored = async () => {
    const hits = [];
    for (const [name, store] of [["local", localStorage], ["session", sessionStorage]]) {
        for (let i = 0; i < store.length; i++) {
            const key = store.key(i);
            if (key.includes(MARK) || String(store.getItem(key)).includes(MARK)) hits.push(`${name}:${key}`);
        }
    }
    const dbs = indexedDB.databases ? await indexedDB.databases() : [];
    for (const db of dbs) hits.push(`indexedDB:${db.name}`);
    return hits;
};
window.done = (async () => {
    const out = {};
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="helios" id="s1" live=${session}
        exec=${exec} onBack=${() => {}} />`)), root);
    await until(() => field() && pad().querySelector(".skwas")); await quiet();
    out.auto = field().value === template && cards().length === 4 && !document.querySelector(".sheet.on");
    // Every secret of an act is its card, never a marker, its state on its head.
    out.cards = !root.querySelector(".actmark, .actmarker")
        && JSON.stringify(cards().map((card, n) => [head(n), Boolean(card.querySelector(".skfill"))]))
            === JSON.stringify([["secret · yours", true], ["secret · yours", true], ["secret · filled in", false], ["secret · won't give", false]]);
    const filled = cards()[2];
    out.filled = text(filled.querySelector(".artitle")) === "The second code of the SMS, 6 digits"
        && text(filled.querySelector(".armeta > span:first-child")) === "sms-code"
        && text(filled.querySelector(".sksaved")).startsWith("saved ")
        && text(filled.querySelector(".pnmpath")) === DIR + "/sms-code";
    const refused = cards()[3];
    out.refused = text(refused.querySelector(".pnmnote")) === "Not on this machine."
        && !refused.querySelector(".sksaved, .pnmpath");
    // What the panel told the session stands nowhere: not as a line under the
    // card, not as a bubble, not as a card of its own.
    out.noReply = !root.querySelector(".actreply, .pnm") && !root.textContent.includes("to the agent")
        && ![...root.querySelectorAll(".msg.me")].some((el) => el.textContent.includes("(act "));
    out.noTemplate = cards().every((card) => ["settings/tokens", "GH_TOKEN", "DB_USER", "SMS_CODE", "SSO_PASSWORD"]
        .every((word) => !card.innerHTML.includes(word)));
    out.path = text(pad().querySelector(".skpath")) === DIR + "/github-token";
    out.replaces = text(pad().querySelector(".skwas")).startsWith("Replaces the secret saved ");
    out.attrs = ["autocomplete=off", "autocorrect=off", "autocapitalize=off", "spellcheck=false"].every(pair => {
        const [key, value] = pair.split("="); return field().getAttribute(key) === value;
    });
    eye().click(); await quiet();
    out.hidden = mask() === "masked" && field().value === template;
    eye().click(); await quiet();
    out.shown = mask() === "plain" && field().value === template;
    await typeInto(field(), template.replace("GH_TOKEN=", `GH_TOKEN=${MARK}`));
    fill(1); await quiet();
    out.dropped = !(await stored()).length && !root.innerHTML.includes(MARK) && sent.length === 0;
    out.fresh = field().value === "DB_USER=\nDB_PASSWORD=\n" && text(pad().querySelector(".skpath")) === DIR + "/evirma-db.env" && !pad().querySelector(".skwas");
    await typeInto(field(), " \n ");
    out.blank = button("Fill in").disabled;
    fill(0); await quiet();
    out.reset = field().value === template;
    const typed = template.replace("GH_TOKEN=", `GH_TOKEN=${MARK}`) + "# rotated\n";
    await typeInto(field(), typed);
    button("Fill in").click(); button("Fill in").click(); await quiet();
    out.once = sent.length === 1 && sent[0].kind === "secret.put" && sent[0].target === "helios"
        && sent[0].params.act === acts[0].id && sent[0].params.name === "github-token" && sent[0].params.text === typed;
    out.noConfirmation = !document.querySelector('.sheet.on[aria-label="action confirmation"]');
    out.saved = head(0) === "secret · filled in" && !cards()[0].querySelector(".skfill") && Boolean(cards()[1].querySelector(".skfill"))
        && !root.innerHTML.includes(MARK) && !(await stored()).length;
    out.carried = requests.filter(r => r.url.includes(MARK) || r.body.includes(MARK)).length === 1;
    out.next = field().value === "DB_USER=\nDB_PASSWORD=\n";
    out.toast = text(document.querySelector(".toast .tmain")) === "Saved to " + DIR + "/github-token";
    // Outside the session nothing is docked, and the open card has no button to dock it.
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="helios" id="s1" live=${{ ...session, outside: true }}
        exec=${exec} onBack=${() => {}} />`)), root);
    await until(() => !document.querySelector(".actform")); await quiet();
    out.outside = !document.querySelector(".actform") && cards().length === 4 && head(1) === "secret · yours"
        && !root.querySelector(".msecret .skfill");
    return out;
})();
</script>
