<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A session on the stream asked for two secrets: a token whose file the host
// already keeps from an earlier question, and a file of a database it has not
// seen. The card of the token opens the notepad with the session's template;
// what is typed and then dropped by closing the sheet is gone, and what is
// typed and saved leaves the browser once — in the body of secret.put — and
// rests nowhere in the page. The list the host answers says which card has
// been filled in since it was asked.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { stampText } from "/src/screens/chat/labels.js";

const DIR = "/home/u/.local/state/aacpanel/secrets";
const MARK = "ghp_Q7marker4f1d9e";
const template = "# https://github.com/settings/tokens — a classic token with repo\nGH_TOKEN=\n";
const items = [
    { role: "me", text: "deploy it", at: "2026-01-01T08:59:00Z", pos: 1 },
    { role: "secret", use: "toolu_s1", name: "github-token", title: "A token for the GitHub CLI",
      template, at: "2026-01-01T09:00:00Z", pos: 2 },
    { role: "secret", use: "toolu_s2", name: "evirma-db.env", title: "The database of the stand",
      template: "DB_USER=\nDB_PASSWORD=\n", at: "2026-01-01T09:01:00Z", pos: 3 },
];
const older = "2025-12-31T12:00:00Z";
const later = "2026-01-02T08:00:00Z";
const server = { secrets: [{ name: "github-token", bytes: 41, at: older }] };
const requests = [];
const sent = [];

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    const body = (init && typeof init.body === "string") ? init.body : "";
    requests.push({ url: u, method: (init && init.method) || "GET", body });
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: 3, total: items.length, moreBefore: false, state: null });
    }
    if (u === "/api/secrets") return json({ dir: DIR, secrets: server.secrets });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        const got = JSON.parse(body || "{}");
        sent.push(got);
        if (got.kind === "secret.put") {
            server.secrets = [{ name: got.params.name, bytes: got.params.text.length, at: later }];
        }
        return json({ logged: true, ok: true, detail: `saved ${got.params.name} (41 bytes) and told helios` });
    }
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "secret.put", "secret.drop"] };
const session = { session: "helios", sessionId: "s1", status: "idle", transport: "stream", pct: 12.4, tokens: 124000,
    limit: 1000000, cwd: "/srv/proj", model: "claude-opus-5-5", effort: "xhigh", mode: "auto", profile: "personal" };
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 4000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await sleep(25);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const pad = () => document.querySelector('.sheet.on[aria-label="secret notepad"]');
const field = () => (pad() ? pad().querySelector("textarea") : null);
const cards = () => Array.from(root.querySelectorAll(".msecret"));
const fill = (n) => cards()[n].querySelector(".skfill").click();
const typeInto = async (el, value) => {
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(60);
};
const button = (word) => Array.from(pad().querySelectorAll(".btnrow .btn")).find((b) => text(b) === word);
const mask = () => getComputedStyle(field()).webkitTextSecurity;
const eye = () => pad().querySelector(".skeye");

// stored lists every place of the page's storage that holds the marker: a
// key or a value of either storage, or a database by its name.
const stored = async () => {
    const hits = [];
    for (const [name, store] of [["local", localStorage], ["session", sessionStorage]]) {
        for (let i = 0; i < store.length; i++) {
            const key = store.key(i);
            if (key.includes(MARK) || String(store.getItem(key)).includes(MARK)) hits.push(`${name}:${key}`);
        }
    }
    const dbs = indexedDB.databases ? await indexedDB.databases() : [];
    for (const db of dbs) hits.push(`indexedDB:${db.name}`);
    return hits;
};
const readCard = (el) => ({
    title: text(el.querySelector(".artitle")),
    meta: text(el.querySelector(".armeta")),
    saved: text(el.querySelector(".sksaved")),
    fill: text(el.querySelector(".skfill")),
});

window.done = (async () => {
    const out = {};
    try {
        render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="helios" id="s1" live=${session}
            snapshot=${{ at: 1, sessions: [session] }} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
        await until(() => cards().length === 2 && requests.some((r) => r.url === "/api/secrets"));
        await sleep(100);
        out.before = cards().map(readCard);
        out.savedWord = `saved ${stampText(later)}`;

        // The notepad of the token: the session's template, the path, the
        // file it replaces, a field that keeps the words as typed.
        fill(0);
        await until(() => field());
        const f = field();
        out.opened = {
            title: text(pad().querySelector(".cmdhead")),
            value: f.value,
            path: text(pad().querySelector(".skpath")),
            replaces: text(pad().querySelector(".skwas")),
            attrs: ["autocomplete", "autocorrect", "autocapitalize", "spellcheck"].map((a) => `${a}=${f.getAttribute(a)}`),
            spelled: f.spellcheck,
            font: getComputedStyle(f).fontFamily,
        };

        // Hide and Show: visible by default, dots after Hide, the words back
        // after Show — and the text the same all along.
        out.mask = [`${text(eye())}:${mask()}`];
        eye().click();
        await until(() => mask() === "disc");
        out.mask.push(`${text(eye())}:${mask()}`);
        eye().click();
        await until(() => mask() !== "disc");
        out.mask.push(`${text(eye())}:${mask()}`);
        out.maskKept = field().value === template;

        // Typed and closed without saving: nothing went out, nothing rests
        // in the page, and the next opening starts from the template.
        await typeInto(field(), `${template.replace("GH_TOKEN=", `GH_TOKEN=${MARK}`)}`);
        pad().querySelector(".sheetclose").click();
        await until(() => !pad());
        out.closed = { gone: !pad(), stored: await stored(), sent: sent.length, inDom: root.innerHTML.includes(MARK) };
        fill(0);
        await until(() => field());
        out.reopened = field().value;

        // Typed and saved: one action, the text exactly as typed, no second
        // question, the sheet closes and the card says it was saved.
        const typed = `${template.replace("GH_TOKEN=", `GH_TOKEN=${MARK}`)}# rotated\n`;
        await typeInto(field(), typed);
        out.typed = typed;
        button("Save").click();
        await until(() => sent.length > 0 && !pad());
        await until(() => cards()[0] && readCard(cards()[0]).saved !== "");
        out.saved = {
            sent: sent.map((b) => ({ kind: b.kind, target: b.target, params: b.params })),
            confirm: Boolean(document.querySelector('.sheet.on[aria-label="action confirmation"]')),
            closed: !pad(),
            toast: text(document.querySelector(".toast .tmain")),
            card: readCard(cards()[0]),
            stored: await stored(),
            inDom: root.innerHTML.includes(MARK),
            // The text leaves the page once, in the body of the action, and
            // never in an address a worker could keep.
            carried: requests.filter((r) => r.url.includes(MARK) || r.body.includes(MARK)).map((r) => `${r.method} ${r.url}`),
        };
        fill(0);
        await until(() => field());
        out.afterSave = field().value;
        pad().querySelector(".sheetclose").click();
        await until(() => !pad());

        // A name the host does not keep yet replaces nothing.
        fill(1);
        await until(() => field());
        out.fresh = {
            value: field().value,
            path: text(pad().querySelector(".skpath")),
            replaces: Boolean(pad().querySelector(".skwas")),
        };
        // Whitespace is not a secret: Save stays off on it.
        await typeInto(field(), "  \n ");
        out.blankOff = button("Save").disabled;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
