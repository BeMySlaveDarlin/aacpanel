<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="shell no-nav"><main class="body" id="root"></main></div></div>
<script type="module">
// Where a pick goes, on a wide screen: the menus of the model and the effort
// carry the choice between this session and the default, a digit takes it
// along, and a terminal says instead that its pick is the default.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const catalog = { state: "ok", models: [
    { id: "claude-opus-5-5", name: "Claude Opus 5.5" }, { id: "claude-fable-5-1", name: "Claude Fable 5.1" },
    { id: "claude-opus-5", name: "Claude Opus 5" }, { id: "claude-sonnet-5", name: "Claude Sonnet 5" },
    { id: "claude-fable-5", name: "Claude Fable 5" }, { id: "claude-opus-4-8", name: "Claude Opus 4.8" },
    { id: "claude-opus-4-7", name: "Claude Opus 4.7" }, { id: "claude-sonnet-4-6", name: "Claude Sonnet 4.6" },
    { id: "claude-opus-4-6", name: "Claude Opus 4.6" }, { id: "claude-haiku-4-5-20251001", name: "Claude Haiku 4.5" },
] };
const efforts = ["low", "medium", "high", "xhigh", "max"];
const listed = [
    { value: "default", resolved: "claude-opus-5-5[1m]", name: "Default (recommended)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "opus[1m]", resolved: "claude-opus-5-5[1m]", name: "Opus (1M context)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "claude-fable-5-1[1m]", resolved: "claude-fable-5-1", name: "Fable", description: "Fable 5.1 · Most capable for your hardest and longest-running tasks", efforts },
    { value: "sonnet", resolved: "claude-sonnet-5", name: "Sonnet", description: "Sonnet 5 · Efficient for routine tasks", efforts },
    { value: "haiku", resolved: "claude-haiku-4-5-20251001", name: "Haiku", description: "Haiku 4.5 · Fastest for quick answers" },
];
const sent = [];
let transport = "stream";
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/models")) {
        const session = transport === "stream"
            ? { transport, list: listed, mode: "auto", effort: "xhigh", picked: "opus[1m]" }
            : { transport };
        return json({ state: "ok", session, catalog });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true, detail: "ok" });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "session.command", "session.set", "session.stop"] };
const stream = { status: "idle", transport: "stream", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj",
    model: "claude-opus-5-5", effort: "xhigh", mode: "auto" };
const terminal = { ...stream, transport: "" };
const root = document.getElementById("root");
const show = (live) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="atlas" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());
const pick = (what) => document.querySelector(`.pickbar .pkchip[data-pick=${what}]`);
const key = async (k) => { document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true })); await sleep(250); };
const tap = async (el) => { el.click(); await sleep(300); };

const seg = (name) => Array.from(document.querySelectorAll(".pkmenu .pkseg")).find((b) => b.textContent.trim() === name);

window.done = (async () => {
    show(stream);
    await sleep(500);
    const out = {};

    await tap(pick("effort"));
    out.stops = Array.from(document.querySelectorAll(".pkmenu.pkeffort .pkstop")).map((b) => b.getAttribute("aria-label"));
    out.scope = text(".pkmenu.pkeffort .pkseg");
    await tap(seg("Default"));
    out.stillOpen = document.querySelectorAll(".pkmenu.pkeffort").length;
    out.ultraOff = document.querySelector('.pkmenu.pkeffort .pkstop[aria-label="Ultracode"]').disabled;
    await tap(document.querySelector('.pkmenu.pkeffort .pkstop[aria-label="High"]'));

    await tap(pick("model"));
    out.modelScopeOn = text(".pkmenu[aria-label=model] .pkseg.on");
    await key("3");
    // The choice changed while the menu is open goes with the next digit.
    await tap(pick("model"));
    await tap(seg("This session"));
    await key("4");

    transport = "console";
    show(terminal);
    await sleep(400);
    await tap(pick("model"));
    out.termScopes = document.querySelectorAll(".pkmenu .pkscope").length;
    out.termNote = text(".pkmenu[aria-label=model] .pknote")[0] || "";
    await key("2");

    out.sent = sent.map((b) => `${b.kind}:${JSON.stringify(b.params)}`);
    return out;
})();
</script>
