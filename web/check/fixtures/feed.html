<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The chat screen the panel ships, over a fake host: the feed comes from a
// canned answer, the stream is a stub the page feeds by hand, and a send is
// answered after a moment. Preact is watched as it draws: a row of the feed
// and the feed itself are counted.
import { h, options, render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { Row } from "/src/screens/chat/rows.js";
import { FeedGrid } from "/src/screens/chat/timeline.js";
import { SubChat } from "/src/screens/chat/subchat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";
import { feedKey, flushAt, keepAt } from "/src/screens/chat/feedwindow.js";

const reload = new URLSearchParams(location.search).has("reload");
const positionsKey = "aacpanel.feedPositions";
const storeGet = Storage.prototype.getItem, storeSet = Storage.prototype.setItem, storeRemove = Storage.prototype.removeItem;
const positionIO = { reads: 0, writes: 0 };
Storage.prototype.getItem = function (key) {
    if (key === positionsKey) positionIO.reads++;
    return storeGet.call(this, key);
};
Storage.prototype.setItem = function (key, value) {
    if (key === positionsKey) positionIO.writes++;
    return storeSet.call(this, key, value);
};
Storage.prototype.removeItem = function (key) {
    if (key === positionsKey) positionIO.writes++;
    return storeRemove.call(this, key);
};
const storedPositions = () => JSON.parse(storeGet.call(localStorage, positionsKey) || "{}");
if (!reload) localStorage.removeItem(positionsKey);
let historyMode = reload;
let historyTotal = Number(new URLSearchParams(location.search).get("total")) || 120;
let missingPosition = null;
const historyReads = [];
const N = 14;
const items = [];
for (let i = 1; i <= N; i++) {
    items.push({ role: "me", pos: i * 20, text: `question number ${i} about the build`, at: new Date(Date.now() - (N - i) * 60000).toISOString() });
    items.push({ role: "ai", pos: i * 20 + 10, text: `Answer ${i}: the build is green, the check ran in nine seconds and nothing changed in the bundle.`, at: new Date(Date.now() - (N - i) * 60000 + 5000).toISOString() });
}
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
let stream = null;
let pos = 400;
const sent = [];
let acts = [];
const copied = [];
Object.defineProperty(navigator, "clipboard", { configurable: true, value: {
    writeText: (text) => { copied.push(text); return Promise.resolve(); },
} });
window.fetch = counted(async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?") && historyMode) {
        const params = new URL(u, location.href).searchParams;
        const limit = Number(params.get("limit")) || 40;
        const before = Number(params.get("before")), after = Number(params.get("after"));
        historyReads.push({ before, after });
        const all = Array.from({ length: historyTotal }, (_, n) => ({ role: n % 2 ? "ai" : "me", pos: n + 1,
            text: `History ${n + 1}: ${"Read the output and check the build result. ".repeat(5)}`,
        })).flatMap((item) => item.pos === 90 ? [item, { ...item, nth: 1, text: "Another answer from the same record. ".repeat(6) }] : [item])
            .filter((item) => item.pos !== missingPosition);
        const selected = before ? all.filter((item) => item.pos < before).slice(-limit)
            : after ? all.filter((item) => item.pos > after).slice(0, limit) : all.slice(-limit);
        return json({ items: selected, first: selected[0]?.pos, last: selected.at(-1)?.pos, total: all.length,
            moreBefore: selected[0]?.pos > 1, state: null });
    }
    if (u.startsWith("/api/chat?")) return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length, moreBefore: false, state: null });
    if (u.startsWith("/api/acts?")) return json({ acts });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") { sent.push(u); await new Promise((r) => setTimeout(r, 250)); return json({ logged: true }); }
    return new Response("", { status: 404 });
});
window.EventSource = class {
    constructor() { this.readyState = 1; this.listeners = {}; stream = this; }
    addEventListener(type, fn) { (this.listeners[type] ||= []).push(fn); }
    close() { this.readyState = 2; }
    emit(type, data) { for (const fn of this.listeners[type] || []) fn({ data: JSON.stringify(data) }); }
};
const arrive = (text) => {
    pos += 10;
    stream.emit("chat", { items: [{ role: "me", pos, text, at: new Date().toISOString() }], total: items.length + 1 });
};

const draws = { row: 0, feed: 0 };
const drawing = options.__r;
options.__r = (vnode) => {
    if (vnode.type === Row) draws.row += 1;
    if (vnode.type === FeedGrid) draws.feed += 1;
    if (drawing) drawing(vnode);
};

const exec = { available: true };
const live = { status: "idle", pct: 12.4, tokens: 124000, limit: 1000000, tokensIn: 124000, tokensOut: 8000, lastRequestAt: new Date(Date.now() - 120000).toISOString() };
// snap is a snapshot of the host as the application takes one: the session
// comes as a new object saying the same.
let snap = null;
function Page() {
    const [now, setNow] = useState(live);
    snap = () => setNow((was) => ({ ...was, waiting: [...(was.waiting || [])] }));
    return html`<${Chat} name="acme" id="s1" live=${now} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`;
}
if (!reload) render(h(ToastHost, null, h(GateHost, null, h(Page))), document.getElementById("root"));

const until = async (ok) => {
    const end = performance.now() + 5000;
    while (!ok() && performance.now() < end) await new Promise(requestAnimationFrame);
    if (!ok()) throw new Error("The feed did not reach its expected state");
};
const state = () => {
    const box = document.querySelector(".chatfeed");
    const me = Array.from(document.querySelectorAll(".chatfeed .msg.me"));
    const last = me[me.length - 1];
    const texts = me.map((b) => b.textContent.trim());
    const stamp = last && last.nextElementSibling && last.nextElementSibling.classList.contains("mstamp")
        ? last.nextElementSibling.textContent.trim() : "";
    return {
        count: me.length, unique: new Set(texts).size,
        cls: last ? last.className : "", stamp, wait: last && last.querySelector(".mwait") ? last.querySelector(".mwait").textContent : "",
        scrollTop: box.scrollTop, scrollHeight: box.scrollHeight, clientHeight: box.clientHeight,
    };
};

const root = document.getElementById("root");
const historyKey = feedKey("history", "remembered-conversation");
const savedPosition = () => storedPositions()[historyKey];
const mountHistory = () => render(h(ToastHost, null, h(GateHost, null,
    h(Chat, { name: "history", id: "remembered-conversation", live, exec, onBack: () => {} }))), root);
const firstVisible = () => {
    const box = document.querySelector(".chatfeed");
    if (!box) return null;
    const top = box.getBoundingClientRect().top + box.clientTop;
    const row = [...box.querySelectorAll(".feedrow[data-pos]")].find((el) => el.getBoundingClientRect().bottom > top);
    return row ? { pos: Number(row.dataset.pos), nth: Number(row.dataset.nth || 0), offset: top - row.getBoundingClientRect().top } : null;
};
const samePosition = (at) => firstVisible()?.pos === at.pos && firstVisible().nth === (at.nth || 0)
    && Math.abs(firstVisible().offset - at.offset) < 1;
const endVisible = () => {
    const box = document.querySelector(".chatfeed");
    return box && box.querySelector(`[data-pos="${historyTotal}"]`) && box.scrollHeight - box.scrollTop - box.clientHeight < 1;
};
const reloadPosition = async () => {
    const at = savedPosition();
    mountHistory();
    await until(() => at && samePosition(at));
    await quiet();
    return { at: firstVisible(), around: historyReads.some((read) => read.before === at.pos + 1)
        && historyReads.some((read) => read.after === at.pos) };
};
const readingPositions = async () => {
    let frame;
    try {
        render(null, root); historyMode = true; acts = [];
        await quiet(); mountHistory(); await until(endVisible); await quiet();
        const box = document.querySelector(".chatfeed");
        const row = box.querySelector('[data-pos="90"][data-nth="1"]');
        box.scrollTop += row.getBoundingClientRect().top - box.getBoundingClientRect().top + 17;
        box.dispatchEvent(new Event("scroll"));
        await until(() => savedPosition()?.pos === 90);
        await quiet();
        let at = firstVisible();
        render(null, root); historyReads.length = 0;
        await quiet(); mountHistory();
        await until(() => samePosition(at)); await quiet();
        const inTail = samePosition(at) && !historyReads.some((read) => read.before || read.after);
        const fast = document.querySelector(".chatfeed");
        const query = fast.querySelectorAll.bind(fast);
        let measurements = 0;
        fast.querySelectorAll = (selector) => {
            if (selector === ".feedrow[data-pos]") measurements++;
            return query(selector);
        };
        const scrollFast = (pos) => {
            const row = fast.querySelector(`[data-pos="${pos}"]`);
            fast.scrollTop += row.getBoundingClientRect().top - fast.getBoundingClientRect().top + 23;
            for (let n = 0; n < 20; n++) fast.dispatchEvent(new Event("scroll"));
        };
        const writes = positionIO.writes;
        scrollFast(95);
        const deferred = measurements === 0 && positionIO.writes === writes && positionIO.reads === 1;
        window.dispatchEvent(new Event("pagehide"));
        const pagehide = savedPosition()?.pos === 95;
        scrollFast(96);
        Object.defineProperty(document, "visibilityState", { configurable: true, value: "hidden" });
        try { document.dispatchEvent(new Event("visibilitychange")); }
        finally { delete document.visibilityState; }
        const hidden = savedPosition()?.pos === 96;
        scrollFast(97);
        at = firstVisible();
        // Unmount in this turn, before either the debounce or a native scroll runs.
        render(null, root);
        const immediateLeave = savedPosition()?.pos === at.pos && Math.abs(savedPosition().offset - at.offset) < 1;
        historyTotal = 160; historyReads.length = 0;
        await quiet(); mountHistory();
        await until(() => samePosition(at)); await quiet();
        const remount = samePosition(at);
        const around = historyReads.some((read) => read.before === at.pos + 1) && historyReads.some((read) => read.after === at.pos);
        render(null, root); await quiet();
        // A new document has no module memory; only this device's storage crosses it.
        frame = document.createElement("iframe");
        frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99";
        frame.src = `/check/fixtures/feed.html?reload=1&total=${historyTotal}`;
        document.body.append(frame);
        await until(() => frame.contentWindow?.done);
        const reloaded = await frame.contentWindow.done;
        frame.remove(); frame = null;
        missingPosition = at.pos;
        mountHistory();
        await until(() => [at.pos - 1, at.pos + 1].includes(firstVisible()?.pos)); await quiet();
        const missing = [at.pos - 1, at.pos + 1].includes(firstVisible()?.pos);
        const jump = document.querySelector(".chatfeed .feedjump:not(.feedprevious)");
        const explicitJump = jump?.textContent.includes("Back to the end");
        jump.click(); await until(endVisible); await quiet();
        const endForgotten = !savedPosition();
        render(null, root); historyTotal = 180;
        await quiet(); mountHistory(); await until(endVisible); await quiet();
        const end = Boolean(endVisible()) && !document.querySelector(".chatfeed .feedjump:not(.feedprevious)");
        const current = document.querySelector(".chatfeed");
        current.scrollTop = 0; current.dispatchEvent(new Event("scroll"));
        await until(savedPosition);
        for (let n = 0; n < 55; n++) keepAt(`limit-${n}`, current, false);
        flushAt();
        const stored = storedPositions();
        return { deferred, pagehide, hidden, immediateLeave, inTail, remount, around, reload: reloaded.at.pos === at.pos && reloaded.at.nth === at.nth && Math.abs(reloaded.at.offset - at.offset) < 1 && reloaded.around,
            missing, explicitJump, endForgotten, end, bounded: Object.keys(stored).length === 50 && !stored["limit-0"] && Boolean(stored["limit-54"]) };
    } finally {
        frame?.remove(); render(null, root);
        localStorage.removeItem(positionsKey);
    }
};

window.done = (async () => {
    if (reload) return reloadPosition();
    await document.fonts.ready;
    await until(() => document.querySelector(".composer textarea"));
    await quiet();
    const before = state();
    const text = "hello there, run the checks again";
    const area = document.querySelector(".composer textarea");

    // A snapshot of the host and a new state of the work draw the screen again
    // with nothing in the feed changed: the feed is drawn, no row of it is, and
    // the field of the composer is not fitted to its words again.
    const fits = [];
    new MutationObserver((list) => fits.push(...list)).observe(area, { attributes: true, attributeFilter: ["style"] });
    const was = { ...draws };
    snap();
    await quiet();
    stream.emit("state", null);
    await quiet();
    const still = { feed: draws.feed - was.feed, rows: draws.row - was.row, fitted: fits.length };

    area.value = text;
    area.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => !document.querySelector(".composer .iconbtn.accent").disabled);
    const button = document.querySelector(".composer .iconbtn.accent");
    const debug = { areaDisabled: area.disabled, areaValue: area.value, button: Boolean(button), buttonDisabled: button && button.disabled, title: button && button.title };
    // The send clears the field, and the field is fitted to its empty words.
    fits.length = 0;
    button.click();
    await quiet();
    const cleared = { value: area.value, fitted: fits.length };
    const queued = state();
    debug.sent = sent;
    const frames = [];
    let recording = true;
    const tick = () => { if (!recording) return; frames.push(state()); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    arrive(text);
    await until(() => state().stamp !== "queued");
    await quiet();
    recording = false;
    const settled = state();

    // The stream brings an answer again with more written in it: its row is
    // drawn with what came, and it is the one row drawn.
    const answer = items[items.length - 1];
    const more = "And the deploy went out.";
    const said = () => (document.querySelector(`.chatfeed .feedrow[data-pos="${answer.pos}"] .msg`) || {}).textContent || "";
    const drew = draws.row;
    stream.emit("chat", { items: [{ ...answer, text: `${answer.text} ${more}` }], total: items.length + 1 });
    await until(() => said().includes(more));
    await quiet();
    const rewritten = { said: said().trim(), rows: draws.row - drew };
    const copyButton = Array.from(document.querySelectorAll(".chatfeed .msg.me .msgcopy")).at(-1);
    if (copyButton) {
        copyButton.click();
        await until(() => copied.length === 1 && document.querySelector(".toast.on .tmain")?.textContent === "Copied");
    }
    const copy = { button: Boolean(copyButton), text: copied[0], toast: document.querySelector(".toast.on .tmain")?.textContent };

    // Quoting, the way a person does it: select a piece of an answer and press
    // the button that comes up beside it.
    // The piece to quote is one a person can see: a selection scrolled out of
    // the feed has nowhere on screen for its button to stand.
    const feedBox = document.querySelector(".chatfeed").getBoundingClientRect();
    const bubble = Array.from(document.querySelectorAll(".chatfeed .msg:not(.me)")).reverse()
        .find((b) => {
            const r = b.getBoundingClientRect();
            return r.top > feedBox.top + 40 && r.bottom < feedBox.bottom;
        });
    const node = bubble.firstChild.nodeType === 3 ? bubble.firstChild : bubble;
    const range = document.createRange();
    if (node.nodeType === 3) range.setStart(node, 0), range.setEnd(node, Math.min(24, node.textContent.length));
    else range.selectNodeContents(node);
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.dispatchEvent(new Event("selectionchange"));
    await quiet();

    const tip = document.querySelector(".quotetip");
    const quote = { shown: Boolean(tip && tip.classList.contains("on")) };
    if (tip) {
        tip.click();
        await quiet();
    }
    quote.composer = document.querySelector(".composer textarea").value;
    quote.stillShown = Boolean(document.querySelector(".quotetip"));

    // The transcript stays unchanged while a row or the timeline grows on
    // its own. Following the end must include both, and leave a reader above it.
    const growth = async () => {
        const box = document.querySelector(".chatfeed");
        const gap = () => box.scrollHeight - box.scrollTop - box.clientHeight;
        box.scrollTop = box.scrollHeight;
        box.dispatchEvent(new Event("scroll"));
        await quiet();
        const height = box.scrollHeight;
        const pad = document.createElement("div");
        pad.style.height = "50px";
        box.querySelector(".feedrow:last-child").append(pad);
        await until(() => gap() <= 1);
        await quiet();
        const row = { gap: gap(), grew: box.scrollHeight - height };

        const rail = box.querySelector(".rail");
        const railHeight = box.scrollHeight;
        rail.style.minHeight = `${box.querySelector(".feedgrid").clientHeight + 50}px`;
        await until(() => gap() <= 1);
        await quiet();
        const stack = { gap: gap(), grew: box.scrollHeight - railHeight };

        box.scrollTop = 200;
        box.dispatchEvent(new Event("scroll"));
        await quiet();
        const left = box.scrollTop;
        rail.style.minHeight = `${rail.clientHeight + 50}px`;
        await quiet();
        return { row, stack, left, stayed: box.scrollTop, awayGap: gap() };
    };
    const grown = await growth();
    // Act updates touch the card of their row alone, even while the host
    // replaces its waiting summary and the API returns fresh objects for every
    // act.
    const actId = "e".repeat(32);
    const beforeAct = draws.row;
    acts = [{ id: actId, kind: "do", state: "open", title: "Check the router", body: { steps: "Read the label." } }];
    snap(); await until(() => document.querySelector(".requesttitle")?.textContent === acts[0].title); await quiet();
    const actRows = { arrival: draws.row - beforeAct };
    stream.emit("chat", { items: [{ role: "request", id: actId, title: acts[0].title, pos: pos + 20 }], total: items.length + 2 });
    const rowTitle = () => document.querySelector(".feedrow.r-request .requesttitle");
    await until(() => rowTitle()); await quiet();
    const beforeChange = draws.row;
    acts = [{ ...acts[0], title: "Read the router label" }];
    snap(); await until(() => rowTitle()?.textContent === acts[0].title); await quiet();
    actRows.changed = draws.row - beforeChange;
    actRows.title = rowTitle()?.textContent;
    render(h(ToastHost, null, h(SubChat, { session: "acme", id: "s1:agent-1",
        agent: { name: "Worker", kind: "subagent" }, live, onBack: () => {} })), document.getElementById("root"));
    await until(() => document.querySelectorAll(".feedrow").length === items.length);
    await quiet();
    const subGrown = await growth();
    const positions = await readingPositions();
    return { before, still, cleared, queued, frames, settled, rewritten, debug, quote, copy, grown, subGrown, actRows, positions };
})();
</script>
