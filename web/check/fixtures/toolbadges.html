<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="shell"><div class="body" id="root"></div></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<script type="module">
// A run of every kind of call, a run that only thought and the end of a turn,
// each after a reply of its own: every one of them has a badge on the
// timeline.
import { render } from "preact";
import { html } from "/src/html.js";
import { Row } from "/src/screens/chat/rows.js";
import { rows, weld } from "/src/screens/chat/feed.js";
import { FeedGrid } from "/src/screens/chat/timeline.js";
import { KIND_NAMES } from "/src/screens/chat/labels.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const at = "2026-09-26T10:00:00Z";
const kinds = Object.keys(KIND_NAMES).concat(["hook"]);
const long = "A reply long enough to part the marks. ".repeat(4);
const items = [];
let pos = 1;
for (const kind of kinds) {
    items.push({ role: "tools", kind, run: pos, pos, at, calls: [{ name: kind, arg: "x", pos, index: 0 }] });
    pos += 1;
    items.push({ role: "ai", text: `${kind}: ${long}`, pos, at });
    pos += 1;
}
items.push({ role: "think", run: pos, pos, at, count: 2, tokens: 40, spots: [] });
pos += 1;
items.push({ role: "ai", text: `after thinking: ${long}`, pos, at });
pos += 1;
items.push({ role: "turn", ms: 64000, pos, at });
pos += 1;
items.push({ role: "me", text: "next", pos, at });

render(html`<div class="chatfeed"><${FeedGrid} rows=${rows(weld(items))} wide=${false} onOpen=${() => {}}
    row=${(item) => html`<${Row} item=${item} session="lab" id="1" />`} /></div>`,
    document.getElementById("root"));

// The rail sums works into stacks by how the rows of the column lay out, so
// the page waits for the fonts, then, three seconds at most, for a badge of
// every work.
const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
window.done = (async () => {
    await document.fonts.ready;
    const end = performance.now() + 3000;
    while (document.querySelectorAll(".railbadge").length < kinds.length + 2 && performance.now() < end) await frame();
    const col = document.querySelector(".feedcol");
    const marks = Array.from(document.querySelectorAll(".railbadge")).map((b) => {
        const kind = Array.from(b.classList).find((c) => c.startsWith("k-")) || "";
        return { kind: kind.slice(2) };
    });
    const out = { badges: marks, inColumn: col.querySelectorAll(".mtools, .railbadge").length };

    const runningItems = [
        { role: "me", text: "Run the checks.", pos: 1, at },
        { role: "tools", kind: "bash", run: 2, pos: 2, at, calls: [{ name: "Bash", arg: "make check", pos: 2, index: 0 }] },
        { role: "ai", text: long, pos: 3, at },
        { role: "tools", kind: "files", run: 4, pos: 4, at, calls: [{ name: "Read", arg: "web/src/app.js", pos: 4, index: 0 }] },
    ];
    const work = { agents: [{ id: "worker", name: "Worker", status: "active", kind: "background", startedAt: at }] };
    const json = (body) => new Response(JSON.stringify(body), { headers: { "Content-Type": "application/json" } });
    window.fetch = counted(async (url) => String(url).startsWith("/api/chat?")
        ? json({ items: runningItems, first: 1, last: 4, total: 4, moreBefore: false, state: work }) : json({}));
    let stream;
    window.EventSource = class {
        constructor() { this.readyState = 1; this.listeners = {}; stream = this; }
        addEventListener(type, fn) { this.listeners[type] = fn; }
        close() { this.readyState = 2; }
    };
    const live = { session: "lab", sessionId: "rail", status: "busy", transport: "stream", cwd: "/srv/proj" };
    const show = (session) => render(html`<${ToastHost}><${GateHost}><${Chat} name="lab" id="rail" live=${session}
        exec=${{ available: true, kinds: [] }} onBack=${() => {}} onUsage=${() => {}} /></${GateHost}></${ToastHost}>`, document.getElementById("root"));
    const read = () => ({
        tail: Boolean(document.querySelector(".railbadge.k-files")),
        anchored: Boolean(document.querySelector(".railbadge.k-bash")),
        now: Boolean(document.querySelector(".nowchips .k-files")),
        agents: Boolean(document.querySelector(".nowwait")),
    });
    const until = async (ready) => {
        const end = performance.now() + 3000;
        while (!ready() && performance.now() < end) await frame();
    };
    show(live);
    await until(() => document.querySelector(".nowchips .k-files") && document.querySelector(".railbadge.k-bash"));
    await quiet();
    out.running = read();
    show({ ...live, status: "idle" });
    await quiet();
    out.ended = read();
    show({ ...live, turnOver: true });
    await quiet();
    out.waitingAgents = read();
    show(live);
    stream.listeners.chat({ data: JSON.stringify({ items: [{ role: "ai", text: "The file checks out.", pos: 5, at }], total: 5 }) });
    await quiet();
    out.replied = read();
    return out;
})();
</script>
