<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="shell"><div class="body" id="root"></div></div>

<script type="module">
// Two letters an agent sent with the same words: the first to a name nobody
// answers to, the second to the session that started it. claude refused the
// first and queued the second.
import { h, render } from "preact";
import { Row } from "/src/screens/chat/rows.js";

const at = "2026-09-27T20:28:05Z";
const why = "No agent named 'coordinator' is reachable.\nCheck the spelling, or use the agent ID from a background agent's spawn result.";
const items = [
    { role: "mail", dir: "out", from: "coordinator", source: "agent", use: "toolu_1", pos: 10, at,
      text: "salta", undelivered: why },
    { role: "mail", dir: "out", from: "main", source: "agent", use: "toolu_2", pos: 20, at,
      text: "salta" },
];

render(h("div", { class: "chatfeed" }, items.map((item) => h(Row, { item, key: item.pos }))),
    document.getElementById("root"));

(async () => {
  try {
    await new Promise((r) => setTimeout(r, 200));
    const letters = Array.from(document.querySelectorAll(".mletter"));
    const rows = letters.map((el) => {
        const mark = el.querySelector(".mletterlost");
        return {
            from: (el.querySelector(".mletterwho") || {}).textContent || "",
            mark: mark ? mark.textContent : "",
            markColor: mark ? getComputedStyle(mark).color : "",
            peek: ((el.querySelector(".mletterbody") || {}).textContent || "").trim(),
            why: (el.querySelector(".mletterwhy") || {}).textContent || "",
        };
    });
    const quietColor = getComputedStyle(document.querySelector(".sentlabel")).color;
    // Opened, the refused letter gives claude's reason above its words.
    letters[0].querySelector(".mlettermore").click();
    await new Promise((r) => setTimeout(r, 120));
    const opened = {
        why: (letters[0].querySelector(".mletterwhy") || {}).textContent || "",
        body: (letters[0].querySelector(".mletterbody") || {}).textContent || "",
    };
    window.done = { rows, quietColor, opened };
  } catch (err) {
    window.done = { error: String(err && err.stack || err) };
  }
})();
</script>
