<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style id="shape"></style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="host"></div>
<script type="module">
// The chat screen over eighty events of a live conversation, the session at
// work: far exchanges pressed into bands, the one before the last with the
// head of its report, the work of each in one line on a phone and beside the
// feed on a desk, and a card of the call going on now.
import { h, render } from "preact";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { WIDE } from "/src/ui/wide.js";
import { items, NOW } from "/check/fixtures/feedsample.js";

const wide = window.matchMedia(WIDE).matches;
const now = Date.parse(NOW);
Date.now = () => now;
document.getElementById("shape").textContent = wide
    ? "html,body,#host{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}"
    : "html,body,#host{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}";
document.getElementById("host").innerHTML = wide
    ? '<div class="deskshell"><div class="dkbody"><aside class="dkleft"></aside><section class="dkcenter dkchat" id="root"></section></div></div>'
    : '<div class="shell"><div class="body" id="root"></div></div>';

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length, moreBefore: true, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };
const liveOf = (status) => ({ session: "aacpanel", status, pct: 31.2, transport: "stream", cwd: "/srv/proj",
                              tokensIn: 315000, tokensOut: 9000, lastRequestAt: NOW });
const draw = (status) => render(h(ToastHost, null, h(GateHost, null, h(Chat, { name: "aacpanel", id: "s1", live: liveOf(status),
    exec: { available: true }, onBack() {}, onUsage() {} }))), document.getElementById("root"));
draw("busy");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (test, what) => {
    for (let i = 0; i < 150; i++) {
        const got = test();
        if (got) return got;
        await sleep(20);
    }
    throw new Error(`the screen never came to ${what}`);
};
const flat = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sheetOn = (label) => Array.from(document.querySelectorAll(".sheet.on")).find((s) => s.getAttribute("aria-label") === label);

window.done = (async () => {
    await document.fonts.ready;
    await until(() => document.querySelector(".epnow"), "the card of now");
    const eps = Array.from(document.querySelectorAll(".chatfeed .ep"));
    const prev = eps[eps.length - 2];
    const out = {
        wide,
        bands: document.querySelectorAll(".epband").length,
        full: eps.length,
        stubs: Array.from(document.querySelectorAll(".epstub")).map(flat),
        cut: Boolean(prev && prev.querySelector(".epout.cut")),
        readAll: flat(prev && prev.querySelector(".epreadall")),
        changed: flat(prev && prev.querySelector(".epfiles")),
        now: flat(document.querySelector(".epnow")),
        nowStep: flat(document.querySelector(".epnowstep")),
        nowColumns: (() => {
            const call = document.querySelector(".epnowcall");
            const text = document.querySelector(".epnowtext");
            if (!call || !text) return "";
            const a = call.getBoundingClientRect();
            const b = text.getBoundingClientRect();
            return b.left >= a.right - 1 ? "side by side" : "one under the other";
        })(),
        feedWork: flat(document.querySelector(".chatfeed")).includes("Doing B. First closing"),
    };

    if (wide) {
        const side = document.querySelector(".epside");
        const t0 = performance.now();
        for (let i = 0; i < 100 && side.scrollHeight - side.scrollTop - side.clientHeight >= 2; i++) await sleep(20);
        const waited = performance.now() - t0;
        out.side = {
            sections: side.querySelectorAll(".epsideep").length,
            live: side.querySelectorAll(".epsideep.live").length,
            running: flat(side.querySelector(".epsideep.live .wlogrun")),
            atEnd: side.scrollHeight - side.scrollTop - side.clientHeight < 2,
            scroll: [side.scrollTop, side.scrollHeight, side.clientHeight, waited],
            text: flat(side),
        };
        // A band unfolded on a desk brings its work into the process.
        document.querySelector(".epband").click();
        await until(() => document.querySelectorAll(".epband").length === out.bands - 1, "the band unfolded");
        out.side.afterUnfold = side.querySelectorAll(".epsideep").length;
    } else {
        // The summed badges of a stretch of work list the calls of all its runs.
        const stub = document.querySelectorAll(".epstub")[0];
        stub.querySelector(".mtools:not(.mthink)").click();
        const calls = await until(() => sheetOn("tool calls"), "the calls of the summed badge");
        await until(() => calls.querySelector(".calltime"), "the list");
        out.summedCalls = calls.querySelectorAll(".callnode:not(.still)").length;
        out.summedThinking = calls.querySelectorAll(".callnode.still").length;
        calls.querySelector(".sheetclose").click();
        await until(() => !sheetOn("tool calls"), "the calls closed");

        // The stub opens the work as a layer over the feed.
        stub.click();
        const layer = await until(() => sheetOn("work") && sheetOn("work").querySelector(".wlayer"), "the work layer");
        out.layer = {
            head: flat(layer.querySelector(".wlhead")),
            entries: layer.querySelectorAll(".wlogentry").length,
            earlier: !layer.querySelector(".wlhnav button[aria-label='earlier work']").disabled,
            later: !layer.querySelector(".wlhnav button[aria-label='later work']").disabled,
        };
        // A badge of one step lists the calls of that step alone.
        const step = Array.from(layer.querySelectorAll(".wlogentry .mrow .mtools:not(.mthink)"))[0];
        step.click();
        const one = await until(() => sheetOn("tool calls"), "the calls of a step");
        await until(() => one.querySelector(".calltime"), "the list of a step");
        out.layer.stepCalls = one.querySelectorAll(".callnode:not(.still)").length;
        out.layer.stepBadge = step.getAttribute("aria-label");
        one.querySelector(".sheetclose").click();
        await until(() => !sheetOn("tool calls"), "the calls of a step closed");
        // The arrow leads to the work after it: the exchange going on now.
        layer.querySelector(".wlhnav button[aria-label='later work']").click();
        await until(() => flat(sheetOn("work")).includes("after go"), "the later work");
        out.layer.next = flat(sheetOn("work").querySelector(".wlhead"));
        out.layer.running = flat(sheetOn("work").querySelector(".wlogrun"));
        // The back gesture puts the layer down, as it does every layer over the feed.
        history.back();
        await until(() => !sheetOn("work"), "the layer put down by the back gesture");
        out.layer.backCloses = true;

        // A band unfolds on a tap; a report is read whole on a tap.
        document.querySelector(".epband").click();
        await until(() => document.querySelectorAll(".epband").length === out.bands - 1, "the band unfolded");
        out.unfolded = document.querySelectorAll(".epband").length;
        prev.querySelector(".epreadall").click();
        await until(() => !prev.querySelector(".epout.cut"), "the report read whole");
        out.whole = flat(prev.querySelector(".epout")).includes("#145: connection trust");
    }

    // The session goes idle: nothing is going on, and the last exchange ends
    // on the last thing it said.
    draw("idle");
    await until(() => !document.querySelector(".epnow"), "the card of now gone");
    const last = Array.from(document.querySelectorAll(".chatfeed .ep")).pop();
    out.idle = { out: flat(last.querySelector(".epout")), now: document.querySelectorAll(".epnow").length };
    return out;
})();
</script>
