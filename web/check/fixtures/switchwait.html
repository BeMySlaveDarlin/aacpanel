<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// A session on the stream moving to the console, frame by frame: pressed,
// gone from the snapshot, back in the console while the panel is still asking
// what its views do there, and its terminal opening. Every frame in between
// shows the move or the opening terminal — never the feed it left, never a
// terminal that says it detached.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const items = [{ role: "me", pos: 10, text: "where are we", at: new Date().toISOString() },
               { role: "ai", pos: 20, text: "In the project.", at: new Date().toISOString() }];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// The answer about the sides of the console is held back until the check lets
// it go: the frame before it is the one where the feed used to flash.
let letWay = null;
const wayHeld = new Promise((r) => { letWay = r; });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: 10, last: 20, total: 2, moreBefore: false, state: null });
    if (u === "/api/term") return json({ available: true });
    if (u.startsWith("/api/session/window")) return json({ state: "closed" });
    if (u.startsWith("/api/session/switch")) {
        if (current.live && current.live.transport === "stream") return json({ to: "console" });
        await wayHeld;
        return json({ to: "stream" });
    }
    return new Response("", { status: 404 });
};

const terms = [];
window.EventSource = class {
    static CONNECTING = 0;
    static OPEN = 1;
    static CLOSED = 2;
    constructor(url) {
        this.url = String(url);
        this.readyState = 1;
        this.on = {};
        if (this.url.startsWith("/api/term/stream")) terms.push(this);
    }
    addEventListener(name, fn) { this.on[name] = fn; }
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.switch", "session.send", "session.close"] };
const stream = { session: "aacpanel", sessionId: "s1", transport: "stream", status: "idle", pct: 12.4,
                 tokensIn: 1000, tokensOut: 100, cwd: "/srv/aacpanel", lastRequestAt: new Date().toISOString() };
const consoleSide = { ...stream, transport: "", startedAt: 2 };
let move = null;
const wait = { of: (kind, target) => (kind === "switch" && target === "aacpanel" ? move : null), opening: () => [] };

let current = { live: stream, tick: 0 };
let set = null;
function Host() {
    const [state, setState] = useState(current);
    set = (next) => { current = { ...next, tick: current.tick + 1 }; setState(current); };
    return html`<${Chat} name="aacpanel" id="s1" live=${state.live} wait=${wait} exec=${exec}
                         onBack=${() => {}} onUsage=${() => {}} />`;
}
render(h(ToastHost, null, h(GateHost, null, h(Host))), document.getElementById("root"));

const text = (sel) => {
    const el = document.querySelector(sel);
    return el ? el.textContent.replace(/\s+/g, " ").trim() : "";
};
const frame = () => ({
    wait: text(".viewwait"),
    head: text(".talkword"),
    feed: Boolean(document.querySelector(".chatfeed")),
    composer: Boolean(document.querySelector(".composerbox")),
    term: Boolean(document.querySelector(".termwrap")),
    detached: /detached/.test(document.getElementById("root").textContent),
    termStreams: terms.length,
});
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        if (fn()) return true;
        await sleep(30);
    }
    return Boolean(fn());
};

window.done = (async () => {
    await document.fonts.ready;
    const out = {};
    await until(() => document.querySelector(".composer textarea"));
    out.before = frame();

    move = { kind: "switch", target: "aacpanel", params: { to: "console" }, since: Date.now() - 3000 };
    set({ live: stream });
    await sleep(80);
    out.pressed = frame();

    set({ live: null });
    await sleep(80);
    out.gone = frame();

    move = null;
    set({ live: consoleSide });
    await sleep(200);
    out.back = frame();

    letWay();
    await until(() => document.querySelector(".termwrap"));
    await sleep(200);
    out.opening = frame();

    const es = terms[terms.length - 1];
    if (es && es.on.ready) es.on.ready({ data: JSON.stringify({ id: "t1", kind: "tmux", detail: "" }) });
    await until(() => document.querySelector(".termwrap:not(.off)"));
    out.ready = frame();
    out.readyLive = Boolean(document.querySelector(".termwrap:not(.off)"));

    // A move refused on the stream side: the wait goes, the session never
    // left, and the feed is back at once.
    set({ live: stream });
    await until(() => document.querySelector(".chatfeed"));
    move = { kind: "switch", target: "aacpanel", params: { to: "console" }, since: Date.now() };
    set({ live: stream });
    await sleep(80);
    const refusedDuring = frame();
    move = null;
    set({ live: stream });
    await sleep(80);
    out.refusedDuring = refusedDuring;
    out.refused = frame();
    return out;
})();
</script>
