<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The settings with two secrets on the host: the directory once, a row per
// file with its size and time, and a way to take one off that goes through
// the gate — the first press asks, Cancel sends nothing, the confirmation
// sends secret.drop by the name and the list follows. Then a host with no
// secrets at all. The page is the phone's settings on a phone and the desk's
// dialog of settings at a desk: the shells draw the one screen either way.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Settings } from "/src/screens/settings.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { stampText } from "/src/screens/chat/labels.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const DIR = "/home/u/.local/state/aacpanel/secrets";
const at = "2026-01-02T08:00:00Z";
const server = {
    guide: "Use concrete examples.\nExplain the cost of each choice.",
    secrets: [
        { name: "evirma-db.env", bytes: 2048, at },
        { name: "github-token", bytes: 41, at },
    ],
};
const sent = [];
let asked = 0;
let rejectGuide = false;
const guideSaves = [];

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u === "/api/secrets") {
        asked++;
        return json({ dir: DIR, secrets: server.secrets });
    }
    if (u === "/api/settings") return json({ settings: [] });
    if (u === "/api/settings/brief-guide") {
        if (init && init.method === "PUT") {
            const body = JSON.parse(init.body);
            guideSaves.push(body);
            if (rejectGuide) return new Response("the database is unavailable", { status: 503 });
            server.guide = body.text;
        }
        return json({ text: server.guide });
    }
    if (u === "/api/actions") {
        const got = JSON.parse((init && init.body) || "{}");
        sent.push(got);
        if (got.kind === "secret.drop") server.secrets = server.secrets.filter((s) => s.name !== got.target);
        return json({ logged: true, ok: true, detail: `removed ${got.target}` });
    }
    return new Response("", { status: 404 });
});

const exec = { available: true, kinds: ["session.send", "secret.put", "secret.drop"] };
const root = document.getElementById("root");
const wide = innerWidth > 1000;
const show = (key) => render(h(ToastHost, { key }, h(GateHost, null, wide
    ? html`<div class="deskshell"><${Settings} key=${key} exec=${exec} onClose=${() => {}} /></div>`
    : html`<div class="shell no-nav"><main class="body"><${Settings} key=${key} exec=${exec} onClose=${() => {}} /></main></div>`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 4000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await sleep(25);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const rows = () => Array.from(root.querySelectorAll(".skrow"));
const readRows = () => rows().map((r) => `${text(r.querySelector(".setkey"))} | ${
    Array.from(r.querySelectorAll(".setmeta > span")).map(text).join(" · ")}`);
const gate = () => document.querySelector('.sheet.on[aria-label="action confirmation"]');
const gateButton = (word) => Array.from(gate().querySelectorAll(".btnrow .btn")).find((b) => text(b) === word);
const remove = (name) => {
    const row = rows().find((r) => text(r.querySelector(".setkey")) === name);
    if (row) row.querySelector(".skdrop").click();
};

// reachable says whether a press at the middle of the button lands on it:
// a confirmation drawn under the dialog of the settings is there and cannot
// be pressed.
const reachable = (el) => {
    const b = el.getBoundingClientRect();
    const hit = document.elementFromPoint(b.left + b.width / 2, b.top + b.height / 2);
    return Boolean(hit) && (hit === el || el.contains(hit));
};

window.done = (async () => {
    const out = { wide };
    try {
        show("full");
        await until(() => rows().length === 2);
        out.rows = readRows();
        out.dir = text(root.querySelector(".skdir"));
        out.when = `saved ${stampText(at)}`;
        out.head = Array.from(root.querySelectorAll(".grouphead")).map(text);

        // The first press asks and sends nothing; Cancel leaves the file.
        remove("github-token");
        await until(() => gate() || sent.length > 0);
        if (!gate()) {
            out.asked = { title: "", sent: sent.length, reachable: false };
            return out;
        }
        // The sheet slides in: the press is measured once it has arrived.
        await until(() => reachable(gateButton("Remove")), 2000);
        out.asked = {
            title: text(gate().querySelector(".stitle")),
            sent: sent.length,
            reachable: reachable(gateButton("Remove")),
        };
        gateButton("Cancel").click();
        await until(() => !gate());
        await quiet();
        out.cancelled = { sent: sent.length, rows: readRows().length };

        // The confirmation sends secret.drop by the name, and the list is
        // asked again and follows.
        const before = asked;
        remove("github-token");
        await until(() => gate());
        gateButton("Remove").click();
        await until(() => sent.length > 0 && asked > before && rows().length === 1);
        out.dropped = { sent: sent.map((b) => ({ kind: b.kind, target: b.target, params: b.params })), rows: readRows() };

        // A host with no secrets says so in words, with no rows.
        server.secrets = [];
        show("empty");
        await until(() => root.querySelector(".skempty"));
        out.empty = { rows: rows().length, words: text(root.querySelector(".skempty")) };

        const editor = () => root.querySelector("#brief-guide");
        const save = () => root.querySelector('.setguide button[type="submit"]');
        const edit = async (value) => {
            editor().value = value;
            editor().dispatchEvent(new Event("input", { bubbles: true }));
            await until(() => !save().disabled);
        };
        await until(() => editor());
        out.guide = { initial: editor().value, disabled: save().disabled };
        await edit("Name the decision first.\nGive a concrete example and its cost.");
        rejectGuide = true;
        save().click();
        await until(() => root.querySelector('.setguide [role="alert"]') && !save().disabled);
        out.guide.failed = {
            text: editor().value,
            message: text(root.querySelector('.setguide [role="alert"]')),
            saved: server.guide,
        };
        rejectGuide = false;
        save().click();
        await until(() => text(root.querySelector('.setguide [role="status"]')) === "Saved");
        out.guide.saved = server.guide;
        show("guide-reopen");
        await until(() => editor() && editor().value === server.guide);
        out.guide.reopened = editor().value;
        await edit("");
        save().click();
        await until(() => server.guide === "" && save().disabled);
        out.guide.cleared = server.guide;
        out.guide.saves = guideSaves;

        // Leave a filled editor on screen for the fixture's phone and desk pictures.
        server.guide = out.guide.saved;
        show("guide-picture");
        await until(() => editor() && editor().value === server.guide);
        await document.fonts.ready;
        root.querySelector(".setguide").previousElementSibling.scrollIntoView({ block: "start" });
        const bounds = editor().getBoundingClientRect();
        out.guide.fits = bounds.left >= 0 && bounds.right <= innerWidth && bounds.width > 200;
        out.guide.label = text(root.querySelector('label[for="brief-guide"]'));
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
