<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The band under the field of a codex thread on a phone, in every state the
// row of the session can carry: the word of how it thinks — the model and the
// effort, or the plan and the effort — and the word of what it may do, which
// presses only for one of the three modes the panel sets. Then the two sheets
// behind them: the plan, the models of the catalogue and the scale of the
// efforts the model takes; the three modes and the sandbox; and what each
// press sends, one setting at a time.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const at = new Date(Date.now() - 60000).toISOString();
const items = [
    { role: "me", pos: 1, at, text: "Find out why the cart test is flaky." },
    { role: "ai", pos: 2, at, text: "It reads the clock twice." },
];
const models = [
    { model: "gpt-6-astra", name: "gpt-6-astra", efforts: ["low", "medium", "high", "xhigh"], effort: "medium" },
    { model: "gpt-6-astra-mini", name: "gpt-6-astra-mini", efforts: ["minimal", "low", "medium"], effort: "medium" },
];
const sent = [];
let catalogAsked = 0;
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: 1, last: 2, total: 2, moreBefore: false, state: null });
    if (u.startsWith("/api/session/models")) {
        catalogAsked += 1;
        return json({ state: "ok", session: { agent: "codex", transport: "stream",
            list: models.map((m) => ({ value: m.model, name: m.name, efforts: m.efforts, effort: m.effort })) } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.permit", "session.set", "session.file",
    "session.unqueue", "session.close"] };
const thread = {
    session: "codex-5afc361b", sessionId: "0199c3a2-7f10-7b2e-9c41-6e1d5afc361b", profile: "acme", agent: "codex",
    transport: "stream", status: "idle", model: "gpt-6-astra", effort: "high", mode: "ask", plan: false,
    tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/shop",
};
const root = document.getElementById("root");
const page = (live) => h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name=${live.session} id=${live.sessionId} live=${live} exec=${exec}
                  onBack=${() => {}} onUsage=${() => {}} />`));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 100 && !ok(); i += 1) await sleep(30);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
// said reads a word of the band as it is seen: the pieces a margin keeps
// apart are words of their own.
const said = (el) => {
    if (!el) return "";
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const parts = [];
    for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.textContent.trim()) parts.push(n.textContent.trim());
    return parts.join(" ");
};
const chip = (what) => root.querySelector(`.composer .cstrip .pkchip[data-pick="${what}"]`);
// band reads the band as a person does: what each word says, whether it
// presses, and why not when it does not.
const band = () => ({
    think: said(chip("think")),
    perm: said(chip("perm")),
    permOff: chip("perm") ? chip("perm").disabled : null,
    permWhy: chip("perm") ? chip("perm").title : "",
    thinkOff: chip("think") ? chip("think").disabled : null,
    clip: Boolean(root.querySelector(".composer .cstrip .pickfile")),
    claude: Array.from(root.querySelectorAll(".composer .pkcmds, .composer [data-pick=model], .composer [data-pick=mode]"))
        .map((el) => el.className),
});
const show = async (live) => {
    render(null, root);
    setLiveSessions([live]);
    render(page(live), root);
    if (!await until(() => chip("think") && root.querySelector(".chatfeed .msg.ai"))) throw new Error("the band did not show");
    return band();
};
const sheet = () => document.querySelector(".sheet.on");
const since = (n) => sent.slice(n).filter((s) => s.kind === "session.set").map((s) => s.params);

window.done = (async () => {
    await document.fonts.ready;
    const out = {};
    out.ask = await show(thread);
    out.plan = await show({ ...thread, plan: true });
    out.readOnly = await show({ ...thread, mode: "read-only" });
    out.auto = await show({ ...thread, mode: "auto" });
    out.custom = await show({ ...thread, mode: "custom" });
    const unknown = { ...thread };
    delete unknown.mode;
    delete unknown.plan;
    out.unknown = await show(unknown);
    out.askedBeforeOpen = catalogAsked;

    // A thread whose plan is not known: the switch stands still and says so.
    chip("think").click();
    if (!await until(() => sheet() && sheet().querySelector(".cxplan"))) throw new Error("the sheet did not open");
    out.unknownPlan = {
        off: sheet().querySelector(".cxplan").disabled,
        sub: text(sheet().querySelector(".cxplan .nfsub")),
        checked: sheet().querySelector(".cxplan").getAttribute("aria-checked"),
    };

    // The thread in Ask, with no plan: the sheet of how it thinks.
    await show(thread);
    chip("think").click();
    if (!await until(() => sheet() && sheet().querySelectorAll(".pkrow").length === 2)) throw new Error("the models did not come");
    const think = () => ({
        title: text(sheet().querySelector(".stitle")),
        plan: sheet().querySelector(".cxplan").getAttribute("aria-checked"),
        models: Array.from(sheet().querySelectorAll(".pklist .pkrow")).map((r) => ({
            name: text(r.querySelector(".pkname")), on: r.classList.contains("on"),
        })),
        effort: text(Array.from(sheet().querySelectorAll(".pkgroup")).pop()),
        stops: Array.from(sheet().querySelectorAll(".pkstop")).map((s) => s.getAttribute("aria-label")),
        stopOn: (sheet().querySelector(".pkstop.on") || { getAttribute: () => "" }).getAttribute("aria-label"),
        ultra: Boolean(sheet().querySelector(".pkultra")),
    });
    out.think = think();

    let n = sent.length;
    sheet().querySelector(".cxplan").click();
    await until(() => since(n).length === 1);
    out.planSent = since(n);

    n = sent.length;
    Array.from(sheet().querySelectorAll(".pklist .pkrow")).find((r) => text(r.querySelector(".pkname")) === "gpt-6-astra-mini").click();
    await until(() => since(n).length === 1 && sheet().querySelectorAll(".pkstop").length === 3);
    out.modelSent = since(n);
    out.afterModel = think();

    n = sent.length;
    sheet().querySelector('.pkstop[aria-label="Minimal"]').click();
    await until(() => since(n).length === 1 && said(chip("think")).includes("Minimal"));
    out.effortSent = since(n);
    out.chipAfter = said(chip("think"));

    // The sheet of what codex may do.
    render(null, root);
    await show(thread);
    chip("perm").click();
    if (!await until(() => sheet() && sheet().querySelector(".cxsandbox"))) throw new Error("the sheet of the modes did not open");
    out.perm = {
        title: text(sheet().querySelector(".stitle")),
        rows: Array.from(sheet().querySelectorAll(".pklist .pkrow")).map((r) => ({
            name: text(r.querySelector(".pkname")), on: r.classList.contains("on"), off: r.disabled,
        })),
        sandbox: Array.from(sheet().querySelectorAll(".cxsandbox li")).map((li) => Array.from(li.children).map(text).join(" ")),
    };
    n = sent.length;
    Array.from(sheet().querySelectorAll(".pklist .pkrow")).find((r) => text(r.querySelector(".pkname")) === "Approve for me").click();
    await until(() => since(n).length === 1 && said(chip("perm")) === "Auto");
    out.modeSent = since(n);
    out.permAfter = said(chip("perm"));
    out.targets = [...new Set(sent.filter((s) => s.kind === "session.set").map((s) => s.target))];

    // A word that does not press opens nothing.
    await show({ ...thread, mode: "custom" });
    chip("perm").click();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    out.customOpened = Boolean(sheet());
    return out;
})();
</script>
