<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} #desk{display:none}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div class="deskshell"><div class="dkbody" id="desk"></div></div>
<div class="page" id="phone"></div>
<script type="module">
// The phone's cards expose only the actions the host can take: the home
// session never closes, a daemon thread restarts and outside sessions are only
// read. Every press still belongs to the gate, with its own confirmation.
import { h, render } from "preact";
import { Sessions } from "/src/screens/sessions.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { shownName } from "/src/agent.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const sessions = [
    { session: "helios", sessionId: "h1", contour: 0, home: true, status: "idle", pct: 40, cwd: "/home/me",
      transport: "stream", model: "claude-opus-5-5", work: { agents: 2, tasks: 1 } },
    { session: "lab", sessionId: "l1", contour: 0, status: "idle", pct: 20, cwd: "/srv/lab",
      transport: "stream", model: "claude-opus-5-5", work: { agents: 0, tasks: 1, observers: 1, alarms: 1, workflows: 1 } },
    { session: "quiet", sessionId: "q1", contour: 0, status: "idle", pct: 10, cwd: "/srv/quiet" },
    { session: "codex-5afc361b", sessionId: "c1", title: "Cart flakes", agent: "codex", contour: 0,
      status: "busy", transport: "stream", model: "gpt-6-astra", pct: 18, cwd: "/srv/codex" },
    { session: "outside", sessionId: "o1", contour: 0, outside: true, status: "idle", pct: 9, cwd: "/srv/outside" },
];
setLiveSessions(sessions);
const exec = { available: true, kinds: ["session.close", "session.restart", "session.kill"] };
const snapshot = { at: 1, sessions, profileMap: [], limits: null };
const sent = [], opened = [];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    if (String(url) === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true });
    }
    if (String(url).startsWith("/api/sessions")) return json({ rows: [], total: 0 });
    return new Response("", { status: 404 });
});
const desk = document.getElementById("desk");
const mountDesk = (host = exec, wait = null) => render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot, limits: null, current: "", onPick(p) { opened.push(p); }, picks: [], setPicks() {}, onNames() {}, onOrder() {}, exec: host, wait,
}))), desk);
mountDesk();

const phone = document.getElementById("phone");
const mount = (host = exec, wait = { of: () => null, opening: () => [] }) => render(h(ToastHost, null, h(GateHost, null, h(Sessions, {
    snapshot, error: null, ageSec: 1, exec: host, wait, faults: [], pick: (s) => opened.push(s),
}))), phone);
mount();
const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => requestAnimationFrame(r));
    if (!ok()) throw new Error("the session cards did not reach the expected state");
};
const text = (el) => el ? el.textContent.replace(/\s+/g, " ").trim() : "";
const row = (name) => phone.querySelector(`[aria-label="open conversation ${name}"]`).closest(".pjcard");
const button = (name, kind) => phone.querySelector(`[aria-label="${kind} session ${name}"]`);
const gate = () => phone.querySelector('.sheet.on[aria-label="action confirmation"]');
const tip = (label) => {
    const el = document.querySelector(`#desk [aria-label="${label}"]`);
    return el ? el.getAttribute("data-tip") || "" : null;
};
const meets = (a, b) => a.left < b.right - 1 && b.left < a.right - 1 && a.top < b.bottom - 1 && b.top < a.bottom - 1;

window.done = (async () => {
    await until(() => phone.querySelectorAll(".pjcard").length === sessions.length);
    await document.fonts.ready;
    const out = { mobileActions: {}, gates: [], tips: {}, notes: {}, overflow: 0 };
    for (const s of sessions) {
        const card = row(s.session);
        card.scrollIntoView({block: "center"});
        const box = card.getBoundingClientRect();
        const words = [".pjsess", ".pjopen", ".pjpct"].map((sel) => card.querySelector(sel).getBoundingClientRect());
        const buttons = [...card.querySelectorAll(".pjact")];
        const top = card.querySelector(".pjtop");
        const topBox = top.getBoundingClientRect();
        out.mobileActions[s.session] = buttons.map((b) => {
            const r = b.getBoundingClientRect();
            return { text: text(b), label: b.getAttribute("aria-label"), top: b.closest(".pjtop") === top
                    && r.top >= topBox.top && r.bottom <= topBox.bottom, width: r.width, disabled: b.disabled, icon: Boolean(b.querySelector("svg")), height: r.height,
                line: card.querySelector(".pjsess").getBoundingClientRect().height,
                reach: b.contains(document.elementFromPoint(r.left + r.width / 2, r.top - 5)),
                clear: !words.some((w) => meets(r, w)), inside: r.left >= box.left && r.right <= box.right && r.bottom <= box.bottom,
                hit: (() => { const a = b.getBoundingClientRect();
                    return b.contains(document.elementFromPoint(a.left + a.width / 2, a.top + a.height / 2)); })() };
        });
        out.notes[s.session] = buttons.map((b) => b.title).join(" | ");
        card.querySelector(".pjopen").click();
    }
    out.opened = [...opened];
    out.more = phone.querySelectorAll(".pjmore, .pjends, .pjend").length;
    out.overflow = document.scrollingElement.scrollWidth - innerWidth;
    for (const [name, kind] of [["lab", "restart"], ["lab", "close"], ["helios", "restart"], ["codex-5afc361b", "close"]]) {
        const before = sent.length;
        button(name, kind).click();
        await until(() => gate()?.querySelector(".btnrow .btn:last-child"));
        const confirm = gate().querySelector(".btnrow .btn:last-child");
        const shot = { name, kind, title: text(gate().querySelector(".stitle")), effect: text(gate().querySelector(".warnline")) + " " + text(gate().querySelector(".pkseg.on")),
            ok: text(confirm), harsher: [...gate().querySelectorAll("button.item")].map(text), before: sent.length - before,
            opened: opened.length - out.opened.length };
        confirm.click();
        await until(() => sent.length === before + 1 && !gate());
        shot.sent = sent.slice(before);
        out.gates.push(shot);
    }
    for (const [name, kind] of [["helios", "restart"], ["lab", "close"], ["quiet", "close"]]) out.tips[name] = tip(`${kind} session ${name}`);
    out.desktopActions = Object.fromEntries(sessions.map((s) => {
        const card = [...desk.querySelectorAll(".dklive")].find((r) => text(r.querySelector(".dkname")) === shownName(s));
        return [s.session, [...card.querySelectorAll(".dkact")].map((b) => ({
            label: b.getAttribute("aria-label"), off: b.getAttribute("aria-disabled") === "true",
            pressed: b.getAttribute("aria-pressed"), icon: Boolean(b.querySelector("svg")),
        }))];
    }));
    const deskGate = () => desk.querySelector('.sheet.on[aria-label="action confirmation"]');
    out.desktopGates = [];
    for (const [name, kind] of [["lab", "restart"], ["lab", "close"], ["helios", "restart"], ["codex-5afc361b", "close"]]) {
        const before = sent.length, picked = opened.length;
        desk.querySelector(`[aria-label="${kind} session ${name}"]`).click();
        await until(() => deskGate()?.querySelector(".btnrow .btn:last-child"));
        const shot = { name, kind, before: sent.length - before, opened: opened.length - picked };
        deskGate().querySelector(".btnrow .btn:last-child").click();
        await until(() => sent.length === before + 1 && !deskGate());
        shot.sent = sent.slice(before);
        out.desktopGates.push(shot);
    }
    mountDesk({ available: true, kinds: [] });
    await quiet();
    out.desktopUnavailable = [...desk.querySelectorAll('[aria-label$=" lab"]')].map((b) => ({
        off: b.getAttribute("aria-disabled") === "true", why: b.getAttribute("data-tip"),
    }));
    out.desktopBusy = true;
    for (const kind of ["restart", "close"]) {
        mountDesk(exec, { of: (act, name) => name === "lab" && act === kind ? { since: 1 } : null, opening: () => [] });
        await quiet();
        const before = sent.length;
        for (const b of desk.querySelectorAll('[aria-label$="session lab"]')) {
            out.desktopBusy = out.desktopBusy && b.getAttribute("aria-disabled") === "true";
            b.click();
        }
        out.desktopBusy = out.desktopBusy && sent.length === before && !deskGate();
    }
    mountDesk();
    mount({ available: true, kinds: [] });
    await until(() => button("lab", "close").disabled && button("lab", "restart").disabled);
    out.unavailable = [...row("lab").querySelectorAll(".pjact")].map((b) => ({ off: b.disabled, why: b.title }));
    out.busy = true;
    for (const kind of ["restart", "close"]) {
        mount(exec, { of: (act, name) => name === "lab" && act === kind ? { since: 1 } : null, opening: () => [] });
        await until(() => text(row("lab").querySelector(".pjbusy")) === (kind === "restart" ? "restarting" : "closing"));
        out.busy = out.busy && [...row("lab").querySelectorAll(".pjact")].every((b) => b.disabled);
    }
    render(null, phone);
    mount();
    await until(() => phone.querySelectorAll(".pjcard").length === sessions.length);
    await quiet();
    window.scrollTo(0, 0);
    const { sessionPause } = await import("/check/fixtures/sessionpause.js");
    out.pause = await sessionPause();
    return out;
})();
</script>
