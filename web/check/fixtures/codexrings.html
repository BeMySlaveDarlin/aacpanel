<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} .deskshell{position:static;height:700px} .dkbody{height:700px} #phone{width:390px}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell" id="desk"></div>
<div id="phone"></div>
<script type="module">
// Providers arrive as data. Each group keeps its own readings and details,
// and named Codex threads still open by their address on both shells.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { ContourLimits, SessionColumn } from "/src/desktop/sessions.js";
import { LiveLines } from "/src/screens/sessions/blocks.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";
import { quiet } from "/check/fixtures/quiet.js";

const now = Math.floor(Date.now() / 1000);
Date.now = () => now * 1000;
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 });
const limits = { contours: [
    { profile: "Acme", contour: 4, ageSec: 30, fiveHour: part(7, 3.4), sevenDay: part(41, 98),
      codex: { ageSec: 30, windows: [], sevenDay: part(63, 52) },
      gemini: { ageSec: 30, fiveHour: part(27, 2), sevenDay: part(55, 120) } },
    { profile: "Lab", contour: 5, codex: { ageSec: 30, windows: [], sevenDay: part(18, 130) } },
    { profile: "Home", contour: 6, ageSec: 30, sevenDay: part(9, 120) },
] };
const profileMap = [{ id: 4, profile: "Acme", name: "Acme", groups: [] }, { id: 5, profile: "Lab", name: "Lab", groups: [] },
    { id: 6, profile: "Home", name: "Home", groups: [] }];
const codex = { session: "codex-5afc361b", sessionId: "0199c3a2", contour: 4, profile: "Acme", agent: "codex",
    transport: "stream", status: "idle", model: "gpt-6-astra", effort: "high", pct: 15, cwd: "/srv/shop", title: "Cart flakes" };
const sessions = [codex];
setLiveSessions(sessions);
window.fetch = async () => new Response(JSON.stringify({ rows: [], total: 0, limit: 30, offset: 0 }), { headers: { "Content-Type": "application/json" } });
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };
const exec = { available: true, kinds: ["session.close", "session.stop", "session.permit"] };
const opened = [];
const columnProps = {
    snapshot: { at: now, sessions, profileMap, limits }, limits,
    current: "", onPick(p) { opened.push(p); }, onNames() {}, onOrder() {}, exec, wait: null,
};
function Scene() {
    const [shown, setShown] = useState("");
    return h(ToastHost, null, h(GateHost, null, [
        h("div", { class: "dkbody" }, h(SessionColumn, { ...columnProps, onShown: setShown })),
        h("footer", { class: "dkstatus" }, [h("span", { class: "dkstatuscontour" }, shown),
            h(ContourLimits, { key: shown, name: shown, limits, profiles: profileMap })]),
    ]));
}
render(h(Scene), document.getElementById("desk"));
render(h(ToastHost, null, h(GateHost, null, html`
    <section class="pjblock"><${LiveLines} list=${sessions} notes=${null} wait=${null}
                                           onOpen=${(n) => opened.push({ name: n })} exec=${exec} /></section>
`)), document.getElementById("phone"));

const until = async (ok) => {
    const end = performance.now() + 3000;
    while (!ok() && performance.now() < end) await new Promise((r) => requestAnimationFrame(r));
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    await document.fonts.ready;
    const desk = document.getElementById("desk");
    const tabs = () => Array.from(desk.querySelectorAll(".dkpick [role=tab]"));
    if (!await until(() => tabs().length === 3 && desk.querySelector(".dklimhead"))) throw new Error("the contours did not show");
    const out = { heads: [] };
    const headOf = (head) => ({
        headingReadings: head.querySelectorAll(".limit-reading").length,
        name: text(head.querySelector(".dkcontourname")),
        agents: [...new Set([...desk.querySelectorAll(".dkstatus .limit-chip")].map((r) => r.dataset.agent))],
        groups: [...desk.querySelectorAll(".dkstatus .limit-chip-group")].map((group) => ({
            agent: group.dataset.agent, label: group.getAttribute("aria-label"), role: group.getAttribute("role"),
            windows: [...group.querySelectorAll(".limit-reading")].map((r) => r.getAttribute("aria-label")),
            icon: Boolean(group.querySelector(".limit-vendor svg path")?.getAttribute("d")),
        })),
        chips: Array.from(desk.querySelectorAll(".dkstatus .limit-chip")).map((r) => ({
            tip: r.title, value: r.querySelector(".limit-percent").firstChild.textContent, agent: r.dataset.agent || "", vendor: r.closest(".limit-chip-group").querySelector(".limit-vendor")?.dataset.agent, left: text(r.querySelector(".limit-left")),
        })),
    });
    for (const tab of tabs().slice(1)) {
        const name = text(tab.querySelector(".dkpickname"));
        tab.click();
        if (!await until(() => text(desk.querySelector(".dkstatuscontour")) === name)) throw new Error(`the tab of ${name} did not show it`);
        out.heads.push(headOf(desk.querySelector(".dklimhead")));
    }
    tabs()[0].click();
    if (!await until(() => desk.querySelector(".sc:not(.scpast)") && text(desk.querySelector(".dkstatuscontour")) === "Acme")) throw new Error("the first tab did not come back");
    out.heads.unshift(headOf(desk.querySelector(".dklimhead")));
    out.pop = [];
    for (const reading of desk.querySelectorAll(".dkstatus .limit-reading")) {
        reading.click();
        await until(() => reading.getAttribute("aria-expanded") === "true" && document.querySelector(".limit-popover"));
        const label = reading.title.split(", ").slice(0, 2).join(", ");
        const detail = [...document.querySelectorAll(".limit-popover .limit-detail-reading")].find((row) => row.getAttribute("aria-label") === label);
        out.pop.push(detail?.getAttribute("aria-label") || "");
    }
    const last = desk.querySelector('.limit-reading[aria-expanded="true"]');
    last.click();
    out.toggledClosed = await until(() => !document.querySelector(".limit-popover"));
    last.click();
    await until(() => document.querySelector(".limit-popover"));
    await quiet();
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    out.escapeClosed = await until(() => !document.querySelector(".limit-popover"));
    last.click();
    await until(() => document.querySelector(".limit-popover"));
    await quiet();
    desk.querySelector(".dkcontourname").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    out.outsideClosed = await until(() => !document.querySelector(".limit-popover"));
    const row = desk.querySelector(".sc:not(.scpast)");
    out.deskName = { text: text(row.querySelector(".scname")), tip: row.querySelector(".scname").title };
    row.querySelector(".scopen").click();
    out.phoneName = text(document.querySelector("#phone .sc .scname"));
    document.querySelector("#phone .sc .scopen").click();
    out.opened = opened.map((o) => o.name);
    return out;
})();
</script>
