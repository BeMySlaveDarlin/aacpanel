<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<div id="column" style="display:none"></div>
<script type="module">
// A question codex asked without waiting beside the question of claude's it
// is answered as. Claude on the stream asks which theme a page takes, and its
// sheet is read and answered: the head of the conversation and the row in the
// column of sessions beside it stop saying it waits at once, while the
// snapshot still shows the question. Then a codex thread that asked the same nine hours of work
// ago — the question far above the end of the feed the screen holds, and the
// row only saying the thread asks — offers it in the same sheet. A pick, a
// note and Send go as one message naming the question, its words the answer
// codex reads; the message stands as the card of the round answered, on its
// way and once the thread has read it, as claude's answered round stands. A
// second thread asked two questions, and putting them away tells codex the
// person will answer in the conversation. Last, the feed alone: where the
// card of a question stands once its answer came, and the words of an answer
// read back.
//
// The page opened as codexasync.html#claude stops with claude's sheet, #codex
// with codex's, #codexnote with an option picked and a note written,
// #codexgoing with the answer on its way, #codexcard with the answer read and
// #claudecard with claude's answered round in its feed, for a picture.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { rows } from "/src/screens/chat/feed.js";
import { asyncAnswer, panelSaid } from "/src/screens/chat/panelsaid.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const mode = location.hash.slice(1);
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const THEME = "Which theme should the page take?";
const NOTE = "keep the contrast high";

// Claude on the stream, asking.
const claudeAsk = {
    sessionId: "0199c3a2-0000-7000-8000-000000000001", toolUseId: "toolu_theme", cwd: "/srv/site", at: ago(1),
    questions: [{ text: THEME, header: "Theme", multi: false,
                  options: [{ label: "Light", description: "" }, { label: "Dark", description: "" }] }],
};
const claude = {
    session: "site", sessionId: claudeAsk.sessionId, profile: "acme", status: "waiting", waitingFor: "input needed",
    transport: "stream", model: "claude-opus-5-5", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/site",
    ask: { header: "Theme", text: THEME, count: 1, at: claudeAsk.at, toolUseId: "toolu_theme" },
};
// The same session once the round is answered: its card in the feed.
const claudeDone = { ...claude, session: "site-done", status: "idle", waitingFor: "", ask: undefined };

// A codex thread that asked nine hours ago and worked on: the question is
// some two thousand records above the first of the rows the screen reads.
const THREAD = "01a12345-0000-7000-8000-00000000abcd";
const codexAsk = {
    sessionId: "", toolUseId: "call_ask_theme", at: ago(540), async: true,
    questions: [{ text: THEME, header: "", multi: false, other: true,
                  options: [{ label: "Light" }, { label: "Dark" }] }],
};
const codex = {
    session: "codex-0000abcd", sessionId: THREAD, profile: "acme", agent: "codex", transport: "stream",
    status: "busy", model: "gpt-6-astra", tokens: 94000, limit: 272000, pct: 34.9, cwd: "/srv/site",
    lastRequestAt: ago(1),
    ask: { header: "", text: THEME, count: 1, at: codexAsk.at, async: true, toolUseId: "call_ask_theme" },
};
// A second thread that asked two questions together.
const twoAsk = {
    sessionId: "", toolUseId: "call_ask_logo", at: ago(30), async: true,
    questions: [
        { text: "And the footer?", header: "", multi: false, other: true, options: [{ label: "Dark" }, { label: "Light" }] },
        { text: "Should the logo stay?", header: "", multi: false, other: true, options: [] },
    ],
};
const two = {
    ...codex, session: "codex-0000ef01", sessionId: "01a12345-0000-7000-8000-00000000ef01", status: "idle",
    ask: { header: "", text: "And the footer?", count: 2, at: twoAsk.at, async: true, toolUseId: "call_ask_logo" },
};
setLiveSessions([claude, codex, two]);

const said = (pos, role, text, min) => ({ pos, role, text, at: ago(min), cut: false });
const feeds = {
    site: {
        items: [said(10, "me", "Theme the settings page", 3), said(20, "ai", "I look at the page first.", 2)],
        state: { tasks: [], agents: [], ask: claudeAsk },
    },
    "site-done": {
        items: [
            said(10, "me", "Theme the settings page", 3),
            { pos: 30, role: "asked", use: "toolu_theme", at: ago(1),
              asked: [{ header: "Theme", text: THEME, answer: ["Dark"], note: NOTE }] },
            said(40, "ai", "The page is dark now, and the contrast stays high.", 0),
        ],
        state: { tasks: [], agents: [] },
    },
    "codex-0000abcd": {
        items: [
            said(90100, "ai", "I check the colours of the settings page against the design tokens.", 70),
            said(90800, "ai", "The tokens of the light and the dark theme are both there; the page uses neither yet.", 60),
            said(91500, "ai", "The header and the side menu read their colours from the page, so either theme carries over.", 55),
        ],
        state: { tasks: [], agents: [], ask: codexAsk },
        total: 2413, moreBefore: true,
    },
    "codex-0000ef01": {
        items: [said(500, "ai", "The header is done; the footer and the logo are next.", 31)],
        state: { tasks: [], agents: [], ask: twoAsk },
    },
};

const posted = [];
const sentTo = (target) => posted.filter((r) => r.target === target)
    .map((r) => ({ kind: r.kind, target: r.target, params: r.params }));
const json =(b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        posted.push(JSON.parse(init.body));
        return json({ ok: true, detail: "the answer went into the turn that runs" });
    }
    if (u.startsWith("/api/chat?")) {
        const feed = feeds[new URL(u, location.href).searchParams.get("session")];
        if (!feed) return new Response("", { status: 404 });
        const { items } = feed;
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: feed.total || items.length,
                      moreBefore: Boolean(feed.moreBefore), state: feed.state });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return new Response("", { status: 404 });
});
// The stream of the feed, told what the transcript brought.
const streams = [];
window.EventSource = class {
    constructor(url) { this.url = url; this.readyState = 1; this.listeners = {}; streams.push(this); }
    addEventListener(type, fn) { (this.listeners[type] ||= []).push(fn); }
    close() { this.readyState = 2; }
};
const emit = (type, data) => {
    for (const es of streams) {
        if (es.readyState !== 1) continue;
        for (const fn of es.listeners[type] || []) fn({ data: JSON.stringify(data) });
    }
};

const exec = { available: true, kinds: ["session.answer", "session.dismiss", "session.send", "session.unqueue",
                                         "session.stop", "session.close"] };
const root = document.getElementById("root");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const one = (sel) => root.querySelector(sel);
const count = (sel) => root.querySelectorAll(sel).length;

// The sheet of the question and the last card of an answered round.
const sheet = () => {
    const head = root.querySelector(".sheet.on .askhead");
    return head ? head.closest(".sheet") : null;
};
const lastCard = () => {
    const all = root.querySelectorAll(".chatfeed .sent.asked");
    return all.length ? all[all.length - 1] : null;
};
// skeleton is what a part is built of: every element in order, by its tag
// and its classes, leaving out the parts that match skip.
const skeleton = (el, skip = "") => {
    if (!el) return [];
    return [el, ...el.querySelectorAll("*")]
        .filter((n) => !skip || !n.closest(skip))
        .map((n) => n.tagName.toLowerCase() + [...n.classList].sort().map((c) => `.${c}`).join(""));
};
const card = () => {
    const el = lastCard();
    if (!el) return null;
    const stamp = el.parentElement.querySelector(".mstamp");
    return {
        label: text(el.querySelector(".sentlabel")),
        why: text(el.querySelector(".askedwhy")),
        rows: Array.from(el.querySelectorAll(".askedrow")).map((r) => ({
            tag: text(r.querySelector(".mftag")),
            q: text(r.querySelector(".askedq")),
            a: text(r.querySelector(".askeda")),
            note: text(r.querySelector(".pnmnote")),
            faint: r.classList.contains("s-faint"),
        })),
        stamp: text(stamp),
    };
};
const screen = () => ({
    cards: count(".chatfeed .sent.asked"),
    bubbles: count(".chatfeed .msg.me"),
    sheet: Boolean(sheet()),
    composer: Boolean(one(".composer textarea")),
    word: text(one(".chathead .talkword")),
});

// The column of sessions a desk shows beside the conversation, given the
// snapshot once: what changes in it after an answer comes from the answer.
const column = document.getElementById("column");
render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: Date.now() / 1000, sessions: [claude, codex], profileMap: [], limits: null, host: { home: "/home/u" } },
    profiles: { profiles: [] }, limits: null, current: "", currentId: "", onPick() {}, picks: [], setPicks() {},
    onNames() {}, onOrder() {}, onArchive() {}, exec, wait: null,
}))), column);
const rowOf = (name) => {
    const row = Array.from(column.querySelectorAll(".dklive")).find((r) => text(r.querySelector(".dkname")) === name);
    return row ? { tone: row.dataset.tone, said: text(row.querySelector(".dksessmain")) } : null;
};
const stands = (name) => ({ word: text(one(".chathead .talkword")), row: rowOf(name) });

const show = async (live) => {
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${live.session} id=${live.sessionId} live=${live}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    await settled();
};

window.done = (async () => {
    await document.fonts.ready;
    const out = {};

    await show(claude);
    if (!await until(() => sheet() && one(".chatfeed .msg"))) throw new Error("claude's question did not come");
    await settled();
    out.claude = { label: text(sheet().querySelector(".asklabel")), skeleton: skeleton(sheet()),
                   foot: Boolean(sheet().querySelector(".askfoot")) };
    if (mode === "claude") return {};

    // Claude's question answered: a single one goes at the tap. The snapshot
    // the screen holds still says the session waits on it.
    out.claudeAsks = stands("site");
    Array.from(sheet().querySelectorAll(".askopts .askopt:not(.askown) .askpick"))
        .find((b) => text(b) === "Dark").click();
    if (!await until(() => sentTo("site").length > 0 && !sheet())) throw new Error("claude's answer did not go");
    await settled();
    out.claudeSent = sentTo("site");
    out.claudeAnswered = stands("site");

    await show(codex);
    if (!await until(() => sheet() && one(".chatfeed .msg"))) throw new Error("codex's question did not come");
    await settled();
    const go = () => sheet().querySelector(".askfoot .btn.primary");
    out.codex = { label: text(sheet().querySelector(".asklabel")), skeleton: skeleton(sheet(), ".askfoot"),
                  send: text(go()), sendOff: Boolean(go() && go().disabled),
                  drop: text(sheet().querySelector(".askdropwhy")), ...screen() };
    out.codexAsks = stands("codex-0000abcd");
    if (mode === "codex") return {};

    sheet().querySelectorAll(".askopts .askopt:not(.askown) .askpick")[1].click();
    if (!await until(() => sheet() && sheet().querySelector(".asknote"))) throw new Error("no note beside the pick");
    await settled();
    out.picked = {
        posted: sentTo("codex-0000abcd").length,
        on: Array.from(sheet().querySelectorAll(".askopts .askopt:not(.askown)")).map((o) => o.classList.contains("on")),
        send: text(go()), sendOff: go().disabled,
    };
    const note = sheet().querySelector(".asknote");
    note.value = NOTE;
    note.dispatchEvent(new Event("input", { bubbles: true }));
    await settled();
    if (mode === "codexnote") return {};

    go().click();
    if (!await until(() => sentTo("codex-0000abcd").length > 0 && lastCard() && one(".composer textarea"))) {
        throw new Error("the answer did not go");
    }
    // A second message, if the sheet sent one, has the time to show itself.
    await quiet();
    out.posted = sentTo("codex-0000abcd");
    out.going = { card: card(), ...screen(), stands: stands("codex-0000abcd") };
    if (mode === "codexgoing") return {};

    // The thread read the answer: the transcript has the message, and the
    // state no longer carries the question.
    emit("chat", { items: [{ role: "me", pos: 99000, text: out.posted[0].params.text, at: new Date().toISOString() }],
                   total: 2414 });
    emit("state", { tasks: [], agents: [] });
    if (!await until(() => lastCard() && !lastCard().parentElement.querySelector(".mstamp"))) {
        throw new Error("the answer read by the thread did not settle");
    }
    await settled();
    out.read = { card: card(), skeleton: skeleton(lastCard(), ".mftag"), ...screen() };
    if (mode === "codexcard") return {};

    await show(claudeDone);
    if (!await until(() => lastCard())) throw new Error("claude's answered round did not come");
    await settled();
    out.claudeCard = { card: card(), skeleton: skeleton(lastCard(), ".mftag") };
    if (mode === "claudecard") return {};

    await show(two);
    if (!await until(() => sheet() && sheet().querySelector(".askdrop"))) throw new Error("the two questions did not come");
    await settled();
    out.two = { steps: sheet().querySelectorAll(".asksteps i").length, label: text(sheet().querySelector(".asklabel")) };
    sheet().querySelector(".askdrop").click();
    if (!await until(() => sentTo("codex-0000ef01").length > 0 && lastCard())) {
        throw new Error("putting the questions away sent nothing");
    }
    await quiet();
    out.putAway = { posted: sentTo("codex-0000ef01"), card: card(), ...screen() };

    // The feed alone. An answer of two questions, one with a note of two
    // lines and one in words of several, reads back as it was written.
    const words = asyncAnswer(twoAsk.questions, [[1], []], ["", "Drop it, the title\n\nis enough "],
                              ["keep it plain\non every page", ""]);
    out.words = words;
    out.trip = panelSaid(words);
    // Where the card of a question stands: given way to the answer the sheet
    // wrote, saying a message answered it in words of its own, gone into the
    // sheet while it hangs, and saying nobody answered it where no sheet
    // offers it.
    const question = { pos: 10, role: "question", use: "call_ask_theme", at: ago(9),
                       asks: [{ title: THEME, options: ["Light", "Dark"] }] };
    const answer = asyncAnswer(codexAsk.questions, [[2]], [""], [""]);
    const shown = (items, asking) => rows(items, [], asking)
        .map((r) => (r.role === "question" ? `question:${r.status}` : r.role));
    out.rows = {
        sheet: shown([question, said(20, "me", answer, 1)], false),
        words: shown([question, said(20, "me", "Dark, and keep the contrast", 1)], false),
        hangs: shown([question, said(15, "ai", "I go on with the header.", 2)], true),
        open: shown([question, said(15, "ai", "I go on with the header.", 2)], false),
        going: rows([question], [{ role: "me", text: answer, state: "answered", after: 10 }], true).map((r) => r.role),
    };
    return out;
})();
</script>
