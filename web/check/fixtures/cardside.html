<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} #root{width:390px;box-sizing:border-box;padding:0 15px}</style>
<div id="root" class="pfcol"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The right side of live cards on a phone 390 px wide: one on the stream with
// Remote Control up and a long step of its checklist, one with Remote Control
// up, a checklist and two tasks in its background, one in tmux with a task in
// its background and no checklist — each the only session of its project —
// and a project of two, a claude session and a codex thread on the daemon,
// whose rows carry their names over them.
import { h, render } from "preact";
import { ProjectBlock, blocksOf } from "/src/screens/sessions/blocks.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const ago = (min) => new Date(Date.now() - min * 60e3).toISOString();
const steps = (done, total, step) => ({
    at: ago(5),
    items: Array.from({ length: total }, (_, i) => ({
        text: i === done ? step : `step ${i + 1}`,
        status: i < done ? "done" : i === done ? "active" : "pending",
        since: ago(30),
    })),
});
const base = { tokens: 184000, limit: 1000000, limitKnown: true, messages: 42, model: "claude-opus-5-5", status: "idle" };
const rows = [
    { ...base, session: "aacpanel", sessionId: "a", transport: "stream", pct: 78, remote: "https://claude.ai/code/session_01abc",
      startedAt: ago(15 * 60 + 40), lastRequestAt: ago(5),
      checklist: steps(2, 6, "the owner takes the codex screen and the sheet of a thread, both on the phone") },
    { ...base, session: "atlas", sessionId: "b", transport: "stream", pct: 64, remote: "https://claude.ai/code/session_02def",
      startedAt: ago((4 * 24 + 20) * 60), lastRequestAt: ago(60), work: { tasks: 2 },
      checklist: steps(2, 3, "fetch the rest and check that Jellyfin sees it") },
    { ...base, session: "shop", sessionId: "c", transport: "stream", pct: 31, startedAt: ago(90), lastRequestAt: ago(7) },
    { ...base, session: "codex-5afc361b", sessionId: "e", project: { id: 3 }, agent: "codex", transport: "stream",
      model: "gpt-6-astra", pct: 15, startedAt: ago(42), lastRequestAt: ago(2) },
    { ...base, session: "blog", sessionId: "d", pct: 9, startedAt: ago(3 * 60), lastRequestAt: ago(18), work: { tasks: 1 } },
];
const project = (id, name) => ({ id, name, session: name, path: `/srv/${name}` });
const profile = { groups: [
    { name: "Infra", projects: [project(1, "aacpanel"), project(2, "atlas")] },
    { name: "Sites", projects: [project(3, "shop"), project(4, "blog")] },
] };
const exec = { available: true, kinds: ["session.close", "session.open"] };
const blocks = blocksOf({ profile, sessions: rows });

render(
    h(ToastHost, null, h(GateHost, null, blocks.map((block) =>
        h(ProjectBlock, { key: block.key, block, exec, onOpen: () => {}, onMore: () => {} })))),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await sleep(25);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const cut = (el) => Boolean(el) && el.scrollWidth > el.clientWidth + 1;
const lines = (el) => (el ? Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight)) : 0);
const mid = (r) => r.top + r.height / 2;
const round = (n) => Math.round(n * 10) / 10;
const meets = (a, b) => a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5;
// How a mark is drawn: what makes two of them look one kind.
const drawn = (el) => {
    const cs = getComputedStyle(el);
    const box = el.getBoundingClientRect();
    return {
        height: round(box.height),
        border: `${cs.borderTopWidth} ${cs.borderTopStyle} ${cs.borderTopColor}|${cs.borderRightWidth} ${cs.borderBottomWidth} ${cs.borderLeftWidth}`,
        radius: [cs.borderTopLeftRadius, cs.borderTopRightRadius, cs.borderBottomRightRadius, cs.borderBottomLeftRadius].join(" "),
        font: `${cs.fontFamily} ${cs.fontSize} ${cs.fontWeight}`,
        pad: [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(" "),
        ink: cs.color,
        fill: `${cs.backgroundColor} ${cs.backgroundImage}`,
    };
};
// The state's line as it reads, the dots between its words included.
const reads = (line) => Array.from(line.children)
    .map((el) => {
        const before = getComputedStyle(el, "::before").content;
        return `${before && before !== "none" && before !== "normal" ? JSON.parse(before) : ""} ${text(el)}`.trim();
    })
    .filter(Boolean).join(" ").replace(/·\s*/g, "· ").replace(/\s+/g, " ");

window.done = (async () => {
    await until(() => document.querySelectorAll(".pjcard .pjside").length === rows.length);
    await document.fonts.ready;
    await until(() => document.fonts.status === "loaded");
    const out = { cards: {} };
    for (const card of document.querySelectorAll(".pjcard")) {
        const row = card.getBoundingClientRect();
        const rs = getComputedStyle(card);
        const inner = { right: row.right - parseFloat(rs.paddingRight), bottom: row.bottom - parseFloat(rs.paddingBottom) };
        const open = card.querySelector(".pjopen");
        const openBox = open.getBoundingClientRect();
        const side = card.querySelector(".pjside");
        const col = side.getBoundingClientRect();
        const state = card.querySelector(".pjstate");
        const said = card.querySelector(".pjtext");
        const saidBox = said.getBoundingClientRect();
        const firstMid = saidBox.top + parseFloat(getComputedStyle(said).lineHeight) / 2;
        const lived = card.querySelector(".pjlived");
        const tag = card.querySelector(".pjtag");
        const more = card.querySelector(".pjmore");
        const pct = card.querySelector(".pjpct");
        const tagBox = tag.getBoundingClientRect();
        const moreBox = more.getBoundingClientRect();
        const pctBox = pct.getBoundingClientRect();
        const word = Array.from(state.children).find((el) => text(el) === "RC");
        const wordBox = word ? word.getBoundingClientRect() : null;
        const left = Array.from(open.children).filter((el) => el.getBoundingClientRect().height > 0);
        const last = left[left.length - 1];
        const lastBox = last.getBoundingClientRect();
        const checklist = card.querySelector(".pjchecklist");
        const marks = [tag, more, pct].map((el) => el.getBoundingClientRect());
        const label = open.getAttribute("aria-label");
        out.cards[label.slice(label.lastIndexOf(" ") + 1)] = {
            named: Boolean(card.querySelector(".pjsess")),
            stateReads: reads(state),
            stateLines: lines(said),
            rc: word ? {
                inState: word.parentElement === state,
                onLine: Math.abs(wordBox.top - saidBox.top) < 4,
                afterLived: Boolean(lived) && wordBox.left >= lived.getBoundingClientRect().right - 0.5,
                ...drawn(word),
            } : null,
            rcPlates: card.querySelectorAll(".pjrc").length,
            rcInSide: Array.from(side.querySelectorAll("*")).some((el) => text(el) === "RC"),
            mark: text(tag),
            tag: drawn(tag),
            more: drawn(more),
            // The pair on one line, the place first, level with the state.
            pairLevel: round(Math.abs(mid(tagBox) - mid(moreBox))),
            pairGap: round(moreBox.left - tagBox.right),
            pairOff: round(Math.abs(mid(tagBox) - firstMid)),
            pairRight: round(inner.right - moreBox.right),
            pct: text(pct),
            pctRight: round(inner.right - pctBox.right),
            pctBottom: round(inner.bottom - pctBox.bottom),
            pctUnder: round(pctBox.top - Math.max(tagBox.bottom, moreBox.bottom)),
            pctLevel: round(Math.abs(mid(pctBox) - mid(lastBox))),
            last: last.className,
            leftGives: round(col.left - openBox.right),
            clear: left.every((el) => marks.every((m) => !meets(el.getBoundingClientRect(), m))),
            addsHeight: round(col.bottom - openBox.bottom),
            checklist: text(checklist),
            checklistLines: lines(checklist),
            checklistCut: cut(checklist),
            checklistClear: Boolean(checklist) && marks.every((m) => !meets(checklist.getBoundingClientRect(), m)),
            since: text(card.querySelector(".pjsince")),
            sinceLines: lines(card.querySelector(".pjsince")),
            work: text(card.querySelector(".pjwork")),
        };
    }
    out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    return out;
})();
</script>
