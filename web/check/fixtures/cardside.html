<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0}</style>
<div id="root" class="pfcol"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// Live cards on a phone: one on the stream with
// Remote Control up and a long step of its checklist, one with Remote Control
// up, a checklist and two tasks in its background — each the only session of
// its project — a project of two, a claude session and a codex thread on the
// daemon, and a project of two whose first is in tmux with a task in its
// background and no checklist, and whose second has a long name.
import { h, render } from "preact";
import { ProjectBlock, blocksOf } from "/src/screens/sessions/blocks.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const ago = (min) => new Date(Date.now() - min * 60e3).toISOString();
const steps = (done, total, step) => ({
    at: ago(5),
    items: Array.from({ length: total }, (_, i) => ({
        text: i === done ? step : `step ${i + 1}`,
        status: i < done ? "done" : i === done ? "active" : "pending",
        since: ago(30),
    })),
});
const base = { tokens: 184000, limit: 1000000, limitKnown: true, messages: 42, model: "claude-opus-5-5", status: "idle" };
const rows = [
    { ...base, session: "aacpanel", sessionId: "a", status: "busy", transport: "stream", pct: 78, remote: "https://claude.ai/code/session_01abc",
      startedAt: ago(15 * 60 + 40), lastRequestAt: ago(5),
      checklist: steps(2, 6, "the owner takes the codex screen and the sheet of a thread, both on the phone") },
    { ...base, session: "atlas", sessionId: "b", transport: "stream", pct: 64, remote: "https://claude.ai/code/session_02def",
      startedAt: ago((4 * 24 + 20) * 60), lastRequestAt: ago(60), work: { tasks: 2 },
      checklist: steps(2, 3, "fetch the rest and check that Jellyfin sees it") },
    { ...base, session: "shop", sessionId: "c", transport: "stream", pct: 31, startedAt: ago(90), lastRequestAt: ago(7) },
    { ...base, session: "codex-5afc361b", sessionId: "e", project: { id: 3 }, agent: "codex", transport: "stream",
      model: "gpt-6-astra", pct: 15, startedAt: ago(42), lastRequestAt: ago(2) },
    // A command of its own runs: the session is at work in its background,
    // on a line shorter than that of atlas.
    { ...base, session: "blog", sessionId: "d", pct: 9, startedAt: ago(3 * 60), lastRequestAt: ago(18), work: { tasks: 1 } },
    { ...base, session: "blog-fingerprint-rotation-second-pass", sessionId: "f", project: { id: 4 }, transport: "stream",
      pct: 22, startedAt: ago(25), lastRequestAt: ago(3) },
];
const project = (id, name) => ({ id, name, session: name, path: `/srv/${name}` });
const profile = { groups: [
    { name: "Infra", projects: [project(1, "aacpanel"), project(2, "atlas")] },
    { name: "Sites", projects: [project(3, "shop"), project(4, "blog")] },
] };
const exec = { available: true, kinds: ["session.close", "session.restart", "session.open"] };
const blocks = blocksOf({ profile, sessions: rows });

render(
    h(ToastHost, null, h(GateHost, null, blocks.map((block) =>
        h(ProjectBlock, { key: block.key, block, exec, onOpen: () => {} })))),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await sleep(25);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
window.done = (async () => {
    await until(() => document.querySelectorAll(".sc .scl5").length === rows.length);
    const cards = {};
    for (const card of document.querySelectorAll(".sc")) {
        const badges = Array.from(card.querySelectorAll(".scl5 .scb"));
        const step = card.querySelector(".scstep");
        cards[card.dataset.name] = {
            name: card.querySelector(".scname").getAttribute("aria-label"),
            state: text(card.querySelector(".scsay")),
            rc: badges[3].classList.contains("scon"),
            rcWords: Array.from(card.querySelectorAll("*")).filter((el) => el.children.length === 0 && text(el) === "RC").length,
            mark: text(badges[1]),
            pct: text(card.querySelector(".scctx")),
            step: text(step),
            stepTip: (step && step.getAttribute("title")) || "",
        };
    }
    return { cards };
})();
</script>
