<script type="module">
// A page and a document opened inside it in the same breath, which is what a
// brief opened out of a conversation does. Effects run child first, so the two
// register their claim on the back gesture in the reverse of the order a reader
// sees them in.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { useBackClose } from "/src/ui/back.js";

const closed = [];

function Document() {
    return html`<div id="doc">a document</div>`;
}

// The page claims the gesture once and decides what it takes off: the document
// on it, or the page itself when nothing is open. Two claims in one turn race
// each other over the history, and the reader loses the whole page.
function Page({ hasDoc, onCloseDoc, onClose, children }) {
    useBackClose(true, () => (hasDoc ? onCloseDoc() : onClose()));
    return html`<div id="page">${children}</div>`;
}

function App() {
    const [page, setPage] = useState(true);
    const [doc, setDoc] = useState(true);
    return html`
        ${page && html`
            <${Page} hasDoc=${doc}
                     onCloseDoc=${() => { closed.push("doc"); setDoc(false); }}
                     onClose=${() => { closed.push("page"); setPage(false); }}>
                ${doc && html`<${Document} />`}
            <//>
        `}
    `;
}

render(html`<${App} />`, document.getElementById("root"));

(async () => {
    // Room to go back into: the fixture itself is the first entry of this
    // history, and a gesture that walks past it leaves the page rather than
    // closing a layer, which would end the run instead of failing it.
    history.pushState({ pad: 1 }, "", location.href);
    history.pushState({ pad: 2 }, "", location.href);

    await new Promise((r) => setTimeout(r, 150));
    const before = { doc: Boolean(document.getElementById("doc")), page: Boolean(document.getElementById("page")) };

    // One gesture is the whole question: what comes off first. A second would
    // walk out of the fixture itself and leave nothing to report.
    history.back();
    await new Promise((r) => setTimeout(r, 250));
    const afterOne = { doc: Boolean(document.getElementById("doc")), page: Boolean(document.getElementById("page")) };

    window.done = { before, afterOne, closed };
})();
</script>
