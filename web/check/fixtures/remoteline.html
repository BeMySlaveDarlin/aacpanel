<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="shell"><div class="body" id="root"></div></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// Remote Control among the tools of a session: off, on, a session of a
// contour on another account, and a host whose executor does not know the
// switch.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { RemoteLine } from "/src/screens/chat/sessiontools.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const sent = [];
window.fetch = async (url, init) => {
    if (String(url) === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return new Response(JSON.stringify({ logged: true, ok: true, detail: "ok" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

const url = "https://claude.ai/code/session_015aXCcdHpKReTaPGrYZVxrT";
const snapshot = { profiles: [
    { name: "personal", auth: "builtin" },
    { name: "evirma", auth: "token" },
] };
const exec = { available: true, kinds: ["session.remote"] };
const old = { available: true, kinds: ["session.send"] };
const row = (id, name, live, ex = exec) => html`
    <ul id=${id} class="mcplist toollist"><${RemoteLine} name=${name} live=${live} exec=${ex} snapshot=${snapshot} /></ul>`;

render(h(ToastHost, null, h(GateHost, null, html`
    ${row("off", "atlas", { profile: "personal" })}
    ${row("on", "aacpanel", { profile: "personal", remote: url })}
    ${row("work", "wb-parser", { profile: "evirma" })}
    ${row("old", "book", { profile: "personal" }, old)}
`)), document.getElementById("root"));

const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => setTimeout(r, 25));
};
window.done = (async () => {
    await until(() => document.querySelectorAll(".toolline").length === 4);
    const button = (id) => document.querySelector(`#${id} .toolbtn`);
    const look = (id) => {
        const b = button(id);
        const link = document.querySelector(`#${id} a.toolrow`);
        return {
            button: Boolean(b),
            says: b ? b.textContent.trim() : "",
            pressed: b ? b.getAttribute("aria-pressed") : "",
            disabled: Boolean(b && b.disabled),
            note: (document.querySelector(`#${id} .toolnote`) || {}).textContent || "",
            link: link ? link.getAttribute("href") : "",
        };
    };
    const before = { off: look("off"), on: look("on"), work: look("work"), old: look("old") };
    // A disabled button gives no click at all: pressed first, whatever they
    // sent would stand ahead of the two presses that do send.
    if (button("old")) button("old").click();
    button("off").click();
    await until(() => sent.length >= 1 && look("off").says === "Turn off");
    button("on").click();
    await until(() => sent.length >= 2);
    return { before, afterOff: look("off"), sent: sent.map((s) => `${s.kind}:${s.target}:${JSON.stringify(s.params)}`) };
})();
</script>
