<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// The chat screen the panel ships, over a fake host that counts what goes out:
// every send is a POST the page can tally, so one message written by hand can
// be told from one that left twice.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { answered, remember } from "/src/screens/chat/answered.js";

const items = [];
for (let i = 1; i <= 6; i += 1) {
    const back = (6 - i) * 60000;
    items.push({ role: "me", pos: i * 20, text: `question number ${i}`, at: new Date(Date.now() - back).toISOString() });
    items.push({ role: "ai", pos: i * 20 + 10, text: `answer number ${i}`, at: new Date(Date.now() - back + 5000).toISOString() });
}

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
let sends = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") {
        const body = JSON.parse((init && init.body) || "{}");
        if (body.kind === "session.send" || body.kind === "session.file") {
            sends.push({ kind: body.kind, target: body.target, text: (body.params || {}).text });
        }
        await new Promise((r) => setTimeout(r, 200));
        return json({ logged: true });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; this.listeners = {}; }
    addEventListener(type, fn) { (this.listeners[type] ||= []).push(fn); }
    close() { this.readyState = 2; }
};

const exec = { available: true };
const idle = { pct: 12.4, tokens: 124000, limit: 1000000, tokensIn: 124000, tokensOut: 8000 };
const BUSY = { ...idle, status: "busy" };
const WAIT = { ...idle, status: "waiting", waitingFor: "permission", statusUpdatedAt: 1000 };

let putLive = null;
function Page({ name, first }) {
    const [live, set] = useState(first);
    putLive = set;
    return html`<${Chat} name=${name} id=${`${name}-1`} live=${live} exec=${exec}
                         onBack=${() => {}} onUsage=${() => {}} />`;
}

const root = document.getElementById("root");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function mount(name, first) {
    render(null, root);
    sends = [];
    render(h(ToastHost, null, h(GateHost, null, h(Page, { name, first }))), root);
    for (let i = 0; i < 60 && !document.querySelector(".composer textarea"); i += 1) await sleep(50);
    await sleep(150);
}

// mine counts the bubbles of one text: the transcript never echoes here, so
// every bubble carrying it is a copy the screen put there itself.
const mine = (text) => Array.from(document.querySelectorAll(".chatfeed .msg.me"))
    .filter((b) => b.textContent.trim() === text).length;

// say returns the line under the last bubble of this text — the state of a
// message that has not reached the transcript yet.
const say = (text) => {
    const found = Array.from(document.querySelectorAll(".chatfeed .msg.me"))
        .filter((b) => b.textContent.trim() === text);
    const last = found[found.length - 1];
    const stamp = last && last.nextElementSibling;
    return stamp && stamp.classList.contains("mstamp") ? stamp.textContent.trim() : "";
};

const write = (text) => {
    const area = document.querySelector(".composer textarea");
    area.value = text;
    area.dispatchEvent(new Event("input", { bubbles: true }));
};

// tap presses the send button; more than once means one touch that the phone
// turned into two clicks inside a single frame.
const tap = (times) => {
    const button = document.querySelector(".composer .iconbtn.accent");
    if (!button) return false;
    for (let i = 0; i < times; i += 1) button.click();
    return true;
};

// watch keeps the largest number of bubbles one text ever had in a single
// frame: a copy that shows up and goes away again is still a copy on screen.
function watch(text) {
    let most = 0;
    let on = true;
    const tick = () => {
        if (!on) return;
        most = Math.max(most, mine(text));
        requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return () => { on = false; return most; };
}

// once sends one line into a session that is already handling a request.
async function once(name, times) {
    await mount(name, BUSY);
    const text = `run the checks again for ${name}`;
    write(text);
    await sleep(60);
    const stop = watch(text);
    if (!tap(times)) return { sends: 0, bubbles: 0, most: 0, state: "no send button" };
    await sleep(700);
    return { sends: sends.length, bubbles: mine(text), most: stop(), state: say(text), texts: sends.map((s) => s.text) };
}

// waits sends into a session that is still showing the question just answered:
// the row stands by until the snapshot says the session has moved on.
async function waits(name, lines, times) {
    remember(name, answered(WAIT, ""));
    await mount(name, WAIT);
    const texts = lines.map((n) => `${n} for ${name}`);
    const stop = watch(texts[0]);
    for (const text of texts) {
        write(text);
        await sleep(60);
        if (!tap(times)) return { sends: 0, held: 0, bubbles: 0, most: 0, state: "no send button" };
        await sleep(120);
    }
    const held = texts.reduce((n, text) => n + mine(text), 0);
    const holdState = say(texts[0]);
    putLive({ ...BUSY });
    await sleep(900);
    return {
        sends: sends.length,
        held,
        holdState,
        bubbles: texts.reduce((n, text) => n + mine(text), 0),
        most: stop(),
        state: say(texts[0]),
        texts: sends.map((s) => s.text),
    };
}

// churn redraws the screen the way the agent snapshot does while a send is
// still in the air: a new live object every few frames, with nothing about the
// session changed.
function churn(live, ms) {
    let on = true;
    const tick = () => {
        if (!on) return;
        putLive({ ...live });
        setTimeout(tick, 40);
    };
    tick();
    return sleep(ms).then(() => { on = false; });
}

// busyChurn sends one line and keeps the screen redrawing while it goes out.
async function busyChurn(name) {
    await mount(name, BUSY);
    const text = `run the checks again for ${name}`;
    write(text);
    await sleep(60);
    const stop = watch(text);
    tap(1);
    await churn(BUSY, 800);
    return { sends: sends.length, bubbles: mine(text), most: stop(), state: say(text), texts: sends.map((s) => s.text) };
}

// heldChurn lets a row wait for the session and keeps the screen redrawing
// from the moment the session frees until well past the send.
async function heldChurn(name) {
    remember(name, answered(WAIT, ""));
    await mount(name, WAIT);
    const text = `first line for ${name}`;
    write(text);
    await sleep(60);
    const stop = watch(text);
    tap(1);
    await sleep(150);
    const held = mine(text);
    const holdState = say(text);
    await churn(BUSY, 1000);
    return { sends: sends.length, held, holdState, bubbles: mine(text), most: stop(), state: say(text), texts: sends.map((s) => s.text) };
}

window.done = (async () => {
    await document.fonts.ready;
    return {
        busyOnce: await once("alpha", 1),
        busyTwice: await once("bravo", 2),
        heldOnce: await waits("charlie", ["first line"], 1),
        heldTwice: await waits("delta", ["first line", "second line"], 1),
        heldGhost: await waits("echo", ["first line"], 2),
        busyChurn: await busyChurn("foxtrot"),
        heldChurn: await heldChurn("golf"),
    };
})();
</script>
