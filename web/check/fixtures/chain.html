    delete session.outside; draw(); await quiet();
    out.outsideNoCancel = out.outsideNoCancel && Boolean(button("Cancel chain"));
    out.agentNote = step(2).textContent.includes("Access confirmed: role stage-deployer.");
    req.outputs[1].note = ""; await publish();
    out.agentClosed = !step(2).textContent.includes("waits for the session") && !step(2).textContent.includes("the session works on it");
    button("note").click(); await quiet();
    await type(step(4).querySelector("textarea"), "Sign-in works.");
    button("Done").click(); await until(() => !form());
    out.done = sent.at(-1).kind === "session.send" && sent.at(-1).target === "work"
        && JSON.stringify(sent.at(-1).params) === JSON.stringify({ act: req.id, answer: "done", note: "Sign-in works.", step: 4 })
        && feedCard()?.querySelector(".sentlabel").textContent === "chain · 4 of 4 done" && !marker();
    out.closedCard = Boolean(feedCard()) && feedCard().querySelectorAll(".chainbody").length === steps.length
        && !feedCard().querySelector(".requestanswer, .requestnote, .chainterm, button.chainicon, [aria-expanded]")
        && !document.querySelector(".actreply button, .actreply details, .actreply summary")
        && !document.querySelector(".chatfeed").textContent.includes("Full log:")
        && ![...feedCard().querySelectorAll("button")].some(b => b.textContent.trim() === "Cancel chain");
    const closedStep = n => feedCard().querySelector(`[data-step="${n}"]`);
    closedStep(1).querySelector(".chaintext p").click(); closedStep(1).querySelector(".chainwho").click(); await quiet();
    out.closedStaysOpen = Boolean(closedStep(1).querySelector(".chainbody"));
    out.oneResult = !closedStep(1).querySelector(".chainresult") && closedStep(1).querySelector(".chainstatus")?.textContent.trim() === "exit 0 · 31 s"
        && closedStep(1).textContent.match(/exit 0 · 31 s/g)?.length === 1;
    const closedBefore = copied.length;
    closedStep(1).querySelector(".mdcopy").click(); await until(() => copied.length > closedBefore);
    out.closedCopy = copied.at(-1) === steps[0].command;
    const link = closedStep(4).querySelector(".chaintext a");
    let followed = false;
    link.addEventListener("click", event => { followed = true; event.preventDefault(); }, { once: true });
    link.click(); await quiet();
    out.linkFollows = followed && link.href === "https://stage.example.test/" && Boolean(closedStep(4).querySelector(".chainbody"));
    showScene("manual"); await publish(); await until(form);
    const sends = sent.length;
    button("Can't").click(); await quiet();
    out.reasonFirst = Boolean(step(4).querySelector("textarea")) && sent.length === sends;
    await type(step(4).querySelector("textarea"), "No account.");
    button("Can't").click(); await until(() => !form());
    out.cant = sent.at(-1).kind === "session.send"
        && JSON.stringify(sent.at(-1).params) === JSON.stringify({ act: req.id, answer: "cant", note: "No account.", step: 4 })
        && feedCard()?.querySelector(".sentlabel").textContent === "chain · 3 of 4 done · Can't" && !marker();
    // A plain request still docks in the form. With a chain open beside it the
    // form keeps the request, and the pill counts both and leads in turn to
    // the chain's row and to the form.
    const legacy = { id: "b".repeat(32), kind: "do", title: "Legacy request", state: "open", created: at, body: { steps: "Run this:\n```sh\nprintf legacy\n```" } };
    acts = [req, legacy];
    showScene("manual");
    // The step at hand is a new item of the host's summary: the one answered before stays settled.
    session.waiting = [{ kind: "request", id: req.id, title: req.title, at: new Date().toISOString(), pos: 2, blocking: true }];
    items = [...items, { role: "request", pos: 4, at, id: legacy.id, title: legacy.title, steps: legacy.body.steps }];
    stream.listeners.chat({ data: JSON.stringify({ items, state: {}, first: 1, last: 4, total: items.length }) });
    await until(() => document.querySelector(".actform .requeststeps .mdrun") && form()); await quiet();
    out.legacy = document.querySelector(".actform .requeststeps").textContent.includes("printf legacy")
        && !docked() && !polls().length;
    const pill = () => document.querySelector(".movepill");
    const legacyDocked = () => Boolean(document.querySelector(".actform .requeststeps")?.textContent.includes("printf legacy")) && !docked();
    out.mixed = pill().querySelector(".movecount").textContent === "2" && legacyDocked() && Boolean(form());
    pill().click(); await until(() => row().classList.contains("waitingtarget"));
    out.pillReveals = legacyDocked() && row().contains(form()) && document.querySelectorAll(".waitingtarget").length === 1;
    // The feed stands on the step at hand, not on the head of the card: the
    // step at the top of the feed, or as near as the end of the feed lets it.
    // The feed may still settle a frame or two after the reveal under load,
    // so the place is waited for, not sampled once.
    const standsOnStep = () => {
        const feed = document.querySelector(".chatfeed");
        const feedTop = feed.getBoundingClientRect().top;
        const stepTop = row().querySelector(".chainstep.current")?.getBoundingClientRect().top;
        const atEnd = feed.scrollTop >= feed.scrollHeight - feed.clientHeight - 1;
        return stepTop != null && row().getBoundingClientRect().top < feedTop
            && stepTop >= feedTop && stepTop < feedTop + feed.clientHeight
            && (Math.abs(stepTop - feedTop - 12) < 2 || atEnd);
    };
    let stands = standsOnStep();
    for (let frame = 0; !stands && frame < 60; frame++) {
        await new Promise((done) => requestAnimationFrame(done));
        stands = standsOnStep();
    }
    out.pillStep = stands;
    row().classList.remove("waitingtarget");
    pill().click(); await quiet();
    const toForm = !document.querySelector(".waitingtarget") && legacyDocked();
    pill().click(); await until(() => row().classList.contains("waitingtarget"));
    out.pillCycles = toForm && legacyDocked();

    const summary = (act, rows) => `The chain “Release” (${act.id}):\n${rows}\nFull log: /logs/step`;
    const range = { ...req, id: "c".repeat(32), state: "open", step: 3,
        body: { steps: [{ ...steps[0] }, { ...steps[1], who: "you" }, { ...steps[2], who: "agent" }, steps[3]] },
        outputs: [{ state: "done" }, { state: "done" }, null, null] };
    const finished = { ...req, id: "f".repeat(32), state: "answered", outputs: steps.map(() => ({ state: "done" })) };
    // A finished chain whose own row is out of the feed stands open where the
    // last of its replies was, once however many replies it took.
    acts = [finished]; items = [{ role: "me", pos: 5, at, text: summary(finished, "3 you · Deploy · done") },
        { role: "me", pos: 6, at, text: summary(finished, "4 you · Check sign-in · done") }];
    render(null, root); session.waiting = []; draw();
    await until(feedCard);
    const cards = [...document.querySelectorAll(".chatfeed .mchain")];
    out.detachedCard = cards.length === 1 && !document.querySelector(".chatfeed .actreply")
        && feedCard().querySelector(".sentlabel").textContent === "chain · 4 of 4 done"
        && feedCard().querySelectorAll(".chainbody").length === steps.length
        && !feedCard().querySelector(".requestanswer, .requestnote, .chainterm");

    // An open chain whose row is above what the feed read: its reply draws
    // nothing, and a push about it reads a window around the row and reveals
    // the card there, working.
    const remote = { ...req, id: "9".repeat(32), title: "Finish the release", state: "open", step: 4,
        outputs: [{ ...done }, { state: "done" }, { ...done }, null] };
    acts = [remote];
    older = [{ role: "request", pos: 2, at, id: remote.id, title: remote.title, steps }];
    items = [{ role: "ai", pos: 7, at, text: "Meanwhile the session went on." },
        { role: "me", pos: 8, at, text: summary(remote, "3 you · Restart the API · exit 0") }];
    session.waiting = [{ kind: "request", id: remote.id, title: remote.title, at, pos: 2, blocking: true }];
    render(null, root); draw();
    await until(() => document.querySelector(".chatfeed")?.textContent.includes("Meanwhile the session went on."));
    const revealed = () => document.querySelector('.feedrow.waitingtarget[data-pos="2"]');
    const works = () => Boolean(revealed()?.querySelector(".mchain .chainstep.current") && button("Done") && button("Can't"));
    out.farRow = !row() && !docked() && !document.querySelector(".chatfeed .actreply");
    render(null, root); toAct = { id: remote.id }; draw();
    await until(works);
    out.pushReveals = !docked() && document.querySelectorAll(".waitingtarget").length === 1;
    // Once a tap: the acts read again after it leave the reader where they are; another tap shows it again.
    revealed().classList.remove("waitingtarget");
    const readsBefore = actReads;
    await publish();
    const once = actReads > readsBefore && !document.querySelector(".waitingtarget");
    toAct = { id: remote.id }; draw();
    await until(revealed);
    out.pushOnce = once;
    toAct = null;

    // The replies under the row of an open chain draw nothing: its card stands in place.
    const opened = [];
    const openItem = { role: "request", id: range.id, title: range.title, steps: range.body.steps,
        actReplies: [summary(range, "1 you · Login · exit 0\n2 you · Check access · done")] };
    render(html`<div>
        <div data-case="attached"><${Row} item=${openItem} act=${range} onAct=${act => opened.push(act)} /></div>
        <div data-case="missing"><${Row} item=${openItem} /></div>
    </div>`, root);
    await until(() => document.querySelector('[data-case="attached"] .mchain'));
    const attached = document.querySelector('[data-case="attached"]');
    out.attachedInPlace = opened.length === 0 && attached.querySelector(".mchain .chainstep.current")?.dataset.step === "3"
        && !attached.querySelector(".actreply, .actmarker") && !attached.textContent.includes("Full log:");
    out.missingRecord = Boolean(document.querySelector('[data-case="missing"] .actmarker'))
        && !document.querySelector('[data-case="missing"] .mchain');
    const withdrawn = { ...finished, state: "withdrawn" };
    render(html`<${Row} item=${{ role: "request", id: withdrawn.id, title: withdrawn.title }} act=${withdrawn} />`, root);
    await until(() => document.querySelector(".mchain"));
    out.withdrawn = document.querySelector(".mchain .sentlabel").textContent === "chain · 4 of 4 done · withdrawn"
        && !document.querySelector(".actmarker, .requestanswer, .requestnote");
    return out;
})();
</script>
