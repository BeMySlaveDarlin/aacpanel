<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="shell"><div class="body" id="root"></div></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// What a terminal prints beside the conversation: tasks done inside a run and
// alone, the end of a turn, and lines of claude.
import { render } from "preact";
import { html } from "/src/html.js";
import { Row } from "/src/screens/chat/rows.js";
import { rows, runCalls, turnCalls, weld } from "/src/screens/chat/feed.js";
import { callsOf, FeedGrid } from "/src/screens/chat/timeline.js";

const at = "2026-09-26T10:28:00Z";
const items = [
    { role: "ai", text: "Running the checks in the background.", pos: 1, at },
    { role: "tools", kind: "bash", run: 2, pos: 2, at, calls: [{ name: "Bash", arg: "make check", pos: 2, index: 0, use: "u1", seq: 0 }] },
    { role: "tools", kind: "hook", run: 2, pos: 3, at, calls: [{ name: "PreToolUse:Bash hook", arg: "budget ran out", pos: 3, index: 0, use: "", seq: 1 }] },
    { role: "taskdone", use: "u9", task: "a515a204cce27a85c", status: "completed", summary: "Agent \"Commit the notes\" finished", ms: 24233, tokens: 33108, pos: 4, at },
    { role: "taskdone", use: "u1", task: "bg3me3whb", status: "failed", summary: "Background command \"make check\" failed with exit code 2", pos: 5, at },
    { role: "ai", text: "Between the runs.", pos: 55, at },
    { role: "taskdone", use: "u7", status: "completed", summary: "Background command \"sleep 1\" completed (exit code 0)", pos: 56, at },
    { role: "ai", text: "The checks failed; looking at the log.", pos: 6, at },
    { role: "turn", ms: 169000, agents: 3, pos: 7, at },
    { role: "notice", text: "Working on the panel; the tree is clean, two tails left.", from: "while you were away", level: "info", pos: 8, at },
    { role: "notice", text: "Unknown command: /storage", level: "warn", pos: 9, at },
    { role: "notice", text: "The safeguards flagged this message.", from: "safeguards", level: "crit", pos: 10, at },
];

const opened = [];
const sheets = [];
const feed = weld(items);
render(html`<div class="chatfeed"><${FeedGrid} rows=${rows(feed)} wide=${false}
    onOpen=${(g, badge) => sheets.push(callsOf(g, feed, runCalls, turnCalls, badge))}
    row=${(item) => html`<${Row} item=${item} session="lab" id="1" onTask=${(task) => opened.push(task)} />`} /></div>`,
    document.getElementById("root"));

const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => setTimeout(r, 25));
};

(async () => {
    await until(() => document.querySelector(".railbadge.k-turn") && document.querySelectorAll(".mtask").length === 3
        && document.querySelectorAll(".mside").length === 3);
    const text = (el) => (el ? el.innerText.replace(/\s+/g, " ").trim() : "");
    const col = document.querySelector(".feedcol");
    const turn = document.querySelector(".railbadge.k-turn");
    window.done = {
        marks: Array.from(document.querySelectorAll(".railbadge:not(.k-turn)")).map((b) => b.getAttribute("aria-label")),
        colLeft: col.getBoundingClientRect().left,
        cards: Array.from(document.querySelectorAll(".mtasks")).map((el) => ({
            rows: el.querySelectorAll(".mtask").length,
            head: el.querySelector(".sentlabel").textContent,
            left: el.getBoundingClientRect().left,
            width: el.getBoundingClientRect().width,
        })),
        tasks: Array.from(document.querySelectorAll(".mtask")).map((el) => ({
            tag: text(el.querySelector(".mftag")),
            name: text(el.querySelector(".mfname")).replace(text(el.querySelector(".mfnote")), "").trim(),
            aside: text(el.querySelector(".mfnote")),
            said: el.getAttribute("aria-label"),
            tagColour: getComputedStyle(el.querySelector(".mftag")).color,
            node: el.tagName,
        })),
        turn: turn.getAttribute("aria-label"),
        turnNum: text(turn.querySelector(".rbnum")),
        turnIcon: Boolean(turn.querySelector(".rbicon svg")),
        turnOpens: (() => { turn.click(); return sheets.map((s) => (s.turn ? s.turn.pos : -1)); })(),
        plates: (() => {
            const hook = document.querySelector(".railbadge.k-hook");
            const [first, second] = Array.from(hook.parentElement.querySelectorAll(".railbadge"));
            const box = (el) => el.getBoundingClientRect();
            const own = (el) => getComputedStyle(el).backgroundImage !== "none";
            const icon = box(first.querySelector(".rbicon"));
            const num = box(first.querySelector(".rbnum"));
            return {
                apart: box(second).top - box(first).bottom,
                own: own(first) && own(second),
                stack: getComputedStyle(hook.parentElement).backgroundImage,
                numRight: num.left - icon.right,
                level: Math.abs((num.top + num.bottom) / 2 - (icon.top + icon.bottom) / 2),
            };
        })(),
        hookOpens: (() => {
            document.querySelector(".railbadge.k-hook").click();
            return sheets[sheets.length - 1].list.map((c) => c.name);
        })(),
        worked: col.innerText.includes("worked"),
        badges: col.querySelectorAll(".mtools, .railbadge").length,
        opened: (() => { document.querySelectorAll("button.mtask").forEach((b) => b.click()); return opened; })(),
        lines: Array.from(document.querySelectorAll(".mside")).map((el) => ({
            text: text(el),
            dot: getComputedStyle(el.querySelector(".msidedot")).backgroundColor,
            colour: getComputedStyle(el.querySelector(".msidetext")).color,
        })),
    };
})();
</script>
