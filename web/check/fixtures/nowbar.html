<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="composerbox" id="root"></div>
<div class="composerbox" id="think"></div>
<div class="composerbox" id="back"></div>
<script type="module">
// The bar above the composer of a session at work: a command going out ten
// seconds ago, a read that failed before it in the same run; a turn that has
// only thought; and a turn thinking after its last call came back.
import { render } from "preact";
import { html } from "/src/html.js";
import { WorkStatus } from "/src/screens/chat/work.js";

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const feed = [
    { role: "me", text: "run the checks", at: ago(40), pos: 1 },
    { role: "tools", kind: "files", run: 5, pos: 5, at: ago(30),
      calls: [{ name: "Read", arg: "web/check/nowbar_test.go", pos: 5, index: 0, at: ago(30), failed: true }] },
    { role: "tools", kind: "bash", run: 5, pos: 6, at: ago(10),
      calls: [{ name: "Bash", arg: "go test ./web/check/", pos: 6, index: 0, at: ago(10), open: true }] },
];
let opened = "";
let call = "";
render(html`<${WorkStatus} work=${null} busy=${true} compacting="" feed=${feed}
    onCalls=${(run) => { opened = String(run); }}
    onCall=${(run, c) => { call = `${run}:${c.pos}:${c.index}`; }} />`, document.getElementById("root"));
// A turn that has only thought so far: short words, one badge, no call.
const thinking = [
    { role: "me", text: "and now?", at: ago(8), pos: 1 },
    { role: "think", run: 3, pos: 3, at: ago(4), count: 1, tokens: 300 },
];
render(html`<${WorkStatus} work=${null} busy=${true} compacting="" feed=${thinking} onCalls=${() => {}} />`,
    document.getElementById("think"));
// The command came back four seconds ago: the session thinks over it.
const back = [
    { role: "me", text: "and the logs?", at: ago(30), pos: 1 },
    { role: "tools", kind: "bash", run: 4, pos: 4, at: ago(12),
      calls: [{ name: "Bash", arg: "journalctl -u aacpanel -n 50", pos: 4, index: 0, at: ago(12), open: false }] },
    { role: "ai", text: "Reading them.", at: ago(4), pos: 5 },
];
render(html`<${WorkStatus} work=${null} busy=${true} compacting="" feed=${back} onCalls=${() => {}} />`,
    document.getElementById("back"));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const until = async (ok) => { for (let i = 0; i < 100 && !ok(); i++) await sleep(20); };
// What one bar says, and the parts of its line in order.
const shape = (id) => {
    const root = document.getElementById(id);
    const line = root.querySelector(".nowtop");
    return {
        top: text(line),
        state: text(root.querySelector(".nowstate")),
        clock: text(root.querySelector(".nowel")),
        order: Array.from(line.children).map((k) => k.className.split(" ")[0]),
        parts: Array.from(line.children).map((k) => text(k)),
    };
};

window.done = (async () => {
    const out = {};
    try {
        await until(() => document.querySelectorAll(".nowbar").length >= 3);
        const root = document.getElementById("root");
        out.top = text(root.querySelector(".nowtop"));
        out.arg = text(root.querySelector(".nowarg"));
        const badges = Array.from(root.querySelectorAll(".nowchips .mtools"));
        out.badges = badges.length;
        out.failed = badges.filter((b) => b.classList.contains("mtfail")).length;
        if (badges[0]) badges[0].click();
        out.opened = opened;
        out.old = /handling the request/.test(document.getElementById("root").textContent);

        // The call is a button of its own, inside no other, named after the
        // call it opens; a press hands the run and the very call over.
        const button = root.querySelector(".nowcall");
        out.call = {
            tag: button ? button.tagName : "",
            nested: Boolean(button && button.parentElement.closest("button")),
            label: button ? button.getAttribute("aria-label") : "",
            text: text(button),
        };
        if (button) button.click();
        out.called = call;
        out.running = shape("root");
        out.back = shape("back");

        out.thinking = shape("think");
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
