<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The feed of a codex thread that works with the second set of codex's tools
// for agents, as the collector folds agent/testdata/codex-agents-second.jsonl:
// a card of each agent started, with its role and model and no task — the
// task travels encrypted; the calls to the agents among the calls of one run;
// how the agents stand after them settling the cards; and a line where an
// agent was interrupted and where it finished.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { rows } from "/src/screens/chat/feed.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const LEXER = "01a12348-0000-7000-8000-0000000000c1";
const TESTS = "01a12348-0000-7000-8000-0000000000c2";

const at = (n) => new Date(Date.now() - (40 - n) * 60000).toISOString();
const call = (name, arg, seq, pos, use, more = {}) => ({ name, arg, seq, at: at(seq + 4), pos, index: 0, use, ...more });
const items = [
    { pos: 707, role: "me", text: "Split the parser work between two agents", cut: false },
    { pos: 1613, role: "spawn", use: "call_spawn_lexer", text: "", cut: false,
      spawned: [{ id: LEXER, name: "lexer", role: "explorer", model: "gpt-6-astra", effort: "low", state: "running" }] },
    { pos: 2901, role: "spawn", use: "call_spawn_tests", text: "", cut: false,
      spawned: [{ id: TESTS, name: "tests", role: "", model: "gpt-6-astra", effort: "medium", state: "running" }] },
    { pos: 3716, role: "tools", kind: "agents", run: 3716, calls: [
        call("SendMessage", "lexer", 0, 3716, "call_send_1"),
        call("Wait", "", 1, 4913, "call_wait_1"),
        call("InterruptAgent", "tests", 2, 6094, "call_interrupt_1"),
        call("ListAgents", "", 3, 7263, "call_list_1"),
        call("FollowupTask", "tests", 4, 8075, "call_followup_1"),
        call("Wait", "", 5, 10364, "call_wait_2", { failed: true })] },
    { pos: 6455, role: "agentstates", spawned: [{ id: TESTS, state: "interrupted" }] },
    { pos: 6455, role: "notice", from: "agent tests", text: "was interrupted", level: "warn" },
    { pos: 8523, role: "agentstates", spawned: [{ id: TESTS, state: "running" }] },
    { pos: 9293, role: "agentstates", spawned: [{ id: LEXER, state: "completed" }] },
    { pos: 9293, role: "notice", from: "agent lexer", text: "finished", level: "ok" },
    { pos: 11012, role: "note", text: "the human interrupted the answer" },
    { pos: 11491, role: "ai", text: "The lexer drops escaped quotes; tests go on.", cut: false },
].map((item, n) => ({ at: at(n), ...item }));

const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length,
                      moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.close"] };
const thread = {
    session: "codex-0000abcd", sessionId: PARENT, profile: "acme", agent: "codex",
    transport: "stream", status: "idle", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/parser",
};
setLiveSessions([thread]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel) => Array.from(root.querySelectorAll(sel));

window.done = (async () => {
    await document.fonts.ready;
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => all(".chatfeed .xrspawn").length === 2 && all(".chatfeed .mside").length === 2)) {
        throw new Error("the starts of the agents and their lines did not come");
    }
    await settled();
    const folded = rows(items).filter((r) => r.role === "toolrow");
    return {
        cards: all(".chatfeed .xrspawn").map((el) => ({
            label: text(el.querySelector(".sentlabel")),
            agents: Array.from(el.querySelectorAll(".mtask")).map((row) => ({
                name: text(row.querySelector(".mfname")).replace(text(row.querySelector(".mfnote")), "").trim(),
                note: text(row.querySelector(".mfnote")),
                tag: text(row.querySelector(".mftag")),
                tone: Array.from(row.classList).find((c) => c.startsWith("s-")) || "",
                opens: row.tagName === "BUTTON",
            })),
            task: Boolean(el.querySelector(".xrtaskmore")),
        })),
        lines: all(".chatfeed .mside").map((el) => ({
            from: text(el.querySelector(".msidefrom")),
            said: text(el.querySelector(".msidetext")).replace(text(el.querySelector(".msidefrom")), "").trim(),
            tone: Array.from(el.classList).find((c) => c.startsWith("s-")) || "",
        })),
        hidden: all(".chatfeed .feedrow.r-agentstates").length,
        runs: folded.map((r) => r.groups.map((g) => g.calls.map((c) => `${c.name}${c.arg ? ` ${c.arg}` : ""}${c.failed ? " ✗" : ""}`))),
    };
})();
</script>
