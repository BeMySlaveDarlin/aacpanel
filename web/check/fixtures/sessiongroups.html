<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} .deskshell{position:static;height:900px} .dkbody{height:900px} .phone{width:390px;padding:.6rem 17px;display:flex;flex-direction:column;gap:.55rem}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root">
<div class="deskshell"><div class="dkbody" id="desk"></div></div>
<div class="phone" id="phone1"></div>
<div class="phone" id="phone2"></div>
<div class="phone" id="plain"></div>
<div class="phone" id="phonefold"></div>
<div id="shell"></div>
</div>
<script type="module">
// The sessions a session had the panel open, in both lists. On the phone a
// child stands in the block of its parent whatever its project, a step in
// under it, behind a fold that is open, says who of them waits and lifts the
// block to where the most pressing of the group puts it; the children of a
// parent that closed stand under a stub of it that says when it closed; a
// child whose parent lives in another contour stands on its own page, saying
// which session opened it. The desktop column lays every contour out in
// blocks of its projects as the phone does, a heading over each, the only
// session of a project included; the children keep rows of their own there
// while the fold is open, and the arrow keys of the shell go down the rows
// block after block, where a digit picks nothing. A list where nobody opened
// anybody shows none of it.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { blocksOf, ProjectBlock } from "/src/screens/sessions/blocks.js";
import { useFolds } from "/src/screens/sessions/folds.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const now = Date.now();
const iso = (min) => new Date(now - min * 60e3).toISOString();
const P = (id, name, path) => ({ id, name, session: name, path });
const pj = {
    lead: P(11, "lead", "/srv/lead"), person: P(12, "person", "/srv/person"), wiki: P(13, "wiki", "/srv/wiki"),
    shop: P(14, "shop", "/srv/shop"), rotation: P(21, "rotation", "/srv/rotation"), quotes: P(22, "quotes", "/srv/quotes"),
};
const profileMap = [
    { id: 1, profile: "Personal", name: "Personal", groups: [
        { name: "work", projects: [pj.lead, pj.person, pj.wiki] },
        { name: "side", projects: [pj.shop] },
    ] },
    { id: 2, profile: "Algo", name: "Algo", groups: [{ name: "trading", projects: [pj.rotation, pj.quotes] }] },
];
const S = (contour, p, o) => ({
    profile: contour === 1 ? "Personal" : "Algo", contour, transport: "stream", status: "idle", pct: 20,
    sessionId: `id-${o.session}`, cwd: p.path, project: { id: p.id, name: p.name }, startedAt: iso(o.up || 90),
    lastRequestAt: iso(o.ago || 5), ...o,
});
const sessions = [
    S(1, pj.lead, { session: "lead", status: "busy", up: 300, ago: 1 }),
    S(1, pj.person, { session: "person", status: "waiting", ask: { count: 1, header: "Layout" }, up: 40, ago: 3,
        parent: { session: "lead" } }),
    S(1, pj.lead, { session: "codex-5afc361b", agent: "codex", title: "review the protocol", status: "busy", up: 25, ago: 1,
        parent: { session: "lead" } }),
    S(1, pj.wiki, { session: "wiki", status: "busy", up: 70, ago: 2, parent: { session: "docs" } }),
    S(1, pj.shop, { session: "shop", up: 600, ago: 190 }),
    S(2, pj.rotation, { session: "rotation", status: "busy", up: 500, ago: 1 }),
    S(2, pj.quotes, { session: "quotes", up: 200, ago: 25, parent: { session: "lead" } }),
];
// The parent that closed is in the archive, closed forty minutes ago.
const archive = [
    { name: "docs", sessionId: "d0", profile: "Personal", contour: 1, project: { id: 11, name: "lead", group: "work" },
      cwd: "/srv/lead", startedAt: iso(160), lastAt: iso(40), messages: 38, pctMax: 71, prompts: ["Sweep the docs"] },
];

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) return json({ rows: archive, total: archive.length, limit: 30, offset: 0 });
    return new Response("", { status: 404 });
});
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.close", "session.restart", "session.open", "session.resume"] };
const wrap = (node) => h(ToastHost, null, h(GateHost, null, node));
let order = [];
const picked = [];
const snapshot = { at: now / 1000, sessions, profileMap, limits: null };
render(wrap(h(SessionColumn, {
    snapshot, limits: null, current: "", onPick(p) { picked.push(p); }, picks: [], setPicks() {}, onNames() {},
    onOrder(list) { order = list.map((s) => s.name); }, exec, wait: null,
})), document.getElementById("desk"));

const opened = [];
const page = (id, contour, list) => {
    const blocks = blocksOf({ profile: profileMap.find((p) => p.id === contour), sessions: list });
    render(wrap(html`${blocks.map((block) => html`
        <${ProjectBlock} key=${block.key} block=${block} profile=${profileMap.find((p) => p.id === contour)} exec=${exec} live=${sessions} past=${archive}
                         onOpen=${(name, sid) => opened.push({ name, id: sid })} />
    `)}`), document.getElementById(id));
};
page("phone1", 1, sessions.filter((s) => s.contour === 1));
page("phone2", 2, sessions.filter((s) => s.contour === 2));
// Nobody opened anybody: the same sessions with no parent.
page("plain", 1, sessions.filter((s) => s.contour === 1).map(({ parent, ...s }) => s));
// The contour page of the phone folds a project by its name, as the desktop column does.
localStorage.removeItem("aacpanel.project-folds");
const pages = [];
function FoldingPage() {
    const profile = profileMap.find((p) => p.id === 1);
    const blocks = blocksOf({ profile, sessions: sessions.filter((s) => s.contour === 1) });
    const [folded, toggle] = useFolds("aacpanel.project-folds");
    return html`${blocks.map((block) => html`
        <${ProjectBlock} key=${block.key} block=${block} profile=${profile} exec=${exec} live=${sessions} past=${archive}
                         onProject=${(project) => pages.push(project.name)}
                         folded=${folded.has(block.key)} onToggle=${() => toggle(block.key)} />
    `)}`;
}
render(wrap(h(FoldingPage)), document.getElementById("phonefold"));

const until = async (ok) => {
    const end = performance.now() + 3000;
    while (!ok() && performance.now() < end) await new Promise(requestAnimationFrame);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const names = (root, sel) => Array.from(root.querySelectorAll(sel)).map(text);

// cardOf reads a card as its name, a "› " a step it stands in, and what it
// says of the session that opened it; foldOf a fold as how many and who of
// them waits.
const cardOf = (row) => {
    const depth = Number(row.style.getPropertyValue("--depth") || 0);
    const tag = text(row.querySelector(".sctag"));
    return `${"› ".repeat(depth)}${row.querySelector(".scname").getAttribute("aria-label")}${tag ? ` (${tag})` : ""}`;
};
const foldOf = (row) => {
    const waits = text(row.querySelector(".scfoldwaits"));
    return `fold: ${text(row.querySelector(".scfoldtext"))}${waits ? ` · ${waits}` : ""}`;
};
const rowOf = (row) => row.classList.contains("scfold") ? foldOf(row)
    : row.classList.contains("scstub") ? `stub: ${text(row)}` : cardOf(row);
const ROWS = ".scfold, .scstub, .sc:not(.scpast):not(.scghost)";
// phoneOf reads a page of the phone block by block: the name of its heading —
// none for a block no project holds — and its rows in order.
const phoneOf = (root) => Array.from(root.querySelectorAll(".pjblock")).map((block) => ({
    name: text(block.querySelector(".pjname")),
    rows: Array.from(block.querySelectorAll(ROWS)).map(rowOf),
}));
// deskOf reads the desktop column: its rows in order — the heading of a
// project as its name, its group and "+" for the way to a new session in it,
// a fold, a stub or a card as on the phone.
const deskOf = () => Array.from(document.querySelectorAll(`#desk .dkscroll > section :is(.dkproj, ${ROWS})`))
    .map((row) => {
        if (row.classList.contains("dkproj")) {
            const plus = row.querySelector('.scact[aria-label^="new session"]') ? " +" : "";
            return `head: ${text(row.querySelector(".dkprojname"))} · ${text(row.querySelector(".dkprojgroup"))}${plus}`;
        }
        return rowOf(row);
    });

window.done = (async () => {
    const desk = document.getElementById("desk");
    const phone1 = document.getElementById("phone1");
    if (!await until(() => desk.querySelector(".scstub .scstubnote") && text(desk.querySelector(".scstub .scstubnote")).includes("ago"))) {
        throw new Error("the stub of the closed parent did not learn when it closed");
    }
    const out = {};
    out.phone = phoneOf(phone1);
    out.phoneAlgo = phoneOf(document.getElementById("phone2"));
    out.plain = phoneOf(document.getElementById("plain"));
    out.plainMarks = document.querySelectorAll("#plain .scfold, #plain .scstub, #plain .sckid, #plain .sctag").length;
    out.desk = deskOf();
    out.order = order.slice();

    // The stub opens the conversation of the parent that closed.
    phone1.querySelector("button.scstub").click();
    desk.querySelector(".scstub").click();
    out.stubOpens = { phone: opened.slice(), desk: picked.map((p) => ({ name: p.name, id: p.id, archived: Boolean(p.archived) })) };

    // A closed fold keeps who waits, and on the desktop takes its sessions out
    // of the way of the arrow keys; it stays closed for its parent, and opens
    // again.
    phone1.querySelector(".scfold").click();
    desk.querySelector(".scfold").click();
    await until(() => !phone1.querySelector(".pjblock .sc.sckid") || order.length < out.order.length);
    await until(() => order.length < out.order.length);
    out.phoneFolded = phoneOf(phone1);
    out.deskFolded = deskOf();
    out.orderFolded = order.slice();
    out.kept = JSON.parse(localStorage.getItem("aacpanel.folds") || "[]");
    desk.querySelector(".scfold").click();
    await until(() => order.length === out.order.length);
    out.orderOpen = order.slice();

    // The shell over the same sessions, the last conversation of the first
    // contour open: ArrowDown goes on to the row under it as the column
    // stands, into the next contour and its block, a digit leaves the open one
    // as it is, and ArrowUp goes back. Every key is pressed with the screen at
    // rest, so a key the shell took shows on the row lit as open.
    const shell = document.getElementById("shell");
    const { DesktopShell } = await import("/src/desktop/shell.js");
    render(wrap(h(DesktopShell, {
        snapshot, tree: [], treeError: null, hostError: null, ageSec: 1, history: [], faults: [],
        alerts: { kind: "ready", list: [], reload() {} }, openAlerts: 0, exec, onRefresh() {},
        wait: { opening: () => [], of: () => null }, theme: "space", onTheme() {}, updateReady: false,
        updating: false, onApplyUpdate() {}, route: { here: "", via: "", why: "", onRecheck() {}, onOpen() {} },
        jump: { name: "shop", id: "id-shop" }, onJumped() {},
    })), shell);
    const lit = () => { const on = shell.querySelector(".sc.sccur"); return on ? on.dataset.name : ""; };
    await until(() => lit() === "shop");
    await quiet();
    const press = async (key) => {
        if (document.activeElement) document.activeElement.blur();
        window.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
        await quiet();
        return lit();
    };
    out.walk = [lit(), await press("ArrowDown")];
    out.digit = await press("1");
    out.back = await press("ArrowUp");
    render(null, shell);
    // Worktree placement comes from the service's project id, not a name or
    // the checkout's path. An unmapped child carries an explicit null.
    const family = [
        S(1, pj.lead, { session: "root" }),
        S(1, pj.person, { session: "helper", cwd: "/srv/person-fix", parent: { session: "root" }, up: 30 }),
        S(1, pj.lead, { session: "local", parent: { session: "root" }, up: 20 }),
        S(1, pj.person, { session: "unmapped", project: null, cwd: "/srv/stray", parent: { session: "root" }, up: 10 }),
    ];
    const labelMap = [{ ...profileMap[0], groups: [{ name: "work", projects: [pj.lead, { ...pj.person, name: "Backend" }] }] }];
    const familyBlocks = blocksOf({ profile: labelMap[0], sessions: family });
    const labels = document.createElement("div");
    document.body.append(labels);
    render(wrap(html`
        <div id="labelphone">${familyBlocks.map((block) => html`
            <${ProjectBlock} block=${block} profile=${labelMap[0]} live=${family} exec=${exec} />
        `)}</div>
        <div id="labeldesk"><${SessionColumn} snapshot=${{ ...snapshot, sessions: family, profileMap: labelMap }}
            limits=${null} current="" onPick=${() => {}} picks=${[]} setPicks=${() => {}} onNames=${() => {}} exec=${exec} /></div>
    `), labels);
    await quiet();
    const labelRows = (id) => Array.from(labels.querySelectorAll(`#${id} .sc[data-name]:not(.scpast):not(.scghost)`)).map((row) => ({
        name: row.dataset.name, text: text(row.querySelector(".scname")),
        project: text(row.querySelector(".scproject")), label: row.querySelector(".scname").getAttribute("aria-label"),
        depth: Number(row.style.getPropertyValue("--depth") || 0),
    }));
    out.projectLabels = { phone: labelRows("labelphone"), desk: labelRows("labeldesk"), blocks: familyBlocks.map((b) => b.name) };
    render(null, labels);
    labels.remove();
    const { sessionPins } = await import("/check/fixtures/sessionpins.js");
    out.pins = await sessionPins();
    const { sessionLevels } = await import("/check/fixtures/sessionlevels.js");
    out.levels = await sessionLevels();
    {
        const root = document.getElementById("phonefold");
        const block = Array.from(root.querySelectorAll(".pjblock")).find((b) => b.querySelector(".pjrows .sc"));
        const name = block.querySelector("button.pjname");
        const rowsBefore = block.querySelectorAll(".pjrows .sc").length;
        name.click();
        await until(() => block.querySelector(".pjrows").hidden);
        const foldedState = { hidden: block.querySelector(".pjrows").hidden, expanded: name.getAttribute("aria-expanded"),
            count: text(block.querySelector(".pjfoldcount")), stored: JSON.parse(localStorage.getItem("aacpanel.project-folds") || "[]").length };
        block.querySelector('[aria-label^="conversations of project"]').click();
        name.click();
        await until(() => !block.querySelector(".pjrows").hidden);
        out.phoneFold = { rowsBefore, folded: foldedState, pages: pages.slice(), reopened: !block.querySelector(".pjrows").hidden,
            expanded: name.getAttribute("aria-expanded"), countGone: !block.querySelector(".pjfoldcount") };
    }
    const { sessionPause } = await import("/check/fixtures/sessionpause.js");
    out.pause = await sessionPause();
    return out;
})();
</script>
