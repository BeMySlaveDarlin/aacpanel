<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The terminals of places on a phone, walked in the whole shell the way a
// person walks them: the bottom menu and the menu under the logo, the pager
// of contours with the places under them, the choice of where a new terminal
// starts, the terminal of a place with its tabs, what ⋯ does to a tab, the
// question before a tab is closed, and the × of each tab. The host is played
// by the page: it keeps the list, answers the actions and records what was
// asked.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { MobileShell } from "/src/mobile/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

// A frame to look at: #shot=A stops the walk where the artboard stands.
const shot = new URLSearchParams(location.hash.slice(1)).get("shot") || "";
const pause = async (name) => {
    if (shot !== name) return;
    await sleep(400);
    document.body.dataset.shot = name;
    await new Promise(() => {});
};

const now = Math.floor(Date.now() / 1000);
const T = (id, place, label, name, command, typedAgo, created, screen = {}) =>
    ({ id, place, label, name, command, activity: now - typedAgo, created: now - created, clients: 0, ...screen });
// The host lists by place, and the screen lays the places out otherwise: a
// project of a contour stands on its page in the order of the map, and the
// first contour takes home ahead of its projects and a place no contour lists
// after them — even where another contour lists the home directory. Whether
// something runs and the last line of a screen are the host's word.
const HTOP_KEYS = "F1Help  F2Setup  F3Search  F4Filter  F5Tree  F6SortBy  F7Nice -  F8Nice +  F9Kill  F10Quit";
let terms = [
    T("t-lab", "/data/lab", "lab", "zsh", "zsh", 7200, 9000),
    T("t-h1", "/home/u", "Home", "zsh", "zsh", 180, 8000, { last: "u@helios ~ $" }),
    T("t-h2", "/home/u", "Home", "htop", "htop", 3600, 7000, { busy: true, last: HTOP_KEYS }),
    T("t-misc", "/opt/misc", "misc", "zsh", "zsh", 900, 6500),
    T("t-api", "/srv/proj/api", "api", "npm run dev", "npm", 300, 6200, { busy: true, last: "ready in 412 ms" }),
    T("t-s1", "/srv/proj/shop", "shop", "make check", "make", 60, 6000, { busy: true, last: "ok   shop/internal/store   15.90s" }),
    T("t-s2", "/srv/proj/shop", "shop", "zsh", "zsh", 720, 5000),
    T("t-s3", "/srv/proj/shop", "shop", "git log", "git", 2400, 4000),
];
const profileMap = [
    { id: 1, profile: "personal", groups: [{ name: "Side", projects: [
        { id: 11, name: "shop", path: "/srv/proj/shop", session: "shop" },
        { id: 12, name: "api", path: "/srv/proj/api", session: "api" },
    ] }] },
    { id: 2, profile: "work", groups: [{ name: "Lab", projects: [
        { id: 21, name: "lab", path: "/data/lab", session: "lab" },
        { id: 22, name: "helios", path: "/home/u", session: "helios" },
    ] }] },
    { id: 3, profile: "ops", groups: [{ name: "Infra", projects: [
        { id: 31, name: "infra", path: "/srv/infra", session: "infra" },
    ] }] },
];

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
let made = 0;
// held keeps the answer to the next close back until the walk lets it go, so
// the walk can look at a tab whose close is on its way.
let held = null;
const holdClose = () => {
    let release;
    const answered = new Promise((r) => { release = r; });
    held = { answered, release };
    return held;
};
window.fetch = async (url, init) => {
    const u = String(url);
    if (u === "/api/term") return json({ available: true });
    if (u === "/api/terms") return json({ terms });
    if (u.startsWith("/api/term/")) return json({});
    if (u === "/api/actions" && init && init.method === "POST") {
        const body = JSON.parse(init.body);
        asked.push(body);
        const p = body.params || {};
        if (body.kind === "term.start") {
            made += 1;
            const id = `t-new${made}`;
            const label = p.place === "/home/u" ? "Home" : p.place.split("/").pop();
            terms = [...terms, T(id, p.place, label, "zsh", "zsh", 0, -made)]
                .sort((a, b) => a.place.localeCompare(b.place) || a.created - b.created);
            return json({ ok: true, detail: "", logged: true, id });
        }
        if (body.kind === "term.close") {
            if (held) await held.answered;
            terms = terms.filter((t) => t.id !== p.id);
        }
        if (body.kind === "term.rename") terms = terms.map((t) => (t.id === p.id ? { ...t, name: p.name } : t));
        return json({ ok: true, detail: "", logged: true });
    }
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    return json({});
};

const streams = [];
window.EventSource = class {
    static CONNECTING = 0;
    static OPEN = 1;
    static CLOSED = 2;
    constructor(url) {
        this.url = String(url);
        this.readyState = 1;
        this.on = {};
        streams.push(this);
    }
    addEventListener(name, fn) { this.on[name] = fn; }
    close() { this.readyState = 2; }
};
const lastStream = () => streams.filter((s) => s.url.startsWith("/api/term/stream")).pop() || null;
// live answers the stream as the host does and writes a screen into it.
const live = async (lines) => {
    await until(() => lastStream() && lastStream().on.ready && lastStream().onmessage);
    const s = lastStream();
    s.on.ready({ data: JSON.stringify({ id: "in-1" }) });
    s.onmessage({ data: btoa(String.fromCharCode(...new TextEncoder().encode(lines.join("\r\n")))) });
};

const exec = { available: true, kinds: ["term.start", "term.close", "term.rename", "term.console", "session.send"] };
const snapshot = { at: 1, hostName: "helios", sessions: [], profileMap, limits: null, host: { home: "/home/u" } };
const wait = { opening: () => [], of: () => null };
const alerts = { kind: "ready", alerts: [], older: [], reload: () => {} };
render(h(ToastHost, null, h(GateHost, null, html`<${MobileShell} snapshot=${snapshot}
    tree=${{ stacks: [], running: 0, total: 0 }} treeError=${null} hostError=${null} ageSec=${1} history=${[]} faults=${[]}
    alerts=${alerts} openAlerts=${0} exec=${exec} onRefresh=${() => {}} wait=${wait} conn=${{ kind: "live" }}
    theme="space" onTheme=${() => {}} updateReady=${false} updating=${false} onApplyUpdate=${() => {}}
    installable=${false} onInstall=${() => {}}
    route=${{ here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }}
    jump=${null} onJumped=${() => {}} />`)), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await sleep(30);
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel, from = document) => Array.from(from.querySelectorAll(sel));
const navItems = () => all("nav.tabs > *").map((el) => (el.classList.contains("homeslot") ? "(home)" : text(el)));
const navButton = (label) => all("nav.tabs button").find((b) => text(b) === label);
const sheet = () => document.querySelector(".sheet.on");
const rows = () => all(".sheet.on .mcprow").map((b) => text(b.querySelector(".toollabel")));
const rowOf = (label) => all(".sheet.on .mcprow").find((b) => text(b.querySelector(".toollabel")) === label);
// A contour in the pager reads as its name and the number of its terminals.
const placeTab = (b) => {
    const n = b && b.querySelector(".n");
    return n ? `${text(b).slice(0, -text(n).length).trim()} ${text(n)}` : text(b);
};
// The choice of a place reads top to bottom: a row as its name and path, a
// chip in brackets with a star on the one pressed, a heading in square ones.
const picker = () => all(".sheet.on .tpick .cmdsechead, .sheet.on .tpick .chip, .sheet.on .tpick .mcprow").map((el) => {
    if (el.classList.contains("mcprow")) return `${text(el.querySelector(".toollabel"))} ${text(el.querySelector(".toolaside"))}`;
    if (el.classList.contains("chip")) return `(${text(el)}${el.getAttribute("aria-pressed") === "true" ? "*" : ""})`;
    return `[${text(el)}]`;
});
// A page reads as its title, the places on it with their cards, the line of
// an empty one and whether it has the button of a new terminal.
const pageShot = (page) => ({
    title: text(page.querySelector(".ttitle h2")),
    places: all(".tplace", page).map((sec) => ({
        head: `${text(sec.querySelector(".theadname"))} ${text(sec.querySelector(".theadpath"))}`,
        cards: all(".tcardname", sec).map(text),
    })),
    empty: text(page.querySelector(".empty")),
    newButton: Boolean(page.querySelector(".ttitle .tnew")),
});
// A card reads as its name, its dot, when it was typed into and the last line
// of its screen, with how that line is set: how many lines it takes, whether
// it is cut and with what, whether it wears the face of the name, and whether
// it stands under the name across to the end of the card.
const cardShot = (c) => {
    const last = c.querySelector(".tcardlast");
    const shot = {
        name: text(c.querySelector(".tcardname")),
        runs: c.querySelector(".tdot").classList.contains("run"),
        when: text(c.querySelector(".tcardwhen")),
        last: last ? last.textContent : null,
    };
    if (!last) return shot;
    const style = getComputedStyle(last);
    const range = document.createRange();
    range.selectNodeContents(last);
    const name = c.querySelector(".tcardname").getBoundingClientRect();
    const when = c.querySelector(".tcardwhen").getBoundingClientRect();
    const box = last.getBoundingClientRect();
    return {
        ...shot,
        // An ellipsis is a box of its own on the same line: lines count by their tops.
        lines: new Set(Array.from(range.getClientRects(), (r) => Math.round(r.top))).size,
        cut: last.scrollWidth > last.clientWidth,
        ellipsis: style.textOverflow === "ellipsis",
        mono: style.fontFamily === getComputedStyle(c.querySelector(".tcardname")).fontFamily,
        under: box.top >= name.bottom && Math.round(box.left) === Math.round(name.left) && Math.round(box.right) === Math.round(when.right),
    };
};
const tabs = () => all(".ttabs .ttab:not(.tadd)").map(text);
const onTab = () => text(document.querySelector(".ttabs .ttab.on"));
const pageOf = (label) => {
    const at = all(".pftab").findIndex((b) => text(b).replace(/\s*\d+$/, "") === label);
    return all(".pfpages > .pfpage")[at] || null;
};
const actions = (kind) => asked.filter((a) => a.kind === kind);
const closesOf = (id) => actions("term.close").filter((a) => a.params.id === id).length;
// The tabs over a terminal read as their names, the open one starred.
const cells = () => all(".ttabs .ttabcell");
const tabRow = () => cells().map((c) => `${text(c.querySelector("[role=tab]"))}${c.classList.contains("on") ? "*" : ""}`);
const xOf = (i) => (cells()[i] ? cells()[i].querySelector(".ttabx") : null);
// inkOf is the colour a variable of the theme paints with where the tabs stand.
const inkOf = (name) => {
    const probe = document.createElement("span");
    probe.style.color = `var(${name})`;
    document.querySelector(".ttabs").appendChild(probe);
    const ink = getComputedStyle(probe).color;
    probe.remove();
    return ink;
};
// A tab and its × read as how they stand: the name of the × and whether it is
// inside the tab, the role of the cell around them, whether the × stands after
// the name on its line and as tall as the tab, how wide it is and its mark,
// whether it is drawn, the colour of its mark against the faint ink and the
// accent, and whether the name is cut with an ellipsis.
const cellShot = (c) => {
    const tab = c.querySelector("[role=tab]");
    const x = c.querySelector(".ttabx");
    const name = tab.querySelector(".ttabname");
    const [tr, xr, nr, ir] = [tab, x, name, x.querySelector("svg")].map((el) => el.getBoundingClientRect());
    const style = getComputedStyle(x);
    return {
        name: text(name),
        on: c.classList.contains("on"),
        label: x.getAttribute("aria-label"),
        nested: tab.contains(x),
        role: c.getAttribute("role") || "",
        after: xr.left >= nr.right - 0.5,
        sameLine: Math.abs((xr.top + xr.bottom) / 2 - (nr.top + nr.bottom) / 2) <= 2,
        tall: xr.height >= tr.height - 0.5,
        width: Math.round(xr.width),
        icon: Math.round(Math.max(ir.width, ir.height)),
        shown: xr.width > 0 && xr.height > 0 && style.visibility === "visible" && style.opacity !== "0",
        ink: style.color === inkOf("--accent") ? "accent" : style.color === inkOf("--ink-faint") ? "faint" : style.color,
        cut: name.scrollWidth > name.clientWidth,
        ellipsis: getComputedStyle(name).textOverflow === "ellipsis",
    };
};
const LONG = "tail -f /var/log/aacpanel/collector.log";

window.done = (async () => {
    const out = {};
    try {
        await document.fonts.ready;
        await until(() => navButton("Terminals"));
        out.nav = navItems();

        // The menu under the logo leads with usage.
        document.querySelector("header .host").click();
        await until(() => sheet() && sheet().querySelector(".item"));
        out.logoMenu = all(".sheet.on .item").map(text);
        // The cross puts the menu away at once. The scrim does it only once
        // the menu has joined the back gesture, after its first paint, and a
        // menu left open would stand in for every sheet the walk looks for.
        document.querySelector(".sheet.on .sheetclose").click();
        await until(() => !sheet());
        if (sheet()) throw new Error("the menu under the logo did not close");

        navButton("Terminals").click();
        await until(() => all(".pftab").length === 3 && pageOf("personal") && pageOf("personal").querySelector(".tcard"));
        out.tabs = all(".pftab").map(placeTab);
        out.current = placeTab(document.querySelector(".pftab.on"));
        out.pages = all(".pfpages > .pfpage").map(pageShot);
        out.homeCards = all(".tplace", pageOf("personal"))
            .filter((sec) => text(sec.querySelector(".theadname")) === "Home")
            .flatMap((sec) => all(".tcard", sec))
            .map(cardShot);
        out.bareCard = cardShot(all(".tplace", pageOf("personal"))
            .find((sec) => text(sec.querySelector(".theadname")) === "misc").querySelector(".tcard"));
        await pause("A");

        all(".pftab").find((b) => text(b).startsWith("work")).click();
        await until(() => text(document.querySelector(".pftab.on")).startsWith("work"));
        out.picked = placeTab(document.querySelector(".pftab.on"));

        // New on the page of a contour offers home and the projects of that
        // contour; a chip turns the choice to another contour.
        pageOf("work").querySelector(".tnew").click();
        await until(() => sheet() && sheet().querySelector(".tpick .chip"));
        out.picker = picker();
        await pause("A2");
        all(".sheet.on .tpick .chip").find((b) => text(b) === "personal").click();
        await until(() => rowOf("shop"));
        out.rechosen = picker();
        if (!rowOf("shop")) throw new Error(`the chip of personal did not turn the choice: ${out.rechosen.join(", ")}`);

        rowOf("shop").click();
        // The tabs of the place stand up first; the terminal attaches and the
        // menu goes away a moment later, and on a slow machine a good deal later.
        await until(() => document.querySelector(".ttabs") && lastStream() && !document.querySelector("nav.tabs"));
        out.started = actions("term.start").map((a) => ({ target: a.target, params: a.params }));
        out.opened = {
            head: text(document.querySelector(".phead h2")),
            tabs: tabs(),
            on: onTab(),
            stream: lastStream() ? lastStream().url.replace(/&cols=.*$/, "") : "",
            nav: Boolean(document.querySelector("nav.tabs")),
        };
        await live([
            "\x1b[2mu@helios\x1b[0m \x1b[34mshop\x1b[0m \x1b[36mmain\x1b[0m $ nice -n 10 make check",
            "go vet ./...",
            "\x1b[32mok\x1b[0m   shop/internal/cart     0.21s",
            "\x1b[32mok\x1b[0m   shop/internal/orders   3.10s",
            "\x1b[32mok\x1b[0m   shop/internal/store   15.90s",
            "\x1b[32mOK\x1b[0m",
            "\x1b[2mu@helios\x1b[0m \x1b[34mshop\x1b[0m \x1b[36mmain\x1b[0m $ ",
        ]);
        await until(() => document.querySelector(".termkeys"));
        out.keys = all(".termkeys .termkey").map(text);

        // Another tab of the place attaches the terminal to it.
        all(".ttabs .ttab").find((b) => text(b) === "make check").click();
        await until(() => lastStream() && lastStream().url.includes("term=t-s1"));
        out.switched = { on: onTab(), stream: lastStream().url.replace(/&cols=.*$/, "") };

        // The plus of the tabs starts one more in the same place.
        document.querySelector(".ttabs .tadd").click();
        await until(() => actions("term.start").length === 2 && onTab() === "zsh" && lastStream().url.includes("t-new2"));
        out.plus = { params: actions("term.start")[1].params, on: lastStream().url.replace(/&cols=.*$/, "") };
        all(".ttabs .ttab").find((b) => text(b) === "make check").click();
        await until(() => lastStream().url.includes("term=t-s1"));
        await live(["\x1b[2mu@helios\x1b[0m \x1b[34mshop\x1b[0m \x1b[36mmain\x1b[0m $ nice -n 10 make check",
            "\x1b[32mok\x1b[0m   shop/internal/store   15.90s", "\x1b[33m…\x1b[0m    shop/web/check"]);

        await pause("B1");

        // ⋯: a window, a name, a new tab, the closing.
        document.querySelector(".phead .pmore").click();
        await until(() => rowOf("Open in a window"));
        out.menu = rows();
        await pause("B");
        rowOf("Open in a window").click();
        await until(() => actions("term.console").length === 1);
        out.window = actions("term.console")[0];

        document.querySelector(".phead .pmore").click();
        await until(() => rowOf("Rename tab"));
        rowOf("Rename tab").click();
        const field = await until(() => document.querySelector(".sheet.on .rnname"));
        field.value = "build";
        field.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(50);
        all(".sheet.on .btn.primary").pop().click();
        await until(() => actions("term.rename").length === 1 && tabs().includes("build"));
        out.renamed = { action: actions("term.rename")[0], tabs: tabs() };

        // Close asks first, names what the tab ends, and Cancel keeps it.
        await until(() => !sheet());
        document.querySelector(".phead .pmore").click();
        await until(() => rowOf("Close tab"));
        rowOf("Close tab").click();
        await until(() => document.querySelector(".sheet.on .tclose"));
        out.ask = {
            title: text(document.querySelector(".sheet.on .tclose .stitle")),
            sub: text(document.querySelector(".sheet.on .tclose .ssub")),
            says: text(document.querySelector(".sheet.on .tclose .warnline")),
            closedBefore: actions("term.close").length,
        };
        all(".sheet.on .tclose .btn").find((b) => text(b) === "Cancel").click();
        await until(() => !sheet());
        out.kept = { closes: actions("term.close").length, tabs: tabs() };

        document.querySelector(".phead .pmore").click();
        await until(() => rowOf("Close tab"));
        rowOf("Close tab").click();
        await until(() => document.querySelector(".sheet.on .tclose"));
        all(".sheet.on .tclose .btn").find((b) => text(b) === "Close tab").click();
        await until(() => actions("term.close").length === 1 && !tabs().includes("build"));
        out.closed = { action: actions("term.close")[0], tabs: tabs(), on: onTab() };

        // Back lands on the page of the contour of the place, with the menu
        // under it again, though New was pressed on another.
        document.querySelector(".phead .pback").click();
        await until(() => document.querySelector(".pftab.on") && navButton("Terminals"));
        out.back = { current: placeTab(document.querySelector(".pftab.on")), nav: navItems() };

        // The × of each tab. Home holds an idle zsh and htop running; two more
        // shells start there, the last one takes a name too long for its tab,
        // and the first zsh is opened again: the tabs typed into later stand
        // after it, so a close that moved the screen would be seen.
        all(".tplace", pageOf("personal")).find((sec) => text(sec.querySelector(".theadname")) === "Home")
            .querySelector(".tcard").click();
        await until(() => document.querySelector(".ttabs .tadd") && lastStream() && lastStream().url.includes("term=t-h1"));
        document.querySelector(".ttabs .tadd").click();
        await until(() => actions("term.start").length === 3 && lastStream().url.includes("term=t-new3"));
        document.querySelector(".ttabs .tadd").click();
        await until(() => actions("term.start").length === 4 && lastStream().url.includes("term=t-new4"));
        await until(() => !sheet());
        document.querySelector(".phead .pmore").click();
        await until(() => rowOf("Rename tab"));
        rowOf("Rename tab").click();
        const longField = await until(() => document.querySelector(".sheet.on .rnname"));
        longField.value = LONG;
        longField.dispatchEvent(new Event("input", { bubbles: true }));
        await until(() => !all(".sheet.on .btn.primary").pop().disabled);
        all(".sheet.on .btn.primary").pop().click();
        await until(() => !sheet() && tabRow().includes(`${LONG}*`));
        cells()[0].querySelector("[role=tab]").click();
        await until(() => tabRow()[0] === "zsh*" && lastStream().url.includes("term=t-h1"));
        out.x = { before: tabRow(), cells: cells().map(cellShot) };
        await pause("X");

        // × on an idle tab that is not the open one closes it at once; the
        // host keeps its answer back for a moment, and the × stays down
        // meanwhile, a second press sending nothing.
        const hold = holdClose();
        xOf(3).click();
        await until(() => closesOf("t-new4") === 1);
        const down = await until(() => xOf(3) && xOf(3).disabled);
        xOf(3).click();
        const twice = closesOf("t-new4");
        held = null;
        hold.release();
        await until(() => tabRow().length === 3);
        out.x.idle = { down: Boolean(down), sentTwice: twice > 1, closes: closesOf("t-new4"), sheet: Boolean(sheet()), row: tabRow() };

        // × on a tab where something runs asks first, naming what runs, and
        // sends nothing until the question is answered; the open tab stays.
        xOf(1).click();
        await until(() => document.querySelector(".sheet.on .tclose"));
        out.x.running = {
            title: text(document.querySelector(".sheet.on .tclose .stitle")),
            sub: text(document.querySelector(".sheet.on .tclose .ssub")),
            closedBefore: closesOf("t-h2"),
        };
        all(".sheet.on .tclose .btn").find((b) => text(b) === "Close tab").click();
        await until(() => closesOf("t-h2") === 1 && tabRow().length === 2 && !sheet());
        out.x.running.closes = closesOf("t-h2");
        out.x.running.row = tabRow();

        // × on the open tab gives way to the one typed into last.
        xOf(0).click();
        await until(() => closesOf("t-h1") === 1 && tabRow().length === 1 && lastStream().url.includes("term=t-new3"));
        out.x.open = { closes: closesOf("t-h1"), sheet: Boolean(sheet()), row: tabRow(), stream: lastStream().url.replace(/&cols=.*$/, "") };

        // × on the last tab puts the place down.
        xOf(0).click();
        await until(() => closesOf("t-new3") === 1 && !document.querySelector(".ttabs") && document.querySelector(".pftab.on"));
        out.x.last = { closes: closesOf("t-new3"), layer: Boolean(document.querySelector(".ttabs")), pager: Boolean(document.querySelector(".pftab.on")) };
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
