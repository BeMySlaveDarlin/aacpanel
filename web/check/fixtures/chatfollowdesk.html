<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The desktop with a conversation open, the way a push or a link opens it. A
// closed conversation opened beside a live session of the same name stays
// itself; a live one whose session restarts under the same name goes on to
// the new conversation.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { DesktopShell } from "/src/desktop/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

// Hold only the feed's resize delivery: a late frame must not leave the
// previous-message button below a feed that was already following its end.
let holdFeedResizes = false;
const heldResizes = new Map();
const NativeResizeObserver = window.ResizeObserver;
window.ResizeObserver = class extends NativeResizeObserver {
    constructor(callback) {
        super((entries, observer) => {
            const deliver = () => callback(entries, observer);
            if (holdFeedResizes && this.feed) heldResizes.set(observer, deliver);
            else deliver();
        });
        this.feed = false;
    }
    observe(target, options) {
        this.feed ||= target.matches(".chatfeed");
        super.observe(target, options);
    }
    disconnect() {
        heldResizes.delete(this);
        super.disconnect();
    }
};

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
let extraA = 0;
const started = Date.now() - 600000;
const previousAsk = (id) => ({ id: `ask-${id}`, kind: "ask", state: "answered", closed: new Date(started + 21000).toISOString(), title: "Choose the next build",
    created: new Date(started + 20000).toISOString(), body: { questions: Array.from({ length: 4 }, () => ({
        question: "Which build should be deployed after the checks finish? ".repeat(8),
    })) }, answer: { answers: Array.from({ length: 4 }, () => ({ picks: ["After the checks"],
        text: "Keep the previous build ready until the new build has passed its checks. ".repeat(8),
    })) } });
const network = window.fetch.bind(window);
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u === "/check/pointer") return network(url, init);
    if (u.startsWith("/api/chat?")) {
        const params = new URL(u, location.href).searchParams;
        const id = params.get("id") || "";
        asked.push(id);
        const total = id === "nav-a" ? 40 + extraA : 40;
        const all = id.startsWith("nav-") ? Array.from({ length: total }, (_, n) => ({
            role: n % 2 ? "ai" : "me", pos: n + 1, at: new Date(started + n * 1000).toISOString(), text: `${id} message ${n + 1}: ${"read the build output and check the result. ".repeat(id === "nav-a" ? 12 : 1)}`,
        })) : [];
        const items = (params.has("before") ? all.filter((item) => item.pos < Number(params.get("before"))) : all).slice(-40);
        if (id.startsWith("nav-") && !params.has("before")) await until(() =>
            document.querySelector(".chatfeed")?.textContent.includes("Reading the conversation"));
        return json({ items, first: items[0]?.pos || 0, last: items.at(-1)?.pos || 0, total: all.length, moreBefore: items[0]?.pos > 1, state: null });
    }
    if (u.startsWith("/api/acts?")) {
        const id = new URL(u, location.href).searchParams.get("session");
        return json({ acts: id?.startsWith("nav-") ? [previousAsk(id)] : [] });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u.startsWith("/api/profiles")) return json({ profiles: [] });
    return json({});
});
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const run = (sessionId) => ({ session: "aacpanel", sessionId, status: "busy", transport: "stream", pct: 77.2,
    tokens: 772000, limit: 1000000, cwd: "/srv/proj", model: "claude-opus-5-5", profile: "personal" });
const root = document.getElementById("root");
const waits = { opening: () => [], of: () => null };
const alerts = { kind: "ready", list: [], reload: () => {} };
const until = async (ok) => {
    const end = performance.now() + 3000;
    while (!ok() && performance.now() < end) await new Promise(requestAnimationFrame);
    if (!ok()) throw new Error("The conversation did not open");
};

const show = (snap, jump) => render(h(ToastHost, null, h(GateHost, null, html`<${DesktopShell} snapshot=${snap}
    tree=${[]} treeError=${null} hostError=${null} ageSec=${1} history=${[]} faults=${[]}
    alerts=${alerts} openAlerts=${0} exec=${exec} onRefresh=${() => {}} wait=${waits}
    theme="space" onTheme=${() => {}} updateReady=${false} updating=${false} onApplyUpdate=${() => {}}
    route=${{ here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }}
    jump=${jump} onJumped=${() => {}} />`)), root);

const open = async (name, id) => {
    document.querySelector(`button[aria-label="open conversation ${name}"]`).click();
    await until(() => document.querySelector(".chatfeed")?.textContent.includes(`${id} message ${id === "nav-a" ? 40 + extraA : 40}`));
    await quiet();
    return document.querySelector(".chatfeed");
};
const atEnd = (box) => box.scrollHeight - box.scrollTop - box.clientHeight <= 1;
const pointer = async (point) => {
    const response = await fetch("/check/pointer", { method: "POST", body: JSON.stringify(point) });
    if (!response.ok) throw new Error(await response.text());
};

(async () => {
    const out = {};
    try {
        show({ at: 1, sessions: [run("new1")] }, { name: "aacpanel", id: "old0" });
        await quiet();
        out.pastAsked = [...asked];
        out.pastComposer = Boolean(document.querySelector(".dkchat textarea"));

        render(null, root);
        asked.length = 0;
        show({ at: 1, sessions: [run("a1")] }, { name: "aacpanel", id: "a1" });
        await quiet();
        out.liveComposer = Boolean(document.querySelector(".dkchat textarea"));
        show({ at: 2, sessions: [] }, null);
        await quiet();
        show({ at: 3, sessions: [run("a2")] }, null);
        await quiet();
        out.restartAsked = [...asked];
        out.restartComposer = Boolean(document.querySelector(".dkchat textarea"));

        render(null, root);
        show({ at: 4, sessions: [
            { ...run("nav-a"), session: "alpha" }, { ...run("nav-b"), session: "beta" },
        ] }, null);
        await quiet();
        out.navigation = [];
        for (const [name, id] of [["alpha", "nav-a"], ["beta", "nav-b"], ["alpha", "nav-a"]]) {
            const box = await open(name, id);
            out.navigation.push({ name, scrollable: box.scrollHeight > box.clientHeight,
                atEnd: atEnd(box), gap: box.scrollHeight - box.scrollTop - box.clientHeight });
            if (out.navigation.length === 1) {
                const edge = box.getBoundingClientRect();
                const text = [...box.querySelectorAll(".msg, .askedq")].reverse().find((el) => {
                    const r = el.getBoundingClientRect();
                    return r.bottom > edge.top + 10 && r.top < edge.bottom - 10;
                });
                const r = text.getBoundingClientRect();
                await pointer({ x: r.left + r.width / 2,
                    y: Math.max(edge.top + 10, Math.min(edge.bottom - 10, r.top + r.height / 2)) });
                await quiet();
                out.clickedAtEnd = atEnd(box);
            }
            if (name === "beta") extraA += 8;
        }
        out.arrivedWhileAway = extraA;
        out.jumpReturns = [];
        for (const mode of ["jump immediately", "jump after settling", "wheel after 200ms"]) {
            const box = document.querySelector(".chatfeed");
            box.scrollTop = 200;
            box.dispatchEvent(new Event("scroll"));
            await until(() => box.querySelector(".feedjump:not(.feedprevious)"));
            await quiet();
            if (mode.startsWith("wheel")) {
                const r = box.getBoundingClientRect();
                await pointer({ x: r.left + r.width / 2, y: r.top + r.height / 2, wheel: box.scrollHeight });
                await new Promise((resolve) => setTimeout(resolve, 200));
            } else {
                box.querySelector(".feedjump:not(.feedprevious)").click();
                if (mode === "jump after settling") await quiet();
            }
            await open("beta", "nav-b");
            const returned = await open("alpha", "nav-a");
            out.jumpReturns.push({ mode, atEnd: atEnd(returned) });
        }
        render(null, root);
        await quiet();
        show({ at: 5, sessions: [
            { ...run("nav-a"), session: "alpha" }, { ...run("nav-b"), session: "beta" },
        ] }, null);
        await quiet();
        holdFeedResizes = true;
        out.delayedNavigation = [];
        for (const [name, id] of [["alpha", "nav-a"], ["beta", "nav-b"], ["alpha", "nav-a"]]) {
            const box = await open(name, id);
            await until(() => box.querySelector(".feedprevious"));
            out.delayedNavigation.push({ name, scrollable: box.scrollHeight > box.clientHeight,
                atEnd: atEnd(box), gap: box.scrollHeight - box.scrollTop - box.clientHeight });
            if (name === "beta") extraA += 8;
        }
        const delayedBox = document.querySelector(".chatfeed");
        delayedBox.scrollTop = 200;
        delayedBox.dispatchEvent(new Event("scroll"));
        await until(() => delayedBox.querySelector(".feedjump:not(.feedprevious)"));
        await quiet();
        delayedBox.querySelector(".feedjump:not(.feedprevious)").click();
        await quiet();
        out.delayedJumpGap = delayedBox.scrollHeight - delayedBox.scrollTop - delayedBox.clientHeight;
        out.delayedResizes = heldResizes.size;
        holdFeedResizes = false;
        for (const deliver of heldResizes.values()) deliver();
        heldResizes.clear();
        await quiet();
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    window.done = out;
})();
</script>
