<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The desktop with a conversation open, the way a push or a link opens it. A
// closed conversation opened beside a live session of the same name stays
// itself; a live one whose session restarts under the same name goes on to
// the new conversation.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { DesktopShell } from "/src/desktop/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        asked.push(new URL(u, location.href).searchParams.get("id") || "");
        return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u.startsWith("/api/profiles")) return json({ profiles: [] });
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const run = (sessionId) => ({ session: "aacpanel", sessionId, status: "busy", transport: "stream", pct: 77.2,
    tokens: 772000, limit: 1000000, cwd: "/srv/proj", model: "claude-opus-5-5", profile: "personal" });
const root = document.getElementById("root");
const waits = { opening: () => [], of: () => null };
const alerts = { kind: "ready", list: [], reload: () => {} };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const show = (snap, jump) => render(h(ToastHost, null, h(GateHost, null, html`<${DesktopShell} snapshot=${snap}
    tree=${[]} treeError=${null} hostError=${null} ageSec=${1} history=${[]} faults=${[]}
    alerts=${alerts} openAlerts=${0} exec=${exec} onRefresh=${() => {}} wait=${waits}
    theme="space" onTheme=${() => {}} updateReady=${false} updating=${false} onApplyUpdate=${() => {}}
    route=${{ here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }}
    jump=${jump} onJumped=${() => {}} />`)), root);

(async () => {
    const out = {};
    try {
        show({ at: 1, sessions: [run("new1")] }, { name: "aacpanel", id: "old0" });
        await sleep(600);
        out.pastAsked = [...asked];
        out.pastComposer = Boolean(document.querySelector(".dkchat textarea"));

        render(null, root);
        asked.length = 0;
        show({ at: 1, sessions: [run("a1")] }, { name: "aacpanel", id: "a1" });
        await sleep(600);
        out.liveComposer = Boolean(document.querySelector(".dkchat textarea"));
        show({ at: 2, sessions: [] }, null);
        await sleep(300);
        show({ at: 3, sessions: [run("a2")] }, null);
        await sleep(600);
        out.restartAsked = [...asked];
        out.restartComposer = Boolean(document.querySelector(".dkchat textarea"));
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    window.done = out;
})();
</script>
