<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A codex thread that asked without waiting hours ago and worked on long
// after: the feed is read from its end, and the card of the question is not
// among the rows the screen holds. The row of the thread says the question
// hangs, with its id and its options, and the screen offers it over the
// composer: a tap on an option goes as the answer, naming the question; it
// folds into a line and opens again; and it leaves once the row no longer
// says it hangs. A second thread, whose question has no options, is answered
// with words of one's own from the composer: they go as the answer, and the
// question leaves as they do. The page opened as codexaskdock.html#dock stops
// with the question over the composer, #folded with it folded, and #sent
// once the tap has gone, for a picture.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const OTHER = "01a12345-0000-7000-8000-00000000ef01";
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
// The tail of a long thread: the question was asked nine hours ago, some two
// thousand records before the first of these rows, and no message of the
// person came after it — one would have answered it.
const items = [
    { pos: 90100, at: ago(70), role: "ai", text: "I check the source addresses on the test servers.", cut: false },
    { pos: 90800, at: ago(65), role: "ai", text: "The test servers saw different source addresses, 127.0.0.2 and 127.0.0.3. The full test run was not started; the Clippy warnings are kept in the report.", cut: false },
    { pos: 91500, at: ago(60), role: "ai", text: "The changes are carried into the working directory with a check that the earlier edits survive. The temporary checkout, builds, dependencies and caches are removed.", cut: false },
    { pos: 92200, at: ago(55), role: "ai", text: "Nothing is on the server yet. What is left for the launch: the host and the list of IPv4 addresses, whether the addresses reach the Router environment, and the real outside IP after NAT.", cut: false },
];

const sent = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        const body = JSON.parse(init.body);
        sent.push(body);
        return json({ ok: true, detail: "the answer started a turn" });
    }
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: 2413,
                      moreBefore: true, state: { tasks: [], agents: [] } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.unqueue", "session.stop", "session.close"] };
const thread = {
    session: "codex-79e1c76e", sessionId: PARENT, profile: "acme", agent: "codex", transport: "stream",
    status: "idle", model: "gpt-6-astra", tokens: 94000, limit: 272000, pct: 34.9, cwd: "/srv/router",
    lastRequestAt: ago(540),
    ask: { header: "", text: "Which server should the router send from?", count: 1, at: ago(540), async: true,
           use: "call_ask_server",
           asks: [{ title: "Which server should the router send from?",
                    options: ["The German one", "The Finnish one", "Both, by turns"] }] },
};
const plain = {
    session: "codex-0000ef01", sessionId: OTHER, profile: "acme", agent: "codex", transport: "stream",
    status: "busy", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/site",
    ask: { header: "", text: "Should the logo stay?", count: 1, at: ago(300), async: true,
           use: "call_ask_logo", asks: [{ title: "Should the logo stay?", options: [] }] },
};
setLiveSessions([thread, plain]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const one = (sel) => root.querySelector(sel);
const dock = () => {
    const el = one(".composerbox .xrdock");
    if (!el) return null;
    return {
        head: text(el.querySelector(".xrdocklabel")),
        at: text(el.querySelector(".xrdockat")),
        titles: Array.from(el.querySelectorAll(".asktext")).map(text),
        options: Array.from(el.querySelectorAll(".askopt")).map((o) => text(o)
            + (o.classList.contains("on") ? " (on)" : o.classList.contains("off") ? " (off)" : "")),
        hint: text(el.querySelector(".hint")),
        line: el.classList.contains("folded") ? text(el.querySelector(".waittext")) : "",
    };
};
const screen = () => ({
    dock: dock(),
    word: text(one(".chathead .talkword")),
    placeholder: one(".composer textarea") ? one(".composer textarea").placeholder : "",
    cards: root.querySelectorAll(".chatfeed .xrquestion").length,
});

const show = async (live) => {
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${live.session} id=${live.sessionId} live=${live}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    await settled();
};

window.done = (async () => {
    await document.fonts.ready;
    await show(thread);
    if (!await until(() => one(".chatfeed .msg") && one(".composerbox .xrdock"))) {
        throw new Error("the feed or the question over the composer did not come");
    }
    await settled();
    const out = { far: screen() };
    if (location.hash === "#dock") return {};

    one(".xrdockhead").click();
    if (!await until(() => one(".xrdock.folded"))) throw new Error("the question did not fold");
    out.folded = screen();
    if (location.hash === "#folded") return {};
    one(".xrdock.folded").click();
    if (!await until(() => one(".xrdock .askopt"))) throw new Error("the question did not open again");
    out.opened = screen();

    Array.from(root.querySelectorAll(".xrdock .askpick")).find((b) => text(b) === "The German one").click();
    if (!await until(() => sent.length > 0 && one(".xrdock .askopt.on"))) throw new Error("the answer did not go");
    await settled();
    out.sent = screen();
    if (location.hash === "#sent") return {};

    // The collector read the answer: the row says no question hangs.
    const { ask, ...answered } = thread;
    await show(answered);
    if (!await until(() => !one(".composerbox .xrdock"))) throw new Error("the answered question stayed");
    out.gone = screen();

    // The second thread: a question without options, answered with words.
    await show(plain);
    if (!await until(() => one(".composerbox .xrdock") && one(".composer textarea"))) {
        throw new Error("the second question did not come");
    }
    await settled();
    out.plain = screen();
    const area = one(".composer textarea");
    area.value = "Drop it";
    area.dispatchEvent(new Event("input", { bubbles: true }));
    if (!await until(() => one(".composer .sendbtn") && !one(".composer .sendbtn").disabled)) {
        throw new Error("the send button did not come");
    }
    const before = sent.length;
    one(".composer .sendbtn").click();
    if (!await until(() => sent.length > before && !one(".composerbox .xrdock"))) {
        throw new Error("the words did not go as the answer");
    }
    await settled();
    out.words = screen();
    out.posted = sent.map((r) => ({ kind: r.kind, target: r.target, params: r.params }));
    return out;
})();
</script>
