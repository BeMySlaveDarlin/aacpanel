<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>
html,body{margin:0}
#col .deskshell{position:static;height:900px} #col .dkbody{height:900px}
#root{display:flex;min-width:0;min-height:0} #root > .dkleft{flex:1;min-width:0}
#talk .deskshell{position:static;height:600px} #talk .dkbody{height:600px}
#talk .dkbody:not(.withpanel) > .dkright{display:none}
#phone{width:390px}
</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script>document.documentElement.style.setProperty("--ui-scale", "1.2");</script>
<div id="col"><div class="deskshell"><div class="dkbody withpanel">
    <div id="root"></div><section class="dkcenter"></section><aside class="dkright"></aside>
</div></div></div>
<div id="talk"><div class="deskshell"><div class="dkbody withpanel" id="body">
    <aside class="dkleft"></aside><section class="dkcenter dkchat" id="chat"></section><aside class="dkright"></aside>
</div></div></div>
<div id="phone"></div>
<script type="module">
// The card of a session in the desktop column, with the right panel open:
// live and closed apart. The live sessions of a contour keep their places and
// keys whatever they do; the state is said in the words of the phone, with a
// quiet line of what the session runs on under it, the share of its context
// among it; the one action of a row stands on every row in its corner; the heading
// counts who waits and opens a new session; the closed conversations stand on
// a shelf below with their time and Resume. Then the header of the
// conversation in two lines, with the right panel open and without, and the
// time of a closed conversation on the phone.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { PastLine } from "/src/screens/sessions/blocks.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const now = Date.now();
const iso = (min) => new Date(now - min * 60e3).toISOString();
const P = (id, name, group, path) => ({ id, name, group, session: name, path });
const projects = {
    11: P(11, "aacpanel", "Side", "/srv/aacpanel"), 12: P(12, "person", "Side", "/srv/person"),
    13: P(13, "blog", "Side", "/srv/blog"), 14: P(14, "helios", "Host", "/home/u"),
    21: P(21, "shop", "SHOP", "/srv/shop"), 22: P(22, "shop-admin", "SHOP", "/srv/shop-admin"),
    23: P(23, "api", "Platform", "/srv/api"),
};
const group = (name, ids) => ({ name, projects: ids.map((id) => { const { group: _, ...p } = projects[id]; return p; }) });
const profileMap = [
    { id: 3, profile: "personal", name: "personal", groups: [group("Side", [11, 12, 13]), group("Host", [14])] },
    { id: 1, profile: "Globex Group", name: "Globex Group", groups: [group("SHOP", [21, 22]), group("Platform", [23])] },
];
const accounts = [
    { name: "personal", account: { permissionMode: "auto" } },
    { name: "globex", account: { permissionMode: "bypassPermissions" } },
];
const limits = { contours: [
    { profile: "personal", contour: 3, ageSec: 30, fiveHour: { pct: 20, resetsAt: now / 1000 + 3600 }, sevenDay: { pct: 30, resetsAt: now / 1000 + 86400 } },
    { profile: "globex", contour: 1, ageSec: 30, fiveHour: { pct: 40, resetsAt: now / 1000 + 3600 }, sevenDay: { pct: 50, resetsAt: now / 1000 + 86400 } },
] };
const S = (o) => ({
    transport: "stream", model: "claude-opus-5-5", effort: "xhigh", limit: 1000000, limitKnown: true,
    startedAt: iso(185), lastRequestAt: iso(5), compacts: 0, mode: "auto", sessionId: `id-${o.session}`,
    cwd: o.project ? o.project.path : `/srv/${o.session}`, tokens: Math.round(o.pct * 10000), ...o,
});
// The collector lists sessions by how full they are.
const first = [
    S({ session: "person", profile: "personal", contour: 3, project: projects[12], status: "waiting", waitingFor: "input needed",
        ask: { count: 2, header: "Palette" }, pct: 63 }),
    S({ session: "aacpanel", profile: "personal", contour: 3, project: projects[11], status: "busy", work: { agents: 2, tasks: 0 },
        pct: 41.8, remote: "https://claude.ai/code/session_x", compacts: 2 }),
    S({ session: "api", profile: "globex", contour: 1, project: projects[23], status: "waiting", waitingFor: "dialog open",
        pct: 37, mode: "plan" }),
    S({ session: "shop", profile: "globex", contour: 1, project: projects[21], status: "busy", work: { agents: 1, tasks: 0 },
        pct: 26, mode: "bypassPermissions" }),
    S({ session: "helios", profile: "personal", contour: 3, project: projects[14], home: true, status: "idle", pct: 10,
        remote: "https://claude.ai/code/session_y" }),
    S({ session: "scratch", profile: "personal", contour: 3, project: null, transport: "tmux", status: "idle", pct: 5 }),
    // A name longer than the column, both marks and a full context: what
    // crowds the right column most.
    S({ session: "acme-fingerprint-rotation-review", profile: "globex", contour: 1, project: null, transport: "tmux",
        status: "idle", pct: 99.6, remote: "https://claude.ai/code/session_w" }),
];
// A minute later every one of them stands otherwise, and the list comes in
// another order.
const later = [
    { ...first[6], status: "busy" },
    { ...first[5], pct: 81, status: "busy" },
    { ...first[4], pct: 90 },
    { ...first[3], status: "idle" },
    { ...first[2], status: "busy", waitingFor: null },
    { ...first[1], status: "waiting", waitingFor: "input needed", ask: { count: 1, header: "Scope" } },
    { ...first[0], status: "idle", ask: null, waitingFor: null },
];
const task = { kind: "open", target: "shop-admin", since: now - 7000, before: first.map((s) => s.session), seen: 0, params: { project: 22 } };
const wait = { opening: () => [task], of: () => null };

const closed = (o) => ({ model: "claude-opus-5-5", pctMax: 40, startedAt: iso(o.min + 60), lastAt: iso(o.min), ...o });
const archive = [
    closed({ sessionId: "c-person-e8", name: "person-e8", profile: "personal", project: projects[12], messages: 3, min: 70,
             prompts: ["Review this change for security vulnerabilities"] }),
    closed({ sessionId: "c-person", name: "person", profile: "personal", project: projects[12], messages: 50, min: 125,
             prompts: ["the palette of the avatar, warmer and fewer greys"] }),
    closed({ sessionId: "c-blog", name: "blog", profile: "personal", project: projects[13], messages: 0, min: 180, prompts: [] }),
    closed({ sessionId: "c-career", name: "career", profile: "personal", project: null, cwd: "/srv/career", messages: 10, min: 300,
             prompts: ["a cover letter for the platform role, shorter"] }),
    closed({ sessionId: "c-shop-admin", name: "shop-admin", profile: "globex", project: projects[22], messages: 20, min: 26 * 60,
             prompts: ["migrate the admin filters to the new router"] }),
];

const asked = [];
const sent = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "done" });
    }
    if (u.startsWith("/api/sessions/archive")) {
        asked.push(new URL(u, location.origin).search);
        return json({ rows: archive, total: archive.length, limit: 30, offset: 0 });
    }
    if (u.startsWith("/api/chat?")) return json({ items: [{ role: "ai", pos: 1, text: "Running the suite." }], first: 1, last: 1, total: 1, moreBefore: false, state: null });
    if (u === "/api/term") return json({ available: true });
    if (u.startsWith("/api/session/switch")) return json({ to: "console" });
    if (u.startsWith("/api/session/window")) return json({ state: "closed" });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.close", "session.restart", "session.resume", "session.open", "session.switch",
    "window.open", "session.send", "session.set"] };
const picked = [];
const orders = [];
let archiveOpened = 0;
const column = (sessions, current, currentId = "") => render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: now / 1000, sessions, profileMap, limits, profiles: accounts, host: { home: "/home/u" } },
    profiles: { profiles: [] }, limits, current, currentId, onPick: (t) => picked.push(t), picks: [], setPicks() {},
    onNames() {}, onOrder: (o) => orders.push(o.map((t) => t.name).join(",")), onArchive: () => { archiveOpened++; }, exec, wait,
}))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
// words reads a line made of several pieces the way it reads on the screen.
const words = (el) => (el ? Array.from(el.children).map(text).filter(Boolean).join(" ") : "");
const root = () => document.getElementById("root");
const rowOf = (name) => Array.from(root().querySelectorAll(".dklive")).find((r) => text(r.querySelector(".dkname")) === name);
const lay = () => Array.from(root().querySelectorAll(".dkscroll > section:not(.dkshelf)")).map((sec) => ({
    name: text(sec.querySelector(".dkcontourname")),
    waits: text(sec.querySelector(".dkwaitn")),
    rows: Array.from(sec.querySelectorAll(".dklive")).map((r) => `${text(r.querySelector(".dkkey"))}:${text(r.querySelector(".dkname"))}`),
}));
const say = (name) => words(rowOf(name) && rowOf(name).querySelector(".dksay"));
const facts = (name) => {
    const d = rowOf(name) && rowOf(name).querySelector(".dkdetail");
    if (!d) return { all: [], shown: [], lines: 0 };
    const spans = Array.from(d.children);
    const top = spans.length ? spans[0].offsetTop : 0;
    const size = parseFloat(getComputedStyle(d).fontSize);
    return {
        all: spans.map(text),
        levels: spans.map((sp) => sp.dataset.level || ""),
        shown: spans.filter((s) => s.offsetTop === top).map(text),
        lines: Math.round(d.getBoundingClientRect().height / (size * 1.4)),
        // A fact on the line stands whole inside it: what does not fit is
        // not cut, it is gone.
        cut: spans.filter((sp) => sp.offsetTop === top && sp !== spans[0]
            && sp.getBoundingClientRect().right > d.getBoundingClientRect().right + 0.5).map(text),
    };
};
const box = (el) => (el ? el.getBoundingClientRect() : null);
const hit = (a, b) => Boolean(a && b && a.width > 0 && b.width > 0
    && a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5);
const clipped = (el) => Boolean(el) && el.scrollWidth > el.clientWidth + 1;
// rows says of every live row whether its action stands, whether it stands in
// the top right corner — on the line of the name, at the right edge — and
// whether the pieces of the row stand clear of each other and inside it.
const rows = () => Array.from(root().querySelectorAll(".dklive:not(.dkghost)")).map((row) => {
    const r = box(row);
    const left = Array.from(row.querySelectorAll(".dksessmain > *")).map((el) => [el.className || "name", box(el)]);
    const icon = row.querySelector(".dkrowacts .dkact");
    const act = box(icon);
    const name = box(row.querySelector(".dkname"));
    const detail = box(row.querySelector(".dkdetail"));
    const say = box(row.querySelector(".dksay"));
    const bad = [];
    for (const [part, b] of left) {
        if (hit(b, act)) bad.push(`${part}/action`);
    }
    if (hit(say, act)) bad.push("state/action");
    if (hit(detail, act)) bad.push("detail/action");
    for (const [part, b] of [["action", act], ["detail", detail]]) {
        if (b && (b.right > r.right + 0.5 || b.bottom > r.bottom + 0.5)) bad.push(`${part} out of the row`);
    }
    if (act && name) {
        const middle = (b) => (b.top + b.bottom) / 2;
        if (Math.abs(middle(act) - middle(name)) > 4) bad.push("action off the line of the name");
        if (r.right - act.right > 12) bad.push("action short of the right edge");
    }
    if (row.querySelector(":scope > .dknum")) bad.push("a share in the corner");
    const style = icon ? getComputedStyle(icon) : null;
    const shown = icon && getComputedStyle(row.querySelector(".dkrowacts")).visibility === "visible"
        && style.visibility === "visible" && style.display !== "none" && Number(style.opacity) === 1 && act.width > 0;
    return { name: text(row.querySelector(".dkname")), icons: row.querySelectorAll(".dkrowacts .dkact").length,
        shown: Boolean(shown), bad };
});

// hiding lists the rules of the stylesheet that take the action of a row, the
// plus of a heading, Resume or the time of a closed conversation off the
// screen: none of them waits for the pointer.
function hiding() {
    const out = [];
    const walk = (list) => {
        for (const rule of list) {
            if (rule.cssRules && !rule.selectorText) {
                walk(rule.cssRules);
                continue;
            }
            const sel = rule.selectorText || "";
            if (!/\.dkrowacts|\.dknew\b|\.dkresume|\.dkclwhen/.test(sel)) continue;
            const st = rule.style;
            if (st.visibility === "hidden" || st.display === "none" || st.opacity === "0") out.push(sel);
        }
    };
    for (const sheet of document.styleSheets) walk(sheet.cssRules);
    return out;
}

window.done = (async () => {
    await document.fonts.ready;
    const out = { pointer: matchMedia("(hover: hover) and (pointer: fine)").matches };

    column(first, "aacpanel");
    for (let i = 0; i < 60 && !root().querySelector(".dkshelf .dkclosed"); i++) await sleep(50);
    await sleep(100);
    out.before = lay();
    out.orderBefore = orders[orders.length - 1];
    out.ghost = (() => {
        const g = root().querySelector(".dkghost");
        const sec = g && g.closest("section");
        return g ? { section: text(sec.querySelector(".dkcontourname")), key: text(g.querySelector(".dkkey")),
                     last: g === Array.from(sec.querySelectorAll(".dklive")).pop(), say: words(g.querySelector(".dksay")) } : null;
    })();
    out.says = Object.fromEntries(["person", "aacpanel", "api", "shop", "helios"].map((n) => [n, say(n)]));
    out.tones = Object.fromEntries(["person", "aacpanel", "helios"].map((n) => [n, rowOf(n).dataset.tone]));
    out.edge = getComputedStyle(rowOf("person")).boxShadow;
    out.noEdge = getComputedStyle(rowOf("helios")).boxShadow;
    out.facts = Object.fromEntries(["aacpanel", "api", "shop", "helios", "scratch", "acme-fingerprint-rotation-review"]
        .map((n) => [n, facts(n)]));
    out.marks = Object.fromEntries(["aacpanel", "helios", "scratch", "shop"].map((n) => [n,
        Array.from(rowOf(n).querySelectorAll(".dkmark, .dkrc, .dkhome")).map(text)]));
    out.columnText = text(root().querySelector(".dkscroll"));
    out.rows = rows();
    out.homeAct = (rowOf("helios").querySelector(".dkrowacts .dkact") || {}).getAttribute?.("aria-label") || "";
    out.hiding = hiding();

    // The shelf.
    out.asked = [...asked];
    out.shelf = Array.from(root().querySelectorAll(".dkshelf .dkclosed")).map((r) => ({
        name: text(r.querySelector(".dkclname")), contour: text(r.querySelector(".dkclcontour")),
        when: text(r.querySelector(".dkclwhen")), about: text(r.querySelector(".dkabout")),
        dot: Boolean(r.querySelector(".dkdot, .dkkey, .dksessbar")),
        resume: getComputedStyle(r.querySelector(".dkresume")).display,
        bad: [
            hit(box(r.querySelector(".dkresume")), box(r.querySelector(".dkabout"))) && "Resume/about",
            hit(box(r.querySelector(".dkresume")), box(r.querySelector(".dkclwhen"))) && "Resume/time",
            hit(box(r.querySelector(".dkclwhen")), box(r.querySelector(".dkclcontour"))) && "time/contour",
            clipped(r.querySelector(".dkclwhen")) && "time cut",
            clipped(r.querySelector(".dkresume")) && "Resume cut",
            box(r.querySelector(".dkresume")).right > box(r).right + 0.5 && "Resume out of the row",
        ].filter(Boolean),
    }));
    root().querySelector(".dkshelfall").click();
    out.archiveOpened = archiveOpened;
    Array.from(root().querySelectorAll(".dkclosed")).pop().click();
    out.pickedClosed = picked[picked.length - 1];

    // The new session of a contour.
    const plus = root().querySelector(".dkscroll > section .dknew");
    out.plus = getComputedStyle(plus).visibility;
    plus.click();
    await sleep(100);
    out.menu = Array.from(root().querySelectorAll(".dknewpop .dknewgroup, .dknewpop .dknewrow")).map((el) =>
        el.classList.contains("dknewgroup") ? `[${text(el)}]` : words(el));
    Array.from(root().querySelectorAll(".dknewrow")).find((b) => text(b.querySelector(".dkname")) === "blog").click();
    await sleep(150);
    const ok = document.querySelector(".btnrow .btn.primary");
    if (ok) ok.click();
    await sleep(250);
    out.opened = sent.slice();

    // A minute later: every state has changed, the list comes in another order.
    column(later, "aacpanel");
    await sleep(150);
    out.after = lay();
    out.orderAfter = orders[orders.length - 1];
    out.saysAfter = { aacpanel: say("aacpanel"), person: say("person") };

    // A closed conversation open: its row carries its time and Resume both.
    sent.length = 0;
    column(first, "shop-admin", "c-shop-admin");
    await sleep(120);
    const open = root().querySelector(".dkclosed.on");
    out.openClosed = open ? { name: text(open.querySelector(".dkclname")),
        resume: getComputedStyle(open.querySelector(".dkresume")).display,
        when: getComputedStyle(open.querySelector(".dkclwhen")).display } : null;
    if (open) {
        open.querySelector(".dkresume").click();
        await sleep(150);
        const yes = document.querySelector(".btnrow .btn.primary");
        if (yes) yes.click();
        await sleep(250);
    }
    out.resumed = sent.slice();
    out.pickedAfterResume = picked.length;

    // The header of a conversation, the right panel open and closed.
    const live = { ...first[3], session: "shop", cwd: "/home/u/Projects/Globex/shop", remote: "https://claude.ai/code/session_z" };
    render(h(ToastHost, null, h(GateHost, null, h(Chat, {
        name: "shop", id: live.sessionId, live, exec, snapshot: { sessions: [live] }, onBack() {}, onUsage() {},
    }))), document.getElementById("chat"));
    const chat = document.getElementById("chat");
    for (let i = 0; i < 40 && !chat.querySelector(".dkplace"); i++) await sleep(50);
    await sleep(100);
    const head = () => {
        const top = chat.querySelector(".dkheadtop").getBoundingClientRect();
        const name = chat.querySelector(".dkwhoname").getBoundingClientRect();
        const sub = chat.querySelector(".dkwhosub").getBoundingClientRect();
        const label = chat.querySelector(".dkheadname").getBoundingClientRect();
        // What the name takes in ink: its halves, not the box that holds them.
        const inked = Array.from(chat.querySelectorAll(".dkheadname .midname > *"))
            .reduce((sum, el) => sum + el.getBoundingClientRect().width, 0);
        const tools = Array.from(chat.querySelector(".dkheadtop").children).slice(1).map((el) => el.getBoundingClientRect());
        return {
            width: Math.round(top.width),
            overflow: Math.max(0, ...tools.map((b) => Math.round(b.right - top.right))),
            twoLines: sub.top >= name.bottom - 1,
            gap: Math.round(label.width - inked),
            sub: words(chat.querySelector(".dkwhosub")),
            place: text(chat.querySelector(".dkplace")),
        };
    };
    out.withPanel = head();
    document.getElementById("body").classList.remove("withpanel");
    await sleep(100);
    out.withoutPanel = head();

    // The time of a closed conversation on the phone.
    render(h(ToastHost, null, h(GateHost, null, html`<${PastLine} row=${archive[1]} project=${null} exec=${exec} onOpen=${() => {}} />`)),
        document.getElementById("phone"));
    await sleep(50);
    out.phoneWhen = text(document.querySelector("#phone .pjwhen"));
    return out;
})();
</script>
