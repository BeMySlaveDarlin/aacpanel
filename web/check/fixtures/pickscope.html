<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// Where a pick goes, on a phone. A session on the stream takes a model or an
// effort for itself or saves it as the default too, and its scale ends in
// ultracode behind a dashed line wherever the model takes xhigh; a terminal
// saves every pick as the default and says so instead of offering a choice.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { pickSub } from "/src/screens/chat/picker.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const catalog = { state: "ok", models: [
    { id: "claude-opus-5-5", name: "Claude Opus 5.5" }, { id: "claude-fable-5-1", name: "Claude Fable 5.1" },
    { id: "claude-opus-5", name: "Claude Opus 5" }, { id: "claude-sonnet-5", name: "Claude Sonnet 5" },
    { id: "claude-fable-5", name: "Claude Fable 5" }, { id: "claude-opus-4-8", name: "Claude Opus 4.8" },
    { id: "claude-opus-4-7", name: "Claude Opus 4.7" }, { id: "claude-sonnet-4-6", name: "Claude Sonnet 4.6" },
    { id: "claude-opus-4-6", name: "Claude Opus 4.6" }, { id: "claude-haiku-4-5-20251001", name: "Claude Haiku 4.5" },
] };
const efforts = ["low", "medium", "high", "xhigh", "max"];
const listed = [
    { value: "default", resolved: "claude-opus-5-5[1m]", name: "Default (recommended)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "opus[1m]", resolved: "claude-opus-5-5[1m]", name: "Opus (1M context)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "claude-fable-5-1[1m]", resolved: "claude-fable-5-1", name: "Fable", description: "Fable 5.1 · Most capable for your hardest and longest-running tasks", efforts },
    { value: "sonnet", resolved: "claude-sonnet-5", name: "Sonnet", description: "Sonnet 5 · Efficient for routine tasks", efforts: ["low", "medium", "high"] },
    { value: "haiku", resolved: "claude-haiku-4-5-20251001", name: "Haiku", description: "Haiku 4.5 · Fastest for quick answers" },
];
const sent = [];
let transport = "stream";
let effortNow = "xhigh";
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/models")) {
        const session = transport === "stream"
            ? { transport, list: listed, mode: "auto", effort: effortNow, picked: "opus[1m]" }
            : { transport };
        return json({ state: "ok", session, catalog });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true, detail: "ok" });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "session.command", "session.set", "session.stop", "session.file"] };
const stream = { status: "idle", transport: "stream", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj",
    model: "claude-opus-5-5", effort: "xhigh", mode: "auto" };
const terminal = { ...stream, transport: "" };
const root = document.getElementById("root");
const show = (live, can = exec) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="atlas" id="s1" live=${live} exec=${can} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());
const sheet = () => document.querySelector(".sheet.on");
const rows = (sel = ".pklist .pkrow") => Array.from(sheet().querySelectorAll(sel));
const tap = async (el) => { el.click(); await sleep(250); };
const named = (list, name) => list.find((r) => r.querySelector(".pkname").textContent.trim() === name);

const labels = () => Array.from(sheet().querySelectorAll(".pkstop")).map((b) => b.getAttribute("aria-label"));
const stop = (name) => sheet().querySelector(`.pkstop[aria-label="${name}"]`);
const seg = (name) => Array.from(sheet().querySelectorAll(".pkseg")).find((b) => b.textContent.trim() === name);
const toastSub = () => text(".toast.on .tsub")[0] || "";
const close = async () => { document.querySelector(".sheet.on .sheetclose").click(); await sleep(300); };
const chip = (i) => document.querySelectorAll(".cstrip .pkchip")[i];

window.done = (async () => {
    show(stream);
    await sleep(400);
    const out = {};

    // The effort of a session on the stream: five levels and ultracode past them.
    await tap(chip(2));
    await sleep(200);
    out.stops = labels();
    const ultra = stop("Ultracode");
    out.ultraDashed = Boolean(ultra) && getComputedStyle(ultra).borderLeftStyle === "dashed";
    out.foot = text(".sheet.on .pkscalefoot")[0] || "";
    out.scope = text(".sheet.on .pkseg");
    out.scopeOn = text(".sheet.on .pkseg.on");
    out.notesAtSession = text(".sheet.on .pknote");
    await tap(ultra);
    out.ultraToast = toastSub();

    // Saved as the default: ultracode is off, and the sheet says why.
    await tap(seg("Default"));
    out.scopeOnAfter = text(".sheet.on .pkseg.on");
    out.ultraOff = stop("Ultracode").disabled;
    out.ultraTitle = stop("Ultracode").getAttribute("title");
    out.defaultNote = text(".sheet.on .pknote")[0] || "";
    await tap(stop("Max"));
    out.maxToast = toastSub();
    await tap(stop("High"));
    out.highToast = toastSub();

    // The model list keeps the choice of where a pick goes.
    await tap(sheet().querySelector(".pkback"));
    out.modelScopeOn = text(".sheet.on .pkseg.on");
    await tap(named(rows(), "Sonnet 5"));
    out.modelToast = toastSub();
    // A model that does not take xhigh has no ultracode.
    await tap(sheet().querySelector(".pkmore"));
    out.sonnetStops = labels();
    out.sonnetFoot = text(".sheet.on .pkscalefoot").length;
    await close();

    // A session already in ultracode says so on the strip and under the knob.
    effortNow = "ultracode";
    show({ ...stream, effort: "ultracode" });
    await sleep(300);
    out.ultraChip = chip(2).textContent.trim();
    await tap(chip(2));
    await sleep(200);
    const on = sheet().querySelector(".pkstop.on");
    out.ultraOn = on ? on.getAttribute("aria-label") : "";
    out.ultraHead = text(".sheet.on .pkheadval")[0] || "";
    out.ultraFoot = text(".sheet.on .pkscalefoot")[0] || "";
    await close();
    effortNow = "xhigh";

    // A terminal saves whatever is picked there as the default.
    transport = "console";
    show(terminal);
    await sleep(400);
    await tap(chip(2));
    await sleep(200);
    out.termScopes = sheet().querySelectorAll(".pkscope").length;
    out.termNote = text(".sheet.on .pknote")[0] || "";
    out.termStops = labels();
    await tap(stop("High"));
    out.termToast = toastSub();
    await tap(sheet().querySelector(".pkback"));
    out.termModelNote = text(".sheet.on .pknote")[0] || "";
    await close();

    out.sent = sent.map((b) => `${b.kind}:${JSON.stringify(b.params)}`);
    out.subs = [
        pickSub({ effort: "ultracode", scope: "session" }, "stream"),
        pickSub({ effort: "high", scope: "session" }, "stream"),
        pickSub({ effort: "high", scope: "default" }, "stream"),
        pickSub({ effort: "max", scope: "default" }, "stream"),
        pickSub({ model: "sonnet", scope: "default" }, "stream"),
        pickSub({ model: "sonnet" }, "console"),
        pickSub({ effort: "max" }, "console"),
        pickSub({ mode: "plan" }, "console"),
        pickSub({ mode: "plan" }, "stream"),
    ];
    return out;
})();
</script>
