<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<!-- The brief as a desk reads it: the document stands in the page of the
     desktop shell, which holds every other screen to a reading width of its
     own, and the shell's scale is in force. -->
<div class="shell deskshell" style="height:100vh;display:flex;flex-direction:column">
  <header class="dktop"><button class="dkbrand" type="button">host</button></header>
  <div class="dkbody">
    <aside class="dkleft"></aside>
    <section class="dkcenter dkchat" id="root"></section>
  </div>
</div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
import { h, render } from "preact";
import { Brief } from "/src/screens/brief.js";
import { Chat } from "/src/screens/chat.js";
import { until } from "/check/fixtures/pie.js";
import { Sheet } from "/src/ui/sheet.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

// The order of saves matters here; the debounce's wall time does not.
const timer = window.setTimeout;
window.setTimeout = (fn, ms, ...args) => timer(fn, ms === 900 ? 30 : ms, ...args);

const doc = {
    id: "at-the-desk",
    sessionId: "22222222-2222-4222-8222-222222222222",
    cwd: "/srv/proj",
    title: "Read at a desk",
    task: "Choose how the search moves to Postgres.",
    why: "The spare cluster costs more than its work.",
    context: [{ title: "The trial", text: "The results match." }],
    decisions: [
        { id: "d1", title: "Where the index lives", ask: "Choose the write path.", multi: false,
          options: [
              { key: "A", label: "Separate table", reason: "Search changes independently.", cost: "Maintain triggers", hours: 6, recommended: true },
              { key: "B", label: "Column on products", reason: "No synchronisation.", cost: "Rebuild pauses writes", hours: 3 },
          ] },
        { id: "d2", title: "When to switch", ask: "Choose the window.", multi: false,
          options: [
              { key: "A", label: "Today", reason: "Save the next bill.", cost: "Less observation", hours: 1 },
              { key: "B", label: "After a week", reason: "Observe the cycle.", cost: "Keep the cluster a week", hours: 2, recommended: true },
          ] },
    ],
};

let sent = "";
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.EventSource = class { addEventListener() {} close() {} };
window.fetch = counted(async (input, init) => {
    const u = typeof input === "string" ? input : input.url;
    const method = (init && init.method) || "GET";
    if (u === "/api/briefs/at-the-desk" && method === "GET") {
        return new Response(JSON.stringify({ brief: doc, draft: { answers: {} }, reply: "" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/at-the-desk" && method === "PUT") {
        return new Response(JSON.stringify({ ok: true, reply: "01 · A" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/at-the-desk/send" && method === "POST") {
        sent = u;
        return new Response(JSON.stringify({ ok: true, detail: "typed into lab" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u.startsWith("/api/chat?")) return json({ items: [{ role: "brief", id: doc.id, title: doc.title, decisions: 2, pos: 1, at: "2026-01-01T09:00:00Z" }], first: 1, last: 1, total: 1, state: {}, moreBefore: false });
    if (u === "/api/briefs") return json({ briefs: [{ id: doc.id, title: doc.title, decisions: 2, sessionId: doc.sessionId, cwd: doc.cwd }] });
    if (u === "/api/acts") return json({ acts: [] });
    if (u.startsWith("/api/term")) return json({ available: false });
    return json({});
});

// The snapshot is how the document finds the session its answers go into. The
// panel hands it down through the conversation; a screen that forgets to pass
// it leaves the send barred with nothing on screen to explain it.
const snapshot = { sessions: [{ session: "lab", sessionId: doc.sessionId, cwd: doc.cwd }] };
const exec = { available: true, kinds: ["session.send"] };

render(
    h(ToastHost, null, h(GateHost, null,
        h(Sheet, { open: true, onClose: () => {}, label: "brief", inner: true, doc: true },
            h(Brief, { id: "at-the-desk", snapshot, exec, onBack: () => {} })))),
    document.getElementById("root"));


window.done = (async () => {
    await quiet();
    const sheet = document.querySelector(".sheet.doc");
    const out = {
        // A document carries one way out — the arrow drawn inside it. The
        // handle and the cross belong to a sheet a person glances into.
        exits: sheet.querySelectorAll(":scope > .sheetclose, :scope > .grab, :scope > .sheetbody > .brief-decisions > .phead .pback").length,
        exitKinds: Array.from(sheet.querySelectorAll(":scope > .sheetclose, :scope > .grab, :scope > .sheetbody > .brief-decisions > .phead .pback")).map((n) => n.className).join(" | "),
        win: sheet.classList.contains("win"),
        doc: sheet.classList.contains("doc"),
        decisions: document.querySelectorAll(".brief-decisions .bdecision").length,
        task: document.querySelector(".btask")?.textContent || "",
    };
    const root = document.querySelector("#root");
    render(null, root);
    await quiet();
    const live = { session: "lab", sessionId: doc.sessionId, cwd: doc.cwd, transport: "stream", status: "idle",
        waiting: [{ kind: "brief", id: doc.id, title: doc.title, at: "2026-01-01T09:00:00Z", questions: 2 }] };
    render(h(ToastHost, null, h(GateHost, null, h(Chat, { name: "lab", id: doc.sessionId, live, snapshot, exec, onBack: () => {} }))), root);
    await until(() => document.querySelector(".actform .brief-decisions .brecommend"), "the brief in the move slot");
    out.inline = Boolean(document.querySelector(".chatfeed .actform .btask")) && Boolean(document.querySelector(".composer > textarea")) && !document.querySelector(".sheet.on");
    out.marker = document.querySelector(".briefmark")?.textContent || "";
    out.icon = document.querySelector('.movepill[data-kind="brief"] svg')?.outerHTML === document.querySelector(".bdecision-head svg")?.outerHTML;
    document.querySelector(".actform .brecommend").click();
    await until(() => !document.querySelector(".actform .bdecision-send").disabled, "the decision pick");
    document.querySelector(".briefmark .actmarker").click();
    await quiet();
    out.single = document.querySelectorAll(".brief-decisions").length === 1 && !document.querySelector(".sheet.on") && document.querySelectorAll(".actform .bdecision.decided").length === 2;
    document.querySelector(".actform .bdecision-send").click();
    await until(() => !document.querySelector(".actform"), "the move after sending");
    out.closed = !document.querySelector('.movepill[data-kind="brief"]') && Boolean(document.querySelector(".composer > textarea"));
    out.sent = sent;
    return out;
})();
</script>
