<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The read-only screens of what a session on the stream is set up with, opened
// by typing their commands in the composer: the panel answers each with its
// own screen and sends nothing. The rows are shaped as the service passes on
// what claude 2.1.282 answered on a real host.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARTS = {
    hooks: { hooks: {
        events: [{ name: "PreToolUse", summary: "Before tool execution", count: 2 },
                 { name: "PostToolBatch", summary: "After a batch of tool calls resolves", count: 1 }],
        hooks: [
            { event: "PreToolUse", matcher: "AskUserQuestion", source: "User settings (~/.claude/settings.json)",
              type: "command", label: "python3 /srv/agent/ask-hook.py", text: "python3 /srv/agent/ask-hook.py",
              textLabel: "Command", timeout: 5 },
            { event: "PreToolUse", source: "Plugin hooks", plugin: "hookify", type: "command",
              label: "Checking the rules", text: "node /home/u/.claude/plugins/hookify/rules.js --event pre", textLabel: "Command",
              disabled: true },
            { event: "PostToolBatch", source: "User settings (~/.claude/settings.json)", type: "command",
              label: "bash /home/u/atlas-scripts/prompt-stamp/prompt-stamp.sh PostToolBatch",
              text: "bash /home/u/atlas-scripts/prompt-stamp/prompt-stamp.sh PostToolBatch", textLabel: "Command" },
        ] } },
    memory: { memory: {
        auto: "on",
        files: [{ kind: "user", path: "/home/u/.claude/CLAUDE.md", label: "User instructions", description: "Saved in ~/.claude/CLAUDE.md" },
                { kind: "project", path: "/srv/proj/CLAUDE.md", label: "Project instructions", description: "Saved in ./CLAUDE.md", missing: true }],
        folders: [{ kind: "auto", path: "/home/u/.claude/projects/-srv-proj/memory/", label: "Open auto-memory folder" }],
        memories: [{ name: "MEMORY.md", modified: Date.now() - 3600e3 },
                   { name: "deploy.md", description: "How the stack is rolled out", type: "project", modified: Date.now() - 86400e3 }] } },
    skills: { skills: [
        { name: "pdf", description: "Read and fill PDF files.", source: "claude.ai sync", tokens: 150, state: "on" },
        { name: "cc-skills-golang:golang-cli", description: "Go command line applications.", source: "plugin", tokens: 180,
          state: "on", lockedBy: "plugin" },
        { name: "brief", description: "Publishes a brief to the panel.", source: "user", tokens: 262, state: "name-only" },
    ] },
    agents: { agents: [
        { name: "Explore", description: "Read-only search agent for broad fan-out searches.", model: "haiku" },
        { name: "pr-review-toolkit:code-reviewer", description: "Reviews code for adherence to project guidelines." },
    ] },
    config: { config: [
        { key: "language", value: "russian" },
        { key: "model", value: "opus[1m]" },
        { key: "statusLine", value: { type: "command", command: "~/statusline.sh" } },
        { key: "verbose", value: false },
    ] },
};

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
const sent = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/setup?")) {
        const part = new URL(u, location.href).searchParams.get("part");
        asked.push(part);
        return json({ state: "ok", transport: "stream", ...PARTS[part] });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true, detail: "ok" });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "session.command"] };
const stream = { status: "idle", transport: "stream", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj",
    model: "claude-opus-5-5", effort: "xhigh", mode: "auto",
    work: { agents: 1 } };
const root = document.getElementById("root");
const show = (live) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="atlas" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.replace(/\s+/g, " ").trim());
const type = async (value) => {
    const area = document.querySelector("textarea");
    area.value = value;
    area.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(150);
};
const open = async (command) => {
    await type(command);
    const send = document.querySelector(".composer .iconbtn.accent");
    const ready = Boolean(send) && !send.disabled;
    if (ready) send.click();
    await sleep(400);
    return ready;
};
const close = async () => {
    const x = document.querySelector(".sheet.on .sheetclose");
    if (x) x.click();
    await sleep(300);
};
const rowNamed = (words) => Array.from(document.querySelectorAll(".sheet.on .mcprow"))
    .find((r) => r.textContent.includes(words));

(async () => {
    const out = {};
    try {
    show(stream);
    await sleep(400);

    await type("/ho");
    out.hints = text(".slashhint");

    out.hooksReady = await open("/hooks");
    out.hooks = { title: text(".sheet.on .cmdhead")[0] || "", sum: text(".sheet.on .cmdsum")[0] || "",
        events: text(".sheet.on .mcprow") };
    rowNamed("PreToolUse").click();
    await sleep(200);
    out.hooks.event = text(".sheet.on .cmdhead")[0] || "";
    out.hooks.rows = text(".sheet.on .mcprow");
    out.hooks.off = document.querySelectorAll(".sheet.on .mcprow.stpoff").length;
    rowNamed("Checking the rules").click();
    await sleep(200);
    out.hooks.card = text(".sheet.on .cmdhead")[0] || "";
    out.hooks.facts = text(".sheet.on .mcpfacts li");
    out.hooks.code = text(".sheet.on .stpcode")[0] || "";
    await close();

    await open("/memory");
    out.memory = { sum: text(".sheet.on .cmdsum")[0] || "", heads: text(".sheet.on .cmdsechead > span:first-child"),
        rows: text(".sheet.on .stplist li") };
    await close();

    await open("/skills");
    out.skills = { sum: text(".sheet.on .cmdsum")[0] || "", rows: text(".sheet.on .mcprow") };
    const find = document.querySelector(".sheet.on .stpfind");
    find.value = "golang";
    find.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(150);
    out.skills.found = text(".sheet.on .mcprow");
    rowNamed("cc-skills-golang").click();
    await sleep(150);
    out.skills.opened = text(".sheet.on .stpdesc");
    await close();

    await open("/agents");
    out.agents = { title: text(".sheet.on .cmdhead")[0] || "", sum: text(".sheet.on .cmdsum")[0] || "",
        rows: text(".sheet.on .mcprow"), workList: Boolean(document.querySelector(".sheet.on .worklist, .sheet.on h2")) };
    await close();

    await open("/config");
    out.config = { rows: text(".sheet.on .stpconfig > li"), blocks: text(".sheet.on .stpconfig .stpcode") };
    await close();

    out.asked = asked;
    out.sent = sent.length;

    // In a console these are the client's own screens, driven by keys: the
    // composer says so and sends nothing.
    show({ ...stream, transport: "" });
    await sleep(300);
    await type("/hooks");
    out.consoleReady = !document.querySelector(".composer .iconbtn.accent").disabled;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    window.done = out;
})();
</script>
