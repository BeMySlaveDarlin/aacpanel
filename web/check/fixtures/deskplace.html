<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The desktop shell walked the way a person walks it: the first visit, a
// section and a conversation left open over a reload, the pages of the header
// closed back onto whatever they were opened over, and a kept place the shell
// no longer has. A reload is the shell taken down and started again: what it
// comes back to is only what it kept in storage.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { DesktopShell } from "/src/desktop/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const KEY = "aacpanel.desktop.place";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const past = {
    sessionId: "past-1", name: "gateway", cwd: "/srv/gateway", profile: "personal",
    project: { id: 42, name: "gateway", path: "/srv/gateway", group: "home" },
    model: "claude-opus-5", pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000,
    limit: 1000000, messages: 4, lastAt: "2026-09-14T09:00:00.000Z", startedAt: "2026-09-14T08:00:00.000Z",
};
const asked = [];
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        asked.push(new URL(u, location.href).searchParams.get("id") || "");
        return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [past], total: 1, limit: 24, offset: 0 });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u.startsWith("/api/profiles")) return json({ profiles: [] });
    if (u.startsWith("/api/devices")) return json({ devices: [], revoked: [], current: null });
    // Home draws usage it has not got: the widgets say so instead of reading
    // fields out of an empty answer.
    if (u.startsWith("/api/usage/")) return json({ error: "usage is not collected here" }, 503);
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const snapshot = { at: 1, sessions: [{ session: "aacpanel", sessionId: "live-1", status: "busy", transport: "stream",
    pct: 20, tokens: 200000, limit: 1000000, cwd: "/srv/proj", model: "claude-opus-5-5", profile: "personal" }] };
const root = document.getElementById("root");
const waits = { opening: () => [], of: () => null };
const alerts = { kind: "ready", alerts: [], older: [], reload: () => {} };

const show = (jump) => render(h(ToastHost, null, h(GateHost, null, html`<${DesktopShell} snapshot=${snapshot}
    tree=${{ stacks: [], running: 0, total: 0 }} treeError=${null} hostError=${null} ageSec=${1} history=${[]} faults=${[]}
    alerts=${alerts} openAlerts=${0} exec=${exec} onRefresh=${() => {}} wait=${waits}
    theme="space" onTheme=${() => {}} updateReady=${false} updating=${false} onApplyUpdate=${() => {}}
    route=${{ here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }}
    jump=${jump} onJumped=${() => {}} />`)), root);
// A reload comes a while after the last press: by then the shell has written
// down where it stands, and the page is only taken down after that.
const reload = async () => {
    await until(() => {
        const k = kept();
        return k && k.section === here();
    });
    render(null, root);
    asked.length = 0;
    show(null);
};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await sleep(30);
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const SECTIONS = ["Sessions", "Containers", "Machine", "Devices"];
// here names what the header lights: home, a section, or the alerts bell.
const here = () => {
    if (document.querySelector(".dktop .dklogo.on")) return "home";
    const lit = Array.from(document.querySelectorAll(".dktop .dkib.on")).map((b) => b.getAttribute("aria-label") || "");
    const got = lit.find((label) => SECTIONS.includes(label) || label.startsWith("Alerts"));
    return got ? got.split(",")[0].toLowerCase() : "";
};
// A press on what is not there is left for the test to see in the stops
// that follow, rather than breaking the walk halfway.
const tap = (el) => el && el.click();
const press = (label) => tap(document.querySelector(`.dktop [aria-label="${label}"]`));
const page = () => text(document.querySelector(".dkpage .phead h2"));
const back = () => tap(document.querySelector(".dkpage .pback"));
const talk = () => Boolean(document.querySelector(".dkchat"));
const kept = () => JSON.parse(localStorage.getItem(KEY) || "null");
// over stands on a section and opens the pages of the header on top of it,
// one from the other.
const over = async (section, ...pages) => {
    press(section);
    await until(() => here() === section.toLowerCase());
    for (const name of pages) {
        press(name);
        await until(() => page() === name);
    }
};
// seen waits for the shell to settle on a section and reports it together
// with the page and the conversation drawn there.
const seen = async (want) => {
    await until(() => here() === want);
    return { here: here(), page: page(), chat: talk() };
};

window.done = (async () => {
    const out = {};
    try {
        localStorage.removeItem(KEY);
        show(null);
        out.first = await seen("home");
        out.first.head = text(document.querySelector(".dkcenter .dkheadname"));
        out.briefsButton = Boolean(document.querySelector('.dktop [aria-label="Briefs"]'));

        press("Containers");
        await until(() => here() === "containers");
        await reload();
        out.reloadSection = await seen("containers");

        // A page of the header over a section closes back onto that section,
        // and so does one opened from another page. Every walk starts from its
        // own section, so one wrong way back does not move the next walk.
        await over("Containers", "Alerts");
        back();
        out.alertsBack = await seen("containers");
        await over("Containers", "Devices");
        back();
        out.devicesBack = await seen("containers");
        await over("Containers", "Devices", "Alerts");
        back();
        out.pageOverPageBack = await seen("containers");

        // A reload on a page keeps the page and its way back.
        await over("Containers", "Alerts");
        await reload();
        out.reloadPage = await seen("alerts");
        back();
        out.reloadPageBack = await seen("containers");

        // A conversation, opened the way a push opens it, stays open over a
        // reload and under the pages opened from it.
        render(null, root);
        show({ name: "aacpanel", id: "live-1" });
        await until(() => talk() && document.querySelector(".dkchat textarea"));
        await reload();
        out.reloadChat = await seen("sessions");
        out.reloadChat.asked = await until(() => asked.join(","));
        out.reloadChat.composer = Boolean(await until(() => document.querySelector(".dkchat textarea")));
        await over("Sessions", "Alerts");
        back();
        out.chatAlertsBack = await seen("sessions");

        // A closed conversation from the archive is kept by its name and id;
        // the archive row it was drawn from is not.
        press("Sessions");
        await until(() => here() === "sessions");
        press("Session archive");
        tap(await until(() => document.querySelector(".dkarch")));
        await until(() => kept() && kept().chat && kept().chat.id === "past-1");
        out.keptArchived = (kept() || {}).chat || null;
        await reload();
        out.reloadArchived = await seen("sessions");
        out.reloadArchived.asked = await until(() => asked.join(","));

        // A kept section the shell does not have, and a kept value that is not
        // a place at all, both open home.
        for (const [name, value] of [["unknownSection", JSON.stringify({ section: "briefs", from: "", chat: null })], ["garbage", "{not json"]]) {
            render(null, root);
            localStorage.setItem(KEY, value);
            show(null);
            out[name] = await seen("home");
        }
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
