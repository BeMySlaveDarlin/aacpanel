// Taking a stuck worker off a device: what the panel put in the caches goes,
// what belongs to anything else stays, and the two versions are read the way
// the settings screen reads them.
import * as pwa from "/src/pwa.js";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

window.done = (async () => {
    const out = {};

    // A worker registered here is what scrub has to take off. The one shipped
    // in /dist is the panel's own, and its scope is the directory it sits in.
    try {
        await navigator.serviceWorker.register("/dist/sw.js", { scope: "/dist/" });
        await sleep(300);
        out.registered = (await navigator.serviceWorker.getRegistrations()).length;
    } catch (err) {
        out.registerError = String(err.message || err);

        const cache = await caches.open(name);
        await cache.put("/kept", new Response("kept"));
    }
    out.before = (await caches.keys()).sort();

    out.runningWithoutWorker = await pwa.runningVersion();

})();
