<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="app"></div>
<script type="module">
// The home screen of the desk: the galaxy of the sessions on top and the four
// tiles of the period under one switch. Three contours are three systems;
// their projects are orbits in the order of the map, a session of no project
// stands on an orbit outside them, and the sessions a session opened are its
// moons, a grandchild a moon of the moon. Where the graph puts a session is
// asked of its own pure functions, and the page then points, clicks and
// right-clicks at that place on the canvas as a person would — the tip, the
// session opened as its row opens it, the menu of its row, a star brought
// forward by a click or by the wheel with Shift. What the graph
// draws is counted by the clears of its canvas: nothing while nothing
// changes, frame after frame only while it turns by itself and the page is
// seen. The system here asks for less motion, so the turn starts off.
//
// The picture is handled as a map: the page drags it, turns it with Shift
// and the middle button, scales it with the wheel, and reads where the graph
// wrote each name in its last frame — a name rides with its mark through a
// move and a zoom.
import { h, render } from "preact";
import { useEffect, useRef } from "preact/hooks";
import { html } from "/src/html.js";
import { Home, PERIOD } from "/src/desktop/home.js";
import { MenuHost } from "/src/desktop/menu.js";
import { attachTips } from "/src/desktop/tip.js";
import { graphOf, lensOf, orbitsIn, orderOf, placesOf, sceneOf } from "/src/desktop/orbits/orbits.js";
import { HOME, IDLE, MOONS, TAU, TURN, ZOOM, add, at, camera, inclined, onOrbit, spinOf, turnBy, worldOf } from "/src/desktop/orbits/space.js";
import { drawScene, spritesMade } from "/src/desktop/orbits/scene.js";
import { periodRange } from "/src/data/usage.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

// Less motion, as the desk of the machine asks for, until the page says
// otherwise; every other query as is.
const REDUCE = "(prefers-reduced-motion: reduce)";
let lessMotion = true;
const plainMedia = window.matchMedia.bind(window);
window.matchMedia = (q) => (q === REDUCE
    ? { matches: lessMotion, media: q, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {} }
    : plainMedia(q));

// The draws of the graph, counted where they start: a frame clears the canvas.
// And the words it wrote in its last frame, where it wrote them.
let draws = 0;
let written = new Map();
let times = new Map();
const onGraph = (ctx) => ctx.canvas.closest && ctx.canvas.closest(".dkorbstage");
const clear = CanvasRenderingContext2D.prototype.clearRect;
CanvasRenderingContext2D.prototype.clearRect = function (...args) {
    if (onGraph(this)) {
        draws += 1;
        written = new Map();
        times = new Map();
    }
    return clear.apply(this, args);
};
const fillText = CanvasRenderingContext2D.prototype.fillText;
CanvasRenderingContext2D.prototype.fillText = function (t, x, y, ...rest) {
    if (onGraph(this)) {
        written.set(t, { x, y });
        times.set(t, (times.get(t) || 0) + 1);
    }
    return fillText.call(this, t, x, y, ...rest);
};

// A whole second, as the snapshot counts its time.
const now = Math.floor(Date.now() / 1000) * 1000;
const iso = (min) => new Date(now - min * 60e3).toISOString();
const S = (o) => ({ transport: "stream", model: "claude-opus-5-5", limit: 1000000, limitKnown: true, startedAt: iso(300),
    pct: 20, tokens: 200000, sessionId: `id-${o.session}`, cwd: `/srv/${o.session}`, ...o });
// The map: a project in personal, two in client — drafts before blog — and
// one in lab. The service names the project of every live session.
const P = (id, name, group) => ({ id, name, session: name, path: `/srv/${name}`, group });
const shopP = P(11, "shop", "Side");
const draftsP = P(21, "drafts", "Work");
const blogP = P(22, "blog", "Work");
const benchP = P(31, "bench", "Lab");
const profileMap = [
    { id: 3, profile: "personal", default: true, groups: [{ name: "Side", projects: [shopP] }] },
    { id: 4, profile: "client", groups: [{ name: "Work", projects: [draftsP, blogP] }] },
    { id: 5, profile: "lab", groups: [{ name: "Lab", projects: [benchP] }] },
];
const sessions = [
    S({ session: "shop", profile: "personal", project: shopP, status: "busy", lastRequestAt: iso(1), work: { agents: 1, tasks: 1 } }),
    S({ session: "blog", profile: "client", project: blogP, status: "waiting", lastRequestAt: iso(60), pct: 52 }),
    S({ session: "notes", profile: "client", project: blogP, status: "idle", lastRequestAt: iso(60), pct: 74 }),
    S({ session: "draft", profile: "client", project: draftsP, status: "idle", lastRequestAt: null, startedAt: iso(5) }),
    S({ session: "stray", profile: "personal", project: null, status: "idle", lastRequestAt: null, startedAt: null }),
    // A thread blog opened in the directory of another project: blog's moon.
    S({ session: "codex-1", profile: "client", project: draftsP, agent: "codex", title: "cx-thread", status: "busy",
        lastRequestAt: iso(2), parent: { session: "blog" } }),
    S({ session: "deep", profile: "client", project: null, status: "idle", lastRequestAt: iso(20), parent: { session: "codex-1" } }),
    S({ session: "bench-1", profile: "lab", project: benchP, status: "idle", lastRequestAt: iso(30) }),
];
let snapshot = { at: Math.floor(now / 1000), hostName: "helios", sessions, profileMap,
    host: { cpuPct: 7, mem: { pct: 41 }, uptime: 200000 } };
const tree = { running: 2, total: 3, stacks: [{ name: "shop", running: 2, total: 3, containers: [] }] };
const exec = { available: true, kinds: ["session.close", "session.restart", "session.stop", "session.switch",
    "session.rename", "window.open", "window.close"] };
const wait = { opening: () => [], of: () => null };

// The fake host: the usage of every period, each request kept.
const usageAsked = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url) => {
    const u = new URL(String(url), location.href);
    if (u.pathname.startsWith("/api/usage/")) {
        const kind = u.pathname.slice("/api/usage/".length);
        if (kind === "scan") return json({ available: true, scannedAt: Math.floor(now / 1000) - 60, files: 3, state: { running: false } });
        usageAsked.push({ kind, from: u.searchParams.get("from") || "", step: u.searchParams.get("step") || "" });
        if (kind === "summary") return json({ inbound: 1000, hit: 0.9, subShareIn: 0.3, subShareOut: 0.2,
            summary: { output: 10, answers: 3, cacheRead: 900, cacheCreation: 50, agents: 2, kinds: 1 } });
        if (kind === "series") return json({ points: [{ at: iso(30), inbound: 40, output: 4 }, { at: iso(90), inbound: 60, output: 6 }] });
        if (kind === "breakdown") return json({ rows: [{ key: "/srv/shop", label: "shop", contour: "personal", inbound: 500,
            output: 5, answers: 2, sessions: 1, hit: 0.9 }] });
        if (kind === "models") return json({ models: [{ model: "claude-opus-5-5", inbound: 900, output: 9, answers: 3, hit: 0.9 }] });
        if (kind === "tools") return json({ top: [{ tool: "Bash", calls: 10, errors: 1 }], calls: 10, errors: 1, restNames: 0, restCalls: 0 });
    }
    if (u.pathname === "/api/session/switch") return json({ to: "console" });
    if (u.pathname === "/api/session/window") return json({ state: "closed" });
    return new Response("", { status: 404 });
});
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const opened = [];
const sections = [];
function Shell({ snap }) {
    const shell = useRef(null);
    const tip = useRef(null);
    useEffect(() => attachTips(shell.current, tip.current), []);
    return html`
        <div class="deskshell" ref=${shell}>
            <${MenuHost}>
                <div class="dktip" ref=${tip} role="tooltip"></div>
                <div class="dkbody full">
                    <${Home} snapshot=${snap} tree=${tree} exec=${exec} wait=${wait} theme="space"
                        onSection=${(id) => sections.push(id)} onSession=${(t) => opened.push(t)} onTerm=${null} />
                </div>
            <//>
        </div>
    `;
}
const show = () => render(h(ToastHost, null, h(GateHost, null, h(Shell, { snap: snapshot }))), document.getElementById("app"));

// The page's own clock is the fixture's. A frame the fixture waits for comes
// at once, a sixtieth of a second later in the page's time, so a glide or a
// second and a half of turning takes the frames it takes and not the wall
// clock's wait; a frame the page asks for while the fixture waits on
// something else comes with the browser's own frame, so a page left turning
// does not spin. The fixture's own deadlines keep the wall clock, and what
// the browser delivers on its real frames — an intersection seen — is waited
// for on them.
const wall = { now: performance.now.bind(performance), frame: window.requestAnimationFrame.bind(window) };
let clock = wall.now();
const due = new Map();
let framesAsked = 0;
let onScreen = false;
const tick = () => {
    clock += 1000 / 60;
    const now = [...due.values()];
    due.clear();
    for (const cb of now) cb(clock);
};
const pump = new MessageChannel();
pump.port1.onmessage = tick;
window.requestAnimationFrame = (cb) => {
    framesAsked += 1;
    due.set(framesAsked, cb);
    if (!onScreen) {
        onScreen = true;
        wall.frame(() => {
            onScreen = false;
            if (due.size > 0) tick();
        });
    }
    return framesAsked;
};
window.cancelAnimationFrame = (id) => { due.delete(id); };
performance.now = () => clock;
const wallFrames = async (n) => { for (let i = 0; i < n; i++) await new Promise((r) => wall.frame(() => r())); };
// The choice of Motion a run before this one, or another page, left behind.
const MOTION_KEY = "aacpanel.desktop.motion";
localStorage.removeItem(MOTION_KEY);
show();

const frame = () => new Promise((r) => {
    framesAsked += 1;
    due.set(framesAsked, () => r());
    pump.port2.postMessage(0);
});
const frames = async (n) => { for (let i = 0; i < n; i++) await frame(); };
const until = async (fn, ms = 3000) => {
    const end = wall.now() + ms;
    while (wall.now() < end) {
        const got = fn();
        if (got) return got;
        await frame();
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const stage = () => document.querySelector(".dkorbstage");
const tipText = () => text(document.querySelector(".dkorbtip"));
const tipLines = () => Array.from(document.querySelectorAll(".dkorbtip > *")).map(text);
const menuNode = () => document.querySelector(".ctxmenu");

// spotOf is where the graph's own functions put a session on the canvas, in
// the coordinates of the window, for the home view with front in front —
// the liveliest when the page opens. starOf is the same for the star of a
// contour.
const viewOf = (front, order) => {
    const box = stage().getBoundingClientRect();
    const g = graphOf(snapshot);
    const ord = order || orderOf(g);
    const places = placesOf(g, ord, front || ord[0]);
    const pr = camera(HOME, box.width, box.height, lensOf(g, box.width, box.height));
    const win = (q) => ({ x: box.left + q.x, y: box.top + q.y });
    return { g, places, pr, win };
};
const spotOf = (name, front, order) => {
    const { g, places, pr, win } = viewOf(front, order);
    const n = g.nodes.find((x) => x.s.session === name);
    return win(pr(worldOf(places.get(n.p.system), n.p.w)));
};
const starOf = (contour, front, order) => {
    const { places, pr, win } = viewOf(front, order);
    return win(pr(places.get(contour).c));
};
const pointer = (type, p, extra = {}) => {
    const ev = new PointerEvent(type, { bubbles: true, cancelable: true, clientX: p.x, clientY: p.y,
        pointerType: "mouse", pointerId: 1, button: 0, buttons: type === "pointerup" ? 0 : 1, ...extra });
    stage().dispatchEvent(ev);
    return ev;
};
const press = async (p) => {
    pointer("pointerdown", p);
    pointer("pointerup", p);
    await frame();
};
const rightClick = (p) => {
    stage().dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 2, buttons: 2,
        clientX: p.x, clientY: p.y, pointerType: "mouse" }));
    const ev = new PointerEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, buttons: 2,
        clientX: p.x, clientY: p.y, pointerType: "mouse" });
    stage().dispatchEvent(ev);
    return ev;
};

window.done = (async () => {
    await document.fonts.ready;
    await until(() => stage() && document.querySelectorAll(".dkhmgrid .usrow").length > 0);
    await quiet();
    const out = {};

    // The systems, their orbits and their moons, from the graph's own
    // functions.
    const g = graphOf(snapshot);
    const node = (name) => g.nodes.find((x) => x.s.session === name);
    out.systems = g.systems.map((sys) => ({ name: sys.name, live: sys.live, summary: sys.summary,
        orbits: sys.orbits.map((o) => ({ key: o.key, name: o.name, label: Boolean(o.label),
            planets: o.planets.map((p) => p.key) })) }));
    const moonOf = (child) => {
        const kid = node(child).p;
        return { depth: kid.depth, parent: kid.parent, system: kid.system };
    };
    out.moon = moonOf("codex-1");
    out.grandchild = moonOf("deep");
    out.orbitOf = Object.fromEntries(g.nodes.map((n) => [n.s.session, n.orbit]));
    out.notes = node("blog").note;
    // draft has asked nothing yet and counts from its start; stray names
    // neither and counts a day.
    out.notesOf = { draft: node("draft").note, stray: node("stray").note };

    // The orbits of a contour go out by weight — the small and quiet inside,
    // the large and lively outside — and turn as the planets of a sun do. The
    // map has big, pair, solo and late in that order; big holds four sessions
    // and a moon with a moon of its own, pair two, solo one, and late one that
    // waits.
    {
        const Q = (id, name) => ({ id, name, session: name, path: `/srv/${name}`, group: "Work" });
        const bigP = Q(41, "big");
        const pairP = Q(42, "pair");
        const soloP = Q(43, "solo");
        const lateP = Q(44, "late");
        const W1 = (session, project, status, min, parent) => S({ session, profile: "work", project, status,
            lastRequestAt: iso(min), parent: parent ? { session: parent } : undefined });
        const work = (extra = [], later = 0) => ({ at: Math.floor(now / 1000) + later * 60, sessions: [
            ...["b1", "b2", "b3", "b4"].map((n, i) => W1(n, bigP, "idle", 10 + i * 7)),
            W1("m1", null, "idle", 12, "b1"),
            W1("m2", null, "idle", 14, "m1"),
            W1("p1", pairP, "idle", 40),
            W1("p2", pairP, "idle", 45),
            W1("s1", soloP, "idle", 300),
            W1("l1", lateP, "waiting", 3),
            ...extra,
        ], profileMap: [{ id: 9, profile: "work", default: true, groups: [{ name: "Work", projects: [bigP, pairP, soloP, lateP] }] }] });
        const keys = (gr) => gr.systems[0].orbits.map((o) => o.key);
        const gw = graphOf(work());
        const sys = gw.systems[0];
        const before = orbitsIn(gw);
        const later = graphOf(work([W1("b5", bigP, "idle", 60)], 10), before);
        out.weights = {
            order: keys(gw),
            weights: Object.fromEntries(sys.orbits.map((o) => [o.key, o.weight])),
            // solo gains a session and weighs as pair does.
            tieFresh: keys(graphOf(work([W1("s2", soloP, "idle", 200)]))),
            tieKept: keys(graphOf(work([W1("s2", soloP, "idle", 200)]), before)),
            later: keys(later),
            // solo gains three at work and outweighs big.
            reordered: keys(graphOf(work(["s2", "s3", "s4"].map((n) => W1(n, soloP, "busy", 1))), before)),
        };
        // The orbits turn as the planets of a sun do: solo, pair and big idle,
        // late waits; the moons of b1 round it, and of m1 round m1.
        const inner = sys.orbits[0].R;
        const orb = (key) => sys.orbits.find((o) => o.key === key);
        const nd = (k) => gw.nodes.find((n) => n.s.session === k).p;
        out.spins = {
            turn: TURN,
            innerTurn: Math.round(TAU / spinOf(inner, inner, true)),
            orbits: sys.orbits.map((o) => ({ key: o.key, R: o.R, spin: o.spin, idleSpin: spinOf(o.R, inner, false),
                liveSpin: spinOf(o.R, inner, true) })),
            moons: { big: orb("p41").spin, b1: nd("b1").spin, m1: nd("m1").spin },
        };
        // A moon at work stirs the orbit of its planet as a planet at work would.
        const stirred = graphOf({ ...work(), sessions: work().sessions.map((x) => (x.session === "m1" ? { ...x, status: "busy" } : x)) });
        const big = stirred.systems[0].orbits.find((o) => o.key === "p41");
        out.spins.stirred = big.spin / spinOf(big.R, stirred.systems[0].orbits[0].R, true);
        // Ten seconds of turning move every planet and every moon by its spin.
        const turns = new Map();
        turnBy(gw, turns, 10);
        const off = (u, v) => Math.max(...u.map((x, i) => Math.abs(x - v[i])));
        out.spins.offBy = Math.max(
            ...sys.orbits.flatMap((o) => o.planets.map((n) => off(n.w, onOrbit(o, n.ang + o.spin * 10)))),
            off(nd("m1").w, add(nd("b1").w, inclined(nd("b1").lean, at(nd("m1").ang + nd("b1").spin * 10, nd("b1").orbit)))),
            off(nd("m2").w, add(nd("m1").w, inclined(nd("m1").lean, at(nd("m2").ang + nd("m1").spin * 10, nd("m1").orbit)))));
        out.spins.kept = turns.size;
    }

    // The galaxy, as the page opens: the liveliest nearest; an orbit says its
    // project only where its planets do not.
    out.order = orderOf(g);
    {
        const { places, pr } = viewOf();
        const depths = g.systems.map((sys) => ({ name: sys.name, z: pr(places.get(sys.name).c).z }));
        out.galaxy = { nearest: depths.sort((a, b) => a.z - b.z)[0].name };
        out.written = { blog: times.get("blog") || 0, drafts: times.get("drafts") || 0, outside: times.get("outside the map") || 0,
            shop: times.get("shop") || 0, client: times.get("client") || 0,
            helper: times.get("codex · blog") || 0, thread: times.get("cx-thread") || 0,
            counts: [...times.keys()].filter((t) => /^\d+ sessions?\b/.test(t)).length };
    }

    // The header carries what the tile of the sessions said, and that tile is
    // gone: the rows beside the graph are the containers and the machine.
    out.head = text(document.querySelector(".dkorbhead .dkorbnote"));
    out.titles = Array.from(document.querySelectorAll(".dkhm .uwgtitle, .dkhm .dkorbtitle")).map(text);
    out.jumps = Array.from(document.querySelectorAll(".dkhmjump .dkhmjumplabel b")).map(text);
    document.querySelectorAll(".dkhmjump")[1].click();
    out.sections = sections.slice();

    // The tip names the session under the pointer, and none stands over the
    // empty dial.
    pointer("pointermove", spotOf("blog"), { buttons: 0 });
    await until(() => tipText());
    out.tip = tipLines();
    const box = stage().getBoundingClientRect();
    pointer("pointermove", { x: box.left + 6, y: box.top + 6 }, { buttons: 0 });
    await until(() => !tipText());
    out.tipAway = tipText();

    // A click on a mark opens its session as the row does; a drag turns the
    // scene and opens nothing; Reset view brings the marks back.
    await press(spotOf("blog"));
    out.clicked = opened.slice();
    const from = spotOf("notes");
    pointer("pointerdown", from);
    pointer("pointermove", { x: from.x + 90, y: from.y + 30 });
    pointer("pointermove", { x: from.x + 180, y: from.y + 60 });
    pointer("pointerup", { x: from.x + 180, y: from.y + 60 });
    await frames(2);
    out.afterDrag = opened.length;
    await press(spotOf("notes"));
    out.oldSpotAfterDrag = opened.slice(out.afterDrag).map((t) => t.name);
    Array.from(document.querySelectorAll(".dkorbbtn")).find((b) => text(b) === "Reset view").click();
    await frames(2);
    const before = opened.length;
    await press(spotOf("notes"));
    out.afterReset = opened.slice(before).map((t) => t.name);


    // The picture is handled as a map. NAMES pairs a session with the name the
    // graph writes for it, and the name its tip says where that is another —
    // the thread of codex blog opened is written as blog's helper; a name's
    // offset from its mark at the home view tells where the mark stands later,
    // while the name keeps its side. The names are those of the system in
    // front, which are always written.
    await quiet();
    const NAMES = [["blog", "blog"], ["notes", "notes"], ["draft", "draft"], ["codex-1", "codex · blog", "cx-thread"], ["deep", "deep"]];
    const local = (p) => ({ x: p.x - box.left, y: p.y - box.top });
    const names = () => Object.fromEntries(NAMES.map(([, n]) => [n, written.get(n) ? { ...written.get(n) } : null]));
    const marks0 = Object.fromEntries(NAMES.map(([s, n]) => [n, local(spotOf(s))]));
    const names0 = names();
    // Where each name stands beside its mark at the home view, as it stands now.
    const besides = () => {
        const seen = names();
        return Object.fromEntries(NAMES.map(([, n]) => [n, { x: seen[n].x - marks0[n].x, y: seen[n].y - marks0[n].y }]));
    };
    const beside = besides();
    const apart = (a, b) => Math.max(...NAMES.map(([, n]) => Math.hypot(a[n].x - b[n].x, a[n].y - b[n].y)));
    const shifted = (a, b, dx, dy) => Math.max(...NAMES.map(([, n]) => Math.hypot(b[n].x - a[n].x - dx, b[n].y - a[n].y - dy)));
    const resetView = async () => {
        Array.from(document.querySelectorAll(".dkorbbtn")).find((b) => text(b) === "Reset view").click();
        await quiet();
    };
    const tipAt = async (p) => {
        pointer("pointermove", p, { buttons: 0 });
        await frames(2);
        // A system behind taken whole says its name too; tipAt asks for the
        // mark itself under the point.
        const name = text(document.querySelector(".dkorbtip:not([data-on=system]) b"));
        pointer("pointermove", { x: box.left + 6, y: box.top + 6 }, { buttons: 0 });
        await frames(1);
        return name;
    };
    const g2 = {};
    out.gestures = g2;
    out.help = text(document.querySelector(".dkorbhelp"));
    out.legend = Array.from(document.querySelectorAll(".dkorbleg > span:not(.dkorbhelp)")).map(text);

    // A drag moves the picture, every name with its mark; a press that
    // travelled opens nothing, even on a mark.
    const corner = { x: box.left + 6, y: box.top + 6 };
    pointer("pointerdown", corner);
    pointer("pointermove", { x: corner.x + 30, y: corner.y + 12 });
    pointer("pointermove", { x: corner.x + 60, y: corner.y + 25 });
    await frames(2);
    g2.panDuring = shifted(names0, names(), 60, 25);
    pointer("pointerup", { x: corner.x + 60, y: corner.y + 25 });
    await quiet();
    g2.panAfter = shifted(names0, names(), 60, 25);
    const blogNow = { x: spotOf("blog").x + 60, y: spotOf("blog").y + 25 };
    g2.panTip = await tipAt(blogNow);
    // The picture follows the press, so the mark it started on is under the
    // pointer again where it is let go.
    let count = opened.length;
    pointer("pointerdown", blogNow);
    pointer("pointermove", { x: blogNow.x + 20, y: blogNow.y + 30 });
    await frames(2);
    pointer("pointerup", { x: blogNow.x + 20, y: blogNow.y + 30 });
    await quiet();
    g2.pressAfterPan = opened.length - count;
    // Reset view brings the picture back from where the two moves left it,
    // every name with its mark.
    const moved = names();
    await resetView();
    g2.resetPan = shifted(moved, names(), -80, -55);
    // A move that takes a name over the edge leaves it there while it goes on:
    // the name rides with its mark, and is placed again once the move ends.
    const base = names();
    const sidesNow = besides();
    const [, edge] = NAMES.find(([, n]) => sidesNow[n].x < -10);
    const far = 30 - marks0[edge].x;
    pointer("pointerdown", corner);
    pointer("pointermove", { x: corner.x + far / 2, y: corner.y });
    pointer("pointermove", { x: corner.x + far, y: corner.y });
    await frames(2);
    g2.panEdge = { name: edge, off: shifted(base, names(), far, 0), during: names()[edge].x };
    pointer("pointerup", { x: corner.x + far, y: corner.y });
    await quiet();
    g2.panEdge.after = names()[edge].x;
    await resetView();

    // The wheel scales the picture round the pointer and is the graph's: the
    // page does not scroll under it. The mark under the pointer stays, every
    // other one goes out from it, and every name rides with its mark.
    const m = spotOf("blog");
    const ml = local(m);
    const at0 = besides();
    const markOf = (seen, n) => ({ x: seen[n].x - at0[n].x, y: seen[n].y - at0[n].y });
    const wheel300 = new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: -300, deltaMode: 0, clientX: m.x, clientY: m.y });
    stage().dispatchEvent(wheel300);
    g2.wheelPrevented = wheel300.defaultPrevented;
    await frames(2);
    const zoomed = names();
    const mark = (n) => markOf(zoomed, n);
    g2.zoomBy = Math.hypot(mark("draft").x - mark("notes").x, mark("draft").y - mark("notes").y)
        / Math.hypot(marks0.draft.x - marks0.notes.x, marks0.draft.y - marks0.notes.y);
    g2.zoomKept = Math.hypot(mark("blog").x - ml.x, mark("blog").y - ml.y);
    g2.zoomOff = Math.max(...NAMES.map(([, n]) => Math.hypot(
        mark(n).x - (ml.x + g2.zoomBy * (marks0[n].x - ml.x)), mark(n).y - (ml.y + g2.zoomBy * (marks0[n].y - ml.y)))));
    await quiet();
    // And out: the picture shrinks round the pointer and the names crowd, and
    // still every name rides with its mark while the wheel turns.
    await resetView();
    const at1 = besides();
    stage().dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: 300, deltaMode: 0, clientX: m.x, clientY: m.y }));
    await frames(2);
    const shrunk = names();
    const small = (n) => ({ x: shrunk[n].x - at1[n].x, y: shrunk[n].y - at1[n].y });
    const by = Math.hypot(small("draft").x - small("notes").x, small("draft").y - small("notes").y)
        / Math.hypot(marks0.draft.x - marks0.notes.x, marks0.draft.y - marks0.notes.y);
    g2.zoomOutBy = by;
    g2.zoomOutOff = Math.max(...NAMES.map(([, n]) => Math.hypot(
        small(n).x - (ml.x + by * (marks0[n].x - ml.x)), small(n).y - (ml.y + by * (marks0[n].y - ml.y)))));
    await quiet();
    await resetView();
    // The zoom stops at its bounds, in and out.
    const toward = (n, k) => ({ x: m.x + k * (marks0[n].x + box.left - m.x), y: m.y + k * (marks0[n].y + box.top - m.y) });
    stage().dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: -100000, clientX: m.x, clientY: m.y }));
    await quiet();
    g2.zoomIn = { bound: ZOOM[1], tip: await tipAt(toward("codex · blog", ZOOM[1])) };
    stage().dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: 100000, clientX: m.x, clientY: m.y }));
    await quiet();
    g2.zoomOut = { bound: ZOOM[0], tip: await tipAt(toward("draft", ZOOM[0])) };
    await resetView();

    // Shift and a drag turn the scene, as the middle button does: the names
    // part from one another, not only slide.
    const unturned = names();
    pointer("pointerdown", corner, { shiftKey: true });
    for (let i = 1; i <= 50; i++) {
        pointer("pointermove", { x: corner.x + 3 * i, y: corner.y }, { shiftKey: true });
        await frames(2);
    }
    const turned = names();
    pointer("pointerup", { x: corner.x + 150, y: corner.y }, { shiftKey: true });
    await quiet();
    g2.turnApart = shifted(unturned, turned, turned.blog.x - unturned.blog.x, turned.blog.y - unturned.blog.y);
    count = opened.length;
    await resetView();
    const unmiddled = names();
    const middle = new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 1, buttons: 4,
        clientX: corner.x, clientY: corner.y, pointerType: "mouse", pointerId: 1 });
    stage().dispatchEvent(middle);
    g2.middlePrevented = middle.defaultPrevented;
    pointer("pointermove", { x: corner.x + 60, y: corner.y }, { buttons: 4 });
    await frames(2);
    const middled = names();
    pointer("pointerup", { x: corner.x + 60, y: corner.y }, { button: 1 });
    await quiet();
    g2.middleApart = shifted(unmiddled, middled, middled.blog.x - unmiddled.blog.x, middled.blog.y - unmiddled.blog.y);

    // Reset view brings back the turn, the place and the scale: every mark is
    // where the home view puts it.
    pointer("pointerdown", corner);
    pointer("pointermove", { x: corner.x + 80, y: corner.y + 40 });
    pointer("pointerup", { x: corner.x + 80, y: corner.y + 40 });
    stage().dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: -400, clientX: m.x, clientY: m.y }));
    await quiet();
    await resetView();
    g2.resetTips = [];
    for (const [s, n, said = n] of NAMES) g2.resetTips.push((await tipAt(spotOf(s))) === said ? said : `${said}?`);
    g2.resetOpened = opened.length - count;

    // A crowded ring of fourteen sessions, one of them waiting and three the
    // moons of the first, drawn on a canvas of its own.
    const crowd = { at: Math.floor(now / 1000), profileMap: [], sessions: Array.from({ length: 14 }, (_, i) => S({
        session: `node-${String.fromCharCode(97 + i)}`, profile: "personal", status: i === 5 ? "waiting" : i % 3 ? "idle" : "busy",
        lastRequestAt: iso(2 + i * 1.5), pct: 10 + i * 5,
        parent: i > 10 ? { session: "node-a" } : undefined })) };
    const cg = graphOf(crowd);
    const corder = orderOf(cg);
    const cplaces = placesOf(cg, corder, corder[0]);
    const W = 900;
    const H = 420;
    const sheet = document.createElement("canvas");
    sheet.width = W;
    sheet.height = H;
    const cx = sheet.getContext("2d");
    const pal = { ink: "#eef1ff", wait: "#e3c97a", busy: "#63a8ff", cap: "#b98cff", void: "#06070f", sky: false };
    const type = { unit: 1, tag: { font: "15px Inter", size: 15, sp: 0.5, halo: 6 }, star: { font: "600 15px Inter", size: 15, sp: 0.8, halo: 6 } };

    // Behind the front only the name of the system and that of a session
    // waiting for the person are written; the same crowded system in front,
    // drawn small, writes every name.
    const hues = ["#6b9c83", "#7fe3d4", "#b98cff"];
    const SW = 380;
    const SH = 200;
    const clearOf = (front) => {
        cx.clearRect(0, 0, W, H);
        const lab = drawScene(cx, SW, SH, camera(HOME, SW, SH, lensOf(cg, SW, SH)), { ...sceneOf(cg, cplaces, hues), front,
            pal, type, sides: new Map(), settle: true }).labels;
        const shown = lab.filter((l) => !l.hidden);
        return { hidden: lab.filter((l) => l.hidden).map((l) => l.key), shown: shown.length, shownKeys: shown.map((l) => l.key) };
    };
    out.quiet = { behind: clearOf("elsewhere"), front: clearOf(corder[0]) };

    // Nothing is drawn while nothing changes.
    await quiet();
    const still = draws;
    await frames(20);
    out.still = draws - still;

    // The galaxy in depth. The liveliest contour stands in front; the wheel
    // with Shift brings the next forward, round and round both ways, and
    // zooms nothing; a click on a star brings its contour forward. A change of
    // how alive the contours are moves nothing until Reset view orders them
    // anew. Where less motion is asked for a system stands in its place at
    // once, elsewhere it glides there.
    await resetView();
    const gal = {};
    out.carousel = gal;
    const CONTOURS = ["client", "personal", "lab"];
    const fronts = async (front, order) => {
        const found = [];
        for (const c of CONTOURS) found.push((await tipAt(starOf(c, front, order))) === c ? c : `${c}?`);
        return found;
    };
    const shiftWheel = async (dy) => {
        const sb = stage().getBoundingClientRect();
        const ev = new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: dy, shiftKey: true,
            clientX: sb.left + 40, clientY: sb.top + 40 });
        stage().dispatchEvent(ev);
        return ev.defaultPrevented;
    };
    // At rest: no frame drawn for three frames in a row.
    const rest = async () => {
        let last = -1;
        let same = 0;
        await until(() => {
            if (draws === last) same += 1;
            else {
                same = 0;
                last = draws;
            }
            return same >= 3;
        }, 3000);
    };
    gal.order = orderOf(graphOf(snapshot));
    gal.first = await fronts();
    let drawn0 = draws;
    gal.prevented = await shiftWheel(-100);
    await rest();
    gal.instant = draws - drawn0;
    gal.up = await fronts("personal");
    pointer("pointermove", starOf("personal", "personal"), { buttons: 0 });
    await frames(2);
    gal.frontSays = text(document.querySelector(".dkorbtip em"));
    pointer("pointermove", { x: box.left + 6, y: box.top + 6 }, { buttons: 0 });
    await shiftWheel(100);
    await rest();
    gal.down = await fronts("client");
    await shiftWheel(100);
    await rest();
    gal.wrap = await fronts("lab");
    count = opened.length;
    await press(starOf("personal", "lab"));
    await rest();
    gal.clicked = await fronts("personal");
    gal.clickOpened = opened.length - count;
    // A click among the orbits of a system behind, off its star and its
    // planets, brings it forward as its star does: the point on its outer
    // orbit farthest from every mark of it.
    const amongOrbitsOf = (contour, front) => {
        const { g: seen, places, pr, win } = viewOf(front);
        const sys = seen.systems.find((x) => x.name === contour);
        const place = places.get(contour);
        const o = sys.orbits[sys.orbits.length - 1];
        const marks = [pr(place.c), ...sys.members.map((n) => pr(worldOf(place, n.w)))];
        let best = null;
        let far = -1;
        for (let i = 0; i < 48; i++) {
            const q = pr(worldOf(place, onOrbit(o, (i / 48) * TAU)));
            const d = Math.min(...marks.map((m) => Math.hypot(m.x - q.x, m.y - q.y)));
            if (d > far) {
                far = d;
                best = q;
            }
        }
        gal.orbitFromStar = Math.round(Math.hypot(best.x - marks[0].x, best.y - marks[0].y));
        gal.orbitFromMarks = Math.round(far);
        return win(best);
    };
    count = opened.length;
    await press(amongOrbitsOf("client", "personal"));
    await rest();
    gal.orbitClicked = await fronts("client");
    gal.orbitOpened = opened.length - count;
    await press(starOf("personal", "client"));
    await rest();
    // A planet of a system behind is the system too: the pointer over it
    // names the system, and a click brings the system forward and opens no
    // session.
    pointer("pointermove", spotOf("bench-1", "personal"), { buttons: 0 });
    await frames(2);
    const whole = document.querySelector(".dkorbtip");
    gal.behindTip = whole ? `${whole.getAttribute("data-on")} ${text(whole.querySelector("b"))}` : "";
    pointer("pointermove", { x: box.left + 6, y: box.top + 6 }, { buttons: 0 });
    count = opened.length;
    await press(spotOf("bench-1", "personal"));
    await rest();
    gal.planetClicked = await fronts("lab");
    gal.planetOpened = opened.length - count;
    await press(starOf("personal", "lab"));
    await rest();
    // The right click on a body of the system in front opens the menu of the
    // session's row, and its Open opens it; a body of a system behind is not a
    // session to act on, and its right click takes no menu.
    let ev = rightClick(spotOf("shop", "personal"));
    await until(menuNode);
    await quiet();
    out.menu = {
        prevented: ev.defaultPrevented,
        label: menuNode() ? menuNode().getAttribute("aria-label") : "",
        items: menuNode() ? Array.from(menuNode().querySelectorAll('[role="menuitem"] .pkname')).map(text) : [],
    };
    const openItem = Array.from(menuNode().querySelectorAll('[role="menuitem"]')).find((el) => text(el.querySelector(".pkname")) === "Open");
    openItem.click();
    await until(() => !menuNode());
    out.menuOpened = opened[opened.length - 1];
    ev = rightClick({ x: box.left + 6, y: box.top + 6 });
    await frame();
    out.menuAway = { prevented: ev.defaultPrevented, menu: Boolean(menuNode()) };
    ev = rightClick(spotOf("blog", "personal"));
    await frame();
    out.menuBehind = Boolean(menuNode());
    // The contours wake up and quiet down: lab now waits, blog does not.
    const kept = gal.order;
    snapshot = { ...snapshot, sessions: snapshot.sessions.map((x) => (x.session === "blog" ? { ...x, status: "idle" }
        : x.session === "bench-1" ? { ...x, status: "waiting" } : x)) };
    show();
    await quiet();
    gal.kept = await fronts("personal", kept);
    await resetView();
    gal.reorder = orderOf(graphOf(snapshot));
    gal.reset = await fronts();
    // Outside less motion the next system glides forward over some frames.
    lessMotion = false;
    drawn0 = draws;
    await shiftWheel(-100);
    await frames(3);
    gal.midway = await tipAt(starOf(gal.reorder[1], gal.reorder[1], gal.reorder));
    await rest();
    gal.glide = draws - drawn0;
    gal.glided = await fronts(gal.reorder[1], gal.reorder);
    lessMotion = true;
    await resetView();
    // A contour of one orbit is brought in front of one of five.
    {
        const P2 = (id, name, group) => ({ id, name, session: name, path: `/srv/${name}`, group });
        const five = [1, 2, 3, 4, 5].map((i) => P2(100 + i, `part-${i}`, "Parts"));
        const solo = P2(200, "solo", "Solo");
        const before = snapshot;
        snapshot = { at: Math.floor(now / 1000), sessions: [
            ...five.map((pj) => S({ session: pj.name, profile: "big", project: pj, status: "idle", lastRequestAt: iso(10) })),
            S({ session: "solo", profile: "small", project: solo, status: "idle", lastRequestAt: iso(10) }),
        ], profileMap: [
            { id: 7, profile: "big", default: true, groups: [{ name: "Parts", projects: five }] },
            { id: 8, profile: "small", groups: [{ name: "Solo", projects: [solo] }] },
        ] };
        show();
        await quiet();
        await resetView();
        const order = orderOf(graphOf(snapshot));
        gal.five = { first: order[0], orbits: Object.fromEntries(graphOf(snapshot).systems.map((sys) => [sys.name, sys.orbits.length])) };
        await shiftWheel(-100);
        await rest();
        gal.five.front = (await tipAt(starOf("small", "small", order))) === "small" ? "small" : "?";
        snapshot = before;
        show();
        await quiet();
        await resetView();
    }
    // A snapshot that reorders the orbits carries them there: over some
    // frames where motion is welcome, at once where less is asked for. stray
    // starts to wait and outweighs shop: shop goes in, stray out.
    {
        const order = orderOf(graphOf(snapshot));
        await press(starOf("personal", order[0], order));
        await rest();
        const before = snapshot;
        const waits = { ...snapshot, sessions: snapshot.sessions.map((x) => (x.session === "stray" ? { ...x, status: "waiting" } : x)) };
        const shopIn = (snap) => {
            const kept = snapshot;
            snapshot = snap;
            const spot = spotOf("shop", "personal", order);
            snapshot = kept;
            return spot;
        };
        const to = shopIn(waits);
        const from = shopIn(before);
        gal.orbitGlide = { moved: Math.round(Math.hypot(to.x - from.x, to.y - from.y)) };
        lessMotion = false;
        drawn0 = draws;
        snapshot = waits;
        show();
        await frames(3);
        gal.orbitGlide.midway = await tipAt(to);
        await rest();
        gal.orbitGlide.frames = draws - drawn0;
        gal.orbitGlide.arrived = await tipAt(to);
        lessMotion = true;
        drawn0 = draws;
        snapshot = before;
        show();
        await until(() => draws > drawn0);
        await frames(8);
        gal.orbitGlide.backDraws = draws - drawn0;
        gal.orbitGlide.back = await tipAt(from);
        await quiet();
        // shop stops working and weighs as stray does: the drawing keeps the
        // orbits where they were, rather than the order of the map, which
        // would put shop back inside.
        const box1 = stage().getBoundingClientRect();
        const spotWith = (gr, name) => {
            const pr = camera(HOME, box1.width, box1.height, lensOf(gr, box1.width, box1.height));
            const n = gr.nodes.find((x) => x.s.session === name);
            const q = pr(worldOf(placesOf(gr, order, "personal").get(n.p.system), n.p.w));
            return { x: box1.left + q.x, y: box1.top + q.y };
        };
        const tie = { ...before, sessions: before.sessions.map((x) => (x.session === "shop" ? { ...x, status: "idle" } : x)) };
        const kept = spotWith(graphOf(tie, orbitsIn(graphOf(before))), "shop");
        const fresh = spotWith(graphOf(tie), "shop");
        gal.orbitTie = { apart: Math.round(Math.hypot(kept.x - fresh.x, kept.y - fresh.y)) };
        drawn0 = draws;
        snapshot = tie;
        show();
        await until(() => draws > drawn0);
        await quiet();
        gal.orbitTie.kept = await tipAt(kept);
        gal.orbitTie.fresh = await tipAt(fresh);
        snapshot = before;
        show();
        await quiet();
        await resetView();
    }

    // One switch for the four tiles of the period: what each of them asks
    // the host, before the switch and after.
    const range = (id) => String(periodRange(id).from);
    const kinds = (fromAt) => [...new Set(usageAsked.filter((a) => a.from === fromAt).map((a) => a.kind))].sort();
    out.period = { start: PERIOD, on: text(document.querySelector(".dkhmperiod .uchip.on")) };
    out.period.before = kinds(range(PERIOD));
    const chip = Array.from(document.querySelectorAll(".dkhmperiod .uchip")).find((b) => text(b) === "7 days");
    chip.click();
    await quiet();
    out.period.after = kinds(range("7d"));
    out.period.onAfter = text(document.querySelector(".dkhmperiod .uchip.on"));
    out.period.hours = text(document.querySelector(".dkhmgrid .uwg .uwgtitle"));
    out.period.thirty = usageAsked.filter((a) => a.from === range("30d")).length;
    // A layer opened from a tile takes the period the switch stands on.
    const tile = (title) => Array.from(document.querySelectorAll(".dkhmgrid .uwg")).find((w) => text(w.querySelector(".uwgtitle")) === title);
    tile("Models and subagents").click();
    await until(() => document.querySelector(".uslayer"));
    await quiet();
    out.period.layer = text(document.querySelector(".uslayer .uchip.on"));
    document.querySelector(".uslayer .dkclose").click();
    await until(() => !document.querySelector(".uslayer"));
    tile("Top projects").click();
    await until(() => document.querySelector(".uslayer"));
    await quiet();
    out.period.breakdown = text(document.querySelector(".uslayer .uchip.on"));

    // Motion. Where less motion is asked for and nothing is kept, the orbits
    // stand: Motion is off and nothing is drawn. Switched on, the planets go
    // round, no more than thirty frames a second and none while the page is
    // hidden or the graph is off the screen; the choice is kept, so a page
    // opened again where less motion is asked for has it on, and off once
    // switched off. With nothing kept and no wish for less motion it is on.
    {
        const app = document.getElementById("app");
        const button = () => Array.from(document.querySelectorAll(".dkorbbtn")).find((b) => text(b) === "Motion");
        const m = {};
        out.motion = m;
        await quiet();
        m.atStart = button().getAttribute("aria-pressed");
        let d0 = draws;
        await frames(20);
        m.offDraws = draws - d0;
        button().click();
        m.kept = localStorage.getItem(MOTION_KEY);
        // The graph is seen on the browser's own frame.
        await wallFrames(2);
        await frames(4);
        const made0 = spritesMade();
        // Every name written, of whichever system stands in front.
        const allNames = () => Object.fromEntries([...written].map(([k, v]) => [k, { ...v }]));
        const at0 = allNames();
        const t0 = performance.now();
        d0 = draws;
        await frames(90);
        m.fps = Math.round(((draws - d0) / ((performance.now() - t0) / 1000)) * 10) / 10;
        const at1 = allNames();
        m.made = spritesMade() - made0;
        m.moved = Math.max(0, ...Object.keys(at0).filter((n) => at1[n])
            .map((n) => Math.round(Math.hypot(at1[n].x - at0[n].x, at1[n].y - at0[n].y) * 100) / 100));
        let hidden = false;
        Object.defineProperty(document, "hidden", { configurable: true, get: () => hidden });
        hidden = true;
        document.dispatchEvent(new Event("visibilitychange"));
        await frames(2);
        d0 = draws;
        await frames(12);
        m.hiddenDraws = draws - d0;
        hidden = false;
        document.dispatchEvent(new Event("visibilitychange"));
        d0 = draws;
        await frames(12);
        m.shownAgain = draws - d0;
        const widget = document.querySelector(".dkorbits");
        widget.style.transform = "translateY(-6000px)";
        await wallFrames(3);
        d0 = draws;
        await frames(12);
        m.awayDraws = draws - d0;
        widget.style.transform = "";
        await wallFrames(3);
        d0 = draws;
        await frames(12);
        m.backDraws = draws - d0;
        render(null, app);
        show();
        await until(() => button());
        m.reopened = button().getAttribute("aria-pressed");
        button().click();
        m.keptOff = localStorage.getItem(MOTION_KEY);
        await quiet();
        d0 = draws;
        await frames(20);
        m.offAgain = draws - d0;
        localStorage.removeItem(MOTION_KEY);
        lessMotion = false;
        render(null, app);
        show();
        await until(() => button());
        m.plainStart = button().getAttribute("aria-pressed");
        render(null, app);
        lessMotion = true;
        localStorage.removeItem(MOTION_KEY);
    }
    return out;
})();
</script>
