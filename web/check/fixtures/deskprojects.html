<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs","xterm":"/vendor/xterm.mjs","xterm-fit":"/vendor/xterm-fit.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The Projects button of the sessions section at a desk opens the settings of
// the map in three columns straight away, on the contour the sessions column
// shows, with no list in a panel before them, and they open again where they
// were left. The tree finds a group or a
// project by name and adds a contour; a project page starts a new session of
// it from its heading and deletes it at its foot. The heading of a contour
// in the sessions column opens the registry of its tasks in the centre, over
// the conversation that is there again once it closes, and its page in the
// settings. A conversation opened from the archive takes the column to the
// tab of its contour.
import { h, render } from "preact";
import { DesktopShell } from "/src/desktop/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

localStorage.setItem("aacpanel.desktop.place", JSON.stringify({ section: "sessions", from: "", chat: null }));

const base = [
    ["transport", null, "claude"], ["model", "opus[1m]", "account"], ["effort", "xhigh", "account"],
    ["permissionMode", "auto", "account"], ["remoteControl", null, "claude"], ["intent", null, "claude"],
    ["contextCap", 80, "contour"], ["autoRestart", false, "panel"], ["restartIntent", null, "claude"],
    ["env", null, "claude"], ["args", null, "claude"],
].map(([key, value, layer]) => ({ key, value, layer }));
const project = (id, groupId, name) => ({ id, groupId, name, path: `/srv/proj/${name}`, session: name, base: "", sort: id,
    launch: {}, effective: base, line: { words: [{ text: "claude" }, { text: "-n" }, { text: name }] } });
const contour = (id, name, groups) => ({ id, name, configDir: `/home/u/.claude-${id}`, prefix: "", auth: "builtin",
     account: { model: "opus[1m]", effort: "xhigh", permissionMode: "auto" }, launch: { contextCap: 80 },
    effective: base, groups: groups.map(([gid, gname, projects]) => ({ id: gid, profileId: id, name: gname, projects })) });
let profiles = [
    contour(3, "personal", [[31, "Home", [project(11, 31, "helios")]],
        [32, "Side", [project(12, 32, "aacpanel"), project(13, 32, "blog"), project(14, 32, "person")]]]),
    contour(4, "Acme", [[41, "Common", [project(21, 41, "api")]], [42, "Infra", [project(22, 42, "infra-rework")]]]),
    contour(1, "Globex Group", [[11, "SHOP", [project(31, 11, "shop")]]]),
];
const profileMap = profiles.map((p) => ({ id: p.id, profile: p.name, name: p.name,
    groups: p.groups.map((g) => ({ id: g.id, name: g.name, projects: g.projects.map((x) => ({ id: x.id, name: x.name, path: x.path, session: x.session })) })) }));
const now = Math.floor(Date.now() / 1000);
const live = (id, name) => ({ session: name, sessionId: `live-${name}`, status: "idle", transport: "stream", pct: 10, tokens: 100000,
    limit: 1000000, model: "claude-opus-5-5", cwd: `/srv/proj/${name}`, profile: "personal", contour: 3,
    project: { id, name } });
// The collector names the contour of Globex Group globex.
const snapshot = { at: now, hostName: "helios", sessions: [live(11, "helios"), live(13, "blog")], profileMap,
    limits: { contours: [{ profile: "globex", contour: 1 }] } };
// Closed conversations of the archive: one in a project of personal, under a
// name of the collector nothing else knows, one off the map in the contour
// the collector calls globex, one in a contour nobody knows. Nothing was said in them, so the shelf of the column leaves them out.
const closed = (name, profile, project) => ({ sessionId: `closed-${name}`, name, profile, project, cwd: `/srv/proj/${name}`,
    messages: 0, model: "claude-opus-5-5", lastAt: new Date(now * 1000 - 3600e3).toISOString() });
const archived = [
    closed("old-helios", "home-dir", { id: 11, name: "helios", group: "Home", path: "/srv/proj/helios" }),
    closed("globex-scratch", "globex", null),
    closed("stray-notes", "lab", null),
];

const sent = [];
// The contours the registry of tasks was asked for.
const boards = [];
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const real = window.fetch.bind(window);
window.fetch = async (url, init) => {
    const u = new URL(String(url), location.href);
    const method = (init && init.method) || "GET";
    if (u.pathname === "/api/profiles/schema") return real(u.pathname);
    if (u.pathname.endsWith("/preview")) return json({ effective: base, line: { words: [{ text: "claude" }] }, problems: [] });
    if (method !== "GET") {
        const body = init.body ? JSON.parse(init.body) : null;
        sent.push({ method, url: u.pathname, body });
        if (method === "DELETE" && u.pathname.startsWith("/api/projects/")) {
            const id = Number(u.pathname.split("/").pop());
            profiles = profiles.map((p) => ({ ...p, groups: p.groups.map((g) => ({ ...g, projects: g.projects.filter((x) => x.id !== id) })) }));
            return json({ profiles, models: null });
        }
        return json({ ok: true, detail: "done" });
    }
    if (u.pathname === "/api/profiles") return json({ profiles, models: null, disk: { state: "ok", roots: [], dirs: [] }, accounts: [] });
    if (u.pathname === "/api/sessions/archive") return json({ rows: archived, total: archived.length, limit: 30, offset: 0 });
    if (u.pathname === "/api/tasks/board") {
        boards.push(u.searchParams.get("contour"));
        return json({ tasks: [], noTask: [], notes: [] });
    }
    if (u.pathname === "/api/chat") return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.pathname === "/api/term") return json({ available: false });
    if (u.pathname.startsWith("/api/usage")) return new Response("", { status: 503 });
    if (u.pathname === "/api/probes") return json({ probes: [] });
    if (u.pathname.startsWith("/api/history")) return json({ rows: [] });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() {} addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.open", "session.close", "session.resume"] };
render(h(ToastHost, null, h(GateHost, null, h(DesktopShell, {
    snapshot, tree: { stacks: [] }, treeError: null, hostError: null, ageSec: 10, history: null, faults: null,
    alerts: { reload() {}, items: [] }, openAlerts: 0, exec, onRefresh() {}, wait: null, theme: "space", onTheme() {},
    updateReady: false, updating: false, onApplyUpdate() {}, route: null, jump: null, onJumped() {},
}))), document.getElementById("root"));

// until waits on a condition of the screen frame by frame.
const until = async (fn, ms = 4000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await new Promise((r) => requestAnimationFrame(r));
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel, scope = document) => Array.from(scope.querySelectorAll(sel));
const button = (label, scope = document) => all("button", scope).find((b) => text(b) === label);
const projectsButton = () => document.querySelector('.dktop button[aria-label="Projects"]');
const cols = () => all(".dkcols .dkcol");
const heads = () => cols().map((c) => text(c.querySelector(".phead h2")));
const confirm = async (label) => {
    const sheet = await until(() => all(".sheet.on").find((s) => button(label, s)));
    if (sheet) button(label, sheet).click();
    return Boolean(sheet);
};
const find = (query) => {
    const input = document.querySelector(".dkcoltree .dktreefind");
    if (!input) return false;
    input.value = query;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    return true;
};

// Each step reads what it finds and stops the page at the first thing that
// is not there, so the test says what was missing rather than the script.
const tabOf = (name) => all(".dkleft .dkpick [role=tab]").find((b) => text(b.querySelector(".dkpickname")) === name);
const shown = () => text(document.querySelector(".dkleft .dkcontourname"));

window.done = (async () => {
    const out = {};
    await until(() => projectsButton() && tabOf("Acme"));
    tabOf("Acme").click();
    await until(() => shown() === "Acme");
    projectsButton().click();
    await until(() => heads()[0]);
    out.opened = heads();
    out.panel = Boolean(document.querySelector(".dkright"));
    out.active = projectsButton().classList.contains("on");
    out.tree = all(".dktreeitem").map(text);
    out.adds = text(document.querySelector(".dkcoltree .dktreeadd"));

    if (!document.querySelector(".dkcols")) return out;

    // The tree finds a project by its name and opens it.
    if (!find("blo")) return out;
    const found = await until(() => document.querySelector(".dktreeproject"));
    out.found = all(".dktreeitem").map(text);
    if (!found) return out;
    found.click();
    await until(() => heads()[1] === "blog");
    out.foundOpens = heads();
    find("nothing like it");
    out.none = text(await until(() => document.querySelector(".dktreenone")));
    find("");
    await until(() => !document.querySelector(".dktreenone"));

    // The page of a project starts a new session of it from its heading, and
    // a session that starts closes the settings.
    const start = await until(() => cols()[1] && cols()[1].querySelector(".phead .dkcolstart"));
    if (!start) return out;
    out.start = text(start);
    start.click();
    out.startAsked = await confirm("Open");
    await until(() => sent.some((s) => s.body && s.body.kind === "session.open"));
    out.startSent = (sent.find((s) => s.body && s.body.kind === "session.open") || {}).body || null;
    await until(() => !document.querySelector(".dkcols"));
    out.closedAfterStart = !document.querySelector(".dkcols") && !projectsButton().classList.contains("on");

    // The settings open again where they were left.
    projectsButton().click();
    await until(() => heads()[1]);
    out.reopened = heads();

    // The project is deleted at the foot of its page; the page goes, the group stays.
    const del = cols()[1] && button("Delete project", cols()[1]);
    if (!del) return out;
    del.click();
    out.deleteAsked = await confirm("Delete");
    await until(() => sent.some((s) => s.method === "DELETE"));
    out.deleteSent = sent.find((s) => s.method === "DELETE") || null;
    await until(() => heads()[1] === "");
    out.afterDelete = heads();
    out.treeAfterDelete = all(".dktreegroup").map(text);

    // A new contour is added from the foot of the tree.
    const add = document.querySelector(".dkcoltree .dktreeadd");
    if (add) add.click();
    const layer = await until(() => document.querySelector('[role="dialog"][aria-label="new contour"]'), 1000);
    out.newContour = layer ? text(layer.querySelector("h2")) : "";
    if (layer) layer.querySelector(".pback").click();
    await until(() => !document.querySelector('[role="dialog"][aria-label="new contour"]'));

    // The cross of the window closes it.
    document.querySelector(".dkcols .dkcolsclose").click();
    await until(() => !document.querySelector(".dkcols"));
    out.closed = !document.querySelector(".dkcols");

    // The heading of the contour shown opens its registry of tasks in the
    // centre over the conversation; the arrow keys leave the conversation
    // under it as it is, the way back brings it back, and a conversation
    // picked over the registry takes its place.
    const lit = () => { const on = document.querySelector(".dkleft .sc.sccur"); return on ? on.dataset.name : ""; };
    const center = () => {
        const tasks = document.querySelector(".dkpage .tqscreen");
        if (tasks) return `tasks: ${text(document.querySelector(".dkpage .phead h2"))}`;
        if (document.querySelector(".dkchat")) return `conversation: ${lit()}`;
        return document.querySelector(".chatnone") ? "nothing" : "";
    };
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    const act = (label) => document.querySelector(`.dkleft .dkcontouracts button[aria-label="${label}"]`);
    const card = (name) => document.querySelector(`.dkleft .sc[data-name="${name}"] .scopen`);
    tabOf("personal").click();
    await until(() => shown() === "personal");
    const acts = { before: center(), heading: all(".dkleft .dkcontouracts button").map((b) => b.getAttribute("aria-label")) };
    out.acts = acts;
    if (!card("helios") || !act("Tasks")) return out;
    card("helios").click();
    await until(() => center() === "conversation: helios");
    acts.picked = center();
    act("Tasks").click();
    await until(() => center().startsWith("tasks") && boards.length);
    acts.opened = center();
    acts.boards = boards.slice();
    acts.column = Boolean(document.querySelector(".dkleft"));
    // ArrowDown would go on to blog; over the registry it does nothing, and
    // two frames are what a conversation it moved to would take to show.
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
    await frame();
    await frame();
    document.querySelector(".dkpage .pback").click();
    await until(() => center().startsWith("conversation"));
    acts.closed = center();
    act("Tasks").click();
    await until(() => center().startsWith("tasks"));
    card("blog").click();
    await until(() => center().startsWith("conversation"));
    acts.pickedOver = center();

    // The tab of another contour: its own registry and its own page.
    tabOf("Acme").click();
    await until(() => shown() === "Acme");
    boards.length = 0;
    act("Tasks").click();
    await until(() => center() === "tasks: Tasks · Acme" && boards.length);
    acts.other = { opened: center(), boards: boards.slice() };
    document.querySelector(".dkpage .pback").click();
    await until(() => center().startsWith("conversation"));
    act("Profile").click();
    await until(() => heads()[0]);
    acts.profile = heads();
    document.querySelector(".dkcols .dkcolsclose").click();
    await until(() => !document.querySelector(".dkcols"));

    // A closed conversation opened from the archive takes the column to the
    // tab of its contour, kept as a press on the tab is: by the project of
    // its row, else by the contour the collector names it by. One in a
    // contour nobody knows leaves the column where it stands.
    const selected = () => text(document.querySelector('.dkleft .dkpick [aria-selected="true"] .dkpickname'));
    const talking = () => text(document.querySelector(".dkchat .dkchatname"));
    const archiveRow = (name) => all(".dkright .dkarch").find((r) => text(r.querySelector(".dkname")) === name);
    // opened waits for the column to reach the tab it should, or, with none
    // to reach, two frames: what a moved switch would take to show.
    const opened = async (name, tab) => {
        archiveRow(name).click();
        await until(() => talking() === name && (!tab || selected() === tab));
        if (!tab) {
            await frame();
            await frame();
        }
        return { talk: talking(), tab: selected(), kept: localStorage.getItem("aacpanel.sessions.profile") || "" };
    };
    document.querySelector('.dktop button[aria-label="Session archive"]').click();
    await until(() => archiveRow("stray-notes"));
    if (!archiveRow("stray-notes")) return out;
    out.reveal = { before: selected() };
    out.reveal.project = await opened("old-helios", "personal");
    out.reveal.collector = await opened("globex-scratch", "Globex Group");
    out.reveal.unknown = await opened("stray-notes");
    return out;
})();
</script>
