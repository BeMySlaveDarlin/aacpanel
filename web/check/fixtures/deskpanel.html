<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="dkbody withpanel"><aside class="dkleft"></aside><section class="dkcenter"></section><div id="root"></div></div></div>
<script type="module">
// The right-hand panel of the desktop under the styles it ships with: the
// archive over a fake service, on a screen wide enough for the desktop rules
// to apply. Measured here are the things only an engine can answer — whether
// the buttons of a row stand clear of its text, and whether a size follows the
// scale — plus what the contour filter of the panel sends out.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { RightPanel } from "/src/desktop/panels.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const profiles = { profiles: [
    { id: 7, name: "Acme Labs", configDir: "/home/u/.claude-profiles/acme" },
    { id: 3, name: "personal", configDir: "/home/u/.claude" },
] };

const names = ["Acme Labs", "personal"];

const row = (id, profile, at) => ({
    sessionId: id, name: `the conversation about the build ${id.slice(0, 4)}`,
    cwd: "/srv/proj/a-project-with-a-long-name", profile,
    model: "claude-opus-5", pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000,
    limit: 1000000, messages: 4, lastAt: at, startedAt: at, lastRequestAt: at,
    project: { id: 1, name: "a-project-with-a-long-name", path: "/srv/proj/a-project-with-a-long-name", group: "services" },
});

const rows = [
    row("11111111-1111-4111-8111-111111111111", "acme", "2026-09-14T09:00:00.000Z"),
    row("22222222-2222-4222-8222-222222222222", "personal", "2026-09-13T09:00:00.000Z"),
];

const asked = [];
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) {
        asked.push(u);
        return new Response(JSON.stringify({ rows, total: rows.length, limit: 20, offset: 0 }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

const exec = { available: true };

function Panel() {
    const [picks, setPicks] = useState([]);
    return h(RightPanel, {
        tab: "archive",
        title: "Session archive",
        profiles,
        names,
        picks: [],
        archPicks: picks,
        setArchPicks: setPicks,
        exec,
        onOpen: () => {},
        onClose: () => {},
        onOpened: () => {},
    });
}

render(h(ToastHost, null, h(GateHost, null, h(Panel))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const settle = async () => {
    for (let i = 0; i < 50 && !document.querySelector(".dkarch"); i++) await sleep(50);
    await sleep(100);
};
const query = () => (asked.length ? new URL(asked[asked.length - 1], location.origin).search : "");

// overlap returns the largest area by which the buttons of a row cover a piece
// of its text. Zero is the whole point: a button laid over the model name or
// the age of the conversation hides them exactly when the pointer arrives.
function overlap() {
    let worst = 0;
    for (const arch of document.querySelectorAll(".dkarch")) {
        const acts = arch.querySelector(".dkacts");
        if (!acts) continue;
        const a = acts.getBoundingClientRect();
        for (const text of arch.querySelectorAll(".dkname, .dknum, .dkwhen, .dkgroup, .dklast, .dkarchmodel")) {
            const b = text.getBoundingClientRect();
            const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
            const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
            if (w > 0 && h > 0) worst = Math.max(worst, w * h);
        }
    }
    return Math.round(worst);
}

const sizes = () => {
    const act = document.querySelector(".dkarch .dkact");
    const acts = document.querySelector(".dkarch .dkacts");
    const right = document.querySelector(".dkright");
    const name = document.querySelector(".dkarch .dkname");
    return {
        shown: acts ? Number(getComputedStyle(acts).opacity) : 0,
        act: act ? Math.round(act.getBoundingClientRect().height) : 0,
        panel: right ? Math.round(right.getBoundingClientRect().width) : 0,
        text: name ? Math.round(parseFloat(getComputedStyle(name).fontSize) * 100) / 100 : 0,
    };
};

const byText = (selector, text) =>
    [...document.querySelectorAll(selector)].find((e) => e.textContent.trim() === text);

window.done = (async () => {
    await settle();
    const plain = { overlap: overlap(), ...sizes() };

    document.documentElement.style.setProperty("--ui-scale", "1.4");
    await sleep(50);
    const scaled = { overlap: overlap(), ...sizes() };
    document.documentElement.style.removeProperty("--ui-scale");
    await sleep(50);

    asked.length = 0;
    document.querySelector(".dkright .dkpickbtn").click();
    await sleep(50);
    const rowsShown = [...document.querySelectorAll(".dkright .dkpickrow")].map((e) => e.textContent.trim());
    byText(".dkright .dkpickrow", "Acme Labs").click();
    await settle();

    return { plain, scaled, picked: query(), pickRows: rowsShown };
})();
</script>
