<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="dkbody withpanel"><div id="left" style="display:contents"></div><section class="dkcenter"></section><div id="root"></div></div></div>
<script type="module">
// The contour buttons of the desktop under the styles they ship with, on a
// screen wide enough for the desktop rules to apply: the filter of the
// archive in the right-hand panel over a fake service — what it offers, how
// its buttons toggle, and what it sends out — and the switch of the sessions
// column beside it — which contour a press shows, and which one it comes back
// to when the column is drawn again.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { RightPanel } from "/src/desktop/panels.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const profiles = { profiles: [
    { id: 7, name: "Acme Labs", configDir: "/home/u/.claude-profiles/acme" },
    { id: 3, name: "personal", configDir: "/home/u/.claude" },
] };

const names = ["Acme Labs", "personal", "design", "ops", "docs", "research", "a contour with a name longer than its button"];
const chosen = {};

const row = (id, profile, at) => ({
    sessionId: id, name: `the conversation about the build ${id.slice(0, 4)}`,
    cwd: "/srv/proj/a-project-with-a-long-name", profile,
    model: "claude-opus-5", pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000,
    limit: 1000000, messages: 4, lastAt: at, startedAt: at, lastRequestAt: at,
    project: { id: 1, name: "a-project-with-a-long-name", path: "/srv/proj/a-project-with-a-long-name", group: "services" },
});

const rows = [
    row("11111111-1111-4111-8111-111111111111", "acme", "2026-09-14T09:00:00.000Z"),
    row("22222222-2222-4222-8222-222222222222", "personal", "2026-09-13T09:00:00.000Z"),
];

const asked = [];
window.fetch = counted(async (url) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) {
        asked.push(u);
        return new Response(JSON.stringify({ rows, total: rows.length, limit: 20, offset: 0 }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
});

const exec = { available: true };

function Panel({ names }) {
    const [picks, setPicks] = useState([]);
    chosen.right = picks;
    return h(RightPanel, {
        tab: "archive",
        title: "Session archive",
        profiles,
        names,
        picks: [],
        archPicks: picks,
        setArchPicks: setPicks,
        exec,
        onOpen: () => {},
        onClose: () => {},
        onOpened: () => {},
    });
}

// The contour the column stands on is kept where the phone keeps the page of
// its sessions tab.
const KEPT = "aacpanel.sessions.profile";

const left = document.getElementById("left");
const column = () => render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { sessions: [], profileMap: names.map((profile, i) => ({ id: i + 1, profile, groups: [] })) },
    exec, onPick: () => {}, onShown: (name) => { chosen.left = name; },
}))), left);
// The column drawn again, as the shell draws it on the way back from another
// section: what it stands on then is only what it kept.
const again = () => {
    render(null, left);
    column();
};

localStorage.setItem(KEPT, names[4]);
render(h(ToastHost, null, h(GateHost, null, h(Panel, { names }))), document.getElementById("root"));
column();

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const settle = async () => {
    for (let i = 0; i < 50 && !document.querySelector(".dkarch"); i++) await sleep(50);
    await quiet();
};
const query = () => (asked.length ? new URL(asked[asked.length - 1], location.origin).search : "");

const buttons = (side) => [...document.querySelectorAll(`.dk${side} .dkpick button`)];
const nameOf = (b) => (b.querySelector(".dkpickname") || b).textContent.trim();
const pickButton = (side, name) => buttons(side).find((b) => nameOf(b) === name);
const shownIn = (side) => [...document.querySelectorAll(`.dk${side} .dkscroll .dkcontourname`)].map((e) => e.textContent.trim());
const selection = () => ({
    picks: chosen.right,
    pressed: buttons("right").map((b) => b.getAttribute("aria-pressed")),
    shown: shownIn("right"),
});
const tab = () => ({
    shown: chosen.left || "",
    roles: buttons("left").map((b) => b.getAttribute("role") || ""),
    selected: buttons("left").map((b) => b.getAttribute("aria-selected") || ""),
    pressed: buttons("left").filter((b) => b.hasAttribute("aria-pressed")).length,
    sections: shownIn("left"),
    panel: (document.querySelector(".dkleft .dkscroll") || {}).getAttribute?.("aria-label") || "",
    kept: localStorage.getItem(KEPT) || "",
});

window.done = (async () => {
    await settle();
    const long = pickButton("right", names[6]);
    const title = long ? long.title : "";
    const pickRows = buttons("right").map(nameOf);
    const tabRows = buttons("left").map(nameOf);
    const group = (document.querySelector(".dkleft .dkpick") || {}).getAttribute?.("role") || "";
    const toggles = [selection()];
    let picked = "";
    for (const name of [names[0], names[6], names[0], names[6]]) {
        asked.length = 0;
        pickButton("right", name).click();
        await settle();
        toggles.push(selection());
        if (toggles.length === 2) picked = query();
    }
    // The switch starts on the contour kept, a press moves it to another
    // and a second press on the same tab leaves it there; drawn again, the
    // column comes back to the last one pressed, and to the first contour
    // once the one kept is not among the contours any more.
    const tabs = [tab()];
    for (const name of [names[0], names[6], names[6]]) {
        pickButton("left", name).click();
        await settle();
        tabs.push(tab());
    }
    again();
    await settle();
    tabs.push(tab());
    localStorage.setItem(KEPT, "a contour gone from the map");
    again();
    await settle();
    tabs.push(tab());
    return { picked, pickRows, title, toggles, tabRows, group, tabs };
})();
</script>
