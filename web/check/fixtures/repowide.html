<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<!-- The viewer at a desk: the code in the middle, the directory in the panel
     beside it, the open files as tabs above. The same component the phone
     draws — what differs is the shape, and the shape is what this measures. -->
<div class="shell no-nav" style="height:100vh;display:flex;flex-direction:column">
  <div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
import { h, render } from "preact";
import { RepoView } from "/src/screens/repo/view.js";
import { ToastHost } from "/src/ui/toasts.js";

const CHANGES = {
    root: "/srv/proj", branch: "work", base: "main", baseFrom: "project",
    head: "abc1234", rev: "rev1",
    files: [
        { path: "pkg/env.go", layer: "worktree", add: 6, delete: 1, status: "M" },
        { path: "pkg/env_test.go", layer: "committed", add: 42, delete: 5, status: "M" },
    ],
    total: 2, cut: false,
};

const TREE = {
    root: "/srv/proj", path: "", total: 3, cut: false,
    entries: [
        { name: "pkg", dir: true },
        { name: "README.md", dir: false },
        { name: "fresh.txt", dir: false, untracked: true },
    ],
};

const FILE = {
    rev: "rev1", path: "pkg/env.go", oid: "2222222", size: 120, first: 1, total: 3, more: false,
    lines: ["package pkg", "", "func childEnv() {} // a line long enough to run off the middle of the screen and then some"],
    spans: [[[3, 7], [0, 1], [5, 3]], [], [[3, 4], [0, 1], [6, 9], [0, 6]]],
};

const DIFF = {
    rev: "rev1", path: "pkg/env.go", base: "main", baseFrom: "project",
    files: [{
        path: "pkg/env.go", oldOid: "1111111", newOid: "2222222",
        hunks: [{
            header: "@@ -74,7 +74,9 @@ func childEnv", layer: "worktree",
            lines: [
                { kind: "ctx", old: 74, new: 74, text: "\tif warn := checkBus(addr); warn != \"\" {", spans: null },
                { kind: "del", old: 75, text: "\t\twarns = append(warns, warn)", spans: null },
                { kind: "add", new: 75, text: "\t\tdelete(env, \"DBUS_SESSION_BUS_ADDRESS\")", spans: null },
                { kind: "ctx", old: 76, new: 77, text: "\t}", spans: null },
            ],
        }],
    }],
};

window.fetch = async (url) => {
    const at = String(url);
    const body = at.includes("/api/repo/changes") ? CHANGES
        : at.includes("/api/repo/diff") ? DIFF
        : at.includes("/api/repo/tree") ? TREE
        : at.includes("/api/repo/file") ? FILE
        : { error: "unknown" };
    return { ok: true, status: 200, json: async () => body, text: async () => JSON.stringify(body) };
};

render(h(ToastHost, null, h(RepoView, { cwd: "/srv/proj", name: "work", onBack() {} })), document.getElementById("root"));

const box = (el) => (el ? el.getBoundingClientRect() : null);
const sel = (q) => document.querySelector(q);
const all = (q) => [...document.querySelectorAll(q)];
const tick = (ms) => new Promise((r) => setTimeout(r, ms));

async function until(q, tries = 60) {
    for (let i = 0; i < tries; i++) {
        const el = sel(q);
        if (el) return el;
        await tick(30);
    }
    return null;
}

// A name in the panel on the right, opened the way a person opens it.
async function openFromPane(name) {
    const node = all(".cdside .cdnode").find((n) => n.textContent.includes(name));
    if (node) node.click();
    await tick(90);
}

window.done = (async () => {
    await until(".cdwide");
    await until(".cdside .cdnode");

    const paneFirst = box(sel(".cdside"));
    const mainFirst = box(sel(".cdmain"));

    // Three files open: two walked from the directory, one opened out of the
    // run of changes.
    await openFromPane("README.md");
    await openFromPane("fresh.txt");

    const changesTab = all(".cdtab").find((t) => t.textContent.includes("Changes"));
    if (changesTab) changesTab.click();
    await tick(90);
    const head = await until(".cdfilehead");
    if (head) head.click();
    await tick(90);
    const open = all(".cdopen").find((b) => b.textContent.includes("Open the file"));
    if (open) open.click();
    await tick(120);

    const tabNames = all(".cdtab").map((t) => t.textContent.replace("×", "").trim());
    const activeName = (sel(".cdtab.on") || {}).textContent
        ? sel(".cdtab.on").textContent.replace("×", "").trim() : "";

    // The code scrolls on its own, the panel keeps its own scroll: walking a
    // directory must not move what is being read.
    // Read the styles here, while both are still in the tree: getComputedStyle
    // of an element the panel has since removed answers with nothing at all.
    const scroller = sel(".cdscroll");
    const sideBody = sel(".cdsidebody");
    const codeScrolls = scroller ? getComputedStyle(scroller).overflowY : "";
    const paneScrolls = sideBody ? getComputedStyle(sideBody).overflowY : "";

    // Closing the tab being read hands the screen to its neighbour, not to a
    // blank panel.
    const xs = all(".cdtabx");
    if (xs.length) xs[xs.length - 1].click();
    await tick(90);
    const afterClose = all(".cdtab").map((t) => t.textContent.replace("×", "").trim());
    const activeAfter = sel(".cdtab.on") ? sel(".cdtab.on").textContent.replace("×", "").trim() : "";

    // The panel folds away, and the code takes the room.
    const mainBefore = box(sel(".cdmain")).width;
    const fold = sel('[title="the panel beside the code"]');
    if (fold) fold.click();
    await tick(120);
    const paneGone = !sel(".cdside");
    const mainAfter = box(sel(".cdmain")).width;

    return {
        laidOut: Boolean(paneFirst && mainFirst),
        paneOnTheRight: Boolean(paneFirst && mainFirst && paneFirst.left >= mainFirst.right - 2),
        paneWidth: paneFirst ? Math.round(paneFirst.width) : 0,
        mainWidth: Math.round(mainFirst.width),
        tabNames,
        activeName,
        codeScrolls,
        paneScrolls,
        afterClose,
        activeAfter,
        paneGone,
        mainGrew: mainAfter > mainBefore + 40,
        phoneStripHidden: all(".cdstrip .chip").every((c) => !c.textContent.includes("Files")),
    };
})();
</script>
