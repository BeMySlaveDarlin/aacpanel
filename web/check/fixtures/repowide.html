<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<!-- A real conversation on both screens: Files opens beside the feed or as
     a full phone list; the file keeps its composer and its way back. -->
<div class="shell no-nav" style="height:100vh;display:flex;flex-direction:column">
  <div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<script type="module">
import { h, render } from "preact";
import { quiet, sel, all, text, until } from "/check/fixtures/repo-scene.js";
import { ClaudeChat } from "/src/screens/chat/claude.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const CHANGES = {
    root: "/srv/proj", branch: "work", base: "main", baseFrom: "project",
    head: "abc1234", rev: "rev1",
    files: [
        { path: "pkg/env.go", layer: "worktree", add: 6, delete: 1, status: "M" },
        { path: "pkg/env_test.go", layer: "committed", add: 42, delete: 5, status: "M" },
    ],
    total: 2, cut: false,
};

const TREE = {
    root: "/srv/proj", path: "", total: 3, cut: false,
    entries: [
        { name: "pkg", dir: true },
        { name: "README.md", dir: false },
        { name: "fresh.txt", dir: false, untracked: true },
    ],
};

const FILE = {
    rev: "rev1", path: "pkg/env.go", oid: "2222222", size: 120, first: 1, total: 3, more: false,
    lines: ["package pkg", "", "func childEnv() {} // a line long enough to run off the middle of the screen and then some"],
    spans: [[[3, 7], [0, 1], [5, 3]], [], [[3, 4], [0, 1], [6, 9], [0, 6]]],
};

const DIFF = {
    rev: "rev1", path: "pkg/env.go", base: "main", baseFrom: "project",
    files: [{
        path: "pkg/env.go", oldOid: "1111111", newOid: "2222222",
        hunks: [{
            header: "@@ -74,7 +74,9 @@ func childEnv", layer: "worktree",
            lines: [
                { kind: "ctx", old: 74, new: 74, text: "\tif warn := checkBus(addr); warn != \"\" {", spans: null },
                { kind: "del", old: 75, text: "\t\twarns = append(warns, warn)", spans: null },
                { kind: "add", new: 75, text: "\t\tdelete(env, \"DBUS_SESSION_BUS_ADDRESS\")", spans: null },
                { kind: "ctx", old: 76, new: 77, text: "\t}", spans: null },
            ],
        }],
    }],
};

window.fetch = async (url) => {
    const at = String(url);
    const body = at.includes("/api/repo/changes") ? CHANGES
        : at.includes("/api/repo/diff") ? DIFF
        : at.includes("/api/repo/tree") ? (new URL(at, location.href).searchParams.get("path") === "pkg"
            ? { ...TREE, path: "pkg", total: 2, entries: [{ name: "env.go", dir: false }, { name: "env_test.go", dir: false }] } : TREE)
        : at.includes("/api/repo/file") ? FILE
        : at.startsWith("/api/chat?") ? { items: [{ pos: 1, role: "ai", text: "Read the changes beside this conversation." }], first: 1, last: 1, total: 1, moreBefore: false }
        : at.startsWith("/api/reviews") ? { reviews: [] }
        : at.startsWith("/api/term") ? { available: false }
        : {};
    return { ok: true, status: 200, json: async () => body, text: async () => JSON.stringify(body) };
};


window.EventSource = class { addEventListener() {} close() {} };
const live = { session: "work", sessionId: "talk1", status: "idle", transport: "stream", cwd: "/srv/proj", profile: "personal" };
const exec = { available: true, kinds: ["session.send"] };
render(h(ToastHost, null, h(GateHost, null, h(ClaudeChat, {
    name: "work", id: "talk1", live, exec, snapshot: { sessions: [live] }, onBack() {}, onUsage() {},
    wait: { of: () => null, opening: () => [] },
}))), document.getElementById("root"));

window.done = (async () => {
    await until(".chatfeed .msg");
    await quiet();
    const wide = matchMedia("(min-width:1100px)").matches;
    const feed = sel(".chatfeed");
    const composer = sel(".composerbox");
    const button = sel('.cdfilesbutton');
    const out = { wide, closed: sel(".cdside").hidden, buttonText: text(button) };
    button.click();
    await quiet();
    out.opened = !sel(".cdside").hidden;
    out.baseLabel = text(sel(".cdbasepick"));
    out.baseTitle = sel(".cdbasepick").title;
    out.feedWithSidebar = sel(".chatfeed") === feed && !sel(".cdfeedslot").hidden;
    out.folderCount = text(sel('.cdnode[data-path="pkg"] .cdinside'));
    out.changedMarks = text(sel('.cdchangedfile[data-path="pkg/env.go"]'));
    sel('.cdchangedfile[data-path="pkg/env.go"]').click();
    await until(".cdln");
    await quiet();
    out.twoActionsOpened = Boolean(sel(".cdfileview"));
    out.headerFeedPressed = Boolean(sel('.dktabs .dktab[aria-pressed="true"]'));
    out.headerFilesPressed = button.classList.contains("on") && button.getAttribute("aria-expanded") === "true";
    out.defaultChanges = sel('.cdmodes [aria-pressed="true"]').textContent.trim();
    out.keptFeed = sel(".chatfeed") === feed && sel(".cdfeedslot").hidden;
    out.keptComposer = sel(".composerbox") === composer;
    out.selected = Boolean(sel('.cdchangedfile[data-path="pkg/env.go"][aria-current="true"]'));
    all('.cdmodes .cdcontrol').find((b) => text(b) === "File").click();
    await until(".cdsrc");
    await quiet();
    out.fileLines = all(".cdsrc").map(text);
    sel(".cdwrap").click();
    await quiet();
    out.wrap = sel(".cdfileview").classList.contains("wrap");
    sel(".cdtofeed").click();
    await quiet();
    out.returned = !sel(".cdfileview") && !sel(".cdside").hidden && !sel(".cdfeedslot").hidden;
    sel('.cdnode[data-path="pkg"]').click();
    await until('.cdnode[data-path="pkg/env.go"]');
    await quiet();
    out.treeMarks = text(sel('.cdnode[data-path="pkg/env.go"]'));
    out.folderCrumb = text(sel(".cdallfiles .cdcrumbs"));
    sel(".cdallfiles .cdup").click();
    await quiet();
    out.treeBackRoot = !sel(".cdallfiles .cdcrumbs");
    sel('.cdnode[data-path="pkg"]').click();
    await until('.cdnode[data-path="pkg/env.go"]');
    await quiet();
    sel('.cdnode[data-path="pkg/env.go"]').click();
    await until(".cdfileview");
    await quiet();
    out.treeOpened = text(sel(".cdfilepath")).replace(/\s/g, "");
    if (!wide) {
        history.back();
        await until(() => !sel(".cdfileview"));
        await quiet();
        out.backToFolder = !sel(".cdside").hidden && Boolean(sel('.cdnode[data-path="pkg/env.go"]'));
        history.back();
        await until(() => sel(".cdside").hidden);
        await quiet();
        out.backToConversation = !sel(".cdfeedslot").hidden;
        sel(".pmore").click();
        await until(".cmdsheet.tools");
        await quiet();
        out.toolFileEntry = sel(".cmdsheet.tools").textContent.includes("Files of the project");
    } else {
        sel(".cdtofeed").click();
        await quiet();
        button.click();
        await quiet();
        out.folded = sel(".cdside").hidden && !button.classList.contains("on");
    }
    out.noTabs = !sel(".cdtabs") && !sel(".cdsidetabs");

    return out;
})();
</script>
