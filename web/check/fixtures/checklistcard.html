<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div id="root" class="page"></div>

<script type="module">
// Live rows of the sessions list on a phone: a session at work on the fourth
// of seven steps of its checklist, a quiet one whose checklist is all behind
// it, one that asks the person something while its checklist is half done,
// one that keeps no checklist, and a thread of codex keeping one as a claude
// session does.
import { h, render } from "preact";
import { ProjectBlock, blocksOf } from "/src/screens/sessions/blocks.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const base = {
    tokens: 184000, limit: 1000000, pct: 18.4, limitKnown: true, messages: 42, model: "claude-opus-5-5",
    status: "idle", transport: "stream",
    startedAt: new Date(Date.now() - 3 * 3600e3).toISOString(),
    lastRequestAt: new Date(Date.now() - 120e3).toISOString(),
};
const steps = (done, active, pending) => [
    ...Array.from({ length: done }, (_, i) => ({ text: `step ${i + 1}`, status: "done", since: base.startedAt })),
    ...Array.from({ length: active }, () => ({ text: "the watcher waits for the background and checks a fresh snapshot again",
                                               status: "active", since: base.startedAt })),
    ...Array.from({ length: pending }, (_, i) => ({ text: `later ${i + 1}`, status: "pending" })),
];
const rows = [
    { ...base, session: "busy", sessionId: "a", status: "busy", checklist: { items: steps(3, 1, 3), at: base.startedAt } },
    { ...base, session: "done", sessionId: "b", checklist: { items: [...steps(6, 0, 0), { text: "gone", status: "dropped" }], at: base.startedAt } },
    { ...base, session: "asks", sessionId: "c", ask: { header: "Which way", count: 1 }, checklist: { items: steps(1, 0, 2), at: base.startedAt } },
    { ...base, session: "plain", sessionId: "d" },
    { ...base, session: "codex-5afc361b", sessionId: "0199c3a2-7f10-7b2e-9c41-6e1d5afc361b", agent: "codex",
      model: "gpt-6-sol", effort: "high", status: "busy",
      checklist: { items: [{ text: "read the router", status: "done", since: base.startedAt },
                           { text: "fix the test of the router", status: "active", since: base.startedAt },
                           { text: "run the suite", status: "pending" }], at: base.startedAt } },
];
const exec = { available: true, kinds: ["session.close", "session.open"] };
const blocks = blocksOf({ profile: null, sessions: rows });

render(
    h(ToastHost, null, h(GateHost, null, blocks.map((block) =>
        h(ProjectBlock, { key: block.key, block, exec, onOpen: () => {} })))),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    for (let i = 0; i < 100 && document.querySelectorAll(".pjblock").length < 5; i++) await sleep(20);
    const out = {};
    for (const card of document.querySelectorAll(".sc")) {
        const step = card.querySelector(".scstep");
        const segs = Array.from(card.querySelectorAll(".scsegs i"));
        out[card.dataset.name] = {
            state: text(card.querySelector(".scsay")),
            step: text(step),
            stepTip: step.getAttribute("title") || "",
            n: text(card.querySelector(".scn")),
            segs: segs.map((i) => i.className === "scd" ? "d" : i.className === "sca" ? "a" : "-").join(""),
            over: Boolean(card.querySelector(".scsegs.scover")),
            empty: Boolean(card.querySelector(".scsegs.scempty")),
        };
    }
    return out;
})();
</script>
