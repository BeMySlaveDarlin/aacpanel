<link rel="stylesheet" href="/dist/bundle.css">
<div id="root" class="page"></div>

<script type="module">
// Live rows of the sessions list on a phone: a session at work on the fourth
// of seven steps of its checklist, a quiet one whose checklist is all behind
// it, one that asks the person something while its checklist is half done,
// and one that keeps no checklist.
import { h, render } from "preact";
import { ProjectBlock, blocksOf } from "/src/screens/sessions/blocks.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const base = {
    tokens: 184000, limit: 1000000, pct: 18.4, limitKnown: true, messages: 42, model: "claude-opus-5-5",
    status: "idle", transport: "stream",
    startedAt: new Date(Date.now() - 3 * 3600e3).toISOString(),
    lastRequestAt: new Date(Date.now() - 120e3).toISOString(),
};
const steps = (done, active, pending) => [
    ...Array.from({ length: done }, (_, i) => ({ text: `step ${i + 1}`, status: "done", since: base.startedAt })),
    ...Array.from({ length: active }, () => ({ text: "the watcher waits for the background and checks a fresh snapshot again",
                                               status: "active", since: base.startedAt })),
    ...Array.from({ length: pending }, (_, i) => ({ text: `later ${i + 1}`, status: "pending" })),
];
const rows = [
    { ...base, session: "busy", sessionId: "a", status: "busy", checklist: { items: steps(3, 1, 3), at: base.startedAt } },
    { ...base, session: "done", sessionId: "b", checklist: { items: [...steps(6, 0, 0), { text: "gone", status: "dropped" }], at: base.startedAt } },
    { ...base, session: "asks", sessionId: "c", ask: { header: "Which way", count: 1 }, checklist: { items: steps(1, 0, 2), at: base.startedAt } },
    { ...base, session: "plain", sessionId: "d" },
];
const exec = { available: true, kinds: ["session.close", "session.open"] };
const blocks = blocksOf({ profile: null, sessions: rows });

render(
    h(ToastHost, null, h(GateHost, null, blocks.map((block) =>
        h(ProjectBlock, { key: block.key, block, exec, onOpen: () => {}, onMore: () => {} })))),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const cut = (el) => Boolean(el) && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1);

window.done = (async () => {
    for (let i = 0; i < 100 && document.querySelectorAll(".pjblock").length < 4; i++) await sleep(20);
    await document.fonts.ready;
    const out = {};
    for (const block of document.querySelectorAll(".pjblock")) {
        const state = block.querySelector(".pjstate");
        const said = block.querySelector(".pjtext");
        const checklist = block.querySelector(".pjchecklist");
        const a = said.getBoundingClientRect();
        const b = checklist ? checklist.getBoundingClientRect() : null;
        out[text(block.querySelector(".pjname"))] = {
            state: text(said),
            stateCut: cut(said),
            stateLines: Math.round(a.height / parseFloat(getComputedStyle(said).lineHeight)),
            checklist: text(checklist),
            inState: Boolean(checklist) && checklist.parentElement === state,
            below: Boolean(b) && b.top >= state.getBoundingClientRect().bottom - 1,
            lived: text(block.querySelector(".pjlived")),
            livedOnLine: (() => {
                const l = block.querySelector(".pjlived");
                if (!l) return false;
                const r = l.getBoundingClientRect();
                return Math.abs(r.top - a.top) < 4 && r.left >= a.right - 1;
            })(),
            checklistWidth: b ? Math.round(b.width) : 0,
            checklistInside: Boolean(b) && b.right <= block.querySelector(".pjside").getBoundingClientRect().left + 0.5,
        };
    }
    out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    return out;
})();
</script>
