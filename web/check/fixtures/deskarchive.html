<script type="module">
// The archive panel the desktop ships, over a fake service: the map labels its
// contours in its own words, and one contour of the collector is not on the map
// at all.
import { h, render } from "preact";
import { Archive } from "/src/desktop/panels/archive.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const profiles = { profiles: [
    { id: 7, name: "Acme Labs", configDir: "/home/u/.claude-profiles/acme" },
    { id: 9, name: "The Workshop", configDir: "/home/u/.claude-profiles/shop" },
    { id: 3, name: "personal", configDir: "/home/u/.claude" },
] };

// The pages of the panel follow the map, plus whatever the collector reports
// that the map has never heard of.
const names = ["Acme Labs", "The Workshop", "personal", "off-the-map"];

const row = (id, profile, at) => ({
    sessionId: id, name: `talk ${id}`, cwd: "/srv/proj/lab", profile,
    model: "claude-opus-5", pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000,
    limit: 1000000, messages: 4, lastAt: at, startedAt: at, lastRequestAt: at,
});

const rows = [
    row("11111111-1111-4111-8111-111111111111", "acme", "2026-09-14T09:00:00.000Z"),
    row("22222222-2222-4222-8222-222222222222", "personal", "2026-09-13T09:00:00.000Z"),
];

const asked = [];
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) {
        asked.push(new URL(u, location.origin).search);
        return new Response(JSON.stringify({ rows, total: rows.length, limit: 20, offset: 0 }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

const exec = { available: true };
const root = document.getElementById("root");
const show = (picks) => render(
    h(ToastHost, null, h(GateHost, null,
        h(Archive, { profiles, names, picks, setPicks: () => {}, exec, onOpen: () => {} }))), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const settle = async () => {
    for (let i = 0; i < 50 && !document.querySelector(".dkarch"); i++) await sleep(50);
    await sleep(150);
};

window.done = (async () => {
    show([]);
    await settle();
    const all = [...asked];
    const sections = [...document.querySelectorAll(".dkcontourname")].map((e) => e.textContent);

    asked.length = 0;
    show(["Acme Labs", "The Workshop"]);
    await settle();
    const labelled = [...document.querySelectorAll(".dkcontourname")].map((e) => e.textContent);

    asked.length = 0;
    show(["off-the-map"]);
    await settle();
    const unknown = [...asked];

    return { all, labelled, unknown, sections };
})();
</script>
