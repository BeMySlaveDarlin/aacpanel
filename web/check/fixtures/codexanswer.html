<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A codex thread at work with a question it asked without waiting hanging in
// the feed. Words of one's own typed in the composer then are the answer: they
// go naming the question, the card closes as they leave, and the row under
// them says they went as the answer, with nothing to take back. The next
// message, the question answered, goes as any message does — into the queue,
// with its way back. The page opened as codexanswer.html#asks stops before
// the words are typed, and as #answered once the answer has gone, for a
// picture.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const items = [
    { pos: 600, at: ago(8), role: "me", text: "Tidy the header", cut: false },
    { pos: 1400, at: ago(7), role: "ai", text: "The header has the logo and the title.", cut: false },
    { pos: 2300, at: ago(6), role: "question", use: "call_ask_logo",
      asks: [{ title: "Should the logo stay in the header?", options: ["Keep it", "Drop it"] }] },
];

const sent = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        const body = JSON.parse(init.body);
        sent.push(body);
        return json({ ok: true, detail: body.params.asked
            ? "the answer went into the turn that runs"
            : "the message waits in the panel's queue, first" });
    }
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length,
                      moreBefore: false, state: { tasks: [], agents: [] } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.unqueue", "session.stop", "session.close"] };
const thread = {
    session: "codex-0000abcd", sessionId: PARENT, profile: "acme", agent: "codex", transport: "stream",
    status: "busy", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/site",
    ask: { header: "", text: "Should the logo stay in the header?", count: 1, at: ago(6), async: true },
};
setLiveSessions([thread]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const one = (sel) => root.querySelector(sel);
const card = () => {
    const el = one(".chatfeed .xrquestion");
    return {
        head: text(el.querySelector(".sentlabel")),
        options: Array.from(el.querySelectorAll(".askopt")).map(text),
        answer: text(el.querySelector(".xranswer")),
    };
};
// What stands under the message last sent from the composer: the line where
// its time will be, and whether it offers a way back from the queue.
const lastSent = () => {
    const stamps = Array.from(root.querySelectorAll(".chatfeed .mstamp"));
    return { stamp: text(stamps[stamps.length - 1]), takeBack: root.querySelectorAll(".chatfeed .mqueue").length };
};
const placeholder = () => one(".composer textarea").placeholder;

const write = async (words) => {
    const area = one(".composer textarea");
    area.value = words;
    area.dispatchEvent(new Event("input", { bubbles: true }));
    if (!await until(() => one(".composer .sendbtn") && !one(".composer .sendbtn").disabled)) {
        throw new Error("the send button did not come");
    }
    const before = sent.length;
    one(".composer .sendbtn").click();
    if (!await until(() => sent.length > before && !one(".chatfeed .mclock"))) throw new Error("the message did not go");
    await settled();
};

const open = async () => {
    await document.fonts.ready;
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => one(".chatfeed .xrquestion") && one(".composer textarea"))) {
        throw new Error("the question or the composer did not come");
    }
    await settled();
};

window.done = (async () => {
    await open();
    const out = { asks: { card: card(), placeholder: placeholder() } };
    if (location.hash === "#asks") return {};
    await write("Drop it, the title is enough");
    out.answered = { card: card(), placeholder: placeholder(), ...lastSent() };
    if (location.hash === "#answered") return {};
    await write("And make the footer dark");
    out.after = { card: card(), ...lastSent() };
    out.sent = sent.map((r) => ({ kind: r.kind, target: r.target, params: r.params }));
    return out;
})();
</script>
