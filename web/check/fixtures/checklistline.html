<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="composerbox" id="busy"></div>
<div class="composerbox" id="idle"></div>
<div class="composerbox" id="over"></div>
<div class="composerbox" id="long"></div>
<div class="composerbox" id="none"></div>
<div class="composerbox" id="busynone"></div>
<script type="module">
// The bar over the composer of a phone with the checklist of the work: a
// session running a command on the fourth of seven steps, the same checklist
// with the session quiet, a checklist all behind, a checklist of forty steps,
// and two sessions that keep no checklist — one quiet, one at work.
import { render } from "preact";
import { html } from "/src/html.js";
import { WorkStatus } from "/src/screens/chat/work.js";

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const feed = [
    { role: "me", text: "go on", at: ago(40), pos: 1 },
    { role: "tools", kind: "bash", run: 5, pos: 5, at: ago(10),
      calls: [{ name: "Bash", arg: "go test ./web/check/", pos: 5, index: 0, at: ago(10), open: true }] },
];
const step = (text, status, sec) => (sec == null ? { text, status } : { text, status, since: ago(sec) });
const checklist = {
    items: [
        step("read the code", "done", 3000), step("find where it is drawn", "done", 2400),
        step("write the fixtures", "done", 1800),
        step("the watcher waits for the background and checks a fresh snapshot again", "active", 900),
        step("the script and the client answer WAIT", "pending"), step("skills: WAIT and --anyway", "pending"),
        step("the panel: what stops the close", "pending"),
    ],
    at: ago(900),
    note: "waits on the test base",
};
const over = {
    items: [...checklist.items.slice(0, 6).map((s) => ({ ...s, status: "done", since: ago(60) })),
            { text: "a second collector", status: "dropped" }],
    at: ago(60),
};
const long = {
    items: Array.from({ length: 40 }, (_, i) => (i < 20 ? step(`step ${i + 1}`, "done", 600)
        : i === 20 ? step("the twenty-first step, at work", "active", 60) : step(`step ${i + 1}`, "pending"))),
    at: ago(60),
};
const opened = [];
const put = (id, props) => render(html`<${WorkStatus} work=${null} compacting="" feed=${feed} onCalls=${() => {}}
    onChecklist=${() => opened.push(id)} ...${props} />`, document.getElementById(id));
put("busy", { busy: true, checklist });
put("idle", { busy: false, checklist });
put("over", { busy: false, checklist: over });
put("long", { busy: true, checklist: long });
put("none", { busy: false, checklist: null });
put("busynone", { busy: true, checklist: null });

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const box = (el) => (el ? el.getBoundingClientRect() : null);
const until = async (ok) => { for (let i = 0; i < 100 && !ok(); i++) await sleep(20); };

// What one bar says of the checklist and where it stands in the bar.
const read = (id) => {
    const root = document.getElementById(id);
    const bar = root.querySelector(".workbar.status");
    const line = root.querySelector(".ckline");
    const kids = bar ? Array.from(bar.children) : [];
    const step = root.querySelector(".ckstep");
    return {
        bar: Boolean(bar),
        line: Boolean(line),
        first: Boolean(line) && kids[0] === line,
        kids: kids.map((k) => k.className),
        word: text(root.querySelector(".ckword")),
        num: text(root.querySelector(".cknum")),
        step: text(step),
        stepWidth: step ? Math.round(box(step).width) : 0,
        ticks: Array.from(root.querySelectorAll(".ckticks i")).map((i) => i.className),
        ticksRight: line ? Math.round(box(line).right - box(root.querySelector(".ckticks")).right) : -1,
        lineAbove: Boolean(line && root.querySelector(".nowbar")) && box(line).bottom <= box(root.querySelector(".nowbar")).top + 1,
        inside: Boolean(line && bar) && box(line).left >= box(bar).left - 0.5 && box(line).right <= box(bar).right + 0.5,
        oneLine: Boolean(line) && box(line).height < 44,
        now: Boolean(root.querySelector(".nowbar")),
    };
};

window.done = (async () => {
    const out = {};
    try {
        await until(() => document.querySelectorAll(".ckline").length >= 4);
        for (const id of ["busy", "idle", "over", "long", "none", "busynone"]) out[id] = read(id);
        document.querySelector("#idle .ckline").click();
        document.querySelector("#busy .ckline").click();
        out.opened = opened.join(",");
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
