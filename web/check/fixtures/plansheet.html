<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A session on a phone at work on the fourth of seven steps of its plan, one
// step of it dropped along the way: the line of the plan heads the card over
// the composer, and a tap on it opens the whole plan in a sheet.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

// Times of today: a step done today is said by its time alone.
const at = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };
const today = (iso) => new Date(iso).toLocaleString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const items = [
    { role: "me", text: "go on with the plan", at: at(10, 0), pos: 1 },
    { role: "tools", kind: "bash", run: 5, pos: 5, at: at(10, 20),
      calls: [{ name: "Bash", arg: "make check", pos: 5, index: 0, at: at(10, 20), open: true }] },
];
const plan = {
    items: [
        { text: "read the code", status: "done", since: at(10, 4) },
        { text: "a second collector", status: "dropped" },
        { text: "write the tests", status: "done", since: at(10, 9) },
        { text: "mutate the lines of the feature", status: "active", since: at(10, 18) },
        { text: "the full check", status: "pending" },
        { text: "shots of the live screen", status: "pending" },
        { text: "hand it back", status: "pending" },
    ],
    at: at(10, 18),
    note: "waits on the test base",
};
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: 5, total: items.length, moreBefore: false,
                      state: { tasks: [], agents: [], workflows: [], plan } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const live = { status: "busy", transport: "stream", pct: 40.2, tokens: 402000, limit: 1000000, cwd: "/srv/proj" };
render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="lab" id="s1" live=${live} exec=${exec}
    onBack=${() => {}} onUsage=${() => {}} />`)), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const until = async (ok) => { for (let i = 0; i < 100 && !ok(); i++) await sleep(30); };

window.done = (async () => {
    const out = {};
    try {
        await until(() => document.querySelector(".composerbox .nowbar") && document.querySelector(".composerbox .planline"));
        const bar = document.querySelector(".composerbox .workbar.status");
        out.lineFirst = Boolean(bar) && bar.firstElementChild === bar.querySelector(".planline");
        out.line = text(document.querySelector(".composerbox .planline"));
        document.querySelector(".composerbox .planline").click();
        await until(() => document.querySelector(".sheet.on .planlist"));
        const sheet = document.querySelector(".sheet.on");
        out.title = text(sheet.querySelector(".sheethead h2"));
        out.sub = text(sheet.querySelector(".sheethead .chatsub"));
        out.label = sheet.getAttribute("aria-label");
        const note = sheet.querySelector(".plannote");
        const list = sheet.querySelector(".planlist");
        out.note = text(note);
        out.noteOnTop = Boolean(note && list) && note.getBoundingClientRect().bottom <= list.getBoundingClientRect().top + 0.5;
        out.steps = Array.from(sheet.querySelectorAll(".plstep")).map((li) => ({
            cls: li.className,
            text: text(li.querySelector(".pltext")),
            at: text(li.querySelector(".plat")),
            tick: Boolean(li.querySelector(".plmark svg")),
            struck: getComputedStyle(li.querySelector(".pltext")).textDecorationLine,
            tag: li.querySelector(".pltext").tagName.toLowerCase(),
        }));
        out.times = { done1: today(at(10, 4)), done2: today(at(10, 9)), active: today(at(10, 18)) };
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
