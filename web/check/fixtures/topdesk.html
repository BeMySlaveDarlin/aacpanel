<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<link rel="stylesheet" href="/vendor/uplot.css">
<style>html,body{height:100%;margin:0}</style>
<!-- The Machine section at a desk: the table under a host metric holds the
     containers of the history and the processes of the machine together, and
     the card of the panel says its release and a newer one only when one is
     out. -->
<div class="dkshell">
  <div id="root" class="dkmain"></div>
</div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<script type="module">
import { h, render } from "preact";
import { quiet } from "/check/fixtures/quiet.js";
import { MachineCenter } from "/src/desktop/machine.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const SNAPSHOT = {
    programs: { codex: { version: "0.163.0" }, claude: { version: "2.1.283" } },
    lanCertificate: { name: "panel.example.org", expiresAt: 1800000000, daysLeft: 13 },
    panel: { version: "v1.2.0", check: true, newer: { tag: "v1.3.0", page: "https://github.com/BeMySlaveDarlin/aacpanel/releases/tag/v1.3.0", update: "./install.sh update" } },
    host: {
        cpuPct: 7, cpus: 24, load: [1, 2, 3], uptime: 6000,
        mem: { used: 1e10, total: 6e10, available: 5e10, pct: 18, swapUsed: 0, swapTotal: 1e10 },
        disks: [], net: [],
    },
};
const TOP = {
    sortBy: "avg", resolution: "a minute",
    rows: [
        { container: "warden-db", avg: 12.5, max: 40.2, alive: true, coverage: 1 },
        { container: "monitor", avg: 2.1, max: 6.3, alive: true, coverage: 1 },
    ],
};
const PROCS = {
    state: "ok", at: 1600000000, total: 851,
    items: [
        { pid: 4242, cmd: "/usr/bin/python3 /home/dev/burn.py", cpuPct: 91.5, rss: 524288000, user: "dev" },
    ],
};

window.fetch = async (url) => {
    const at = String(url);
    const body = at.includes("/api/procs") ? PROCS : {};
    return { ok: true, status: 200, json: async () => body, text: async () => JSON.stringify(body) };
};


const until = async (condition) => {
    const deadline = performance.now() + 4000;
    while (!condition()) {
        if (performance.now() > deadline) throw new Error("machine rows did not settle");
        await new Promise(requestAnimationFrame);
    }
};

const draw = (snapshot) => render(h(ToastHost, null, h(GateHost, null, h(MachineCenter, {
    snapshot, probes: [], history: [], topCpu: TOP, topMem: TOP, cat: "cpu",
}))), document.getElementById("root"));

// release reads the card of the panel drawn with the panel the snapshot says.
const release = async (panel) => {
    draw({ ...SNAPSHOT, panel });
    await until(() => document.querySelector(".panelrel .panelversion")?.textContent === (panel.version || "version unknown"));
    const link = document.querySelector(".panelnew a");
    return { text: document.querySelector(".panelrel").textContent.replace(/\s+/g, " ").trim(), link: link ? link.getAttribute("href") : "" };
};

window.done = (async () => {
    draw(SNAPSHOT);

    await until(() => document.querySelectorAll(".dkttr:not(.dkth)").length === 3);
    await quiet();

    const rows = [...document.querySelectorAll(".dkttr:not(.dkth)")].map((row) => {
        const cells = [...row.children].map((c) => c.textContent.trim());
        return { kind: cells[0], name: cells[1], avg: cells[2], peak: cells[3], title: row.getAttribute("title") || "" };
    });
    const note = (document.querySelector(".dktopnote") || document.querySelector(".dkempty") || {}).textContent || "";

    const order = [".dkttr", ".programs", ".lancert"].map((selector) => [...document.querySelectorAll("*")].indexOf(document.querySelector(selector)));
    const out = { rows, note, order, programs: document.querySelector(".programs")?.textContent, certificate: document.querySelector(".lancert")?.textContent, warning: !!document.querySelector(".lancert .warn") };
    out.release = {
        newer: await release(SNAPSHOT.panel),
        level: await release({ version: "v1.3.0", check: true }),
        off: await release({ version: "v1.2.0", check: false }),
        unknown: await release({ version: "", check: false }),
    };
    return out;
})();
</script>
