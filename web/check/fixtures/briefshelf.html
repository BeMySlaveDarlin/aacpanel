<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="dkpage"><div id="root"></div></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The shelf over a host with four briefs: one sent, one answered and waiting to
// go, one half done and one nobody has opened.
import { h, render } from "preact";
import { ToastHost } from "/src/ui/toasts.js";
import { Briefs } from "/src/screens/briefs.js";

const now = Date.now();
const iso = (minutes) => new Date(now - minutes * 60000).toISOString();

const briefs = [
    { id: "teleport", sessionId: "11111111-1111-4111-8111-111111111111", cwd: "/srv/gateway",
      title: "Teleport as an adapter, not a foundation", eyebrow: "the access scheme",
      at: iso(20), questions: 5, answered: 0, sent: false },
    { id: "twelve", sessionId: "22222222-2222-4222-8222-222222222222", cwd: "/srv/harness",
      title: "Twelve forks in the harness", eyebrow: "after the review",
      at: iso(28), questions: 12, answered: 12, sent: true },
    { id: "what-is-left", sessionId: "33333333-3333-4333-8333-333333333333", cwd: "/srv/proj",
      title: "What is left to decide", eyebrow: "the first real brief",
      at: iso(1020), questions: 5, answered: 5, sent: false },
    { id: "cmux", sessionId: "44444444-4444-4444-8444-444444444444", cwd: "/srv/proj",
      title: "cmux beside tmux: what the panel loses and what it gains", eyebrow: "a look before the choice",
      at: iso(2600), questions: 7, answered: 3, sent: false },
];

const dropped = [];
window.fetch = async (url, init) => {
    const method = (init && init.method) || "GET";
    if (String(url) === "/api/briefs" && method === "GET") {
        return new Response(JSON.stringify({ briefs }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (method === "DELETE") {
        dropped.push(String(url));
        // The shelf of the host loses it too, so a list read again does not
        // bring the document back.
        const id = String(url).split("/").pop();
        const at = briefs.findIndex((c) => c.id === id);
        if (at >= 0) briefs.splice(at, 1);
        return new Response(JSON.stringify({ ok: true }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

const snapshot = {
    sessions: [
        { session: "harness", sessionId: "22222222-2222-4222-8222-222222222222", cwd: "/srv/harness" },
        { session: "lab", sessionId: "44444444-4444-4444-8444-444444444444", cwd: "/srv/proj" },
    ],
};

render(h(ToastHost, null,
    h(Briefs, { snapshot, exec: { available: true, kinds: ["session.send"] }, onSession: () => {} })),
    document.getElementById("root"));

const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());

// The shelf is fetched before it is drawn: the page waits for what it reads
// rather than for a guess at how long that takes, which a busy machine outruns.
const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => setTimeout(r, 25));
};

(async () => {
    await until(() => document.querySelector(".bcard") && document.querySelector(".bcard-live"));
    const cards = Array.from(document.querySelectorAll(".bcard"));


    const shot = {
        head: (document.querySelector(".bshelf-h") || {}).textContent || "",
        titles: text(".bcard-t"),
        states: text(".bcard-state"),
        live: text(".bcard-live"),
        meta: text(".bcard-meta"),
        // Where each card sits, to see whether the shelf is a column or a grid.
        tops: cards.map((c) => Math.round(c.getBoundingClientRect().top)),
        widths: cards.map((c) => Math.round(c.getBoundingClientRect().width)),
        bars: cards.map((c) => {
            const fill = c.querySelector(".bcard-bar i");
            return fill ? Math.round(fill.getBoundingClientRect().width / c.getBoundingClientRect().width * 100) : -1;
        }),
    };

    // The cross beside a card asks once, then removes.
    const x = document.querySelector(".bcard-x");
    const removing = { there: Boolean(x), first: "", gone: 0, before: document.querySelectorAll(".bcard").length };
    if (x) {
        x.click();
        await until(() => document.querySelector(".bcard-x.asking"));
        removing.first = (document.querySelector(".bcard-x.asking") || {}).textContent || "";
        const again = document.querySelector(".bcard-x.asking");
        if (again) again.click();
        await until(() => document.querySelectorAll(".bcard").length < removing.before);
        removing.gone = document.querySelectorAll(".bcard").length;
        removing.titles = Array.from(document.querySelectorAll(".bcard-t")).map((n) => n.textContent.trim());
        removing.stillAsking = document.querySelectorAll(".bcard-x.asking").length;
        removing.asked = dropped.slice();
    }

    window.done = { ...shot, removing };
})();
</script>
