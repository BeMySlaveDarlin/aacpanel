<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div class="shell" id="shell"></div>
<script type="module">
// The limits at the top of every contour page of the phone: claude's five
// hours and seven days, signed Claude, and beside them in their row codex's
// week, signed Codex. A contour without codex keeps claude's two, a contour
// codex alone spent in has codex's alone, and an account that told no week,
// ran into its limit or has not renewed its numbers for a while says so. One
// contour has a share with a tenth, a reset that has come and one in minutes,
// and no week. An account with no five-hour window has its week beside
// codex's.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Sessions } from "/src/screens/sessions.js";
import { Nav } from "/src/ui/nav.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 20, offset: 0 });
    if (u.startsWith("/api/term")) return json({ available: false });
    return json({});
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const now = Math.floor(Date.now() / 1000);
// Half an hour past the whole hour, so the hours left read the same through the run.
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 + 1800 });
const codex = (ageSec, more) => ({ at: now - ageSec, ageSec, codexHome: "/home/u/.codex", windows: [], ...more });
const profileMap = [
    { id: 4, profile: "Acme", name: "Acme", groups: [] },
    { id: 3, profile: "personal", name: "personal", groups: [] },
    { id: 5, profile: "lab", name: "lab", groups: [] },
    { id: 6, profile: "globex", name: "globex", groups: [] },
    { id: 7, profile: "initech", name: "initech", groups: [] },
    { id: 8, profile: "hooli", name: "hooli", groups: [] },
];
const limits = { contours: [
    { profile: "Acme", contour: 4, ageSec: 30, fiveHour: part(7, 3), sevenDay: part(41, 98),
      codex: codex(30, { plan: "pro", sevenDay: part(38, 52) }) },
    { profile: "personal", contour: 3, ageSec: 30, fiveHour: part(12, 2), sevenDay: part(24, 100) },
    { profile: "lab", codex: codex(30, { reached: "rate_limit" }) },
    { profile: "globex", contour: 6, ageSec: 30, fiveHour: part(30, 4), sevenDay: part(55, 101),
      codex: codex(4000, { sevenDay: part(92, 102), reached: "rate_limit" }) },
    { profile: "initech", contour: 7, ageSec: 30, fiveHour: { pct: 99.5, resetsAt: now - 60 }, sevenDay: part(64, 0),
      codex: codex(30, { plan: "plus" }) },
    { profile: "hooli", contour: 8, ageSec: 30, sevenDay: { pct: 10 }, codex: codex(30, { sevenDay: part(72, 85) }) },
] };
const run = (session, contour) => ({ session, sessionId: `${session}-id`, status: "idle", transport: "stream",
    pct: 12, tokens: 100000, limit: 1000000, cwd: `/srv/${session}`, model: "claude-opus-5-5", contour });
const sessions = [run("shop", 4), run("infra", 4), run("notes", 3)];
const exec = { available: true, kinds: ["session.send"] };
const wait = { opening: () => [], of: () => null };
const shell = document.getElementById("shell");

render(h(ToastHost, null, h(GateHost, null, html`
    <main class="body">
        <${Sessions} snapshot=${{ at: 1, sessions, profileMap, limits }} error=${null} ageSec=${1} exec=${exec}
                     wait=${wait} faults=${[]} onLayer=${() => {}} onUsage=${() => {}} />
    </main>
    <${Nav} current="sessions" onSelect=${() => {}} home=${null} />
`)), shell);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 100 && !ok(); i += 1) await sleep(30);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    if (!await until(() => document.querySelectorAll(".pfpage .pflimits").length === profileMap.length)) throw new Error("the contour pages did not show their limits");
    return { pages: [...document.querySelectorAll(".pfpage")].map((page, i) => ({
        name: profileMap[i].profile,
        rings: [...page.querySelectorAll(".limit-ring")].map((ring) => ({
            agent: ring.dataset.agent,
            word: text(ring.querySelector(".agentword")),
            window: text(ring.querySelector(".limit-dial")),
            label: ring.getAttribute("aria-label"),
            title: ring.title,
            tone: ring.className,
            old: ring.classList.contains("old"),
        })),
        notes: [...page.querySelectorAll(".limits-note")].map(text),
    })) };
})();
</script>
