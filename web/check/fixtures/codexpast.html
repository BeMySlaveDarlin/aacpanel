<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} #phone{width:390px} #chat{height:700px;display:flex;flex-direction:column}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="phone"></main></div>
<div id="desk"></div>
<div class="shell no-nav"><main class="body" id="chat"></main></div>
<span id="codexhue" style="color: var(--agent-codex)"></span><span id="claudehue" style="color: var(--agent-claude)"></span>
<script type="module">
// The archive of a contour with a thread of codex beside a conversation of
// claude: on the phone's archive and in the archive panel of the desktop, the
// thread reads by the word of its agent, resumes in the daemon of its home and
// opens the feed of its rollout by its id.
import { h, render } from "preact";
import { Past } from "/src/screens/sessions/past.js";
import { Archive } from "/src/desktop/panels/archive.js";
import { shelfOf } from "/src/desktop/sessions.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const THREAD = "01a120b0-28ab-7600-8dfe-714b9a8a82d7";
const CLAUDE = "11111111-1111-4111-8111-111111111111";
const project = { id: 7, name: "Admin", session: "admin", path: "/srv/admin", group: "Work" };
const rows = [
    { sessionId: CLAUDE, name: "admin", cwd: "/srv/admin", profile: "acme", project, model: "claude-opus-5",
      pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000, limit: 1000000, messages: 4,
      prompts: ["look at the login page of the admin"],
      lastAt: "2026-10-10T12:00:00.000Z", startedAt: "2026-10-10T11:00:00.000Z" },
    { sessionId: THREAD, agent: "codex", name: "admin", nameGuessed: true, cwd: "/srv/admin", profile: "acme", project,
      model: "gpt-6-astra", effort: "xhigh", pct: 0, pctMax: 0, tokens: 0, tokensMax: 0, tokensUsed: 29361219,
      messages: 0, prompts: [], lastAt: "2026-10-10T10:36:21.376Z", startedAt: "2026-10-09T12:42:58.106Z" },
];

const sent = [];
const asked = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "resumed", session: "codex-8a82d7", contour: "acme" });
    }
    if (u.startsWith("/api/sessions/archive")) return json({ rows, total: rows.length, limit: 60, offset: 0 });
    if (u.startsWith("/api/chat?")) {
        asked.push(u);
        return json({ items: [{ role: "ai", text: "The router lives in src/router.", pos: 1, at: "2026-10-10T10:36:21Z" }],
            first: 1, last: 1, total: 1, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.resume", "session.open"] };
const opened = [];
const openChat = (name, id) => {
    opened.push({ name, id });
    const row = rows.find((r) => r.sessionId === id) || null;
    render(h(ToastHost, null, h(GateHost, null, h(Chat, {
        name, id, live: null, archive: row, exec, snapshot: { sessions: [] }, onBack() {}, onUsage() {},
    }))), document.getElementById("chat"));
};
render(h(ToastHost, null, h(GateHost, null, h(Past, {
    profile: "acme", contour: 4, map: null, sessions: [], onBack() {}, onProject() {}, exec, chat: openChat,
}))), document.getElementById("phone"));
render(h(ToastHost, null, h(GateHost, null, h(Archive, {
    profiles: { profiles: [] }, names: ["acme"], picks: [], setPicks() {}, exec, onOpen() {},
}))), document.getElementById("desk"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const color = (el) => (el ? getComputedStyle(el).color : "");

// confirm presses the button of the gate's sheet and waits for the action to go.
const confirm = async (count) => {
    if (!await until(() => document.querySelector(".btnrow .btn.primary"))) throw new Error("the gate did not ask");
    const effect = text(document.querySelector(".warnline"));
    document.querySelector(".btnrow .btn.primary").click();
    if (!await until(() => sent.length === count)) throw new Error("the resume did not go");
    await sleep(50);
    return effect;
};

window.done = (async () => {
    const phone = document.getElementById("phone");
    const desk = document.getElementById("desk");
    if (!await until(() => phone.querySelectorAll(".pjpast").length === 2)) throw new Error("the phone shows no archive");
    if (!await until(() => desk.querySelectorAll(".dkarch").length === 2)) throw new Error("the desktop shows no archive");

    const line = (row) => ({
        word: text(row.querySelector(".agentword")),
        agent: (row.querySelector(".agentword") || { dataset: {} }).dataset.agent || "",
        hue: color(row.querySelector(".agentword")),
        about: text(row.querySelector(".pjabout")),
        when: text(row.querySelector(".pjwhen")),
        resume: Boolean(row.querySelector(".pjresume")),
    });
    const out = {
        hues: { codex: color(document.getElementById("codexhue")), claude: color(document.getElementById("claudehue")) },
        phone: Array.from(phone.querySelectorAll(".pjpast")).map(line),
        desk: Array.from(desk.querySelectorAll(".dkarch")).map((row) => ({
            word: text(row.querySelector(".agentword")),
            hue: color(row.querySelector(".agentword")),
            num: text(row.querySelector(".dknum")),
            model: text(row.querySelector(".dkarchmodel")),
        })),
        // The shelf keeps a conversation a project; this one is the thread alone.
        shelf: shelfOf([rows[1]]).map((r) => r.sessionId),
    };

    const codexRow = Array.from(phone.querySelectorAll(".pjpast")).find((row) => row.querySelector(".agentword"));
    codexRow.querySelector(".pjresume").click();
    out.effect = await confirm(1);

    const deskRow = Array.from(desk.querySelectorAll(".dkarch")).find((row) => row.querySelector(".agentword"));
    deskRow.querySelector(".dkacts .dkact").click();
    await confirm(2);
    out.sent = sent;

    codexRow.querySelector(".pjopen").click();
    const chat = document.getElementById("chat");
    if (!await until(() => chat.querySelector(".chatfeed .msg.ai"))) throw new Error("the feed of the thread did not open");
    out.opened = opened;
    out.feed = Array.from(chat.querySelectorAll(".chatfeed .msg.ai")).map(text);
    out.asked = asked;
    return out;
})();
</script>
