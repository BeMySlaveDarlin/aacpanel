<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A codex thread that asked without waiting, as the collector folds
// agent/testdata/codex-async-questions.jsonl, its last question given options:
// the first question answered by the message that came after it, the last
// one hanging while codex works on. A tap on an option of the hanging one
// sends that option as the answer to that question; the page opened as
// codexquestion.html#asked stops before the tap, for a picture.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const items = [
    { pos: 600, at: ago(20), role: "me", text: "Theme the settings page", cut: false },
    { pos: 1400, at: ago(19), role: "ai", text: "I ask, then go on.", cut: false },
    { pos: 2300, at: ago(19), role: "question", use: "call_ask_theme",
      asks: [{ title: "Which theme should the page take?", options: ["Light", "Dark"] }] },
    { pos: 3100, at: ago(18), role: "me", text: "Dark", cut: false },
    { pos: 4000, at: ago(17), role: "ai", text: "The page is dark now.", cut: false },
    { pos: 5000, at: ago(6), role: "me", text: "And the header?", cut: false },
    { pos: 5900, at: ago(5), role: "question", use: "call_ask_logo",
      asks: [{ title: "Should the logo stay in the header?", options: ["Keep it", "Drop it"] }] },
];

const sent = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "the answer went into the turn that runs" });
    }
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length,
                      moreBefore: false, state: { tasks: [], agents: [] } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.close"] };
const thread = {
    session: "codex-0000abcd", sessionId: PARENT, profile: "acme", agent: "codex", transport: "stream",
    status: "busy", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/site",
    ask: { header: "", text: "Should the logo stay in the header?", count: 1, at: ago(5), async: true },
};
setLiveSessions([thread]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel) => Array.from(root.querySelectorAll(sel));
const card = (el) => ({
    head: text(el.querySelector(".sentlabel")),
    titles: Array.from(el.querySelectorAll(".asktext")).map(text),
    options: Array.from(el.querySelectorAll(".askopt")).map((o) => text(o) + (o.classList.contains("on") ? " (on)" : "")),
    answer: text(el.querySelector(".xranswer")),
});

const open = async () => {
    await document.fonts.ready;
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => all(".chatfeed .xrquestion").length === 2)) throw new Error("the questions did not come");
    await settled();
};

window.done = location.hash === "#asked" ? open().then(() => ({})) : (async () => {
    await open();
    const out = {
        before: all(".chatfeed .xrquestion").map(card),
        head: text(root.querySelector(".chathead")),
    };
    const hanging = all(".chatfeed .xrquestion")[1];
    Array.from(hanging.querySelectorAll(".askpick")).find((b) => text(b) === "Drop it").click();
    if (!await until(() => sent.length > 0 && all(".chatfeed .xrquestion")[1].querySelector(".askopt.on"))) {
        throw new Error("the answer did not go");
    }
    await settled();
    out.sent = sent.map((r) => ({ kind: r.kind, target: r.target, params: r.params }));
    out.after = card(all(".chatfeed .xrquestion")[1]);
    return out;
})();
</script>
