<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style id="shape"></style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="host"></div>
<script type="module">
// The chat screen over a feed with a row of every role: every mark of it has
// to be on the screen, or one tap away — a band unfolded, a report read whole,
// the work of an exchange opened, the calls of a badge listed. On a phone the
// work opens as a layer; on a desk it stands beside the feed.
import { h, render } from "preact";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { WIDE } from "/src/ui/wide.js";
import { items, NOW } from "/check/fixtures/feedroles.js";

const wide = window.matchMedia(WIDE).matches;
const now = Date.parse(NOW);
Date.now = () => now;
document.getElementById("shape").textContent = wide
    ? "html,body,#host{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}"
    : "html,body,#host{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}";
document.getElementById("host").innerHTML = wide
    ? '<div class="deskshell"><div class="dkbody"><aside class="dkleft"></aside><section class="dkcenter dkchat" id="root"></section></div></div>'
    : '<div class="shell"><div class="body" id="root"></div></div>';

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items, first: 1, last: 103, total: items.length, moreBefore: true, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };
const live = { session: "lab", status: "busy", pct: 20, transport: "stream", cwd: "/srv/proj", tokensIn: 1000, tokensOut: 100,
               lastRequestAt: NOW };
render(h(ToastHost, null, h(GateHost, null, h(Chat, { name: "lab", id: "s1", live, exec: { available: true },
    onBack() {}, onUsage() {} }))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (test, what) => {
    for (let i = 0; i < 150; i++) {
        const got = test();
        if (got) return got;
        await sleep(20);
    }
    throw new Error(`the screen never came to ${what}`);
};
const marks = [...new Set(JSON.stringify(items).match(/MARK-[a-z]+(?:-[a-z]+)*-?\d*/g))];
const seen = new Set();
const look = (el) => {
    const text = el ? el.textContent : "";
    for (const m of marks) if (text.includes(m)) seen.add(m);
    return text;
};
const feedText = () => document.querySelector(".chatfeed").textContent;
const sheetOn = (label) => Array.from(document.querySelectorAll(".sheet.on")).find((s) => s.getAttribute("aria-label") === label);
const closeSheet = async (label) => {
    sheetOn(label).querySelector(".sheetclose").click();
    await until(() => !sheetOn(label), `the ${label} sheet closed`);
};

// Every badge in a box opens a list of calls; what the list names is reachable.
const badgesIn = async (box, where) => {
    const out = [];
    for (const badge of Array.from(box.querySelectorAll(".mtools:not(.mturn)"))) {
        badge.click();
        const sheet = await until(() => sheetOn("tool calls"), `the calls of a badge in ${where}`);
        await until(() => sheet.querySelector(".calltime"), "the list of calls");
        look(sheet);
        out.push({ badge: badge.getAttribute("aria-label"), title: badge.title, failed: badge.classList.contains("mtfail"),
                   calls: sheet.querySelectorAll(".callnode:not(.still)").length });
        await closeSheet("tool calls");
    }
    return out;
};

window.done = (async () => {
    await document.fonts.ready;
    await until(() => document.querySelector(".chatfeed .ep"), "the episodes");
    const first = {
        bands: document.querySelectorAll(".epband").length,
        full: document.querySelectorAll(".chatfeed .ep:not(.epwait)").length,
        waiting: (document.querySelector(".epwait") || { textContent: "" }).textContent.includes("MARK-queued-103"),
        now: (document.querySelector(".epnow") || { textContent: "" }).textContent.replace(/\s+/g, " ").trim(),
        stubs: document.querySelectorAll(".epstub").length,
    };
    look(document.querySelector(".chatfeed"));

    // Unfold every band, the way a person would: one tap each.
    for (let band = document.querySelector(".epband"); band; band = document.querySelector(".epband")) {
        const before = document.querySelectorAll(".epband").length;
        band.click();
        await until(() => document.querySelectorAll(".epband").length < before, "a band unfolded");
    }
    for (const more of Array.from(document.querySelectorAll(".epreadall"))) more.click();
    await until(() => !document.querySelector(".epreadall"), "every report read whole");
    look(document.querySelector(".chatfeed"));
    const unfolded = {
        feed: feedText(),
        stubs: document.querySelectorAll(".epstub").length,
        shots: document.querySelectorAll(".chatfeed .mshot").length,
        command: document.querySelectorAll(".chatfeed .cmdcard").length,
        turns: document.querySelectorAll(".chatfeed .mturn").length,
        link: (document.querySelector(".chatfeed a.artifact") || { href: "" }).href,
    };

    const work = [];
    if (wide) {
        const side = document.querySelector(".epside");
        look(side);
        work.push({ text: side.textContent, sections: side.querySelectorAll(".epsideep").length,
                    badges: await badgesIn(side, "the process") });
    } else {
        // Every stub, and the card of what goes on now, opens the work of its exchange.
        const doors = Array.from(document.querySelectorAll(".epstub, .epnow"));
        for (let i = 0; i < doors.length; i++) {
            Array.from(document.querySelectorAll(".epstub, .epnow"))[i].click();
            const layer = await until(() => sheetOn("work") && sheetOn("work").querySelector(".wlayer"), "the work layer");
            look(layer);
            work.push({ text: layer.textContent, badges: await badgesIn(layer, "the work layer") });
            await closeSheet("work");
        }
    }
    // The badges of the feed itself: the ones summing a stretch of work.
    const summed = await badgesIn(document.querySelector(".chatfeed"), "the feed");

    return {
        wide, first, unfolded, work, summed,
        missing: marks.filter((m) => !seen.has(m)),
        marks: marks.length,
    };
})();
</script>
