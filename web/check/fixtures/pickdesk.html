<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="shell no-nav"><main class="body" id="root"></main></div></div>
<script type="module">
// A live session on a wide screen: inside the composer the model with its
// effort and the mode, each a menu over the composer; the effort opens beside
// the model's menu, in the place of the older models.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const catalog = { state: "ok", models: [
    { id: "claude-opus-5-5", name: "Claude Opus 5.5" }, { id: "claude-fable-5-1", name: "Claude Fable 5.1" },
    { id: "claude-opus-5", name: "Claude Opus 5" }, { id: "claude-sonnet-5", name: "Claude Sonnet 5" },
    { id: "claude-fable-5", name: "Claude Fable 5" }, { id: "claude-opus-4-8", name: "Claude Opus 4.8" },
    { id: "claude-opus-4-7", name: "Claude Opus 4.7" }, { id: "claude-sonnet-4-6", name: "Claude Sonnet 4.6" },
    { id: "claude-opus-4-6", name: "Claude Opus 4.6" }, { id: "claude-haiku-4-5-20251001", name: "Claude Haiku 4.5" },
] };
const efforts = ["low", "medium", "high", "xhigh", "max"];
const listed = [
    { value: "default", resolved: "claude-opus-5-5[1m]", name: "Default (recommended)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "opus[1m]", resolved: "claude-opus-5-5[1m]", name: "Opus (1M context)", description: "Opus 5.5 with 1M context · Best for everyday, complex tasks", efforts },
    { value: "claude-fable-5-1[1m]", resolved: "claude-fable-5-1", name: "Fable", description: "Fable 5.1 · Most capable for your hardest and longest-running tasks", efforts },
    { value: "sonnet", resolved: "claude-sonnet-5", name: "Sonnet", description: "Sonnet 5 · Efficient for routine tasks", efforts },
    { value: "haiku", resolved: "claude-haiku-4-5-20251001", name: "Haiku", description: "Haiku 4.5 · Fastest for quick answers" },
];
const sent = [];
let transport = "stream";
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/models")) {
        const session = transport === "stream"
            ? { transport, list: listed, mode: "auto", effort: "xhigh", picked: "opus[1m]" }
            : { transport };
        return json({ state: "ok", session, catalog });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true, detail: "ok" });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "session.command", "session.set", "session.stop"] };
const stream = { status: "idle", transport: "stream", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj",
    model: "claude-opus-5-5", effort: "xhigh", mode: "auto" };
const terminal = { ...stream, transport: "" };
const root = document.getElementById("root");
const show = (live) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="helios" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, ms = 3000) => {
    const end = Date.now() + ms;
    while (!ok() && Date.now() < end) await sleep(20);
};
const text = (sel) => Array.from(root.querySelectorAll(sel)).map((n) => n.textContent.trim());
const count = (sel) => root.querySelectorAll(sel).length;
const pick = (what) => root.querySelector(`.pickbar .pkchip[data-pick=${what}]`);
const chips = () => Array.from(root.querySelectorAll(".pickbar .pkchip"));
const key = async (k) => { document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true })); await sleep(250); };
const tap = async (el) => { el.click(); await sleep(300); };

const model = ".pkmenu[aria-label=model]";
const effortSub = `${model} > .pkmenu.pksub[aria-label=effort]`;
// A row of the model's menu that opens a list beside it, by its name.
const beside = (name) => Array.from(root.querySelectorAll(`${model} > .pkmorerow`))
    .find((r) => r.querySelector(".pkname").textContent.trim() === name);
// The lists the model's menu has open beside it, and the rows that say so.
const subs = () => Array.from(root.querySelectorAll(`${model} > .pkmenu.pksub`)).map((m) => m.getAttribute("aria-label"));
const expanded = () => Array.from(root.querySelectorAll(`${model} > .pkmorerow[aria-expanded=true] .pkname`)).map((n) => n.textContent.trim());
const openEffort = async () => {
    await tap(pick("model"));
    await until(() => beside("Effort"));
    await tap(beside("Effort"));
    await until(() => count(effortSub) > 0);
};

(async () => {
    show(stream);
    await until(() => chips().length > 0);
    const out = {};
    out.chips = chips().map((c) => c.textContent.trim());
    out.inComposer = count(".composer .cstrip .pickbar");

    await tap(pick("model"));
    await until(() => beside("More models"));
    out.modelMenu = text(`${model} > .pkrow .pkname`);
    out.numbers = text(`${model} > .pkrow .pknum`);
    out.marked = text(`${model} > .pkrow.on .pkname`);
    out.effortRow = text(`${model} > .pkmorerow .pkrowval`);

    // The older models open beside the menu, the effort takes their place,
    // and the older models take it back.
    await tap(beside("More models"));
    out.more = text(`${model} > .pkmenu.pksub[aria-label="more models"] .pkname`);
    out.subsMore = subs();
    await tap(beside("Effort"));
    await until(() => count(effortSub) > 0);
    out.subsEffort = subs();
    out.expandedEffort = expanded();
    out.effortHead = text(`${effortSub} .pkmenuhead`)[0] || "";
    out.effortStops = Array.from(root.querySelectorAll(`${effortSub} .pkstop`)).map((b) => b.getAttribute("aria-label"));
    const knob = root.querySelector(`${effortSub} .pkstop.on`);
    out.effortOn = knob ? knob.getAttribute("aria-label") : "";
    const menuBox = root.querySelector(model).getBoundingClientRect();
    const subBox = root.querySelector(effortSub).getBoundingClientRect();
    out.effortBeside = subBox.left >= menuBox.right && Math.abs(subBox.bottom - menuBox.bottom) < 1;
    // A press inside the list beside the menu is a press inside the menu.
    root.querySelector(`${effortSub} .pkmenuhead`).dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    await sleep(250);
    out.insideKeeps = count(effortSub);
    await tap(beside("More models"));
    out.subsBack = subs();
    out.expandedBack = expanded();

    // A digit picks a model with the effort open beside the menu, as without it.
    await tap(beside("Effort"));
    await key("3");
    out.afterKey = count(".pkmenu");

    await tap(pick("mode"));
    out.modeMenu = text(".pkmenu[aria-label=mode] .pkrow .pkname");
    out.modeOn = text(".pkmenu[aria-label=mode] .pkrow.on .pkname");
    await key("Escape");
    out.afterModeEscape = count(".pkmenu");

    await openEffort();
    await key("Escape");
    out.afterEscape = count(".pkmenu");

    await openEffort();
    root.querySelector(".chatfeed").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    await sleep(250);
    out.afterAway = count(".pkmenu");

    await openEffort();
    await tap(root.querySelector(`${effortSub} .pkstop[aria-label="High"]`));
    out.afterEffort = count(".pkmenu");

    await tap(pick("mode"));
    await tap(Array.from(root.querySelectorAll(".pkmenu[aria-label=mode] .pkrow")).find((r) => r.textContent.includes("Accept edits")));
    out.chipsAfter = chips().map((c) => c.textContent.trim());

    out.sent = sent.map((b) => `${b.kind}:${JSON.stringify(b.params)}`);
    out.confirm = Boolean(document.querySelector(".sheet.on .btnrow"));

    // A session that says no effort shows the model alone.
    show({ ...stream, effort: "" });
    await until(() => !root.querySelector(".pickbar .pkeff"));
    out.bare = chips().map((c) => c.textContent.trim());
    window.done = out;
})();
</script>
