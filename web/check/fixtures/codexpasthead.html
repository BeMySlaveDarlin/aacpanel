<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} .body{height:420px;display:flex;flex-direction:column}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="codex"></main></div>
<div class="shell no-nav"><main class="body" id="claude"></main></div>
<script type="module">
// The head of a closed conversation, on the phone and at a desk: a thread of
// codex from the archive says what it spent, as its row in the archive does,
// for the archive of codex keeps no fill of its context; a conversation of
// claude keeps its peak.
import { h, render } from "preact";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const THREAD = "01a120b0-28ab-7600-8dfe-714b9a8a82d7";
const CLAUDE = "11111111-1111-4111-8111-111111111111";
const codex = { sessionId: THREAD, agent: "codex", name: "admin", cwd: "/srv/admin", profile: "acme",
                model: "gpt-6-astra", effort: "xhigh", pct: 0, pctMax: 0, tokens: 0, tokensMax: 0, tokensUsed: 29361219,
                messages: 0, prompts: [], lastAt: "2026-10-10T10:36:21.376Z", startedAt: "2026-10-09T12:42:58.106Z" };
const claude = { sessionId: CLAUDE, name: "admin", cwd: "/srv/admin", profile: "acme", model: "claude-opus-5",
                 pct: 12, pctMax: 40, tokens: 400000, tokensMax: 400000, limit: 1000000, messages: 4,
                 prompts: ["look at the login page"], lastAt: "2026-10-10T12:00:00.000Z" };

const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items: [{ role: "ai", text: "Done.", pos: 1, at: "2026-10-10T10:36:21Z" }],
            first: 1, last: 1, total: 1, moreBefore: false, state: null });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.resume"] };
for (const [where, row] of [["codex", codex], ["claude", claude]]) {
    render(h(ToastHost, null, h(GateHost, null, h(Chat, {
        name: row.name, id: row.sessionId, live: null, archive: row, exec, snapshot: { sessions: [] },
        onBack() {}, onUsage() {},
    }))), document.getElementById(where));
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

// head reads the head of one conversation, whichever the screen drew: the
// line under the name and whether a bar of the context stands under it.
const head = (root) => ({
    desk: Boolean(root.querySelector(".dkhead")),
    sub: text(root.querySelector(".dkwhosub") || root.querySelector(".chathead .chatsub")),
    bar: Boolean(root.querySelector(".ctxbar")),
});

window.done = (async () => {
    const codexRoot = document.getElementById("codex");
    const claudeRoot = document.getElementById("claude");
    if (!await until(() => codexRoot.querySelector(".chatfeed .msg.ai") && claudeRoot.querySelector(".chatfeed .msg.ai"))) {
        throw new Error("the conversations did not open");
    }
    const out = { codex: head(codexRoot), claude: head(claudeRoot) };
    // The sheet of the tools says the same of the thread on the phone.
    const more = codexRoot.querySelector("button.pmore");
    out.tools = null;
    if (more) {
        more.click();
        if (await until(() => document.querySelector(".mcpfacts"))) {
            out.tools = Array.from(document.querySelectorAll(".mcpfacts li"))
                .map((li) => `${text(li.querySelector(".cmdname"))}: ${text(li.querySelector(".cmdtok"))}`);
        }
    }
    return out;
})();
</script>
