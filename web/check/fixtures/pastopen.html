<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div id="root"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The buttons of an archived card over a fake service. Two contours hold a
// project of the same name, and one row of the archive ran outside the map.
import { h, render } from "preact";
import { PastActions } from "/src/screens/sessions/actions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const onTheMap = {
    sessionId: "11111111-1111-4111-8111-111111111111",
    name: "Common", cwd: "/srv/proj/Labs/ai-platform", messages: 12,
    project: { id: 42, name: "AI platform", session: "ai-platform", path: "/srv/proj/Labs/ai-platform", group: "Labs" },
};
const offTheMap = {
    sessionId: "22222222-2222-4222-8222-222222222222",
    name: "Stray", cwd: "/srv/elsewhere/lab", messages: 3,
};

const sent = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return new Response(JSON.stringify({ ok: true, detail: "up" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

const exec = { available: true, kinds: ["session.open", "session.resume"] };

render(
    h(ToastHost, null, h(GateHost, null, [
        h(PastActions, { key: "a", row: onTheMap, exec }),
        h(PastActions, { key: "b", row: offTheMap, exec }),
    ])),
    document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const press = async (label) => {
    const btn = Array.from(document.querySelectorAll("button"))
        .find((n) => (n.getAttribute("aria-label") || "") === label);
    if (!btn) return `no button labelled ${label}`;
    btn.click();
    await sleep(150);
    const ok = document.querySelector(".btnrow .btn.primary");
    if (!ok) return "the confirmation never came up";
    ok.click();
    await sleep(250);
    return "";
};

window.done = (async () => {
    const trouble = [];
    trouble.push(await press("new session in project AI platform"));
    trouble.push(await press("new session in project lab"));
    return { sent, trouble: trouble.filter(Boolean) };
})();
</script>
