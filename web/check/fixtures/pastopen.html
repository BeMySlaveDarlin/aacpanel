<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div id="root"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The new session of an archived conversation, pressed on its row of the
// archive over a fake service. Two contours hold a project of the same name,
// and one row of the archive ran outside the map.
import { h, render } from "preact";
import { Archive } from "/src/desktop/panels/archive.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const onTheMap = {
    sessionId: "11111111-1111-4111-8111-111111111111",
    name: "Common", cwd: "/srv/proj/Labs/api", messages: 12,
    project: { id: 42, name: "API", session: "api", path: "/srv/proj/Labs/api", group: "Labs" },
};
const offTheMap = {
    sessionId: "22222222-2222-4222-8222-222222222222",
    name: "Stray", cwd: "/srv/elsewhere/lab", messages: 3,
};
const rows = [onTheMap, offTheMap];

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sent = [];
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/sessions/archive")) return json({ rows, total: rows.length, offset: 0 });
    if (u === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "up" });
    }
    return new Response("", { status: 404 });
});

const exec = { available: true, kinds: ["session.open", "session.resume"] };

render(
    h(ToastHost, null, h(GateHost, null,
        h(Archive, { profiles: null, names: [], picks: [], setPicks: () => {}, onOpen: () => {}, exec }))),
    document.getElementById("root"));

const rowOf = (name) => Array.from(document.querySelectorAll(".dkarch"))
    .find((r) => r.querySelector(".dkname").textContent.trim() === name);

// press presses the new session of a row — the second of its icons, after
// Resume — and says yes to the gate.
const press = async (name) => {
    const row = rowOf(name);
    const plus = row ? row.querySelectorAll(".dkacts .dkact")[1] : null;
    if (!plus) return `no new session on the row of ${name}`;
    plus.click();
    await quiet();
    const ok = document.querySelector(".btnrow .btn.primary");
    if (!ok) return "the confirmation never came up";
    ok.click();
    await quiet();
    return "";
};

window.done = (async () => {
    await quiet();
    const trouble = [];
    trouble.push(await press("Common"));
    trouble.push(await press("Stray"));
    return { sent, trouble: trouble.filter(Boolean) };
})();
</script>
