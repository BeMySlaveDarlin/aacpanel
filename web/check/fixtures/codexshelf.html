<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A codex thread whose own turn is over while one of the two agents it
// started works on: the state of the thread lists both, as the collector
// reads agent/testdata/codex-agents-second.jsonl. The thread is busy with its
// turn over — the bar over the composer says the agents work, the chip counts
// the one at work, and the composer sends rather than stops; the list of the
// agents names each with its role and how it stands, stops the one at work by
// the id of its own thread, and an agent opens its own thread.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const PARENT = "01a12345-0000-7000-8000-00000000abcd";
const LEXER = "01a12348-0000-7000-8000-0000000000c1";
const TESTS = "01a12348-0000-7000-8000-0000000000c2";

const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const items = [
    { pos: 707, at: ago(14), role: "me", text: "Split the parser work between two agents", cut: false },
    { pos: 1613, at: ago(13), role: "spawn", use: "call_spawn_lexer", text: "", cut: false,
      spawned: [{ id: LEXER, name: "lexer", role: "explorer", model: "gpt-6-astra", effort: "low", state: "running" }] },
    { pos: 2901, at: ago(12), role: "spawn", use: "call_spawn_tests", text: "", cut: false,
      spawned: [{ id: TESTS, name: "tests", role: "", model: "gpt-6-astra", effort: "medium", state: "running" }] },
    { pos: 9293, at: ago(6), role: "agentstates", spawned: [{ id: LEXER, state: "completed" }] },
    { pos: 9293, at: ago(6), role: "notice", from: "agent lexer", text: "finished", level: "ok" },
    { pos: 11491, at: ago(5), role: "ai", text: "The lexer drops escaped quotes; tests go on.", cut: false },
];
const state = { tasks: [], agents: [
    { agent: "codex", kind: "subagent", id: TESTS, name: "tests", status: "active", at: ago(12), model: "gpt-6-astra" },
    { agent: "codex", kind: "subagent", id: LEXER, name: "lexer", text: "explorer", status: "completed",
      at: ago(13), doneAt: ago(6), model: "gpt-6-astra" },
] };
const lexerItems = [{ pos: 1, at: ago(9), role: "ai", text: "The lexer drops escaped quotes." }];

const asked = [];
const sent = [];
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
const feed = (list, work) => json({ items: list, first: list[0].pos, last: list[list.length - 1].pos, total: list.length,
                                    moreBefore: false, state: work });
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "the agent is stopped: its turn was interrupted" });
    }
    if (u.startsWith("/api/chat?")) {
        asked.push(new URL(u, location.href).searchParams.get("id"));
        if (u.includes(`id=${LEXER}&`)) return feed(lexerItems, null);
        return feed(items, state);
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.close", "agent.stop", "task.stop"] };
const thread = {
    session: "codex-0000abcd", sessionId: PARENT, profile: "acme", agent: "codex", transport: "stream",
    status: "busy", turnOver: true, work: { tasks: 0, agents: 1 },
    model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/parser", lastRequestAt: ago(5),
};
setLiveSessions([thread]);
const root = document.getElementById("root");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel) => Array.from(root.querySelectorAll(sel));

const open = async () => {
    await document.fonts.ready;
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => root.querySelector(".nowwait") && all(".wchips .wchip").length > 0)) {
        throw new Error("the thread did not come with its agents");
    }
    await settled();
};

// The pictures: the thread with its agents at work, and their list open over
// it, before anything is stopped — the page opened as codexshelf.html#shelf
// stops at the list. The checks below do not wait on them.
window.show = {
    thread: async () => {
        render(null, root);
        await open();
    },
    shelf: async () => {
        render(null, root);
        await open();
        root.querySelector(".wchips .wchip[aria-label^='subagents']").click();
        if (!await until(() => all(".worklist .wline").length === 2)) throw new Error("the list of the agents did not open");
        await settled();
    },
};

window.done = location.hash === "#shelf" ? window.show.shelf().then(() => ({})) : (async () => {
    await open();
    const out = {
        bar: text(root.querySelector(".nowwait .nowstate")),
        chips: all(".wchips .wchip").map((el) => ({ label: el.getAttribute("aria-label"), num: text(el.querySelector(".wnum")) })),
        send: Boolean(root.querySelector(".sendbtn")),
        stop: Boolean(root.querySelector("button[aria-label^='stop the work of session']")),
    };
    root.querySelector(".wchips .wchip[aria-label^='subagents']").click();
    if (!await until(() => all(".worklist .wline").length === 2)) throw new Error("the list of the agents did not open");
    await settled();
    out.sub = text(root.querySelector(".sheethead .chatsub"));
    out.rows = all(".worklist .wline").map((line) => ({
        name: text(line.querySelector(".wname")).replace(text(line.querySelector(".wname .agentword")), "")
            .replace(text(line.querySelector(".wname .wmodel")), "").trim(),
        word: text(line.querySelector(".agentword")),
        model: text(line.querySelector(".wmodel")),
        sub: text(line.querySelector(".wsub")),
        state: text(line.querySelector(".wstate")),
        stop: line.querySelector(".wstop") ? (line.querySelector(".wstop").disabled ? "off" : "on") : "none",
    }));
    // The agent at work is stopped by the id of its own thread.
    all(".worklist .wline")[0].querySelector(".wstop").click();
    await until(() => document.querySelector(".stitle") && document.querySelector(".btnrow .btn"));
    out.stopAsks = text(document.querySelector(".stitle"));
    const ok = [...document.querySelectorAll(".btnrow .btn")].pop();
    if (ok) ok.click();
    if (!await until(() => sent.length > 0 && text(all(".worklist .wline .wstate")[0]) === "stopped from the panel")) {
        throw new Error("the stop of the agent did not go");
    }
    out.stopSent = sent.map((r) => ({ kind: r.kind, target: r.target, params: r.params || null }));
    out.stopped = text(all(".worklist .wline .wstate")[0]);
    // The finished agent opens its own thread.
    all(".worklist .wline")[1].querySelector(".wrow").click();
    if (!await until(() => asked.includes(LEXER) && text(root.querySelector(".chatfeed")).includes("The lexer drops escaped quotes."))) {
        throw new Error("the thread of the agent did not open");
    }
    await settled();
    out.agent = { name: text(root.querySelector(".chathead h2")), sub: text(root.querySelector(".chathead .chatsub")) };
    return out;
})();
</script>
