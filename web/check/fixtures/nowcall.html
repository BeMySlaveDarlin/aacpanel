<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A session on a phone running a command after a read and a thought of the
// same run. The call named in the bar above the composer opens itself in the
// calls sheet, its way back leads to the list of the run, and a badge of the
// bar opens the list.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const items = [
    { role: "me", text: "deploy the site", at: ago(60), pos: 1 },
    { role: "think", run: 5, pos: 4, at: ago(50), count: 1, tokens: 300,
      spots: [{ seq: 0, at: ago(50), tokens: 300, pos: 4, index: 0 }] },
    { role: "tools", kind: "files", run: 5, pos: 5, at: ago(40),
      calls: [{ name: "Read", arg: "deploy/site.sh", pos: 5, index: 0, at: ago(40), use: "toolu_rd" }] },
    { role: "tools", kind: "bash", run: 5, pos: 6, at: ago(20),
      calls: [{ name: "Bash", arg: "ssh -p 69 fi-vps 'tar -x'", pos: 6, index: 0, at: ago(20), open: true, use: "toolu_sh" }] },
];
const asked = [];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat/call?")) {
        const q = new URL(u, location.href).searchParams;
        asked.push(`${q.get("pos")}:${q.get("i")}`);
        return json({ tool: "", args: "{}", result: "done", at: ago(20), resultAt: ago(19) });
    }
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: 6, total: items.length, moreBefore: false,
                      state: { tasks: [], agents: [], workflows: [] } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const live = { status: "busy", transport: "stream", pct: 40.2, tokens: 402000, limit: 1000000, cwd: "/srv/proj" };
render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="lab" id="s1" live=${live} exec=${exec}
    onBack=${() => {}} onUsage=${() => {}} />`)), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const until = async (ok) => { for (let i = 0; i < 300 && !ok(); i++) await sleep(30); };
const sheet = () => document.querySelector(".sheet.on[aria-label='tool calls']");
const depth = () => (history.state && history.state.overlay ? Number(history.state.depth) : 0);
// The conversation is a layer of its own, so the screen under the sheets
// already stands on an entry: every depth below is counted from it.
let base = 0;

// What the calls sheet shows: the call opened in it, or the list of the run.
const seen = () => {
    const s = sheet();
    if (!s) return { open: false };
    const view = s.querySelector(".phead");
    return {
        open: true,
        view: Boolean(view),
        title: text(s.querySelector(view ? ".phead h2" : ".sheethead h2")),
        place: view ? text(s.querySelector(".phead .chatsub span")) : "",
        rows: Array.from(s.querySelectorAll(".calltime .callnode")).map((n) => text(n.querySelector(".cnname"))),
    };
};
// A sheet gives its entry of the history back after it is gone, and the next
// one opened before that lands would count on the entry about to go: the walk
// waits until the history is back where it was.
const close = async () => {
    if (!sheet()) return;
    sheet().querySelector(".sheetclose").click();
    await until(() => !sheet() && depth() === base);
};

window.done = (async () => {
    const out = {};
    try {
        // Room to go back into: a gesture that walks past the layers leaves
        // the fixture rather than failing it.
        history.pushState({ pad: 1 }, "", location.href);
        history.pushState({ pad: 2 }, "", location.href);
        await until(() => document.querySelector(".composerbox .nowcall") && depth() >= 1);
        base = depth();

        // The call of the bar opens itself, and its arrow leads to the list.
        document.querySelector(".composerbox .nowcall").click();
        await until(() => sheet() && sheet().querySelector(".phead h2"));
        // The call asks the host from an effect after it is drawn, and joins
        // the back gesture a render later: both are waited for, or a slow
        // machine reads the call before it asked and presses its arrow before
        // the arrow leads anywhere.
        await until(() => asked.length > 0 && depth() >= base + 2);
        out.call = seen();
        out.asked = asked.slice();
        const arrow = sheet() && sheet().querySelector(".pback");
        if (arrow) arrow.click();
        await until(() => sheet() && !sheet().querySelector(".phead") && sheet().querySelector(".sheethead h2"));
        out.arrow = seen();

        // A call picked from that list, then the sheet shut over it: opened
        // again from the bar, the sheet starts on the bar's call.
        const read = sheet() && Array.from(sheet().querySelectorAll(".callnode"))
            .find((n) => text(n.querySelector(".cnname")) === "Read");
        if (read) read.click();
        await until(() => sheet() && text(sheet().querySelector(".phead h2")) === "Read");
        await close();
        document.querySelector(".composerbox .nowcall").click();
        await until(() => sheet() && sheet().querySelector(".phead h2"));
        out.again = seen();

        // The back gesture over the call leads to the list too, the sheet
        // staying open: the call takes its place on the gesture above the sheet.
        await until(() => depth() >= base + 2);
        history.back();
        await until(() => !sheet() || !sheet().querySelector(".phead"));
        out.gesture = seen();
        await close();

        // A badge of the bar opens the list.
        const badge = Array.from(document.querySelectorAll(".composerbox .nowchips .mtools"))
            .find((b) => b.classList.contains("k-bash"));
        if (badge) badge.click();
        await until(() => sheet() && sheet().querySelector(".sheethead h2"));
        out.badge = seen();
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
