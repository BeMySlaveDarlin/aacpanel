<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<div id="root"></div>
<script type="module">
// The terminals section of the wide screen: its button after the sessions,
// the places side by side as columns with home first, the choice of the ones
// shown and the button of a new terminal above them, a card opening its
// terminal under the tabs of its place, each with the × that closes it, and
// the window at the end of the line, and the × of each card.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { DesktopShell } from "/src/desktop/shell.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const shot = new URLSearchParams(location.hash.slice(1)).get("shot") || "";
const pause = async (name) => {
    if (shot !== name) return;
    await sleep(400);
    document.body.dataset.shot = name;
    await new Promise(() => {});
};

const now = Math.floor(Date.now() / 1000);
const T = (id, place, label, name, command, typedAgo, created, screen = {}) =>
    ({ id, place, label, name, command, activity: now - typedAgo, created: now - created, clients: 0, ...screen });
// Whether something runs is the host's word, not the command's: the host has
// not said so of git log, and its card has no dot.
let terms = [
    T("t-lab", "/data/lab", "lab", "zsh", "zsh", 7200, 9000),
    T("t-h1", "/home/u", "Home", "zsh", "zsh", 180, 8000),
    T("t-h2", "/home/u", "Home", "htop", "htop", 3600, 7000, { busy: true }),
    T("t-s1", "/srv/proj/shop", "shop", "make check", "make", 60, 6000, {
        busy: true,
        last: "ok   shop/internal/store   15.90s   coverage: 81.4% of statements in shop/internal/store/...",
    }),
    T("t-s2", "/srv/proj/shop", "shop", "zsh", "zsh", 720, 5000, { last: "u@helios shop main $" }),
    T("t-s3", "/srv/proj/shop", "shop", "git log", "git", 2400, 4000),
];
const profileMap = [
    { id: 1, profile: "personal", groups: [{ name: "Side", projects: [
        { id: 11, name: "shop", path: "/srv/proj/shop", session: "shop" },
    ] }] },
    { id: 2, profile: "work", groups: [{ name: "Lab", projects: [{ id: 21, name: "lab", path: "/data/lab", session: "lab" }] }] },
];

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const asked = [];
// held keeps the answer to the next close back until the walk lets it go, so
// the walk can look at a card whose close is on its way.
let held = null;
const holdClose = () => {
    let release;
    const answered = new Promise((r) => { release = r; });
    held = { answered, release };
    return held;
};
window.fetch = async (url, init) => {
    const u = String(url);
    if (u === "/api/term") return json({ available: true });
    if (u === "/api/terms") return json({ terms });
    if (u.startsWith("/api/term/")) return json({});
    if (u === "/api/actions" && init && init.method === "POST") {
        const body = JSON.parse(init.body);
        asked.push(body);
        if (body.kind === "term.close") {
            if (held) await held.answered;
            terms = terms.filter((t) => t.id !== body.params.id);
        }
        return json({ ok: true, detail: "", logged: true });
    }
    if (u.startsWith("/api/sessions/archive")) return json({ rows: [], total: 0, limit: 24, offset: 0 });
    if (u.startsWith("/api/profiles")) return json({ profiles: [] });
    if (u.startsWith("/api/usage/")) return json({ error: "usage is not collected here" }, 503);
    return json({});
};
const streams = [];
window.EventSource = class {
    static CONNECTING = 0;
    static OPEN = 1;
    static CLOSED = 2;
    constructor(url) {
        this.url = String(url);
        this.readyState = 1;
        this.on = {};
        streams.push(this);
    }
    addEventListener(name, fn) { this.on[name] = fn; }
    close() { this.readyState = 2; }
};
const lastStream = () => streams.filter((s) => s.url.startsWith("/api/term/stream")).pop() || null;

const exec = { available: true, kinds: ["term.start", "term.close", "term.rename", "term.console", "session.send"] };
const snapshot = { at: 1, hostName: "helios", sessions: [], profileMap, limits: null, host: { home: "/home/u" } };
const wait = { opening: () => [], of: () => null };
const alerts = { kind: "ready", alerts: [], older: [], reload: () => {} };
// mount draws the shell, and draws it again over itself with another
// executor: one that does not know how to close a tab.
const mount = (exec) => render(h(ToastHost, null, h(GateHost, null, html`<${DesktopShell} snapshot=${snapshot}
    tree=${{ stacks: [], running: 0, total: 0 }} treeError=${null} hostError=${null} ageSec=${1} history=${[]} faults=${[]}
    alerts=${alerts} openAlerts=${0} exec=${exec} onRefresh=${() => {}} wait=${wait}
    theme="space" onTheme=${() => {}} updateReady=${false} updating=${false} onApplyUpdate=${() => {}}
    route=${{ here: "", via: "", why: "", onRecheck: () => {}, onOpen: () => {} }}
    jump=${null} onJumped=${() => {}} />`)), document.getElementById("root"));
mount(exec);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
        const got = fn();
        if (got) return got;
        await sleep(30);
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const all = (sel, from = document) => Array.from(from.querySelectorAll(sel));
const sections = () => all(".dktop .dkibs")[0];
const sheet = () => document.querySelector(".sheet.on");
const closes = () => asked.filter((a) => a.kind === "term.close");
// The tabs over a terminal read as their names, the open one starred.
const cells = () => all(".dkterm .ttabsdesk .ttabcell");
const tabRow = () => cells().map((c) => `${text(c.querySelector("[role=tab]"))}${c.classList.contains("on") ? "*" : ""}`);
const xNamed = (name) => {
    const cell = cells().find((c) => text(c.querySelector("[role=tab]")) === name);
    return cell ? cell.querySelector(".ttabx") : null;
};
// inkOf is the colour a variable of the theme paints with where the tabs
// stand, or where the element at says.
const inkOf = (name, at = ".ttabsdesk") => {
    const probe = document.createElement("span");
    probe.style.color = `var(${name})`;
    document.querySelector(at).appendChild(probe);
    const ink = getComputedStyle(probe).color;
    probe.remove();
    return ink;
};
// A tab and its × read as on the phone.
const cellShot = (c) => {
    const tab = c.querySelector("[role=tab]");
    const x = c.querySelector(".ttabx");
    const name = tab.querySelector(".ttabname");
    const [tr, xr, nr, ir] = [tab, x, name, x.querySelector("svg")].map((el) => el.getBoundingClientRect());
    const style = getComputedStyle(x);
    return {
        name: text(name),
        on: c.classList.contains("on"),
        label: x.getAttribute("aria-label"),
        nested: tab.contains(x),
        role: c.getAttribute("role") || "",
        after: xr.left >= nr.right - 0.5,
        sameLine: Math.abs((xr.top + xr.bottom) / 2 - (nr.top + nr.bottom) / 2) <= 2,
        tall: xr.height >= tr.height - 0.5,
        width: Math.round(xr.width),
        icon: Math.round(Math.max(ir.width, ir.height)),
        shown: xr.width > 0 && xr.height > 0 && style.visibility === "visible" && style.opacity !== "0",
        ink: style.color === inkOf("--accent") ? "accent" : style.color === inkOf("--ink-faint") ? "faint" : style.color,
        cut: name.scrollWidth > name.clientWidth,
        ellipsis: getComputedStyle(name).textOverflow === "ellipsis",
    };
};
// A card and its × read as on the phone.
const cardXShot = (cell) => {
    const card = cell.querySelector(".tcard");
    const x = cell.querySelector(".tcardx");
    const [cr, xr, ir] = [card, x, x.querySelector("svg")].map((el) => el.getBoundingClientRect());
    const style = getComputedStyle(x);
    const meets = (r) => r.width > 0 && r.left < xr.right && xr.left < r.right && r.top < xr.bottom && xr.top < r.bottom;
    return {
        name: text(card.querySelector(".tcardname")),
        label: x.getAttribute("aria-label"),
        nested: card.contains(x),
        role: cell.getAttribute("role") || "",
        right: Math.round(cr.right - xr.right),
        top: Math.round(xr.top - cr.top),
        width: Math.round(xr.width),
        height: Math.round(xr.height),
        icon: Math.round(Math.max(ir.width, ir.height)),
        shown: xr.width > 0 && xr.height > 0 && style.visibility === "visible" && style.opacity !== "0",
        ink: style.color === inkOf("--ink-faint", ".tcardcell") ? "faint" : style.color,
        under: all(".tdot, .tcardname, .tcardwhen, .tcardlast", card)
            .filter((el) => meets(el.getBoundingClientRect())).map((el) => el.className),
    };
};
const termStreams = () => streams.filter((s) => s.url.startsWith("/api/term/stream")).length;
// A card reads as its name, its dot and the last line of its screen, with how
// that line is set, as on the phone.
const cardShot = (c) => {
    const last = c.querySelector(".tcardlast");
    const shot = {
        name: text(c.querySelector(".tcardname")),
        runs: c.querySelector(".tdot").classList.contains("run"),
        when: text(c.querySelector(".tcardwhen")),
        last: last ? last.textContent : null,
    };
    if (!last) return shot;
    const style = getComputedStyle(last);
    const range = document.createRange();
    range.selectNodeContents(last);
    const name = c.querySelector(".tcardname").getBoundingClientRect();
    const when = c.querySelector(".tcardwhen").getBoundingClientRect();
    const box = last.getBoundingClientRect();
    return {
        ...shot,
        // An ellipsis is a box of its own on the same line: lines count by their tops.
        lines: new Set(Array.from(range.getClientRects(), (r) => Math.round(r.top))).size,
        cut: last.scrollWidth > last.clientWidth,
        ellipsis: style.textOverflow === "ellipsis",
        mono: style.fontFamily === getComputedStyle(c.querySelector(".tcardname")).fontFamily,
        under: box.top >= name.bottom && Math.round(box.left) === Math.round(name.left) && Math.round(box.right) === Math.round(when.right),
    };
};

window.done = (async () => {
    const out = {};
    try {
        await document.fonts.ready;
        await until(() => all(".dkib", sections()).some((b) => b.getAttribute("aria-label") === "Terminals"));
        out.sections = all(".dkib", sections()).map((b) => b.getAttribute("aria-label"));
        all(".dkib", sections()).find((b) => b.getAttribute("aria-label") === "Terminals").click();

        await until(() => all(".pfdesk.row > .pfstack").length === 3 && all(".tcard").length === 6);
        const stacks = all(".pfdesk.row > .pfstack");
        out.columns = stacks.map((s) => {
            const r = s.getBoundingClientRect();
            return {
                head: text(s.querySelector(".theadname")),
                count: text(s.querySelector(".theadcount")),
                path: text(s.querySelector(".theadpath")),
                cards: all(".tcardname", s).map(text),
                shots: all(".tcard", s).map(cardShot),
                left: Math.round(r.left),
                top: Math.round(r.top),
            };
        });
        out.chooser = text(document.querySelector(".pfdesk.row > .pfsel .pfsellabel"));
        out.newButton = text(document.querySelector(".pfdesk.row > .pfsel .tnew"));
        out.cards = { x: all(".tcardcell").map(cardXShot) };
        await pause("E");

        // A card opens its terminal under the tabs of its place.
        all(".pfstack")[2].querySelectorAll(".tcard")[0].click();
        await until(() => document.querySelector(".dkterm") && lastStream());
        const head = document.querySelector(".dkterm .dkheadtop");
        out.opened = {
            back: text(head.querySelector(".tback")),
            tabs: all(".ttabsdesk .dktab:not(.tadd)", head).map(text),
            on: text(head.querySelector(".ttabsdesk .dktab.on")),
            buttons: all(":scope > .btn", head).map(text),
            stream: lastStream().url.replace(/&cols=.*$/, ""),
            columns: Boolean(document.querySelector(".pfdesk")),
            cells: cells().map(cellShot),
        };
        const s = lastStream();
        await until(() => s.on.ready && s.onmessage);
        s.on.ready({ data: JSON.stringify({ id: "in-1" }) });
        s.onmessage({ data: btoa(["u@helios shop main $ nice -n 10 make check", "ok   shop/internal/cart     0.21s",
            "ok   shop/internal/store   15.90s", "OK", "u@helios shop main $ "].join("\r\n")) });
        await until(() => document.querySelector(".dkterm .termwrap:not(.off)"));
        const term = document.querySelector(".dkterm .termwrap").getBoundingClientRect();
        out.fills = { height: Math.round(term.height), window: window.innerHeight, keys: Boolean(document.querySelector(".termkeys")) };
        await pause("E2");

        all(":scope > .btn", head).find((b) => text(b) === "Open in a window").click();
        await until(() => asked.some((a) => a.kind === "term.console"));
        // × on the open tab, where make runs, asks first.
        xNamed("make check").click();
        await until(() => document.querySelector(".sheet.on .tclose"));
        out.asked = asked.map((a) => a.kind);
        out.question = text(document.querySelector(".sheet.on .tclose .stitle"));
        all(".sheet.on .tclose .btn").find((b) => text(b) === "Close tab").click();
        await until(() => closes().length === 1 && lastStream().url.includes("term=t-s2"));
        out.closed = {
            action: closes()[0],
            on: text(document.querySelector(".dkterm .ttabsdesk .dktab.on")),
        };

        // × on the third tab, idle and not the open one, closes it at once
        // and leaves zsh open.
        await until(() => !sheet());
        xNamed("git log").click();
        await until(() => closes().length === 2 && tabRow().length === 1);
        out.other = { action: closes()[1], sheet: Boolean(sheet()), row: tabRow(), stream: lastStream().url.replace(/&cols=.*$/, "") };

        // An executor that does not know how to close a tab keeps every ×
        // down, saying why.
        mount({ ...exec, kinds: exec.kinds.filter((k) => k !== "term.close") });
        await until(() => xNamed("zsh") && xNamed("zsh").disabled);
        out.unknown = cells().map((c) => {
            const x = c.querySelector(".ttabx");
            return { disabled: x.disabled, title: x.getAttribute("title") || "" };
        });

        document.querySelector(".dkterm .tback").click();
        await until(() => document.querySelector(".pfdesk.row"));
        out.back = all(".pfdesk.row > .pfstack .theadname").map(text);

        // The executor still does not know how to close a terminal: the × of
        // every card is down too, saying why.
        await until(() => all(".tcardx").length > 0);
        out.cards.unknown = all(".tcardx").map((b) => ({
            name: b.getAttribute("aria-label"), disabled: b.disabled, title: b.getAttribute("title") || "",
        }));

        // With one that does, the × of each card closes it without opening a
        // terminal: home holds an idle zsh and htop running.
        mount(exec);
        const cardOf = (head, name) => {
            const stack = all(".pfdesk.row > .pfstack").find((st) => text(st.querySelector(".theadname")) === head);
            return stack ? all(".tcardcell", stack).find((c) => text(c.querySelector(".tcardname")) === name) || null : null;
        };
        const cardX = (head, name) => (cardOf(head, name) ? cardOf(head, name).querySelector(".tcardx") : null);
        // A walk that finds a terminal opened goes on to say so rather than
        // breaking off.
        const press = (el) => el && el.click();
        const seen = termStreams();
        const opened = () => Boolean(document.querySelector(".dkterm")) || termStreams() !== seen;
        await until(() => cardX("Home", "zsh") && !cardX("Home", "zsh").disabled && cardX("Home", "htop"));
        const before = all(".tcard").length;

        // × on the idle card closes it at once; the host keeps its answer back
        // for a moment, and the × stays down meanwhile, a second press
        // sending nothing.
        const hold = holdClose();
        cardX("Home", "zsh").click();
        await until(() => closes().filter((a) => a.params.id === "t-h1").length === 1);
        const down = await until(() => cardX("Home", "zsh") && cardX("Home", "zsh").disabled);
        press(cardX("Home", "zsh"));
        const twice = closes().filter((a) => a.params.id === "t-h1").length;
        const heldSheet = Boolean(sheet());
        held = null;
        hold.release();
        await until(() => !cardOf("Home", "zsh"));
        out.cards.idle = {
            closes: closes().filter((a) => a.params.id === "t-h1").length, down: Boolean(down), sentTwice: twice > 1,
            sheet: heldSheet || Boolean(sheet()), opened: opened(), gone: !cardOf("Home", "zsh"),
            before, after: all(".tcard").length,
        };

        // × on the card where htop runs asks first, naming it, and sends
        // nothing until the question is answered.
        press(cardX("Home", "htop"));
        await until(() => document.querySelector(".sheet.on .tclose"));
        await sleep(100);
        out.cards.running = {
            title: text(document.querySelector(".sheet.on .tclose .stitle")),
            sub: text(document.querySelector(".sheet.on .tclose .ssub")),
            closedBefore: closes().filter((a) => a.params.id === "t-h2").length,
        };
        press(all(".sheet.on .tclose .btn").find((b) => text(b) === "Close tab"));
        await until(() => closes().some((a) => a.params.id === "t-h2") && !cardOf("Home", "htop") && !sheet());
        Object.assign(out.cards.running, {
            closes: closes().filter((a) => a.params.id === "t-h2").length, gone: !cardOf("Home", "htop"), opened: opened(),
        });
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
