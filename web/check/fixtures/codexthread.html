<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// A codex thread on a phone, past the settings: its title in the header, the
// word Thread at the far end of the band and its sheet — compact, review,
// rename and the goal, each sent through the gate as a command of codex's own;
// the count of background processes under the composer and their list with a
// stop for each and for all; what the thread has, read-only, in its tools; and
// the models it can switch to asked of the session itself.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
const at = new Date(Date.now() - 60000).toISOString();
const items = [
    { role: "me", pos: 1, at, text: "Find out why the cart test is flaky." },
    { role: "ai", pos: 2, at, text: "It reads the clock twice." },
];
const sent = [];
const asked = [];
const processes = [
    { id: "proc-1", command: "npm run dev -- --port 5173", cwd: "/srv/shop", pid: null, cpu: null, rssKb: null },
    { id: "proc-2", command: "go test ./checkout/... -count=200", cwd: "/srv/shop" },
];
window.fetch = async (url, init) => {
    const u = String(url);
    asked.push(u);
    if (u.startsWith("/api/chat?")) return json({ items, first: 1, last: 2, total: 2, moreBefore: false, state: null });
    if (u.startsWith("/api/session/models")) {
        return json({ state: "ok", session: { agent: "codex", transport: "stream", effort: "high", picked: "gpt-6-astra", mode: "ask",
            list: [{ value: "gpt-6-astra", name: "gpt-6-astra", efforts: ["low", "high"], effort: "high" }] } });
    }
    if (u.startsWith("/api/session/processes")) return json({ state: "ok", processes });
    if (u.startsWith("/api/session/mcp")) {
        return json({ state: "ok", transport: "stream", agent: "codex", servers: [
            { name: "docs", status: "needs-auth", source: "config.toml", url: "https://docs.test", tools: [] },
            { name: "github", status: "connected", source: "plugin", tools: ["search", "issue"] }] });
    }
    if (u.startsWith("/api/session/setup")) {
        return json({ state: "ok", transport: "stream", agent: "codex", skills: [
            { name: "go-testing", description: "table tests, race, fuzz", source: "user", state: "on" }] });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.set", "session.file", "session.unqueue",
    "session.close", "session.command", "session.rename", "task.stop", "session.mcp"] };
const thread = {
    session: "codex-5afc361b", sessionId: "0199c3a2-7f10-7b2e-9c41-6e1d5afc361b", profile: "acme", agent: "codex",
    transport: "stream", status: "idle", model: "gpt-6-astra", effort: "high", mode: "ask", plan: false,
    tokens: 96000, limit: 272000, pct: 35, cwd: "/srv/shop", title: "Cart flakes", processes: 2,
};
const root = document.getElementById("root");
const show = async (live) => {
    render(null, root);
    setLiveSessions([live]);
    render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${live.session} id=${live.sessionId} live=${live}
        exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);
    if (!await until(() => root.querySelector("[data-pick=thread]") && root.querySelector(".chatfeed .msg.ai"))) throw new Error("the band did not show");
    await settled();
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 100 && !ok(); i += 1) await sleep(30);
    return ok();
};
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sheet = () => document.querySelector('.sheet.on:not([aria-label="action confirmation"])');
const gate = () => document.querySelector('.sheet.on[aria-label="action confirmation"]');
const row = (kind) => sheet() && sheet().querySelector(`[data-thread=${kind}]`);
const type = (el, value) => {
    const set = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), "value").set;
    set.call(el, value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
};
// confirm presses the own button of the gate and returns what it sent.
const confirm = async () => {
    if (!await until(() => gate() && gate().querySelector(".btnrow"))) return { trouble: "no sheet of the gate" };
    const said = { effect: text(gate().querySelector(".warnline")) };
    const before = sent.length;
    gate().querySelector(".btnrow .btn:last-child").click();
    await until(() => sent.length > before);
    said.sent = sent.slice(before).map((s) => ({ kind: s.kind, target: s.target, params: s.params }));
    return said;
};
const button = (box, words) => Array.from(box.querySelectorAll("button")).find((b) => text(b) === words);

window.done = (async () => {
    await document.fonts.ready;
    const out = {};
    await show(thread);
    // What is seen, not what is written: a space a flex item drops is not read.
    out.title = root.querySelector(".chathead h2").innerText.replace(/\s+/g, " ").trim();
    // The space a title splits before is drawn: a flex item that dropped it
    // would glue the words, and the range over it would have no width.
    const tail = root.querySelector(".chathead .midtail");
    const gap = document.createRange();
    if (tail && tail.firstChild) {
        gap.setStart(tail.firstChild, 0);
        gap.setEnd(tail.firstChild, 1);
    }
    out.titleGap = tail && tail.textContent.startsWith(" ") ? Math.round(gap.getBoundingClientRect().width) : -1;
    const strip = root.querySelector(".composer .cstrip");
    out.band = Array.from(strip.children).map((el) => el.dataset.pick || (el.classList.contains("pickfile") ? "clip" : el.className));
    const last = strip.lastElementChild.getBoundingClientRect();
    out.threadAtEnd = Math.round(strip.getBoundingClientRect().right - last.right) < 12;
    const deck = root.querySelector(".deck");
    out.deck = Array.from(deck.querySelectorAll(":scope > .wchips .wchip")).map((b) => b.getAttribute("aria-label"));

    // The thread and its compaction.
    root.querySelector("[data-pick=thread]").click();
    if (!await until(() => row("goal"))) throw new Error("the thread did not open");
    out.rows = Array.from(sheet().querySelectorAll("[data-thread]")).map((r) => `${text(r.querySelector(".pkname"))}: ${text(r.querySelector(".pkdesc"))}`);
    row("compact").click();
    out.compact = await confirm();
    await until(() => !sheet());

    // A review against a branch; a commit that is no hash waits.
    root.querySelector("[data-pick=thread]").click();
    await until(() => row("review"));
    row("review").click();
    await until(() => sheet() && sheet().querySelector(".cxfield, .pkrow"));
    const target = (name) => Array.from(sheet().querySelectorAll(".pkrow")).find((r) => text(r.querySelector(".pkname")) === name);
    target("A commit").click();
    await until(() => sheet().querySelector('[aria-label="the hash of the commit"]'));
    type(sheet().querySelector('[aria-label="the hash of the commit"]'), "not-a-hash");
    await settled();
    out.commitWhy = text(sheet().querySelector(".cxwhy"));
    out.commitOff = button(sheet(), "Review").disabled;
    target("Against a branch").click();
    await until(() => sheet().querySelector('[aria-label="the branch to compare with"]'));
    type(sheet().querySelector('[aria-label="the branch to compare with"]'), "main");
    await until(() => !button(sheet(), "Review").disabled);
    button(sheet(), "Review").click();
    out.review = await confirm();
    await until(() => !sheet());

    // A title of any printable words.
    root.querySelector("[data-pick=thread]").click();
    await until(() => row("rename"));
    row("rename").click();
    await until(() => sheet() && sheet().querySelector('[aria-label="the new name of the thread"]'));
    out.renameValue = sheet().querySelector('[aria-label="the new name of the thread"]').value;
    type(sheet().querySelector('[aria-label="the new name of the thread"]'), "Café ✓ checkout");
    await until(() => !button(sheet(), "Save").disabled);
    let n = sent.length;
    button(sheet(), "Save").click();
    await until(() => sent.length > n);
    out.rename = sent.slice(n).map((s) => ({ kind: s.kind, params: s.params }));
    await until(() => !sheet());

    // A goal set with a budget.
    root.querySelector("[data-pick=thread]").click();
    await until(() => row("goal"));
    row("goal").click();
    await until(() => sheet() && sheet().querySelector('[aria-label="the goal"]'));
    type(sheet().querySelector('[aria-label="the goal"]'), "make CI green");
    type(sheet().querySelector('[aria-label="the budget of tokens"]'), "50000");
    await until(() => !button(sheet(), "Set the goal").disabled);
    button(sheet(), "Set the goal").click();
    out.goalSet = await confirm();

    // A thread running towards its goal: the row says it, and a pause goes.
    await show({ ...thread, goal: { objective: "make CI green", status: "active", tokensUsed: 41000, tokenBudget: 200000, timeUsedSeconds: 600 } });
    root.querySelector("[data-pick=thread]").click();
    await until(() => row("goal"));
    out.goalRow = text(row("goal").querySelector(".pkdesc"));
    row("goal").click();
    await until(() => sheet() && sheet().querySelector(".cxgoal"));
    out.goalShown = text(sheet().querySelector(".cxgoal"));
    button(sheet(), "Pause").click();
    out.goalPause = await confirm();

    // A busy thread has its turn to finish before a review.
    await show({ ...thread, status: "busy" });
    root.querySelector("[data-pick=thread]").click();
    await until(() => row("review"));
    out.busyReview = { off: row("review").disabled, desc: text(row("review").querySelector(".pkdesc")) };

    // The background processes.
    await show(thread);
    root.querySelector(".deck .wchip").click();
    if (!await until(() => sheet() && sheet().querySelectorAll(".cxproc").length === 2)) throw new Error("the processes did not come");
    out.procs = Array.from(sheet().querySelectorAll(".cxproc")).map((p) => text(p.querySelector(".cmdname")));
    sheet().querySelector(".cxproc .btn").click();
    out.stopOne = await confirm();
    await until(() => sheet() && sheet().querySelectorAll(".cxproc").length === 2);
    button(sheet(), "Stop all").click();
    out.stopAll = await confirm();

    // What the thread has, read-only.
    await show(thread);
    root.querySelector(".phead .pmore").click();
    await until(() => document.querySelector(".tools .toollabel"));
    out.tools = Array.from(document.querySelectorAll(".tools .toolsec .cmdsechead")).map(text);
    Array.from(document.querySelectorAll(".tools .toolrow")).find((b) => text(b.querySelector(".toollabel")) === "MCP servers").click();
    await until(() => sheet() && sheet().querySelector(".cmdsum") && sheet().querySelector(".cmdsec .mcplist .mcprow"));
    out.mcp = Array.from(sheet().querySelectorAll(".cmdsec .mcplist .mcprow .cmdname")).map(text);
    sheet().querySelector(".cmdsec .mcplist .mcprow").click();
    await until(() => sheet().querySelector(".mcpfacts"));
    out.mcpActs = Boolean(sheet().querySelector(".mcpacts"));

    // The models are asked of the session, not of any daemon.
    await show(thread);
    root.querySelector("[data-pick=think]").click();
    await until(() => sheet() && sheet().querySelector(".pklist .pkrow"));
    out.catalog = asked.filter((u) => u.includes("/models")).map((u) => u.split("&")[0]);
    out.sentKinds = [...new Set(sent.map((s) => s.kind))].sort();
    return out;
})();
</script>
