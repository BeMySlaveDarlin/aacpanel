<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// /status opens the panel's card of the session: what it runs, where, since
// when, its id, its MCP servers in a line and, on the stream, its account. A
// console has no handshake to read, and its card goes without the account.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
let transport = "stream";
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/status")) {
        return json(transport === "stream"
            ? { state: "ok", transport, version: "2.1.282",
                account: { email: "owner@example.com", organization: "owner@example.com's Organization", plan: "max" } }
            : { state: "ok", transport: "console", version: "2.1.280" });
    }
    if (u.startsWith("/api/session/mcp")) {
        return json({ state: "ok", transport: "stream", servers: [
            { name: "docker", status: "connected" }, { name: "gmail", status: "connected" },
            { name: "hex", status: "needs-auth" }, { name: "tg", status: "failed" }] });
    }
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send", "session.command"] };
const stream = { status: "idle", transport: "stream", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj",
    model: "claude-opus-5-5", effort: "xhigh", mode: "auto", sessionId: "5f94ee29-aead-423a-a0c8-35c6244e253d",
    startedAt: new Date(Date.now() - 3 * 3600 * 1000).toISOString() };
const root = document.getElementById("root");
const show = (live) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name="atlas" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());
const open = async () => {
    const area = document.querySelector("textarea");
    area.value = "/status";
    area.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(150);
    document.querySelector(".composer .iconbtn.accent").click();
    await sleep(400);
};

(async () => {
    const out = {};
    show(stream);
    await sleep(400);
    await open();
    out.title = text(".sheet.on .cmdhead")[0] || "";
    out.sections = text(".sheet.on .cmdsechead > span");
    out.rows = text(".sheet.on .mcpfacts li");
    document.querySelector(".sheet.on .sheetclose").click();
    await sleep(300);

    transport = "console";
    show({ ...stream, transport: "" });
    await sleep(300);
    await open();
    out.consoleSections = text(".sheet.on .cmdsechead > span");
    out.consoleRows = text(".sheet.on .mcpfacts li");
    window.done = out;
})();
</script>
