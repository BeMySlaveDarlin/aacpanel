    { name: "Side", projects: [projects[11], projects[13]] },
    { name: "Host", projects: [projects[14]] },

const S = (o) => ({

    // Two sessions aacpanel had the panel open, a claude and a thread of

    S({ session: "review", project: { ...projects[11], group: "Side" }, parent: { session: "aacpanel" }, status: "idle" }),
    S({ session: "codex-2", project: { ...projects[11], group: "Side" }, agent: "codex", title: "cx-review", status: "idle",
        sessionId: "th-cx2", codexHome: "/home/u/.codex", parent: { session: "aacpanel" } }),

    profile: "personal", prompts: ["the archive pages of the blog, newest first"], ...o });

    closed({ sessionId: "c-blog", name: "blog", project: { ...projects[13], group: "Side" }, cwd: "/srv/blog", min: 30 }),
    closed({ sessionId: "c-cx", name: "drafts", agent: "codex", project: { ...projects[13], group: "Side" }, cwd: "/srv/blog",
        min: 90, tokensUsed: 5000, messages: 0 }),
    // Off the map, in a directory that came without its root: nothing names a

    closed({ sessionId: "c-loose", name: "loose", project: null, cwd: "srv/loose", min: 150, messages: 0 }),

const tree = { running: 1, total: 2, stacks: [{ name: "shop", running: 1, total: 2, hasStats: true, cpu: 1, mem: 64 << 20,
    containers: [
        { id: "c1", name: "shop-web", service: "web", state: "running", status: "Up 2 hours", hasStats: true, cpu: 1, mem: 32 << 20 },
        { id: "c2", name: "shop-db", service: "db", state: "exited", status: "Exited (0) 3 hours ago" },

// The host knows every kind the menus press but Remote Control and the
// restart of a container: those two are dimmed, and say why.
const exec = { available: true, kinds: ["session.close", "session.restart", "session.resume", "session.open",
    "session.switch", "session.rename", "session.stop", "session.detach", "session.parent", "window.open", "window.close", "term.start",
    "container.stop", "container.start", "stack.up", "stack.down"] };
setLiveSessions(sessions);

const sent = [];
const copied = [];
const picked = [];
const terms = [];
const settings = [];
const logs = [];
// The answer of where scratch can move is held until the page lets it go:
// the menu shows the move dimmed while it waits.
let letScratch = null;
const scratchAnswer = new Promise((resolve) => { letScratch = resolve; });
const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    const u = String(url);
    if (u === "/api/actions") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true });
    }
    if (u.startsWith("/api/sessions/archive")) return json({ rows: archive, total: archive.length, limit: 30, offset: 0 });
    if (u.startsWith("/api/session/switch")) {
        const name = new URL(u, location.origin).searchParams.get("name");
        if (name === "aacpanel") return json({ to: "console" });
        if (name === "scratch") return json(await scratchAnswer);
        return json({ to: "", reason: "the project does not live on the stream" });
    }
    if (u.startsWith("/api/session/window")) return json({ state: "closed" });
    if (u === "/api/terms") return json({ terms: [{ id: "t-aac", place: "/srv/aacpanel", activity: 9 }] });

window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };
Object.defineProperty(navigator, "clipboard", { configurable: true, value: {
    writeText: async (t) => { copied.push(t); },
} });

// Probe is an object of the page's own with a menu over a field, an editable
// block, a terminal and words to select: what the host leaves to the browser
// inside an object that has a menu.
function ProbeMenu() {
    return html`<${MenuList} groups=${[[html`<${MenuItem} key="a" label="Probe" onPick=${() => picked.push("probe")} />`]]} />`;
}
function Probe() {
    const menu = useMenu();
    return html`
        <div class="probe" tabindex="0" onContextMenu=${menu && menu(ProbeMenu, {}, "probe")}>
            <span class="probewords">words to select and copy</span>
            <input class="probein" value="typed" />
            <div class="probeedit" contenteditable="true">edited</div>
            <div class="termwrap"><div class="xterm">$ ls</div></div>
        </div>
    `;
}

const snapshot = { at: now / 1000, sessions, profileMap, profiles: [{ name: "personal", auth: "builtin" }], host: { home: "/home/u" } };
const wait = { opening: () => [], of: () => null };

function Shell() {
    const shell = useRef(null);
    const tip = useRef(null);
    useEffect(() => attachTips(shell.current, tip.current), []);
    return html`
        <div class="deskshell" ref=${shell}>
            <${MenuHost}>
                <div class="dktip" ref=${tip} role="tooltip"></div>
                <div class="dkbody withpanel">
                    <${SessionColumn} snapshot=${snapshot} limits=${null} current="" currentId=""
                        onPick=${(t) => picked.push(t.name)} onTerm=${(t) => terms.push(t)}
                        onSettings=${(at) => settings.push(at)} picks=${[]} setPicks=${() => {}}
                        onNames=${() => {}} onOrder=${() => {}} onArchive=${() => {}} exec=${exec} wait=${wait} />
                    <${ContainersCenter} tree=${tree} stack="shop" current=${null} onPick=${() => {}} exec=${exec}
                        onDone=${() => {}} onLogs=${(c) => logs.push(c.name)} />
                    <aside class="dkright">
                        <${Archive} profiles=${null} names=${[]} picks=${[]} setPicks=${() => {}} snapshot=${snapshot}
                            onOpen=${(t) => picked.push(`archive:${t.name}`)} exec=${exec} />
                    </aside>
                </div>
                <div class="dkbody">
                    <${StackColumn} tree=${tree} current="shop" onPick=${() => {}} exec=${exec} onDone=${() => {}} />
                    <section class="dkcenter"><${Probe} /></section>
                </div>
            <//>
        </div>
    `;
}
render(h(ToastHost, null, h(GateHost, null, h(Shell))), document.getElementById("root"));

const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
const until = async (fn, ms = 3000) => {
    const end = performance.now() + ms;
    while (performance.now() < end) {
        const got = fn();
        if (got) return got;
        await frame();
    }
    return fn();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const menuNode = () => document.querySelector(".ctxmenu");
const anyMenu = menuNode;
const rowOf = (name) => Array.from(document.querySelectorAll(".dklive")).find((r) => text(r.querySelector(".dkname")) === name);
const headOf = (name) => Array.from(document.querySelectorAll(".dkproj")).find((r) => text(r.querySelector(".dkprojname")) === name);
const contOf = (name) => Array.from(document.querySelectorAll(".dkcont")).find((r) => text(r.querySelector(".dkc-name")) === name);
const stackRow = () => document.querySelectorAll(".dkbody")[1].querySelector(".dksess");
const box = (el) => {
    const r = el.getBoundingClientRect();
    return { left: Math.round(r.left), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom) };
};

// The right button as the browser presses it: down, then the menu event.
const rightClick = (el, x, y, extra = {}) => {
    el.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 2, buttons: 2,
        clientX: x, clientY: y, pointerType: "mouse", ...extra }));
    const ev = new PointerEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, buttons: 2,
        clientX: x, clientY: y, pointerType: "mouse", ...extra });
    el.dispatchEvent(ev);
    return ev;
};
// The menu key on the focused element, as Chrome sends it.
const keyMenu = (el) => {
    el.focus();
    el.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: "F10", shiftKey: true }));
    const r = el.getBoundingClientRect();
    const ev = new PointerEvent("contextmenu", { bubbles: true, cancelable: true, button: -1, buttons: 0,
        clientX: Math.round(r.left + r.width / 2), clientY: Math.round(r.top + r.height / 2), pointerType: "mouse" });
    el.dispatchEvent(ev);
    return ev;
};

// read lists the items of the open menu: a dimmed one marked ~, a line |.
const read = () => {
    const m = menuNode();
    if (!m) return null;
    return Array.from(m.children).map((el) => (el.getAttribute("role") === "separator"
        ? "|"
        : `${el.getAttribute("aria-disabled") === "true" ? "~" : ""}${text(el.querySelector(".pkname"))}`));
};

    .find((el) => text(el.querySelector(".pkname")) === label) : null);

const openOn = async (el, settle = false) => {
    const r = el.getBoundingClientRect();
    rightClick(el, Math.round(r.left + 20), Math.round(r.top + r.height / 2));
    await until(menuNode);

    if (anyMenu()) key("Escape");
    await until(() => !anyMenu());
};
// confirmClick presses a button or an item and, where the gate asks, says
// yes; it answers what went to the host.
const confirmClick = async (el) => {
    if (!el) return null;

    el.click();
    const yes = await until(() => sent.length > before || document.querySelector(confirmSel), 1500);
    if (yes instanceof Element) yes.click();

    await until(menuNode);
    await quiet();

    await openOn(headOf("aacpanel"));
    out.lists.project = read();
    out.projectNew = await press("New session");
    out.projectNewByButton = await confirmClick(headOf("aacpanel").querySelector(".dkprojnew"));
    await openOn(headOf("aacpanel"));
    itemOf("Settings of the project").click();
    await until(() => settings.length > 0);
    out.settings = settings[settings.length - 1] || null;
    // The settings of the map open on the page of the project it names.
    out.settingsStart = startOf([{ id: 3, name: "personal", groups: [
        { id: 7, name: "Side", projects: [{ id: 11 }, { id: 13 }] },
        { id: 8, name: "Host", projects: [{ id: 14 }] },
    ] }], settings[settings.length - 1], []);
    await openOn(headOf("helios"));
    out.lists.projectHome = read();
    await shut();

    await openOn(aac, true);
    itemOf("Terminal of the project").click();
    await until(() => terms.length > 0);
    out.terminal = terms[terms.length - 1] || null;
    await openOn(aac);
    itemOf("Copy the session ID").click();
    await until(() => copied.length > 0);
    await openOn(aac);
    itemOf("Copy the resume command").click();
    await until(() => copied.length > 1);
    out.copied = copied.slice();
    out.codexCopied = [];
    for (const name of ["cx-thread", "cx-review"]) {
        const before = copied.length;
        await openOn(rowOf(name));
        itemOf("Copy the resume command")?.click();
        await until(() => copied.length > before);
        out.codexCopied.push(...copied.slice(before));
    }
    const beforeArchiveCopy = copied.length;
    await openOn(archRows[1]);
    itemOf("Copy the resume command")?.click();
    await until(() => copied.length > beforeArchiveCopy);
    out.codexCopied.push(...copied.slice(beforeArchiveCopy));
    await openOn(rowOf("cx-thread"));
    out.codexRestart = await press("Restart the session");
    await openOn(aac);
    itemOf("Rename…").click();
    await until(() => document.querySelector(".sheet.on .rnname"));
    out.rename = { value: document.querySelector(".sheet.on .rnname").value, menu: Boolean(anyMenu()) };
    Array.from(document.querySelectorAll(".sheet.on .btnrow .btn")).find((b) => text(b) === "Cancel").click();
    await until(() => !document.querySelector(".sheet.on"));
    out.rename.focusRow = document.activeElement === aac;
    await openOn(aac);
    out.restarted = await press("Restart the session");
    await openOn(aac);
    out.closedByMenu = await press("Close the session");
    out.closedByButton = await confirmClick(aac.querySelector('[aria-label="close session aacpanel"]'));

    await openOn(contOf("shop-web"));
    out.lists.running = read();
    out.about.containerRestart = about("Restart");
    out.stopped = await press("Stop");
    out.stoppedByButton = await confirmClick(contOf("shop-web").querySelectorAll(".dkc-acts .dkact")[2]);
    await openOn(contOf("shop-db"));
    out.lists.exited = read();
    out.started = await press("Start");
    const flip = contOf("shop-db").querySelectorAll(".dkc-acts .dkact")[2];
    out.startedByButton = await confirmClick(flip);
    // A stopped container starts from the play icon, not a red stop.
    const play = document.createElement("div");
    render(h("i", null, Icon.play()), play);
    out.playIcon = { danger: flip.classList.contains("danger"),
        play: flip.querySelector("path").getAttribute("d") === play.querySelector("path").getAttribute("d") };
    await openOn(contOf("shop-db"));
    itemOf("Logs").click();
    await until(() => logs.length > 0);
    out.logs = logs.slice();

    await openOn(stackRow());
    out.lists.stack = read();
    out.downed = await press("Bring down");
    out.downedByButton = await confirmClick(stackRow().querySelector(".dkrowacts .dkact"));

    // A screen narrower than the shell keeps the browser's menu; the same
    // page wide enough takes the panel's.
    const narrow = document.getElementById("narrow");
    narrow.srcdoc = `<!doctype html><script type="importmap">${document.querySelector('script[type="importmap"]').textContent}<\/script>
<div id="n"></div>
<script type="module">
import { render } from "preact";
import { html } from "/src/html.js";
import { MenuHost } from "/src/desktop/menu.js";
import { MenuItem, MenuList, useMenu } from "/src/ui/menu.js";
function Body() { return html\`<\${MenuList} groups=\${[[html\`<\${MenuItem} key="a" label="A" onPick=\${() => {}} />\`]]} />\`; }
function Obj() { const menu = useMenu(); return html\`<div class="obj" onContextMenu=\${menu && menu(Body, {}, "obj")}>object</div>\`; }
render(html\`<\${MenuHost}><\${Obj} /><//>\`, document.getElementById("n"));
<\/script>`;
    const inner = await until(() => narrow.contentWindow && narrow.contentWindow.document.querySelector(".obj")
        && narrow.contentWindow);
    const tryIn = () => {
        const obj = inner.document.querySelector(".obj");
        const e = new inner.PointerEvent("contextmenu", { bubbles: true, cancelable: true, button: 2, buttons: 2, clientX: 5, clientY: 5 });
        obj.dispatchEvent(e);
        return { width: inner.innerWidth, prevented: e.defaultPrevented };
    };
    out.narrow = tryIn();
    await frame();
    out.narrow.menu = Boolean(inner.document.querySelector(".ctxmenu"));
    narrow.style.width = "1200px";
    await until(() => inner.innerWidth === 1200);
    out.wideFrame = tryIn();
    return out;
})();
</script>
