<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div id="root"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// The brief screen the panel ships, over a fake service: one document with the
// shapes a brief can carry, and a live session to send the answers to.
import { h, render } from "preact";
import { Brief } from "/src/screens/brief.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";
import { until } from "/check/fixtures/pie.js";
import { state as briefState } from "/src/data/briefs.js";

const doc = {
    id: "seven-after-twelve",
    sessionId: "11111111-1111-4111-8111-111111111111",
    cwd: "/srv/proj",
    title: "Seven questions after twelve",
    eyebrow: "15.09.2026 · after twelve answers",
    at: "2026-09-15T15:26:37Z",
    reissuedAt: "2026-09-15T15:26:37Z",
    firstAt: "2026-09-14T09:10:00Z",
    lede: "Ten of twelve **closed**. Two were left without a choice, and four new questions came out of the answers themselves.",
    summary: [
        { n: "3", label: "still open" },
        { n: "4", label: "born of answers" },
        { n: "4", label: "settled here" },
    ],
    lineage: [
        { from: "did not close", to: "**07** the configuration directory · **11** the pause" },
        { from: "out of answer 08", to: "**free text of a person on the bus**" },
    ],
    sections: [{ title: "where this came from", body: [
        "The tail of yesterday, not a new round.",
        "| what | where |\n|---|---|\n| the directory | stack 5 |\n| the pause | help 2.1.270 |",
    ] }],
    questions: [
        {
            id: "r1", n: "01", title: "The configuration directory", kind: "pick",
            chips: [{ tone: "stuck", text: "did not close · decision 07" }],
            ask: "You picked one directory, a role inside it. **The CLI may not offer that.**",
            facts: [
                { text: "`--setting-sources user` reads the directory whole", src: "stack 5" },
                { text: "`--restricted` ignores user settings", src: "help 2.1.270", flag: true },
                { text: "The directory has to be writable: the CLI writes into it", src: "stack 5" },
            ],
            options: [
                { key: "A", label: "Curate through `--settings`", note: "argv carries the role, not the directory" },
                { key: "B", label: "A directory per role", note: "a copy of the subscription token in each" },
                { key: "C", label: "Drop curation by role", note: "every role sees one set of skills" },
            ],
            read: [
                "Option A is what you described, with argv as the carrier. Write it down **now**: if the trial says no and there is no fallback, this comes back open exactly when someone sits down to write the runner.",
            ],
            capture: { note: { placeholder: "The fallback" } },
        },
        {
            id: "r2", n: "02", title: "Does the human pause expire", kind: "pick",
            chips: [{ tone: "born", text: "out of answer 02" }],
            ask: "Your own autonomy is an argument **for** expiry, not against it.",
            facts: [{ text: "The admin one expires in four hours", src: "admin-role.md:61" }],
            options: [
                { key: "A", label: "It does not, as now", note: "predictable and absolute" },
                { key: "B", label: "Four hours with an explicit renewal", note: "symmetric to the admin one" },
            ],
            answered: { picks: ["B"], at: "2026-09-15" },
            capture: { note: { placeholder: "A term, if not four hours" } },
        },
        { id: "r3", n: "03", title: "What the analysis rests on", kind: "none" },
    ],
    closing: ["Everything marked as a reading is a proposal, not a finding."],
};

// A brief that asks nothing: a finding to read, with no question under it.
const readOnly = {
    id: "only-to-read",
    sessionId: doc.sessionId,
    cwd: "/srv/proj",
    title: "The test went red when the day turned",
    lede: "The cause is confirmed by a run.",
    questions: [],
};

const decisionDoc = {
    id: "search-plan", title: "Move the catalogue search", sessionId: doc.sessionId, cwd: doc.cwd,
    task: "Move search from the cluster to Postgres.", why: "The cluster is idle and costs half the bill.",
    context: [{ title: "The measurements", text: "The trial kept **every result**." }],
    decisions: [
        { id: "index", title: "Where the index lives", ask: "Choose the **write path**.", multi: false, options: [
            { key: "A", label: "Separate table", reason: "Search changes independently.", cost: "Maintain triggers", hours: 6.15, recommended: true },
            { key: "B", label: "A column on products", reason: "No synchronisation.", cost: "Rebuild pauses writes", hours: 3 },
        ] },
        { id: "checks", title: "Which checks run", ask: "Several may run together.", multi: true, options: [
            { key: "A", label: "Compare results", reason: "Find missing records.", cost: "A second query", hours: 2, recommended: true },
            { key: "B", label: "Replay traffic", reason: "Check the whole load.", cost: "Keep recordings", hours: 4 },
            { key: "C", label: "Watch latency", reason: "Keep the search fast.", cost: "One dashboard", hours: 0.1, recommended: true },
        ] },
        { title: "When to switch", ask: "Choose the window.", multi: false, options: [
            { key: "A", label: "Today", reason: "Save the next bill.", cost: "Less observation", hours: 1 },
            { key: "B", label: "After a week", reason: "Observe the full cycle.", cost: "Keep the cluster a week", hours: 2, recommended: true },
        ] },
    ],
};
let decisionSaved = { decisions: { index: { picks: ["B"] } } };
let decisionSent = false;
let decisionRefused = false;
let releaseDecisionSave = null;
let holdDecisionSave = false;
let releaseDecisionSend = null;
let holdDecisionSend = false;
const decisionCalls = [];
let saved = null;
let sentMark = false;
let removed = false;
let readRemoved = false;
const asked = [];
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (url, init) => {
    const u = String(url);
    const method = (init && init.method) || "GET";
    asked.push(`${method} ${u}`);
    if (u === "/api/briefs/search-plan" && method === "GET") return json({ brief: decisionDoc, draft: { answers: decisionSaved, sentAt: decisionSent ? "2026-01-01T12:00:00Z" : null } });
    if (u === "/api/briefs/search-plan" && method === "PUT") {
        decisionCalls.push({ method, url: u, body: JSON.parse(init.body) });
        if (holdDecisionSave) {
            holdDecisionSave = false;
            await new Promise(resolve => { releaseDecisionSave = resolve; });
        }
        if (decisionRefused) return new Response("The draft was refused", { status: 503 });
        decisionSaved = JSON.parse(init.body).answers;
        return json({ draft: { answers: decisionSaved } });
    }
    if (u === "/api/briefs/search-plan/send" && method === "POST") {
        decisionCalls.push({ method, url: u, body: init.body || "" });
        if (holdDecisionSend) await new Promise(resolve => { releaseDecisionSend = resolve; });
        decisionSent = true;
        return json({ ok: true });
    }
    if (u === "/api/briefs/seven-after-twelve" && method === "GET") {
        return new Response(JSON.stringify({
            brief: doc,
            draft: { answers: { r2: { picks: ["B"] } }, updatedAt: "2026-09-15T15:30:00Z" },
            reply: 'Brief "Seven questions after twelve" · seven-after-twelve\nAnswered 1 of 2\n',
        }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/seven-after-twelve" && method === "PUT") {
        saved = JSON.parse(init.body).answers;
        const done = Object.keys(saved).length;
        return new Response(JSON.stringify({
            draft: { answers: saved },
            reply: `Brief "Seven questions after twelve" · seven-after-twelve\nAnswered ${done} of 2\n`,
        }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/seven-after-twelve" && method === "DELETE") {
        removed = true;
        return new Response(JSON.stringify({ ok: true, dropped: "seven-after-twelve" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/only-to-read" && method === "GET") {
        return new Response(JSON.stringify({ brief: readOnly, draft: null, reply: "" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/briefs/only-to-read" && method === "DELETE") {
        readRemoved = true;
        return new Response(JSON.stringify({ ok: true, dropped: "only-to-read" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u.endsWith("/sent")) {
        sentMark = true;
        return new Response(JSON.stringify({ ok: true }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    if (u === "/api/actions") {
        return new Response(JSON.stringify({ ok: true, detail: "typed into lab" }),
            { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
});

const snapshot = { sessions: [{ session: "lab", sessionId: doc.sessionId, cwd: "/srv/proj" }] };
const exec = { available: true, kinds: ["session.send"] };

const left = [];

render(
    h(ToastHost, null, h(GateHost, null,
        h(Brief, { id: "seven-after-twelve", snapshot, exec, onBack: () => left.push("back") }))),
    document.getElementById("root"));

const text = (sel) => Array.from(document.querySelectorAll(sel)).map((n) => n.textContent.trim());

(async () => {
    await quiet();
    const before = {
        title: (document.querySelector(".bmast h1") || {}).textContent || "",
        // A table written in the prose of a brief is drawn as a table.
        tables: document.querySelectorAll(".bsection table").length,
        cells: Array.from(document.querySelectorAll(".bsection td")).map((n) => n.textContent.trim()),
        questions: text(".bq h3"),
        facts: document.querySelectorAll(".bfacts li").length,
        flagged: document.querySelectorAll(".bfacts .bflag").length,
        sources: text(".bfacts .bsrc"),
        options: text(".bopt-l"),
        costs: document.querySelectorAll(".bopt-c").length,
        reading: document.querySelectorAll(".bread p").length,
        chips: text(".bchip"),
        summary: text(".bsum-n"),
        lineage: document.querySelectorAll(".blin span").length,
        closing: document.querySelectorAll(".bclose p").length,
        // The block that asks nothing carries no field to answer it with.
        captures: document.querySelectorAll(".bcap").length,
        pressed: text('.bopt[aria-pressed="true"] .bopt-k'),
        say: (document.querySelector(".bdock-say") || {}).textContent || "",
        // The dock is the row of the brief's buttons.
        dock: Array.from(document.querySelectorAll(".bbtn")).map((n) => ({ label: n.textContent.trim(), disabled: n.disabled })),
        again: (document.querySelector(".bagain") || {}).textContent || "",
        sendDisabled: Boolean(document.querySelector(".bbtn.go") && document.querySelector(".bbtn.go").disabled),
    };

    document.querySelectorAll(".bq")[0].querySelectorAll(".bopt")[0].click();
    await quiet();

    const after = {
        pressed: text('.bopt[aria-pressed="true"] .bopt-k'),
        saved,
        say: (document.querySelector(".bdock-say") || {}).textContent || "",
        sendDisabled: Boolean(document.querySelector(".bbtn.go") && document.querySelector(".bbtn.go").disabled),
    };

    document.querySelector(".bbtn.go").click();
    await quiet();

    // Once the answers have gone, the document is read and not answered: the
    // session already holds the text, and a second send would arrive as a
    // second set of answers to questions that were settled.
    const savesBefore = asked.filter((a) => a.startsWith("PUT ")).length;
    const opt = document.querySelectorAll(".bq")[0].querySelectorAll(".bopt")[1];
    if (opt) opt.click();
    const note = document.querySelector(".bq textarea");
    if (note) {
        note.value = "typed after the send";
        note.dispatchEvent(new Event("input", { bubbles: true }));
    }
    await quiet();
    const go = document.querySelector(".bbtn.go");
    const locked = {
        button: go ? go.textContent.trim() : "",
        disabled: Boolean(go && go.disabled),
        readonly: Boolean(note && note.readOnly),
        // No clear and no skip while it is read.
        acts: document.querySelectorAll(".bq .bcap-act").length,
        savesAfter: asked.filter((a) => a.startsWith("PUT ")).length - savesBefore,
        picks: Array.from(document.querySelectorAll('.bq .bopt[aria-pressed="true"] .bopt-k')).map((n) => n.textContent),
    };

    // A document has a way out of it.
    const out = document.querySelector(".brief .pback");
    const exit = { there: Boolean(out) };
    if (out) out.click();
    await quiet();
    exit.left = left.length;

    // Removing asks once before it does anything, and the second press is what
    // sends the request.
    const leftBefore = left.length;
    const dropBtn = document.querySelector(".bbtn.drop");
    const removing = { there: Boolean(dropBtn), label: dropBtn ? dropBtn.textContent.trim() : "" };
    if (dropBtn) dropBtn.click();
    await quiet();
    removing.asking = (document.querySelector(".bbtn.drop") || {}).textContent || "";
    removing.afterFirst = removed;
    const again = document.querySelector(".bbtn.drop");
    if (again) again.click();
    await quiet();
    removing.afterSecond = removed;
    removing.left = left.length - leftBefore;

    // A brief with nothing to answer is still put away from inside it: the
    // dock stays, with the one act such a document has.
    const root = document.getElementById("root");
    render(null, root);
    render(
        h(ToastHost, null, h(GateHost, null,
            h(Brief, { id: "only-to-read", snapshot, exec, onBack: () => left.push("back") }))),
        root);
    await quiet();
    const reading = {
        title: (document.querySelector(".bmast h1") || {}).textContent || "",
        buttons: text(".bdock .bbtn"),
    };
    const readLeft = left.length;
    const readDrop = document.querySelector(".bdock .bbtn.drop");
    if (readDrop) readDrop.click();
    await quiet();
    const readAgain = document.querySelector(".bdock .bbtn.drop");
    if (readAgain) readAgain.click();
    await quiet();
    reading.removed = readRemoved;
    reading.left = left.length - readLeft;

    const decisions = await decisionScene();
    window.done = { before, after, asked, sentMark, exit, locked, removing, reading, decisions,
        reply: (document.querySelector(".breply") || {}).textContent || "" };
})();

async function decisionScene() {
    const root = document.querySelector("#root");
    let sent = 0;
    const show = () => {
        render(null, root);
        render(h(ToastHost, null, h(GateHost, null, h(Brief, { id: "search-plan", snapshot, exec, onBack: () => {}, onSession: () => { sent += 1; } }))), root);
    };
    const form = () => document.querySelector(".brief-decisions");
    const change = (id) => form().querySelector(`[data-decision="${id}"] .bchange`).click();
    const input = (el, value) => { el.value = value; el.dispatchEvent(new Event("input", { bubbles: true })); };
    show();
    await until(() => form()?.querySelector(".brecommend"), "the decision form");
    const before = {
        task: form().querySelector(".btask").textContent,
        contextClosed: !form().querySelector(".bcontext").open,
        markdown: Boolean(form().querySelector(".bcontext strong, .bcontext b, .bdecision-ask strong, .bdecision-ask b")),
        accept: form().querySelector(".brecommend").textContent.trim(),
        progress: form().querySelector(".bdecision-progress").textContent.trim(),
        multi: form().querySelectorAll('input[type="checkbox"]').length,
        costs: form().querySelectorAll(".bchoice-cost").length,
        hours: Array.from(form().querySelectorAll(".bchoice-hours")).map(n => n.textContent.trim()),
    };
    form().querySelector(".brecommend").click();
    await quiet();
    const accepted = JSON.parse(JSON.stringify(decisionSaved));
    const collapsed = form().querySelectorAll(".bdecision.decided").length;
    change("index");
    await until(() => form().querySelector('[data-decision="index"] input'), "the reopened decision");
    const rounding = form().querySelector('[data-decision="index"] .bchoice-hours').textContent.trim();
    input(form().querySelector('[data-decision="index"] textarea'), "Keep a fallback");
    form().querySelector('[data-decision="index"] input[value="A"]').click();
    await quiet();
    form().querySelector('[data-decision="index"] .bdecision-done').click();
    await quiet();
    const changed = JSON.parse(JSON.stringify(decisionSaved));
    input(form().querySelector(".bbrief-note"), "Switch after the measurement");
    await until(() => form().querySelector(".bbrief-note").value === "Switch after the measurement", "the general note");
    holdDecisionSend = true;
    const go = form().querySelector(".bdecision-send");
    go.click();
    go.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await until(() => releaseDecisionSend, "the send request");
    const sending = go.disabled;
    releaseDecisionSend();
    await until(() => form().querySelector(".bdecision-send").textContent.trim() === "Sent", "the sent form");
    const locked = { changes: form().querySelectorAll(".bchange, .brecommend").length,
        fields: form().querySelectorAll("textarea, input:not(:disabled)").length, disabled: go.disabled, sent };
    const final = JSON.parse(JSON.stringify(decisionSaved));
    const calls = decisionCalls.slice();
    const state = briefState({ decisions: 3, answered: 2 });
    const sentState = briefState({ decisions: 3, answered: 2, sent: true });
    show();
    await until(() => form()?.querySelector(".bdecision-send")?.textContent.trim() === "Sent", "the saved sent form");
    const reopened = form().querySelectorAll(".bchange, textarea, input:not(:disabled)").length === 0;

    decisionSent = false;
    decisionSaved = {};
    decisionRefused = true;
    holdDecisionSend = false;
    show();
    await until(() => form()?.querySelector(".brecommend"), "a fresh form");
    form().querySelector(".brecommend").click();
    await quiet();
    const failedSends = decisionCalls.filter(c => c.method === "POST").length;
    form().querySelector(".bdecision-send").click();
    await until(() => form().querySelector(".bdecision-error") && !form().querySelector(".bdecision-send").disabled, "the save failure");
    await quiet();
    const refused = { error: form().querySelector(".bdecision-error").textContent,
        sends: decisionCalls.filter(c => c.method === "POST").length - failedSends };
    decisionRefused = false;
    form().querySelector(".bdecision-send").click();
    await until(() => form().querySelector(".bdecision-send").textContent.trim() === "Sent", "the retry");
    refused.retried = decisionCalls.filter(c => c.method === "POST").length - failedSends;

    decisionSent = false;
    decisionSaved = {};
    holdDecisionSave = true;
    show();
    await until(() => form()?.querySelector(".brecommend"), "the form before the delayed save");
    form().querySelector(".brecommend").click();
    await until(() => releaseDecisionSave, "the delayed save");
    change("index");
    await until(() => form().querySelector('[data-decision="index"] input'), "the decision during saving");
    form().querySelector('[data-decision="index"] input[value="B"]').click();
    await until(() => form().querySelector('[data-decision="index"] input[value="B"]').checked, "the last pick");
    form().querySelector(".bdecision-send").click();
    releaseDecisionSave();
    await until(() => form().querySelector(".bdecision-send").textContent.trim() === "Sent", "the send after both saves");
    const raced = decisionSaved.decisions.index.picks;
    return { before, accepted, collapsed, rounding, changed, final, calls, sending, locked, state, sentState, reopened, refused, raced };
}
</script>
