<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="composerbox" id="wait"></div>
<div class="composerbox" id="flows"></div>
<div class="composerbox" id="none"></div>
<div class="composerbox" id="going"></div>
<script type="module">
// The bar above the composer of a session whose own turn is over while the
// work it sent off goes on: two agents at work, the older since 400 seconds
// ago, and one stopped long before; the last call of the turn was a stop.
import { render } from "preact";
import { html } from "/src/html.js";
import { WorkStatus } from "/src/screens/chat/work.js";
import { stateOf } from "/src/screens/chat/head.js";

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const feed = [
    { role: "me", text: "anything left running?", at: ago(420), pos: 1 },
    { role: "tools", kind: "agents", run: 5, pos: 5, at: ago(410),
      calls: [{ name: "TaskStop", arg: "audit", pos: 5, index: 0, at: ago(410) }] },
    { role: "ai", text: "Nothing to stop.", at: ago(405), pos: 6 },
];
const agent = (name, status, sec) => ({ name, status, at: ago(sec), kind: "background", id: name });
const work = {
    tasks: [],
    agents: [agent("audit2", "active", 400), agent("hooks2", "active", 100), agent("audit", "stopped", 900)],
    workflows: [],
};
const opened = [];
const open = (what) => opened.push(what.kind);
const put = (id, props) => render(html`<${WorkStatus} busy=${true} compacting="" feed=${feed}
    onCalls=${() => {}} onOpen=${open} ...${props} />`, document.getElementById(id));
put("wait", { work, turnOver: true });
put("flows", { work: { tasks: [], agents: [agent("audit", "stopped", 900)],
                       workflows: [{ id: "w1", status: "running", at: ago(60) }] }, turnOver: true });
put("none", { work: { tasks: [], agents: [agent("audit", "stopped", 900)], workflows: [] }, turnOver: true });
put("going", { work, turnOver: false });

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
window.done = (async () => {
    const out = {};
    try {
        for (let i = 0; i < 50 && !document.querySelector("#wait .nowbar"); i++) await sleep(20);
        const wait = document.getElementById("wait");
        out.waitTop = text(wait.querySelector(".nowtop"));
        out.waitAll = text(wait);
        const bar = wait.querySelector(".nowbar");
        out.waitIsButton = Boolean(bar && bar.tagName === "BUTTON");
        // The button is the bar and nothing else: no face of a button of its
        // own, and the time at the far end of the bar, as in the bar it stands for.
        const face = bar ? getComputedStyle(bar) : null;
        out.waitFace = face ? `${face.backgroundColor} ${face.borderTopWidth}` : "";
        const frame = wait.querySelector(".workbar").getBoundingClientRect();
        const clock = wait.querySelector(".nowel");
        out.waitTimeGap = clock ? Math.round(frame.right - clock.getBoundingClientRect().right) : -1;
        if (bar) bar.click();
        const flows = document.getElementById("flows");
        out.flowsTop = text(flows.querySelector(".nowtop"));
        const flowBar = flows.querySelector(".nowbar");
        if (flowBar) flowBar.click();
        out.opened = opened;
        out.none = document.getElementById("none").innerHTML;
        out.goingTop = text(document.getElementById("going").querySelector(".nowtop"));
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
        out.headOver = stateOf({ status: "busy", turnOver: true }).word;
        out.headBusy = stateOf({ status: "busy" }).word;
        out.headWaiting = stateOf({ status: "waiting", turnOver: true, waitingFor: "dialog open" }).word;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
