<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{margin:0} .deskshell{position:static;height:600px} .dkbody{height:600px} #phone{width:390px} #chat{height:700px;display:flex;flex-direction:column}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="dkbody" id="desk"></div></div>
<div id="phone"></div>
<div class="deskshell"><div class="dkbody"><aside class="dkleft"></aside><section class="dkcenter dkchat" id="chat"></section></div></div>
<script type="module">
// The names three codex threads read by beside the claude session of their
// project: one the panel named, one it did not — whatever codex calls it, the
// executor leaves that out — and one no project holds; on the desktop list, on
// the phone's list and in the header of a conversation.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { shownName } from "/src/agent.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { LiveLines } from "/src/screens/sessions/blocks.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u === "/api/term") return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() {} };

const admin = { id: 7, name: "Admin", session: "admin", path: "/srv/admin", group: "Work" };
const thread = (tail, extra) => ({
    session: `codex-${tail}`, sessionId: `0199c3a2-7f10-7b2e-9c41-6e1d${tail}`, contour: 4, profile: "Acme",
    agent: "codex", transport: "stream", status: "idle", model: "gpt-6-astra", effort: "high", pct: 10,
    ...extra,
});
const claude = { session: "admin", sessionId: "c1", contour: 4, profile: "Acme", transport: "stream", status: "idle",
    pct: 20, cwd: "/srv/admin", model: "claude-opus-5-5", effort: "high", project: admin };
const unnamed = thread("0000aaaa", { cwd: "/srv/admin", project: admin });
const titled = thread("0000bbbb", { cwd: "/srv/admin", project: admin, title: "login-bug" });
const bare = thread("0000cccc", { cwd: "/srv/loose", project: null });
const sessions = [claude, unnamed, titled, bare];
setLiveSessions(sessions);

const exec = { available: true, kinds: ["session.send", "session.stop", "session.close", "session.rename"] };
const profileMap = [{ id: 4, profile: "Acme", name: "Acme",
    groups: [{ name: "Work", projects: [{ id: 7, name: "Admin", session: "admin", path: "/srv/admin" }] }] }];
render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: 1, sessions, profileMap, limits: null }, profiles: { profiles: [] }, limits: null,
    current: "", onPick() {}, picks: [], setPicks() {}, onNames() {}, onOrder() {}, exec, wait: null,
}))), document.getElementById("desk"));
render(h(ToastHost, null, h(GateHost, null, html`
    <section class="pjblock"><${LiveLines} list=${sessions} notes=${null} wait=${null}
                                           onOpen=${() => {}} onMore=${() => {}} /></section>
`)), document.getElementById("phone"));
render(h(ToastHost, null, h(GateHost, null, h(Chat, {
    name: unnamed.session, id: unnamed.sessionId, live: unnamed, exec, snapshot: { sessions }, onBack() {},
    onUsage() {}, onTerm() {},
}))), document.getElementById("chat"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 100 && !ok(); i += 1) await sleep(30);
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    const desk = document.getElementById("desk");
    const phone = document.getElementById("phone");
    const chat = document.getElementById("chat");
    if (!await until(() => desk.querySelectorAll(".dksess .dkname").length === sessions.length)) {
        throw new Error("the desktop column does not show every session");
    }
    if (!await until(() => chat.querySelector(".midname"))) throw new Error("the conversation has no header name");
    const out = {};
    out.shown = Object.fromEntries(sessions.map((s) => [s.session, shownName(s)]));
    out.desk = Array.from(desk.querySelectorAll(".dksess .dkname"))
        .map((n) => ({ name: text(n), tip: n.getAttribute("title") || "" }));
    out.phone = Array.from(phone.querySelectorAll(".pjrow")).map((r) => ({
        name: text(r.querySelector(".pjsess")),
        address: (r.querySelector(".pjopen").getAttribute("aria-label") || "").replace(/^open conversation /, ""),
    }));
    out.head = chat.querySelector(".midname").getAttribute("aria-label") || "";
    return out;
})();
</script>
