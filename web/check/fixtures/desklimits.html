<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script>document.documentElement.style.setProperty("--ui-scale", "1.2");</script>
<div class="deskshell"><div class="dkbody" id="root"></div></div>
<script type="module">
// The sessions column at a desk: every contour has its section — a heading
// with two rings of its limit that open the details of both windows, its
// live sessions, and its latest closed conversations up to three cards.
import { h, render } from "preact";
import { SessionColumn } from "/src/desktop/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const now = Math.floor(Date.now() / 1000);
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 });
const limits = { contours: [
    { profile: "personal", contour: 3, ageSec: 30, fiveHour: part(12, 4.5), sevenDay: part(24, 100) },
    { profile: "algo", contour: 1, ageSec: 30, fiveHour: part(93, 1.5), sevenDay: part(57, 120) },
    { profile: "evirma", contour: 4, ageSec: 3600, fiveHour: part(7, 2), sevenDay: part(41, 72) },
] };
const profileMap = [
    { id: 4, profile: "Evirma", name: "Evirma", groups: [] },
    { id: 1, profile: "Algorithmics and every project of it", name: "Algorithmics and every project of it", groups: [] },
    { id: 3, profile: "personal", name: "personal", groups: [] },
];
const session = (name, contour) => ({ session: name, sessionId: name, contour, status: "idle", pct: 20, cwd: `/srv/${name}` });
const sessions = [session("lms", 1), session("aacpanel", 3), session("atlas", 3), session("blog", 3)];
const asked = [];
const closed = (contour, n) => Array.from({ length: n }, (_, i) => ({
    sessionId: `c${contour}-${i}`, name: `old-${contour}-${i}`, cwd: `/srv/old${i}`,
    prompts: [`what conversation ${i} of contour ${contour} was about`], lastAt: new Date(Date.now() - (i + 1) * 3600e3).toISOString(),
    pctMax: 30, messages: 10, project: { id: i, name: `old${i}`, group: "Backend", session: `old${i}`, path: `/srv/old${i}` },
}));
window.fetch = async (url) => {
    const u = new URL(String(url), location.href);
    if (u.pathname === "/api/sessions/archive") {
        asked.push(u.search);
        const contour = Number(u.searchParams.get("contour"));
        return new Response(JSON.stringify({ rows: closed(contour, 3), total: 3, limit: 3, offset: 0 }), { headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: now, sessions, profileMap, limits }, profiles: { profiles: [] }, limits,
    current: "aacpanel", currentId: "", onPick() {}, picks: [], setPicks() {}, onNames() {}, onOrder() {},
    exec: { available: true, kinds: ["session.resume", "session.close"] }, wait: null,
}))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sections = () => Array.from(document.querySelectorAll(".dkscroll > section")).map((sec) => {
    const head = sec.querySelector(".dkcontour");
    const box = head.getBoundingClientRect();
    const rings = head.querySelector(".dkrings");
    const rbox = rings ? rings.getBoundingClientRect() : null;
    return {
        name: text(head.querySelector(".dkcontourname")),
        head: text(head),
        rings: Array.from(head.querySelectorAll(".dkring")).map((r) => ({
            text: text(r), level: r.classList.contains("dkcrit") ? "crit" : r.classList.contains("dkwarn") ? "warn" : "",
        })),
        old: Boolean(head.querySelector(".dkrings.dkold")),
        fits: Boolean(rbox) && rbox.right <= box.right + 0.5 && rbox.left >= box.left,
        oneLine: (() => {
            const nb = head.querySelector(".dkcontourname").getBoundingClientRect();
            return Boolean(rbox) && Math.abs((nb.top + nb.bottom) / 2 - (rbox.top + rbox.bottom) / 2) < 6 && box.height < 70;
        })(),
        tall: Math.round(box.height),
        live: Array.from(sec.querySelectorAll(".dksess:not(.dkpast) .dkname")).map(text),
        past: Array.from(sec.querySelectorAll(".dksess.dkpast")).map((r) => ({ name: text(r.querySelector(".dkname")), about: text(r.querySelector(".dklast")) })),
    };
});

window.done = (async () => {
    await document.fonts.ready;
    for (let i = 0; i < 60 && document.querySelectorAll(".dksess.dkpast").length < 5; i++) await sleep(50);
    await sleep(150);
    const out = { sections: sections(), asked };
    const algo = Array.from(document.querySelectorAll(".dkrings"))[1];
    algo.click();
    await sleep(120);
    const pop = document.querySelector(".dklimpop");
    out.pop = pop ? Array.from(pop.querySelectorAll(".dklimwin")).map(text) : null;
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    await sleep(80);
    out.closed = !document.querySelector(".dklimpop");
    Array.from(document.querySelectorAll(".dkrings"))[0].click();
    await sleep(120);
    out.oldNote = text(document.querySelector(".dklimpopnote"));
    // The details of the first contour drop over the heading of the next:
    // what stands at the middle of the note is the note, not that heading.
    const note = document.querySelector(".dklimpopnote");
    if (note) {
        const nb = note.getBoundingClientRect();
        const hit = document.elementFromPoint(nb.left + nb.width / 2, nb.top + nb.height / 2);
        out.noteOnTop = Boolean(hit && note.contains(hit));
    }
    return out;
})();
</script>
