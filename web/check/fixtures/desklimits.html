<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script>document.documentElement.style.setProperty("--ui-scale", "1.2");</script>
<div class="deskshell"><div class="dkbody" id="root"></div></div>
<script type="module">
// The sessions column at a desk: every contour has its section — a heading
// with two rings of its limit, each saying how long until its window starts
// over, that open the details of both windows, and its live sessions, or a
// word that nothing lives in it — and the closed conversations of all of them
// stand on a shelf of their own below.
import { h, render } from "preact";
import { SessionColumn } from "/src/desktop/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const now = Math.floor(Date.now() / 1000);
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 });
// Windows that start over in minutes, hours and days, none of them on a
// whole unit, and one whose reset the snapshot does not know.
const limits = { contours: [
    { profile: "personal", contour: 3, ageSec: 30, fiveHour: part(12, 2.2), sevenDay: part(24, 100) },
    { profile: "algo", contour: 1, ageSec: 30, fiveHour: part(93, 1.5), sevenDay: part(57, 118) },
    { profile: "evirma", contour: 4, ageSec: 3600, fiveHour: part(7, 0.795), sevenDay: { pct: 41 } },
] };
const profileMap = [
    { id: 4, profile: "Evirma", name: "Evirma", groups: [] },
    { id: 1, profile: "Algorithmics and every project of it", name: "Algorithmics and every project of it", groups: [] },
    { id: 3, profile: "personal", name: "personal", groups: [] },
];
const session = (name, contour) => ({ session: name, sessionId: name, contour, status: "idle", pct: 20, cwd: `/srv/${name}` });
const sessions = [session("lms", 1), session("aacpanel", 3), session("atlas", 3), session("blog", 3)];
const asked = [];
// Three closed conversations a contour, an hour apart and the contours
// interleaved, each in a project of its own.
const collector = { 3: "personal", 1: "algo", 4: "evirma" };
const closed = (contour, n) => Array.from({ length: n }, (_, i) => ({
    sessionId: `c${contour}-${i}`, name: `old-${contour}-${i}`, cwd: `/srv/old${contour}${i}`, profile: collector[contour],
    prompts: [`what conversation ${i} of contour ${contour} was about`],
    lastAt: new Date(Date.now() - (i * 3 + contour / 10 + 1) * 3600e3).toISOString(),
    pctMax: 30, messages: 10,
    project: { id: contour * 10 + i, name: `old${contour}${i}`, group: "Backend", session: `old${contour}${i}`, path: `/srv/old${contour}${i}` },
}));
window.fetch = async (url) => {
    const u = new URL(String(url), location.href);
    if (u.pathname === "/api/sessions/archive") {
        asked.push(u.search);
        const rows = u.searchParams.getAll("contour").map(Number).flatMap((c) => closed(c, 3))
            .sort((a, b) => Date.parse(b.lastAt) - Date.parse(a.lastAt));
        return new Response(JSON.stringify({ rows, total: rows.length, limit: 30, offset: 0 }), { headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
};

render(h(ToastHost, null, h(GateHost, null, h(SessionColumn, {
    snapshot: { at: now, sessions, profileMap, limits }, profiles: { profiles: [] }, limits,
    current: "aacpanel", currentId: "", onPick() {}, picks: [], setPicks() {}, onNames() {}, onOrder() {},
    exec: { available: true, kinds: ["session.resume", "session.close"] }, wait: null,
}))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sections = () => Array.from(document.querySelectorAll(".dkscroll > section:not(.dkshelf)")).map((sec) => {
    const head = sec.querySelector(".dkcontour");
    const box = head.getBoundingClientRect();
    const rings = head.querySelector(".dkrings");
    const rbox = rings ? rings.getBoundingClientRect() : null;
    return {
        name: text(head.querySelector(".dkcontourname")),
        head: text(head),
        rings: Array.from(head.querySelectorAll(".dkring")).map((r) => {
            const dial = r.querySelector(".dkringdial");
            // The colour of the arc is the first colour of the conic fill.
            const arc = (getComputedStyle(dial, "::before").backgroundImage.match(/rgba?\([^)]*\)/) || [""])[0];
            return {
                value: text(r.querySelector("b")), label: text(r.querySelector(".dkringlabel")),
                arc, ink: getComputedStyle(r.querySelector("b")).color, tip: r.getAttribute("data-tip") || "",
            };
        }),
        old: Boolean(head.querySelector(".dkrings.dkold")),
        fits: Boolean(rbox) && rbox.right <= box.right + 0.5 && rbox.left >= box.left,
        oneLine: (() => {
            const nb = head.querySelector(".dkcontourname").getBoundingClientRect();
            return Boolean(rbox) && Math.abs((nb.top + nb.bottom) / 2 - (rbox.top + rbox.bottom) / 2) < 6 && box.height < 70;
        })(),
        live: Array.from(sec.querySelectorAll(".dklive .dkname")).map(text),
        closed: sec.querySelectorAll(".dkclosed").length,
        empty: text(sec.querySelector(".dkempty")),
        bottom: sec.getBoundingClientRect().bottom,
    };
});

// painted is the colour an element shows at rest, its own layers laid over
// what its ancestors paint: a gradient counts as the mean of its stops, which
// is enough to tell a band from the ground.
const rgba = (c) => {
    const m = /rgba?\(([^)]*)\)/.exec(c || "");
    if (!m) return [0, 0, 0, 0];
    const [r, g, b, a = 1] = m[1].split(/[ ,/]+/).filter(Boolean).map(Number);
    return [r, g, b, a];
};
const over = (top, below) => {
    const a = top[3] + below[3] * (1 - top[3]);
    if (a === 0) return [0, 0, 0, 0];
    const mix = (i) => (top[i] * top[3] + below[i] * below[3] * (1 - top[3])) / a;
    return [mix(0), mix(1), mix(2), a];
};
const ownLayers = (el) => {
    const cs = getComputedStyle(el);
    const stops = (cs.backgroundImage.match(/rgba?\([^)]*\)/g) || []).map(rgba);
    const image = stops.length
        ? [0, 1, 2, 3].map((i) => stops.reduce((sum, c) => sum + c[i], 0) / stops.length)
        : [0, 0, 0, 0];
    return over(image, rgba(cs.backgroundColor));
};
const painted = (el) => (el ? over(ownLayers(el), painted(el.parentElement)) : [255, 255, 255, 1]);
// band compares the heading of a contour with a row of its sessions: how far
// apart they are painted, and whether the heading's own ground is solid
// enough for the rows scrolling under it to stay unseen.
const band = () => {
    const head = document.querySelector(".dkcontour.dklimhead");
    const row = document.querySelector(".dklive");
    const a = painted(head);
    const b = painted(row);
    return {
        apart: Math.round(Math.max(...[0, 1, 2].map((i) => Math.abs(a[i] - b[i])))),
        solid: ownLayers(head)[3] === 1 || getComputedStyle(head).backdropFilter !== "none",
    };
};

window.done = (async () => {
    await document.fonts.ready;
    for (let i = 0; i < 60 && !document.querySelector(".dkshelf .dkclosed"); i++) await sleep(50);
    await sleep(150);
    const shelf = document.querySelector(".dkshelf");
    const dark = band();
    document.documentElement.classList.add("sky");
    const sky = band();
    document.documentElement.classList.remove("sky");
    const out = {
        band: { dark, sky },
        sections: sections(),
        asked,
        shelf: Array.from(document.querySelectorAll(".dkshelf .dkclosed")).map((r) => ({
            name: text(r.querySelector(".dkclname")), contour: text(r.querySelector(".dkclcontour")),
            about: text(r.querySelector(".dkabout")), when: text(r.querySelector(".dkclwhen")),
        })),
        shelfTop: shelf ? shelf.getBoundingClientRect().top : 0,
        shelfLast: Boolean(shelf) && shelf === shelf.parentElement.lastElementChild,
    };
    const algo = Array.from(document.querySelectorAll(".dkrings"))[1];
    algo.click();
    await sleep(120);
    const pop = document.querySelector(".dklimpop");
    out.pop = pop ? Array.from(pop.querySelectorAll(".dklimwin")).map(text) : null;
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    await sleep(80);
    out.closed = !document.querySelector(".dklimpop");
    Array.from(document.querySelectorAll(".dkrings"))[0].click();
    await sleep(120);
    out.oldNote = text(document.querySelector(".dklimpopnote"));
    // The details of the first contour drop over the heading of the next:
    // what stands at the middle of the note is the note, not that heading.
    const note = document.querySelector(".dklimpopnote");
    if (note) {
        const nb = note.getBoundingClientRect();
        const hit = document.elementFromPoint(nb.left + nb.width / 2, nb.top + nb.height / 2);
        out.noteOnTop = Boolean(hit && note.contains(hit));
    }
    return out;
})();
</script>
