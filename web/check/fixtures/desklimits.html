<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .deskshell{position:static;height:100%} .dkbody{height:100%}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script>document.documentElement.style.setProperty("--ui-scale", "1.2");</script>
<div class="deskshell" id="root"></div>
<script type="module">
// The contour tabs keep the footer limits, actions and archive scoped while each
// reading opens its own shared details.
import { h, render } from "preact";
import { useState } from "preact/hooks";
import { ContourLimits, SessionColumn } from "/src/desktop/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";

const now = Math.floor(Date.now() / 1000);
Date.now = () => now * 1000;
const part = (pct, hours) => ({ pct, resetsAt: now + hours * 3600 });
// Windows that start over in minutes, hours and days, none of them on a
// whole unit, and one whose reset the snapshot does not know.
const limits = { contours: [
    { profile: "personal", contour: 3, ageSec: 30, fiveHour: part(12, 2.2), sevenDay: part(24, 100) },
    { profile: "globex", contour: 1, ageSec: 30, fiveHour: part(93, 1.5), sevenDay: part(57, 118) },
    { profile: "acme", contour: 4, ageSec: 3600, fiveHour: part(7, 0.795), sevenDay: { pct: 41 } },
    { profile: "lab", contour: 9, ageSec: 30, sevenDay: part(5, 50) },
] };
const profileMap = [
    { id: 4, profile: "Acme", name: "Acme", groups: [] },
    { id: 1, profile: "Globex Group and every project of it", name: "Globex Group and every project of it", groups: [] },
    { id: 3, profile: "personal", name: "personal", groups: [] },
];
const session = (name, contour) => ({ session: name, sessionId: name, contour, status: "idle", pct: 20, cwd: `/srv/${name}` });
const sessions = [session("shop", 1), session("aacpanel", 3), session("helios", 3), session("blog", 3)];
const asked = [];
// Three closed conversations a contour, an hour apart and the contours
// interleaved, each in a project of its own.
const collector = { 3: "personal", 1: "globex", 4: "acme" };
// The clock the times of the closed conversations are taken from; the test
// reads their dates against it, not against its own later one.
const clock = Date.now();
const closed = (contour, n) => Array.from({ length: n }, (_, i) => ({
    sessionId: `c${contour}-${i}`, name: `old-${contour}-${i}`, cwd: `/srv/old${contour}${i}`, profile: collector[contour],
    prompts: [`what conversation ${i} of contour ${contour} was about`],
    lastAt: new Date(clock - (i * 3 + contour / 10 + 1) * 3600e3).toISOString(),
    pctMax: 30, messages: 10,
    project: { id: contour * 10 + i, name: `old${contour}${i}`, group: "Backend", session: `old${contour}${i}`, path: `/srv/old${contour}${i}` },
}));
window.fetch = counted(async (url) => {
    const u = new URL(String(url), location.href);
    if (u.pathname === "/api/sessions/archive") {
        asked.push(u.search);
        const rows = u.searchParams.getAll("contour").map(Number).flatMap((c) => closed(c, 3))
            .sort((a, b) => Date.parse(b.lastAt) - Date.parse(a.lastAt));
        return new Response(JSON.stringify({ rows, total: rows.length, limit: 30, offset: 0 }), { headers: { "Content-Type": "application/json" } });
    }
    return new Response("", { status: 404 });
});

// What the actions of a heading hand on: the entry of the map a press on
// Tasks names, and where a press on Profile opens the settings.
const handed = { tasks: [], settings: [] };
const columnProps = {
    snapshot: { at: now, sessions, profileMap, limits }, limits,
    current: "aacpanel", currentId: "", onPick() {}, onNames() {}, onOrder() {},
    onTasks(entry) { handed.tasks.push(entry ? entry.id : null); },
    onSettings(at) { handed.settings.push(at); },
    exec: { available: true, kinds: ["session.resume", "session.close"] }, wait: null,
};
function Scene() {
    const [shown, setShown] = useState("");
    return h(ToastHost, null, h(GateHost, null, [
        h("div", { class: "dkbody" }, h(SessionColumn, { ...columnProps, onShown: setShown })),
        h("footer", { class: "dkstatus" }, [h("span", { class: "dkstatuscontour" }, shown),
            h(ContourLimits, { key: shown, name: shown, limits, profiles: profileMap })]),
    ]));
}
render(h(Scene), document.getElementById("root"));

// until waits on a condition of the screen frame by frame, for three seconds
// at most.
const until = async (ok) => {
    const end = performance.now() + 3000;
    while (!ok() && performance.now() < end) await new Promise((r) => requestAnimationFrame(r));
    return ok();
};
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sections = () => Array.from(document.querySelectorAll(".dkscroll > section:not(.dkshelf)")).map((sec) => {
    const head = sec.querySelector(".dkcontour");
    const footer = document.querySelector(".dkstatus");
    return {
        name: text(head.querySelector(".dkcontourname")),
        head: text(head),
        headingReadings: head.querySelectorAll(".limit-reading").length,
        readings: Array.from(footer.querySelectorAll(".limit-reading")).map((r) => ({
            value: r.querySelector(".limit-percent").firstChild.textContent, label: (r.title.match(/resets (?:in [^,]+|any moment)/) || [""])[0], tip: r.title,
        })),
        old: Boolean(footer.querySelector(".limit-chip-group.old")),
        agents: Array.from(footer.querySelectorAll(".limit-chip-group .limit-vendor")).map((mark) => mark.dataset.agent),
        grouped: Boolean(footer.querySelector('.limit-chip-group[role="group"]')),
        acts: Array.from(head.querySelectorAll(".dkcontouracts button"))
            .map((b) => `${b.getAttribute("aria-label")}${b.disabled ? " off" : ""}`),
        live: Array.from(sec.querySelectorAll(".sc:not(.scpast)")).map((c) => c.dataset.name),
        closed: sec.querySelectorAll(".sc.scpast").length,
        empty: text(sec.querySelector(".dkempty")),
    };
});

const tabOf = (name) => Array.from(document.querySelectorAll(".dkpick [role=tab]"))
    .find((b) => text(b.querySelector(".dkpickname")) === name);
const shelfOf = (contour) => document.querySelector(`.dkshelf .sc.scpast[data-name^="old-${contour}-"]`);
// Read each window separately, then put its details down with Escape.
const details = async () => {
    const windows = [];
    for (const reading of document.querySelectorAll(".dklimitrow .limit-reading")) {
        reading.click();
        await quiet();
        const pop = document.querySelector(".limit-popover");
        const label = reading.getAttribute("aria-label").split(",").slice(0, 2).join(",");
        const detail = [...pop.querySelectorAll(".limit-detail")].find((row) => row.querySelector(".limit-detail-reading").getAttribute("aria-label") === label);
        windows.push([label, text(detail), ...[...pop.children].filter((child) => child.tagName === "SPAN").map(text)].join(" "));
    }
    const out = { windows, note: windows.join(" | ") };
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    out.closed = await until(() => !document.querySelector(".limit-popover"));
    return out;
};

// hand presses Tasks and Profile in the heading shown and says what they
// handed on; a button that is off hands nothing.
const hand = async () => {
    const from = { tasks: handed.tasks.length, settings: handed.settings.length };
    for (const label of ["Tasks", "Profile"]) {
        const button = document.querySelector(`.dkcontouracts button[aria-label="${label}"]`);
        if (button) button.click();
    }
    await quiet();
    return { tasks: handed.tasks.slice(from.tasks), settings: handed.settings.slice(from.settings) };
};

window.done = (async () => {
    const out = { clock, tabs: [] };
    for (const entry of profileMap) {
        const from = asked.length;
        const tab = tabOf(entry.profile);
        if (!tab) break;
        tab.click();
        await until(() => shelfOf(entry.id));
        await quiet();
        const shelf = document.querySelector(".dkshelf");
        out.tabs.push({
            tab: entry.profile,
            sections: sections(),
            // The first tab is the one the column starts on: its request went
            // out with the first draw.
            asked: asked.slice(out.tabs.length === 0 ? 0 : from),
            shelf: Array.from(document.querySelectorAll(".dkshelf .sc.scpast")).map((r) => ({
                name: r.dataset.name, contour: text(r.querySelector(".sctag")),
                about: text(r.querySelector(".scstep")), when: text(r.querySelector(".sctime")),
            })),
            shelfLast: Boolean(shelf) && shelf === shelf.parentElement.lastElementChild,
            details: await details(),
            handed: await hand(),
        });
    }
    // The contour the map does not hold.
    tabOf("lab").click();
    await until(() => text(document.querySelector(".dkcontourname")) === "lab");
    await quiet();
    out.loose = { sections: sections(), handed: await hand() };
    return out;
})();
</script>
