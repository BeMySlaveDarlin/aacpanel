<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div id="root"></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs","uplot":"/vendor/uplot.mjs"}}</script>
<script type="module">
import { render } from "preact";
import { useState } from "preact/hooks";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { Sessions } from "/src/screens/sessions.js";
import { SessionColumn } from "/src/desktop/sessions.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { quiet, counted } from "/check/fixtures/quiet.js";

const until = async (ready) => {
    const deadline = performance.now() + 5000;
    while (!ready() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 20));
    if (!ready()) throw new Error("The waiting UI did not become ready");
};
const wide = innerWidth >= 1100;
const id = "01234567-1234-4321-aaaa-123456789012";
const requestID = "a".repeat(32);
const at = new Date(Date.now() - 10000).toISOString();
let record = { id: requestID, title: "Restart the router", steps: "Run this from the laptop:\n```sh\nssh root@192.168.1.1 reboot\n```\nWait for Wi-Fi to return.", blocking: true, created: at };
const candidates = [
    { kind: "request", id: requestID, title: record.title, at, pos: 10, blocking: true },
    { kind: "brief", id: "rotation", title: "Token rotation", at, pos: 11 },
    { kind: "secret", id: "release.env", title: "Release token", at, pos: 12 },
    { kind: "call", title: "CI needs your choice", at, pos: 13 },
    { kind: "question", id: "message-question", title: "Shall I publish?", answers: ["Publish", "Wait"], at, pos: 16 },
    { kind: "asked", title: "A blocking question", at, pos: 14 },
    { kind: "permit", title: "Permission", at, pos: 15 },
];
let session = { session: "work", sessionId: id, cwd: "/srv/proj", profile: "personal", contour: 1, status: "idle", transport: "stream", called: at, waiting: candidates, model: "claude-opus-4-6", pct: 12 };
const snapshot = { at: 1, sessions: [session], profileMap: [{ id: 1, profile: "personal", name: "personal", groups: [] }, { id: 2, profile: "work", name: "work", groups: [] }] };
const exec = { available: true, kinds: ["session.send", "session.shell", "secret.put"] };
const old = [
    { role: "request", id: requestID, title: record.title, steps: record.steps, blocking: true, pos: 10, at },
    { role: "brief", id: "rotation", title: "Token rotation", questions: 6, pos: 11, at },
    { role: "secret", title: "Release token", name: "release.env", pos: 12, at },
    { role: "call", text: "CI needs your choice", pos: 13, at },
];
old.push({ role: "ai", text: "Shall I publish? The checks passed.", pos: 16, at });
const tail = Array.from({ length: 40 }, (_, i) => ({ role: "ai", pos: 1000 + i, text: `Later answer ${i}: the session kept working on the independent part of its task.`, at }));
const all = [...old, ...tail];
const sent = [];
const windows = [];
let copied = "";
Object.defineProperty(navigator, "clipboard", { configurable: true, value: {
    writeText: async (text) => { copied = text; },
} });
let refuse = true;
let holdRequests = true;
let releaseRequests;
let holdQuestion = false;
let releaseQuestion;
const json = (value, status = 200) => new Response(JSON.stringify(value), { status, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (input, options) => {
    const url = new URL(String(input), location.href);
    if (url.pathname === "/api/chat") {
        const p = url.searchParams;
        let items = tail;
        if (p.has("before")) { windows.push("before"); items = all.filter(i => i.pos < Number(p.get("before"))).slice(-Number(p.get("limit"))); }
        if (p.has("after")) { windows.push("after"); items = all.filter(i => i.pos > Number(p.get("after"))).slice(0, Number(p.get("limit"))); }
        return json({ items, first: items[0]?.pos, last: items.at(-1)?.pos, total: items.length, moreBefore: !p.has("before"), state: null });
    }
    if (url.pathname === "/api/requests") {
        if (holdRequests) {
            holdRequests = false;
            await new Promise(resolve => { releaseRequests = resolve; });
        }
        return json({ requests: [record] });
    }
    if (url.pathname === "/api/briefs") return json({ briefs: [{ id: "rotation", sessionId: id, cwd: session.cwd, title: "Token rotation", questions: 6 }] });
    if (url.pathname === "/api/secrets") return json({ secrets: [] });
    if (url.pathname === "/api/actions") {
        const body = JSON.parse(options.body);
        sent.push(body);
        if (body.kind === "session.shell") return json({ ok: true, detail: "running" });
        if (holdQuestion && body.params.text) {
            holdQuestion = false;
            await new Promise(resolve => { releaseQuestion = resolve; });
        }
        if (refuse) return json({ error: "Delivery refused" }, 502);
        record = { ...record, answer: body.params.answer, note: body.params.note, answered: new Date().toISOString() };
        return json({ ok: true, detail: "queued" });
    }
    if (url.pathname === "/api/sessions/archive") return json({ archive: { rows: [] } });
    if (url.pathname.startsWith("/api/term")) return json({ available: false });
    if (url.pathname.startsWith("/api/session/window")) return json({ state: "none" });
    if (url.pathname.startsWith("/api/session/")) return json({ to: "" });
    return json({});
});
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };

let back, redraw, refresh;
function App() {
    const [opened, setOpened] = useState(false);
    const [, setRevision] = useState(0);
    redraw = () => setRevision(n => n + 1);
    refresh = redraw;
    back = () => setOpened(false);
    const chat = opened && html`<${Chat} name="work" id=${id} live=${session} snapshot=${snapshot} exec=${exec} onBack=${back} onUsage=${() => {}} />`;
    return wide ? html`<div class="deskshell"><div class="dkbody"><${SessionColumn} snapshot=${snapshot} exec=${exec} limits=${{}} picks=${[]} setPicks=${() => {}}
        current=${opened ? "work" : ""} onPick=${() => setOpened(true)} /><section class="dkcenter dkchat">${chat}</section></div></div>`
        : html`<div class="shell no-nav"><main class="body">${opened ? chat : html`<${Sessions} snapshot=${snapshot} ageSec=${0} exec=${exec} wait=${{ opening: () => [], of: () => null }} pick=${() => setOpened(true)} />`}</main></div>`;
}
const mark = () => document.querySelector(".waitingmark");
const queue = () => document.querySelector(".waitingqueue");
const queueCount = () => Number(document.querySelector(".waitinghead")?.textContent.match(/·\s*(\d+)/)?.[1] || 0);
const requestSheet = () => document.querySelector('.sheet.on[aria-label="request"]');
const depth = () => history.state?.depth || 0;
const pick = async (title, settle = true) => {
    const head = document.querySelector(".waitinghead");
    if (head.getAttribute("aria-expanded") !== "true") { head.click(); await quiet(); }
    [...document.querySelectorAll(".waitingitem")].find(b => b.textContent.includes(title)).click();
    if (settle) await quiet();
};
window.done = (async () => {
    render(html`<${ToastHost}><${GateHost}><${App} /></${GateHost}></${ToastHost}>`, document.getElementById("root"));
    await document.fonts.ready;
    await quiet();
    const out = { wide, countBefore: Number(mark()?.dataset.waitingCount || 0) };
    out.needsYou = wide ? document.querySelector(".dklive")?.textContent.includes("Shall I publish?")
        : Boolean(document.querySelector(".pjwaits")?.textContent.includes("needs you") && document.querySelector(".pjcard")?.textContent.includes("Shall I publish?"));
    out.contourMark = wide ? document.querySelector(".dkwaitn")?.textContent.trim() === "1"
        : document.querySelector('.pftab .waitn')?.getAttribute("aria-label") === "1 waiting for you";
    if (new URLSearchParams(location.search).has("screenshot")) return out;
    mark().click();
    await until(() => queue() && document.querySelector(".feedrow"));
    await until(() => releaseRequests);
    out.opened = Boolean(queue() && document.querySelector(".composer"));
    out.countAfterOpening = queueCount();
    out.callGone = ![...document.querySelectorAll(".waitingitem")].some(b => b.textContent.includes("CI needs"));
    const baseDepth = depth();
    await pick("Restart the router", false);
    await until(() => document.querySelector(".mrequest .requeststate"));
    out.readingState = requestSheet()?.querySelector(".requeststate")?.textContent === "Reading request state…";
    releaseRequests();
    await quiet();
    out.oneHistoryEntry = depth() === baseDepth + 1;
    history.back();
    await until(() => !requestSheet() && depth() === baseDepth);
    await quiet();
    out.backCloses = Boolean(document.querySelector(".composer"));

    const feed = document.querySelector(".chatfeed");
    feed.scrollTop = (feed.scrollHeight - feed.clientHeight) / 2;
    feed.dispatchEvent(new Event("scroll"));
    await quiet();
    const scrollBefore = feed.scrollTop, windowsBefore = windows.length;
    await pick("Restart the router");
    let card = requestSheet()?.querySelector(".mrequest");
    out.feedUnmoved = scrollBefore > 0 && feed.scrollTop === scrollBefore;
    out.noWindowLoad = windows.length === windowsBefore;
    out.requestVisible = card?.querySelector(".requesttitle")?.textContent === record.title
        && card?.querySelector(".requeststeps")?.textContent.includes("Wait for Wi-Fi to return.");
    out.sheetShape = Boolean(requestSheet()?.classList.contains(wide ? "win" : "draggable"));
    out.collapsedOnPick = document.querySelector(".waitinghead").getAttribute("aria-expanded") === "false";
    card.querySelector(".mdcopy").click();
    out.commandCopies = copied === "ssh root@192.168.1.1 reboot";
    card.querySelector(".mdrun").click();
    await until(() => document.querySelector(".sheet.on .gtpreview"));
    out.runConfirms = document.querySelector(".sheet.on .gtpreview").textContent === "ssh root@192.168.1.1 reboot" && sent.length === 0;
    document.querySelector(".sheet.on .gtpreview").closest(".sheet").querySelector(".btn.primary").click();
    await quiet();
    out.runSent = sent.at(-1)?.kind === "session.shell" && sent.at(-1)?.target === "work"
        && sent.at(-1)?.params?.text === "ssh root@192.168.1.1 reboot" && Boolean(requestSheet());
    requestSheet().querySelector(".sheetclose").click();
    await quiet();
    for (const [title, kind] of [["Token rotation", "brief"], ["Release token", "secret"], ["Shall I publish?", "ai"]]) {
        await pick(title);
        out[kind + "Highlighted"] = Boolean(document.querySelector(`.r-${kind}.waitingtarget`));
    }
    out.loadedOlderWindow = windows.includes("before") && windows.includes("after");
    out.questionSummary = document.querySelector(".mquestionwhat")?.textContent === "Shall I publish?";
    out.questionFullText = document.querySelector(".mquestionwhat")?.parentElement.textContent.includes("The checks passed.");
    const quick = () => document.querySelector(".mquestionanswers");
    const choices = candidates.find(item => item.kind === "question");
    const offered = choices.answers;
    out.quickButtons = [...quick().querySelectorAll("button")].map(b => b.textContent).join("|") === "Publish|Wait";
    delete choices.answers;
    redraw(); await quiet();
    out.quickMissing = !quick();
    choices.answers = [];
    redraw(); await quiet();
    out.quickEmpty = !quick();
    choices.answers = offered;
    const kinds = exec.kinds;
    exec.kinds = [];
    redraw(); await quiet();
    out.quickUnavailable = !quick();
    exec.kinds = kinds;
    session.outside = true;
    redraw(); await quiet();
    out.quickOutside = !quick();
    session.outside = false;
    redraw(); await quiet();
    const beforeQuick = sent.length;
    holdQuestion = true;
    const firstReply = quick().querySelector("button");
    firstReply.click(); firstReply.click();
    await until(() => releaseQuestion && [...quick().querySelectorAll("button, textarea")].every(b => b.disabled));
    out.quickBusy = sent.length === beforeQuick + 1 && queueCount() === 4;
    out.quickPlain = sent.at(-1)?.kind === "session.send" && sent.at(-1)?.target === "work" && sent.at(-1)?.params?.text === "Publish";
    document.querySelector(".feedjump").click();
    await until(() => [...document.querySelectorAll(".msg.me.queued")].some(row => row.textContent.includes("Publish")));
    out.quickLocalSending = document.querySelector(".chatfeed").textContent.includes("going out");
    releaseQuestion(); releaseQuestion = null;
    await quiet();
    out.quickFailedRow = [...document.querySelectorAll(".msg.me.failed")].some(row => row.textContent.includes("Publish") && row.textContent.includes("Delivery refused"));
    await pick("Shall I publish?");
    out.quickFailureKeeps = Boolean(quick()) && queueCount() === 4;
    await pick("Restart the router");
    card = requestSheet()?.querySelector(".mrequest");
    const field = card.querySelector("textarea");
    field.value = "Wi-Fi is back.";
    field.dispatchEvent(new Event("input", { bubbles: true }));
    await quiet();
    card.querySelector(".requestanswer .primary").click();
    await quiet();
    out.failureKeepsTask = queueCount() === 4 && Boolean(requestSheet()?.querySelector(".requestanswer")) && field.value === "Wi-Fi is back.";
    refuse = false;
    card.querySelector(".requestanswer .primary").click();
    await quiet();
    out.sent = sent.at(-1);
    out.countAfterAnswer = queueCount();
    out.answerCloses = !requestSheet() && depth() === baseDepth;
    const feedCard = feed.querySelector(".mrequest");
    out.answerVisible = feedCard?.querySelector(".requeststate")?.textContent === "Done" && feedCard?.querySelector(".requestreply")?.textContent === "Wi-Fi is back.";
    document.querySelector(".waitinghead").click();
    await quiet();
    out.requestGone = ![...document.querySelectorAll(".waitingitem")].some(b => b.textContent.includes(record.title));
    out.questionHighlightKept = Boolean(feed.querySelector(".r-ai.waitingtarget"));
    await pick("Shall I publish?");
    const note = quick().querySelector("textarea");
    note.value = "  Hold for CI.\nKeep logs.  ";
    note.dispatchEvent(new Event("input", { bubbles: true }));
    await quiet();
    holdQuestion = true;
    quick().querySelectorAll("button")[1].click();
    await until(() => releaseQuestion);
    const quickSent = sent.at(-1);
    out.quickNote = quickSent?.params?.text === "Wait\n\nHold for CI.\nKeep logs.";
    out.quickMessageId = /^[0-9a-f-]{36}$/.test(quickSent?.params?.messageId || "");
    releaseQuestion(); releaseQuestion = null;
    await quiet();
    out.quickGone = Boolean(document.querySelector('.feedrow[data-pos="16"]')) && !quick() && queueCount() === 2;
    document.querySelector(".feedjump").click();
    await quiet();
    out.quickLocalQueued = [...document.querySelectorAll(".msg.me.queued")].some(row => row.textContent.includes("Wait"))
        && document.querySelector(".chatfeed").textContent.includes("queued");
    // A composer reply settles a fresh question through the same send gate.
    choices.id = "composer-question";
    redraw(); await quiet();
    await pick("Shall I publish?");
    const reply = document.querySelector(".composer textarea");
    reply.value = "Publish it.";
    reply.dispatchEvent(new Event("input", { bubbles: true }));
    await quiet();
    document.querySelector(".composer .sendbtn").click();
    await until(() => sent.at(-1)?.params?.text === "Publish it.");
    await quiet();
    out.countAfterReply = queueCount();
    out.questionSummaryGone = !document.querySelector(".mquestionwhat");
    out.questionHighlightGone = !feed.querySelector(".waitingtarget");
    await pick("Release token");
    out.hostHighlightBefore = Boolean(feed.querySelector(".r-secret.waitingtarget"));
    const waitingSession = session;
    session = { ...session, waiting: session.waiting.filter((item) => item.kind !== "secret") };
    snapshot.sessions = [session];
    refresh();
    await quiet();
    out.hostHighlightGone = !feed.querySelector(".waitingtarget");
    session = waitingSession;
    snapshot.sessions = [session];
    refresh();
    await quiet();
    out.horizontalOverflow = document.documentElement.scrollWidth > innerWidth;
    back();
    await quiet();
    out.countBackInList = Number(mark()?.dataset.waitingCount || 0);
    session.agent = "codex";
    choices.id = "codex-question";
    mark().click();
    await until(() => queue() && document.querySelector(".feedrow"));
    await pick("Shall I publish?");
    out.quickCodex = Boolean(document.querySelector(".mquestionwhat")) && !quick();
    return out;
})();
</script>
