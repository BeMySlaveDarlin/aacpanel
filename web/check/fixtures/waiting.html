<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
import { render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";
import { counted, quiet } from "/check/fixtures/quiet.js";
import { movesOf, withActReplies } from "/src/screens/chat/actform.js";

const until = async (ready) => {
    const end = performance.now() + 5000;
    while (!ready() && performance.now() < end) await new Promise(resolve => requestAnimationFrame(resolve));
    if (!ready()) throw new Error("The form did not reach its expected state");
};
const at = new Date(Date.now() - 5 * 60000).toISOString();
const req = { id: "a".repeat(32), kind: "do", title: "Restart the router", state: "open", blocking: true, created: at,
    body: { steps: "Run this:\n```sh\nprintf ready\n```\nWait for Wi-Fi." } };
const sec = { id: "b".repeat(32), kind: "secret", title: "Release token", state: "open", created: at,
    body: { name: "release.env", template: "TOKEN=" } };
let acts = [req, sec];
let items = [
    { role: "request", id: req.id, title: req.title, steps: req.body.steps, pos: 10, at },
    { role: "secret", id: sec.id, title: sec.title, name: sec.body.name, pos: 11, at },
    ...Array.from({ length: 20 }, (_, n) => ({ role: "ai", pos: 20 + n, text: `Independent work ${n}\n\nMore work to read above the form.`, at })),
];
let state = {};
const sent = [];
let refuse = true;
let hold = false, release;
let stream;
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
window.fetch = counted(async (input, options) => {
    const u = new URL(String(input), location.href);
    if (u.pathname === "/api/chat") return json({ items, first: 10, last: 39, total: items.length, moreBefore: false, state });
    if (u.pathname === "/api/acts") return json({ acts });
    if (u.pathname === "/api/secrets") return json({ dir: "/srv/secrets", secrets: [] });
    if (u.pathname === "/api/actions") {
        const body = JSON.parse(options.body); sent.push(body);
        if (hold) { hold = false; await new Promise(resolve => { release = resolve; }); }
        if (refuse) return json({ error: "Delivery refused" }, 502);
        if (body.params.act) acts = acts.map(a => a.id === body.params.act ? { ...a, state: body.params.answer === "decline" ? "declined" : "answered", closed: new Date().toISOString(), answer: { outcome: body.params.answer, note: body.params.note } } : a);
        return json({ ok: true });
    }
    if (u.pathname.startsWith("/api/term")) return json({ available: false });
    return json({});
});
window.EventSource = class {
    constructor() { stream = this; this.listeners = {}; }
    addEventListener(type, fn) { this.listeners[type] = fn; }
    close() {}
};
const session = { session: "work", sessionId: "s1", cwd: "/srv/proj", transport: "stream", status: "idle", model: "claude-opus-5-5",
    waiting: [{ kind: "request", id: req.id, title: req.title, pos: 10, at, blocking: true }, { kind: "secret", id: sec.id, title: sec.title, pos: 11, at }] };
const exec = { available: true, kinds: ["session.send", "session.answer", "session.dismiss", "session.shell", "secret.put"] };
const root = document.querySelector("#root");
const draw = () => render(html`<${ToastHost}><${GateHost}><${Chat} name="work" id="s1" live=${session} exec=${exec} onBack=${() => {}} /></${GateHost}></${ToastHost}>`, root);
const count = () => Number(document.querySelector(".movepill")?.textContent.match(/· (\d+)/)?.[1] || 0);
const form = () => document.querySelector(".actform");
const button = (word) => [...form().querySelectorAll("button")].find(b => b.textContent.trim() === word);
const type = async (el, text) => { el.value = text; el.dispatchEvent(new Event("input", { bubbles: true })); await quiet(); };
const next = async () => { document.querySelector(".movepill").click(); await quiet(); };
const publish = async () => { stream.listeners.state({ data: JSON.stringify(state) }); await quiet(); };
window.done = (async () => {
    const out = {};
    draw(); await until(() => form()?.querySelector(".requestanswer")); await quiet();
    out.auto = count() === 2 && form().textContent.includes(req.title) && !document.querySelector(".sheet.on, .waitingqueue");
    out.waitTime = document.querySelector(".movepill").textContent.includes("5 min ago");
    out.markers = document.querySelectorAll(".chatfeed .actmark").length === 2 && !document.querySelector(".chatfeed .requeststeps, .chatfeed .skpad");
    out.head = document.querySelector('.talkword, .dkword[data-tone="waiting"]')?.textContent === "your move";
    out.noteQuiet = !form().querySelector("textarea");
    await next();
    out.next = Boolean(form().querySelector(".skpad") && document.querySelector('.r-secret.waitingtarget')) && count() === 2;
    await next();
    refuse = false;
    form().querySelector(".mdrun").click();
    await until(() => document.querySelector('.sheet.on .gtpreview'));
    out.runConfirms = sent.length === 0 && document.querySelector('.sheet.on .gtpreview').textContent === "printf ready";
    document.querySelector('.sheet.on .btn.primary').click(); await quiet();
    out.run = sent.at(-1).kind === "session.shell" && sent.at(-1).params.text === "printf ready" && Boolean(form().querySelector('.requeststeps'));

    const area = document.querySelector(".composer > textarea");
    area.focus(); await quiet();
    out.focus = getComputedStyle(document.querySelector(".cstrip")).display === (innerWidth < 1100 ? "none" : "flex")
        && getComputedStyle(document.querySelector(".deck")).display === (innerWidth < 1100 ? "none" : "flex")
        && (getComputedStyle(document.querySelector(".composeclip")).display !== "none") === (innerWidth < 1100);
    await type(area, "I am checking it.");
    refuse = false;
    document.querySelector(".composer .sendbtn").click(); await quiet();
    out.replyKeeps = sent.at(-1)?.params.text === "I am checking it." && form().textContent.includes(req.title) && count() === 2;
    area.blur();
    const added = { id: "c".repeat(32), kind: "do", title: "A new blocking act", blocking: true, state: "open", created: new Date().toISOString(), body: { steps: "Keep waiting." } };
    acts = [...acts, added]; session.waiting = [...session.waiting, { kind: "request", id: added.id, title: added.title, at: added.created }];
    draw(); await quiet();
    out.keepsCurrent = count() === 3 && form().textContent.includes(req.title);
    const beforeCant = sent.length;
    button("Can't").click(); await quiet();
    out.cantReason = Boolean(form().querySelector("textarea")) && sent.length === beforeCant;
    await type(form().querySelector("textarea"), "No power.");
    refuse = true; button("Can't").click(); await quiet();
    out.failureKeeps = count() === 3 && form().querySelector("textarea")?.value === "No power.";
    refuse = false; button("Can't").click(); await quiet();
    out.cant = sent.at(-1).kind === "session.send" && sent.at(-1).params.act === req.id && sent.at(-1).params.answer === "cant" && sent.at(-1).params.note === "No power." && count() === 2;
    // The oldest blocking act is next; Done uses the same gate immediately.
    button("Done").click(); await quiet();
    out.done = sent.at(-1).params.act === added.id && sent.at(-1).params.answer === "done" && count() === 1;
    out.nextForm = Boolean(form()?.querySelector(".skpad"));
    out.secretPath = form().textContent.includes("goes to a file, 0600: the agent gets /srv/secrets/release.env");
    button("Won't give").click(); await quiet();
    await type(form().querySelector(".requestnote textarea"), "No access.");
    button("Won't give").click(); await quiet();
    out.decline = sent.at(-1).kind === "session.send" && sent.at(-1).params.act === sec.id && sent.at(-1).params.answer === "decline" && sent.at(-1).params.note === "No access." && count() === 0 && !form();
    // Changed reply wording still folds under the act identified by the API.
    items = [...items, { role: "me", pos: 40, text: `Different wording for act ${req.id}: unavailable`, at }];
    stream.listeners.chat({ data: JSON.stringify({ items, state, first: 10, last: 40, total: items.length }) }); await quiet();
    out.quietReply = document.querySelector(".actreply summary")?.textContent.startsWith("to the agent: Different wording") && ![...document.querySelectorAll(".msg.me")].some(el => el.textContent.includes("Different wording"));
    const panel = document.querySelector(".actreply"); panel.open = true;
    out.fullReply = panel.querySelector("p").textContent.includes(req.id);
    // A round keeps two questions together; change edits a folded answer.
    state = { ask: { toolUseId: "round", at, questions: [
        { header: "Plan", text: "Choose the plan", options: [{ label: "A" }, { label: "B" }] },
        { header: "Region", text: "Choose the region", options: [{ label: "West" }, { label: "East" }] },
    ] } };
    await publish();
    form().querySelectorAll(".askpick")[0].click(); await quiet();
    out.fold = form().querySelector(".askrow")?.textContent.includes("A") && form().textContent.includes("1 of 2 answered");
    form().querySelector(".askedit").click(); await quiet();
    out.change = Boolean(form().querySelector(".askone .askpick"));
    form().querySelectorAll(".askone")[0].querySelectorAll(".askpick")[1].click(); await quiet();
    form().querySelector(".askone .askpick").click(); await quiet();
    button("Send answers").click(); await quiet();
    out.round = sent.at(-1).kind === "session.answer" && JSON.stringify(sent.at(-1).params.picks) === "[[2],[1]]" && count() === 0;
    state = { ask: { toolUseId: "discussion", at, questions: [{ text: "What next?", options: [{ label: "Proceed" }] }] } };
    await publish();
    const start = sent.length;
    await type(document.querySelector(".composer > textarea"), "Let's discuss.");
    out.dismissHint = document.querySelector(".composer > textarea").placeholder === "your words dismiss the question";
    hold = true; document.querySelector(".composer .sendbtn").click();
    await until(() => document.querySelector('.sheet.on[aria-label="action confirmation"] .btn.primary'));
    document.querySelector('.sheet.on[aria-label="action confirmation"] .btn.primary').click();
    await until(() => release);
    out.dismissFirst = sent.length === start + 1 && sent.at(-1).kind === "session.dismiss";
    release(); await quiet();
    out.discussion = sent.length === start + 2 && sent.at(-1).kind === "session.send" && sent.at(-1).params.text === "Let's discuss.";
    // Both sources agree that only an open act counts; a closed API row wins.
    const normalized = Object.fromEntries(acts.map(a => [a.id, a]));
    const ordered = movesOf({ [req.id]: { ...req, state: "open" } }, [{ kind: "brief", id: "review", at }],
        [{ kind: "permit", blocking: true, at: Date.now() }]);
    out.order = ordered.map(item => item.kind).join(",") === "request,permit,brief";
    out.closedWins = movesOf(normalized, session.waiting, []).length === 0;
    out.detachedReply = withActReplies([items.at(-1)], normalized)[0]?.actReply === true;
    return out;
})();
</script>
