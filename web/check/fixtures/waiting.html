    out.claimWithdraw = sent.length === claimStart + 2 && sent.at(-1).kind === "act.withdraw" && sent.at(-1).target === "work"
        && JSON.stringify(sent.at(-1).params) === JSON.stringify({ act: outgoing.id }) && !letter(outgoing.id).querySelector(".claimwithdraw");
    draw(null);
    await until(() => letter(overdue.id)?.querySelector(".claimwithdraw"));
    letter(overdue.id).querySelector(".claimwithdraw").click();
    await until(() => badge(overdue.id).endsWith(" · withdrawn"));
    out.claimArchive = sent.at(-1).kind === "act.withdraw" && sent.at(-1).target === "saved-sender"
        && sent.at(-1).params.act === overdue.id;
    // A request still open in a session outside the panel has no form to dock into.
    const late = { id: "f".repeat(32), kind: "do", title: "Plug the cable back", state: "open", created: at, body: { steps: "Plug it in." } };
    acts = [...acts, late];
    items = [...items, { role: "request", id: late.id, title: late.title, steps: late.body.steps, pos: 68, at }];
    draw();
    stream.listeners.chat({ data: JSON.stringify({ items, state, first: 10, last: 68, total: items.length }) });
    await until(() => rowCard("request", late.id)?.querySelector(".actfoot .btn") && form()?.textContent.includes(late.title));
    const docks = label(rowCard("request", late.id)) === "request · yours";
    draw({ ...session, outside: true }); await quiet();
    out.outsideDeck = !document.querySelector(".cstrip") && Boolean(document.querySelector(".deck .pkcmds"));
    out.outsideCard = docks && !form() && Boolean(rowCard("request", late.id)) && !rowCard("request", late.id).querySelector("button");
    return out;
})();
</script>
