<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// The conversation screen with a question waiting in it, and the options of
// that question carrying drawings. The shell is the one the phone gets — the
// question card lives in a sheet, and the sheet's width is what the drawing
// has to fit into.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

// A drawing of the width such a question really carries: a mockup of a screen,
// seventy-nine columns across, which is wider than any phone.
const WIDE = [
    "+----------------------------------------------------------------------------+",
    "|  HEADER                                     [search]        [bell] [avatar] |",
    "+-------------------+--------------------------------------------------------+",
    "|  SIDE MENU        |  CONTENT                                                |",
    "|   - Dashboard     |   +--------------------+   +--------------------------+ |",
    "|   - Sessions      |   |  tokens in / out   |   |   context 23% of 1M      | |",
    "|   - Containers    |   |  124k / 8k         |   |   [==========......]     | |",
    "|   - Journal       |   +--------------------+   +--------------------------+ |",
    "|   - Settings      |                                                        |",
    "|                   |   recent runs                                          |",
    "|                   |   - evirma      busy     12 min    make check          |",
    "|                   |   - aacpanel    waiting   3 min    session.answer      |",
    "+-------------------+--------------------------------------------------------+",
].join("\n");

// A drawing narrow enough to be shown as it is.
const NARROW = [
    "ports:",
    "-  - \"51820:51820/udp\"",
    "+  - \"51000:51820/udp\"",
].join("\n");

const ask = {
    sessionId: "s1",
    toolUseId: "toolu_ask_1",
    cwd: "/srv/proj",
    questions: [{
        text: "Where does the menu go on a phone?",
        header: "Menu",
        multi: false,
        options: [
            { label: "Keep the side menu", description: "The menu stays where it is and folds into a drawer under 700px.", preview: WIDE },
            { label: "Move it to the top bar", description: "The rows become a bar over the content, and the drawer goes away.", preview: NARROW },
        ],
    }],
};

const items = [];
for (let i = 1; i <= 6; i += 1) {
    items.push({ role: "me", pos: i * 20, text: `question number ${i} about the build`, at: new Date(Date.now() - (6 - i) * 60000).toISOString() });
    items.push({ role: "ai", pos: i * 20 + 10, text: `Answer ${i}: the build is green.`, at: new Date(Date.now() - (6 - i) * 60000 + 5000).toISOString() });
}
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sent = [];
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: items[0].pos, last: items[items.length - 1].pos, total: items.length, moreBefore: false, state: { ask } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        await new Promise((r) => setTimeout(r, 120));
        return json({ logged: true, ok: true });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; this.listeners = {}; }
    addEventListener(type, fn) { (this.listeners[type] ||= []).push(fn); }
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.answer", "session.dismiss", "session.send"] };
const live = {
    status: "waiting", pct: 12.4, tokens: 124000, limit: 1000000,
    tokensIn: 124000, tokensOut: 8000, cwd: "/srv/proj",
};
function Page() {
    return html`<${Chat} name="evirma" id="s1" live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`;
}
render(h(ToastHost, null, h(GateHost, null, h(Page))), document.getElementById("root"));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// shows the drawing of one option and measures it in the box it was put into.
// The same drawing is measured a second time at the plain size of the panel's
// code, which is the width it would take with nothing fitting it: without that
// number a drawing that happens to be narrow would pass for a drawing that fits.
async function show(n) {
    const back = document.querySelector(".askover .sheetclose");
    if (back) {
        back.click();
        await sleep(350);
    }
    document.querySelectorAll(".askinfo")[n].click();
    await sleep(400);
    const pre = document.querySelector(".askpreview");
    if (!pre) return { open: false };
    const style = getComputedStyle(pre);
    const fitted = { client: pre.clientWidth, scroll: pre.scrollWidth, size: +parseFloat(style.fontSize).toFixed(2) };
    const was = pre.style.fontSize;
    pre.style.fontSize = "var(--t-xs)";
    const plain = { scroll: pre.scrollWidth, size: +parseFloat(getComputedStyle(pre).fontSize).toFixed(2) };
    pre.style.fontSize = was;
    const lines = pre.textContent.split("\n");
    return {
        open: true,
        cols: Number(pre.parentElement.style.getPropertyValue("--cols")),
        widest: lines.reduce((most, line) => Math.max(most, line.length), 0),
        lines: lines.length,
        client: fitted.client,
        scroll: fitted.scroll,
        size: fitted.size,
        plainScroll: plain.scroll,
        plainSize: plain.size,
    };
}

window.done = (async () => {
    await document.fonts.ready;
    for (let i = 0; i < 80 && !document.querySelector(".askinfo"); i += 1) await sleep(50);
    await sleep(300);

    const wide = await show(0);
    const narrow = await show(1);

    const back = document.querySelector(".askover .sheetclose");
    if (back) {
        back.click();
        await sleep(350);
    }
    document.querySelectorAll(".askpick")[1].click();
    await sleep(250);
    const button = document.querySelector(".askfoot .btn.primary");
    const label = button ? button.textContent.trim() : "";
    const off = !button || button.disabled;
    if (button) button.click();
    await sleep(700);

    return { wide, narrow, label, off, sent, waiting: !document.querySelector(".askopt") };
})();
</script>
