<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<div class="shell"><div class="body" id="root"></div></div>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<script type="module">
// Two thoughts with a run of calls between them, and the answer they led to.
import { render } from "preact";
import { html } from "/src/html.js";
import { Row } from "/src/screens/chat/rows.js";
import { rows, weld } from "/src/screens/chat/feed.js";
import { FeedGrid } from "/src/screens/chat/timeline.js";

const at = "2026-09-26T10:28:00Z";
const items = [
    { role: "mind", text: "The test reads the source; the size needs a fixture.", pos: 1, at },
    { role: "tools", kind: "bash", run: 2, pos: 2, at, calls: [{ name: "Bash", arg: "make front", pos: 2, index: 0 }] },
    { role: "mind", text: "The bundle is built; now the fixture itself.", pos: 3, at },
    { role: "ai", text: "Writing a fixture that measures it.", pos: 4, at },
];
render(html`<div class="chatfeed"><${FeedGrid} rows=${rows(weld(items))} wide=${false} onOpen=${() => {}}
    row=${(item) => html`<${Row} item=${item} session="lab" id="1" />`} /></div>`,
    document.getElementById("root"));

const until = async (ok, ms = 3000) => {
    const end = performance.now() + ms;
    while (!ok() && performance.now() < end) await new Promise((r) => setTimeout(r, 25));
};

(async () => {
    await until(() => document.querySelectorAll(".mmind p").length === 2 && document.querySelector(".msg.ai:not(.mmind) p"));
    const style = (el) => getComputedStyle(el);
    const minds = Array.from(document.querySelectorAll(".mmind p"));
    const answer = document.querySelector(".msg.ai:not(.mmind) p");
    const rowsOf = Array.from(document.querySelectorAll(".feedrow.r-mind")).map((r) => r.getBoundingClientRect());
    window.done = {
        mind: parseFloat(style(minds[0]).fontSize),
        answer: parseFloat(style(answer).fontSize),
        mindColour: style(minds[0]).color,
        answerColour: style(answer).color,
        mindFont: style(minds[0]).fontFamily,
        answerFont: style(answer).fontFamily,
        mindItalic: style(minds[0]).fontStyle,
        icons: document.querySelectorAll(".mmind svg").length,
        tags: Array.from(document.querySelectorAll(".mmtag")).map((t) => t.textContent),
        rule: style(document.querySelector(".feedrow.r-mind")).boxShadow,
        answerRule: style(document.querySelector(".feedrow.r-ai")).boxShadow,
        gap: rowsOf.length === 2 ? rowsOf[1].top - rowsOf[0].bottom : null,
    };
})();
</script>
