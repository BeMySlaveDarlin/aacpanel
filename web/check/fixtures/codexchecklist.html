<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div id="frame"></div>
<script type="module">
// The conversation of a codex thread that keeps a checklist through the
// panel's tool, in the state its feed comes with as the collector sends it
// for a thread: on a phone the line over the composer, at a desk the block at
// the top of the timeline, as a claude session's.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const wide = window.innerWidth >= 1000;
document.getElementById("frame").innerHTML = wide
    ? `<div class="deskshell"><div class="shell no-nav"><main class="body" id="root"></main></div></div>`
    : `<div class="shell no-nav"><main class="body" id="root"></main></div>`;

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const items = [
    { role: "me", pos: 1, at: ago(900), text: "Find out why the cart test is flaky, and fix it." },
    { role: "ai", pos: 2, at: ago(840), text: "It reads the clock twice; I am pinning it now." },
];
const checklist = {
    items: [
        { text: "read the cart test", status: "done", since: ago(880) },
        { text: "pin the clock of the cart test", status: "active", since: ago(600) },
        { text: "run the suite", status: "pending" },
    ],
    at: ago(600),
};
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: 2, total: 2, moreBefore: false,
                      state: { tasks: [], agents: [], checklist } });
    }
    if (u.startsWith("/api/session/models")) return json({ state: "ok", session: { agent: "codex", transport: "stream", list: [] } });
    if (u.startsWith("/api/term")) return json({ available: false });
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };

const exec = { available: true, kinds: ["session.send", "session.stop", "session.set", "session.close"] };
const live = {
    session: "codex-5afc361b", sessionId: "0199c3a2-7f10-7b2e-9c41-6e1d5afc361b", profile: "acme", agent: "codex",
    transport: "stream", status: "busy", model: "gpt-6-astra", effort: "high", mode: "ask", plan: false,
    tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/shop", checklist,
};
setLiveSessions([live]);
const root = document.getElementById("root");
render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name=${live.session} id=${live.sessionId} live=${live}
    exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => { for (let i = 0; i < 100 && !ok(); i++) await sleep(30); return ok(); };
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

window.done = (async () => {
    const out = { wide };
    try {
        const drawn = wide
            ? () => document.querySelector(".tline .ckcol") && document.querySelector(".chatfeed .msg.ai")
            : () => document.querySelector(".composerbox .ckline") && document.querySelector(".chatfeed .msg.ai");
        out.drawn = Boolean(await until(drawn));
        await document.fonts.ready;
        const line = document.querySelector(".composerbox .ckline");
        const block = document.querySelector(".tline .ckcol");
        out.line = text(line && line.querySelector(".ckstep"));
        out.lineNum = text(line && line.querySelector(".cknum"));
        out.blockFirst = Boolean(block) && block.parentElement.firstElementChild === block;
        out.blockSteps = block ? Array.from(block.querySelectorAll(".ckitem")).map(text) : [];
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
