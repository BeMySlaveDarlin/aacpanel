<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="deskshell"><div class="shell no-nav"><main class="body" id="root"></main></div></div>
<script type="module">
// A session at a desk at work on the fourth of seven steps of its plan, with a
// feed long enough to scroll: the plan stands at the top of the timeline
// column and stays there while the feed scrolls, and a person folds it to one
// line and finds it folded the next time the conversation is drawn.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { PLAN_KEY } from "/src/screens/chat/plan.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const ago = (sec) => new Date(Date.now() - sec * 1000).toISOString();
const items = [];
let pos = 1;
for (let n = 0; n < 30; n++) {
    const t = 3600 - n * 100;
    items.push({ role: "me", text: `step ${n}: go on`, at: ago(t), pos: pos++ });
    items.push({ role: "tools", kind: "bash", run: pos, pos, at: ago(t - 10),
                 calls: [{ name: "Bash", arg: `make step${n}`, pos, index: 0, at: ago(t - 10) }] });
    pos++;
    items.push({ role: "ai", text: `Step ${n} is done: the build is green and the next one is up.`, at: ago(t - 60), pos: pos++ });
}
const step = (text, status, sec) => (sec == null ? { text, status } : { text, status, since: ago(sec) });
const plan = {
    items: [
        step("read the code", "done", 3000), step("find where it is drawn", "done", 2400),
        step("write the fixtures", "done", 1800), step("mutate the lines of the feature", "active", 900),
        step("the full check", "pending"), step("shots of the live screen", "pending"), step("hand it back", "pending"),
    ],
    at: ago(900),
    note: "waits on the test base",
};
const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
window.fetch = async (url) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) {
        return json({ items, first: 1, last: pos - 1, total: items.length, moreBefore: false,
                      state: { tasks: [], agents: [], workflows: [], plan } });
    }
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.send"] };
const live = { status: "busy", transport: "stream", pct: 40.2, tokens: 402000, limit: 1000000, cwd: "/srv/proj" };
const root = document.getElementById("root");
const draw = () => render(h(ToastHost, null, h(GateHost, null, html`<${Chat} name="lab" id="s1" live=${live} exec=${exec}
    onBack=${() => {}} onUsage=${() => {}} />`)), root);
draw();

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const until = async (ok) => { for (let i = 0; i < 100 && !ok(); i++) await sleep(30); };
const top = (el) => el.getBoundingClientRect().top;

window.done = (async () => {
    const out = {};
    try {
        await until(() => document.querySelector(".tline .plancol") && document.querySelectorAll(".tlentry").length >= 30);
        for (let i = 0; i < 4; i++) await frame();
        const feed = document.querySelector(".chatfeed");
        const line = document.querySelector(".tline");
        const block = () => document.querySelector(".tline .plancol");
        out.first = line.firstElementChild === block();
        out.inComposer = Boolean(document.querySelector(".composerbox .planline"));
        out.nowBar = Boolean(document.querySelector(".composerbox .nowbar"));
        out.head = text(block().querySelector(".planhead"));
        out.steps = block().querySelectorAll(".plstep").length;
        out.note = text(block().querySelector(".plannote"));
        out.scrolls = feed.scrollHeight - feed.clientHeight;

        feed.scrollTop = 0;
        await frame();
        await frame();
        out.atTop = Math.round(top(block()) - top(line));
        out.over = Math.round(block().getBoundingClientRect().left - line.getBoundingClientRect().left);
        feed.scrollTop = feed.scrollHeight;
        await frame();
        await frame();
        out.lineGone = Math.round(top(feed) - top(line));
        out.held = Math.round(top(block()) - top(feed));
        // An entry of the column the block covers is under it, not over it.
        const covered = Array.from(document.querySelectorAll(".tlentry")).find((e) => {
            const b = e.getBoundingClientRect();
            const c = block().getBoundingClientRect();
            return b.top > c.top + 4 && b.top < c.bottom - 4;
        });
        if (covered) {
            const c = covered.getBoundingClientRect();
            const hit = document.elementFromPoint(c.left + 30, c.top + 4);
            out.coveredHit = hit ? (block().contains(hit) ? "plan" : hit.className) : "";
        }

        const tallOpen = block().getBoundingClientRect().height;
        block().querySelector(".planhead").click();
        await until(() => block().classList.contains("folded"));
        await frame();
        out.folded = {
            head: text(block().querySelector(".planhead")),
            step: text(block().querySelector(".planstep")),
            steps: block().querySelectorAll(".plstep").length,
            expanded: block().querySelector(".planhead").getAttribute("aria-expanded"),
            shorter: block().getBoundingClientRect().height < tallOpen / 3,
            oneLine: block().querySelector(".planhead").getBoundingClientRect().height < 30,
            kept: localStorage.getItem(PLAN_KEY),
        };

        // The conversation drawn again, as when it is opened the next time.
        render(null, root);
        await sleep(50);
        draw();
        await until(() => document.querySelector(".tline .plancol"));
        out.again = {
            folded: block().classList.contains("folded"),
            steps: block().querySelectorAll(".plstep").length,
        };
        block().querySelector(".planhead").click();
        await until(() => !block().classList.contains("folded"));
        out.unfolded = { steps: block().querySelectorAll(".plstep").length, kept: localStorage.getItem(PLAN_KEY) };
        out.overflow = document.scrollingElement.scrollWidth - window.innerWidth;
    } catch (err) {
        out.error = String((err && err.stack) || err);
    }
    return out;
})();
</script>
