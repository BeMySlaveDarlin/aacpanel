<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0} .shell{height:100%;--nav-clear:0px;--body-gap:.6rem} .body{position:relative;height:100%;display:flex;flex-direction:column;padding:0 .7rem;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell"><div class="body" id="root"></div></div>
<script type="module">
// A project that lives in the feed, on the wide screen: the views are the
// sides. The feed is the session on the stream, the terminal is the console,
// and the view on the other side is reached by a move, which its tab opens
// rather than makes. The window on the host comes with a move to the console
// and holds the session there: while it is open, the views only pick what to
// watch the console with.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { GateHost } from "/src/actions/gate.js";
import { ToastHost } from "/src/ui/toasts.js";

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sent = [];
const windows = { evirma: "unknown", "evirma-c": "none", "evirma-w": "open", "evirma-b": "none", "evirma-q": "unknown" };
const ways = { evirma: "console", "evirma-c": "stream", "evirma-w": "stream", "evirma-b": "stream", "evirma-q": "console" };
const who = (u) => new URL(u, location.href).searchParams.get("name");
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: null });
    if (u.startsWith("/api/term")) return json({ available: true });
    if (u.startsWith("/api/session/window")) {
        const state = windows[who(u)];
        return json(state === "unknown" ? { state, reason: "session does not live in tmux" } : { state });
    }
    if (u.startsWith("/api/session/switch")) return json({ to: ways[who(u)] });
    if (u.startsWith("/api/actions") && init && init.method === "POST") {
        sent.push(JSON.parse(init.body));
        return json({ ok: true, detail: "moved" });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class {
    constructor() { this.readyState = 1; }
    addEventListener() {}
    close() { this.readyState = 2; }
};

const exec = { available: true, kinds: ["session.switch", "window.open", "window.close", "session.send"] };
const base = { status: "idle", pct: 12.4, tokens: 124000, limit: 1000000, cwd: "/srv/proj/panel" };
const root = document.getElementById("root");
const show = (name, live) => render(h(ToastHost, null, h(GateHost, null,
    html`<${Chat} name=${name} id=${name} live=${live} exec=${exec} onBack=${() => {}} onUsage=${() => {}} />`)), root);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const tabs = () => Array.from(document.querySelectorAll(".dkhead .dktabs .dktab"));
const tab = (label) => tabs().find((b) => b.textContent.replace("⇢", "").trim() === label);
const pressed = () => {
    const on = tabs().find((b) => b.getAttribute("aria-pressed") === "true");
    return on ? (on.textContent.includes("Terminal") ? "term" : "feed") : "";
};
const settle = async () => {
    for (let i = 0; i < 50 && !document.querySelector(".dkplace"); i++) await sleep(100);
    await sleep(400);
};
const go = () => document.querySelector(".dkpop .toolgo");
const panel = async (press) => {
    press.click();
    for (let i = 0; i < 30 && !go(); i++) await sleep(50);
    return go();
};
// agree presses a control, reads the sheet it opens and confirms it.
const agree = async (el) => {
    const before = sent.length;
    el.click();
    for (let i = 0; i < 30 && !document.querySelector(".stitle"); i++) await sleep(100);
    const title = (document.querySelector(".stitle") || {}).textContent || "";
    const effect = (document.querySelector(".warnline") || {}).textContent || "";
    const ok = [...document.querySelectorAll(".btnrow .btn")].pop();
    if (ok) ok.click();
    for (let i = 0; i < 30 && sent.length === before; i++) await sleep(100);
    await sleep(300);
    return { title, effect, sent: sent.length > before ? sent[sent.length - 1] : null };
};
const notes = () => [...document.querySelectorAll(".dkpop .toolmove .toolnote")].map((n) => n.textContent).join(" | ");

window.done = (async () => {
    await document.fonts.ready;
    const out = {};

    // On the stream: the feed is on, the terminal is reached by a move and
    // says so; it opens the move rather than making it.
    show("evirma", { ...base, transport: "stream" });
    await settle();
    out.streamOn = pressed();
    out.termMarked = Boolean(tab("Terminal") && tab("Terminal").classList.contains("moves"));
    out.windowButtons = document.querySelectorAll(".dkhead .winbtn, .dkhead [aria-label*='window']").length;
    const before = sent.length;
    const move = await panel(tab("Terminal"));
    out.termSentNothing = sent.length === before;
    out.toConsole = move ? await agree(move) : { title: "", effect: "", sent: null };
    // The window comes with the move to the console, as a choice in it.
    const again = await panel(document.querySelector(".dkplace"));
    const box = document.querySelector(".dkpop .toolcheck input");
    out.windowOff = !box || box.disabled;
    if (box) box.click();
    await sleep(100);
    out.withWindow = again ? await agree(again) : null;

    // A console of the same project: the terminal is on, the feed moves it.
    show("evirma-c", { ...base, transport: "tmux" });
    await settle();
    out.consoleOn = pressed();
    const toFeed = await panel(tab("Feed"));
    out.toFeed = toFeed ? await agree(toFeed) : { title: "", sent: null };

    // A window holds the console: the feed reads it, nothing moves.
    show("evirma-w", { ...base, transport: "tmux" });
    await settle();
    const count = sent.length;
    tab("Terminal").click();
    await sleep(300);
    out.heldTerm = pressed();
    out.heldTip = tab("Feed").getAttribute("data-tip") || "";
    tab("Feed").click();
    await sleep(400);
    out.heldOn = pressed();
    out.heldSent = sent.length - count;
    out.heldFeed = Boolean(document.querySelector(".chatfeed"));
    out.heldMarked = tabs().some((b) => b.classList.contains("moves"));

    // A turn in progress: the move waits for it, and says so.
    show("evirma-b", { ...base, transport: "tmux", status: "busy" });
    await settle();
    const busy = await panel(tab("Feed"));
    out.busyOff = Boolean(busy && busy.disabled);
    out.busyWhy = notes();

    // A message the session on the stream has not taken yet: claude is idle,
    // the holder still has it, and the move and its window wait for it.
    show("evirma-q", { ...base, transport: "stream", queued: 1 });
    await settle();
    const queued = await panel(document.querySelector(".dkplace"));
    out.queuedOff = Boolean(queued && queued.disabled);
    out.queuedWhy = notes();
    const qbox = document.querySelector(".dkpop .toolcheck input");
    out.queuedWindowOff = Boolean(qbox && qbox.disabled);
    return out;
})();
</script>
