<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dist/bundle.css">
<style>html,body{height:100%;margin:0}</style>
<script type="importmap">{"imports":{"preact":"/vendor/preact.mjs","preact/hooks":"/vendor/preact-hooks.mjs","htm":"/vendor/htm.mjs"}}</script>
<div class="shell no-nav"><main class="body" id="root"></main></div>
<script type="module">
// What a codex thread asks, answered on a phone. A round of plan mode on a
// thread that lives in tmux, through the whole screen: it is answered by
// codex's protocol all the same, so a note goes beside a pick, a question
// with no options is a field, and a secret one hides its words. Then a
// question that takes no words of the person's own, picked at a tap; a
// question put away; and a form of an MCP server — its words, its fields of
// every kind, a required one holding it back, no note anywhere, sent and
// declined.
import { h, render } from "preact";
import { html } from "/src/html.js";
import { Chat } from "/src/screens/chat.js";
import { Ask } from "/src/screens/ask.js";
import { GateHost } from "/src/actions/gate.js";
import { setLiveSessions } from "/src/actions/registry.js";
import { ToastHost } from "/src/ui/toasts.js";

const plan = {
    sessionId: "0199c3a2-7f10-7b2e-9c41-6e1d5afc361b",
    toolUseId: "call_plan_1",
    cwd: "/srv/shop",
    questions: [
        {
            id: "clock", header: "Clock", text: "Where should the cart get the time from?", multi: false, other: true,
            options: [
                { label: "A Clock interface", description: "inject it into the cart; tests pass a fixed clock" },
                { label: "now as an argument", description: "each request reads the clock once and passes it down" },
                { label: "Keep time.Now", description: "freeze it in tests with a package variable" },
            ],
        },
        { id: "token", header: "Token", text: "Paste the token of the staging deploy", multi: false, options: [], other: true, secret: true },
    ],
};
const closedQ = {
    sessionId: plan.sessionId,
    toolUseId: "call_plan_2",
    questions: [{
        id: "first", header: "Order", text: "Which file first?", multi: false,
        options: [{ label: "main.go", description: "the entry" }, { label: "util.go", description: "the helpers" }],
    }],
};
const team = ["Checkout", "Payments", "Search", "Platform", "Mobile", "Growth"];
const form = {
    sessionId: plan.sessionId,
    toolUseId: "elicit-7",
    server: "linear",
    message: "Create an issue for the flaky test?",
    questions: [
        { id: "title", header: "title", text: "Title", multi: false, options: [], other: true, required: true },
        { id: "key", header: "key", text: "API key — kept by the server", multi: false, options: [], other: true, secret: true },
        { id: "team", header: "team", text: "Team", multi: false, options: team.map((label) => ({ label })) },
        { id: "priority", header: "priority", text: "Priority", multi: false,
          options: ["Urgent", "High", "Medium", "Low"].map((label) => ({ label })) },
        { id: "assign", header: "assign", text: "Assign to me", multi: false, options: [{ label: "Yes" }, { label: "No" }] },
        { id: "labels", header: "labels", text: "Labels", multi: true,
          options: ["flaky", "ci", "checkout"].map((label) => ({ label })) },
    ],
};

const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } });
const sent = [];
let ask = plan;
window.fetch = async (url, init) => {
    const u = String(url);
    if (u.startsWith("/api/chat?")) return json({ items: [], first: 0, last: 0, total: 0, moreBefore: false, state: { ask } });
    if (u.startsWith("/api/term")) return json({ available: false });
    if (u.startsWith("/api/session/")) return json({ to: "" });
    if (u === "/api/actions") {
        sent.push(JSON.parse((init && init.body) || "{}"));
        return json({ logged: true, ok: true });
    }
    return new Response("", { status: 404 });
};
window.EventSource = class { constructor() { this.readyState = 1; } addEventListener() {} close() { this.readyState = 2; } };

const exec = { available: true, kinds: ["session.answer", "session.dismiss", "session.send", "session.stop"] };
const thread = {
    session: "shop-checkout", sessionId: plan.sessionId, profile: "acme", agent: "codex", transport: "tmux",
    status: "waiting", waitingFor: "input needed", model: "gpt-6-astra", tokens: 41000, limit: 272000, pct: 15, cwd: "/srv/shop",
};
setLiveSessions([thread]);
const root = document.getElementById("root");
const wrap = (node) => h(ToastHost, null, h(GateHost, null, node));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok) => {
    for (let i = 0; i < 150 && !ok(); i += 1) await sleep(30);
    return ok();
};
// Preact binds the handlers after the screen is drawn: two frames pass
// before anything is pressed.
const settled = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
const text = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const sheet = () => root.querySelector(".sheet.on");
const primary = () => sheet().querySelector(".askfoot .btn.primary");
const type = (el, value) => {
    const proto = el.tagName === "INPUT" ? HTMLInputElement.prototype : HTMLTextAreaElement.prototype;
    Object.getOwnPropertyDescriptor(proto, "value").set.call(el, value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
};
const taken = (kind) => sent.filter((s) => s.kind === kind);
// confirm presses the sheet of the gate a dismissal asks on.
async function confirm() {
    const gate = () => root.querySelector('.sheet.on[aria-label="action confirmation"] .btnrow .btn:last-child');
    if (!await until(gate)) throw new Error("the gate did not ask");
    await settled();
    gate().click();
}

// A round of plan mode on a thread in tmux, the way the conversation draws it.
async function round() {
    ask = plan;
    render(wrap(html`<${Chat} name=${thread.session} id=${thread.sessionId} live=${thread} exec=${exec}
                              onBack=${() => {}} onUsage=${() => {}} />`), root);
    if (!await until(() => sheet() && sheet().querySelector(".askopt .askpick"))) throw new Error("the round did not show");
    await settled();
    const out = { label: text(sheet().querySelector(".askhead .asklabel")) };
    const own = sheet().querySelector(".askown .askpick");
    out.own = Boolean(own && !own.disabled);
    const drop = sheet().querySelector(".askdrop");
    out.drop = Boolean(drop && !drop.disabled);

    sheet().querySelectorAll(".askopts .askopt:not(.askown) .askpick")[1].click();
    if (!await until(() => /Paste the token/.test(text(sheet().querySelector(".asktext"))))) throw new Error("no second step");
    await settled();
    const field = sheet().querySelector(".askone .askinput");
    out.second = {
        tag: field ? field.tagName.toLowerCase() : "", type: field ? field.type : "",
        options: sheet().querySelectorAll(".askone .askopt").length,
        label: text(sheet().querySelector(".askhead .asklabel")),
    };
    type(field, "s3cret-token");
    await settled();
    out.secondButton = text(primary());
    primary().click();
    if (!await until(() => sheet().querySelector(".askreview"))) throw new Error("no review");
    await settled();
    out.review = text(sheet().querySelector(".askreview"));

    // Back to the first question for a note beside the pick.
    sheet().querySelectorAll(".askedit")[0].click();
    if (!await until(() => sheet().querySelector(".asknote"))) throw new Error("no field for a note beside the pick");
    await settled();
    type(sheet().querySelector(".asknote"), "and keep the old helper");
    await settled();
    primary().click();
    if (!await until(() => /Paste the token/.test(text(sheet().querySelector(".asktext"))))) throw new Error("no way forward");
    await settled();
    primary().click();
    if (!await until(() => sheet().querySelector(".askreview"))) throw new Error("no review the second time");
    await settled();
    out.sendLabel = text(primary());
    primary().click();
    await until(() => taken("session.answer").length);
    out.sent = taken("session.answer");
    render(null, root);
    return out;
}

// A question that takes no words of the person's own, answered at a tap, and
// one put away; Ask is mounted as the conversation mounts it.
async function closedRound() {
    sent.length = 0;
    const mount = (q) => render(wrap(html`<${Ask} ask=${q} name=${thread.session} exec=${exec} stream=${false} codex />`), root);
    mount(closedQ);
    if (!await until(() => sheet() && sheet().querySelector(".askopt .askpick"))) throw new Error("the question did not show");
    await settled();
    const out = { own: Boolean(sheet().querySelector(".askown")), foot: Boolean(sheet().querySelector(".askfoot")) };
    sheet().querySelectorAll(".askopt .askpick")[0].click();
    await until(() => taken("session.answer").length);
    out.answer = taken("session.answer");
    render(null, root);

    mount({ ...closedQ, toolUseId: "call_plan_3" });
    if (!await until(() => sheet() && sheet().querySelector(".askdrop"))) throw new Error("no way to put it away");
    await settled();
    sheet().querySelector(".askdrop").click();
    await confirm();
    await until(() => taken("session.dismiss").length);
    out.dismiss = taken("session.dismiss");
    render(null, root);

    // The round again, mounted with stream false as a thread in tmux would
    // be by a screen that reads only the transport: a note still goes beside
    // the pick.
    mount(plan);
    if (!await until(() => sheet() && sheet().querySelector(".askopt .askpick"))) throw new Error("the round did not show again");
    await settled();
    sheet().querySelectorAll(".askopts .askopt:not(.askown) .askpick")[0].click();
    if (!await until(() => /Paste the token/.test(text(sheet().querySelector(".asktext"))))) throw new Error("no second step again");
    await settled();
    sheet().querySelector(".askfoot .btn:not(.primary)").click();
    out.noteInTmux = Boolean(await until(() => sheet().querySelector(".asknote")));
    render(null, root);
    return out;
}

async function filled() {
    sent.length = 0;
    render(wrap(html`<${Ask} ask=${form} name=${thread.session} exec=${exec} stream codex />`), root);
    if (!await until(() => sheet() && sheet().querySelector(".askfield"))) throw new Error("the form did not show");
    await settled();
    const s = sheet();
    const out = {
        label: text(s.querySelector(".askhead .asklabel")),
        message: text(s.querySelector(".asktext")),
        notes: s.querySelectorAll(".asknote").length,
        drop: Boolean(s.querySelector(".askdrop")),
        own: Boolean(s.querySelector(".askown")),
        fields: Array.from(s.querySelectorAll(".askfield .askfieldname, .askswitch .nftitle")).map(text),
        required: Array.from(s.querySelectorAll(".askfield")).filter((f) => f.querySelector(".askreq")).map((f) => f.querySelector(".askfieldname").firstChild.textContent.trim()),
        inputs: Array.from(s.querySelectorAll(".askfield input")).map((i) => i.type),
        select: s.querySelectorAll(".askfield select option").length,
        segments: s.querySelectorAll(".askseg .pkseg").length,
        switches: s.querySelectorAll(".askswitch").length,
        heldBack: primary().disabled,
        held: text(s.querySelector(".askformnote")),
    };
    const [title, key] = s.querySelectorAll(".askfield input");
    type(title, "TestCartTotal flakes on a second boundary");
    type(key, "lin_api_123");
    const select = s.querySelector(".askfield select");
    select.value = "3";
    select.dispatchEvent(new Event("change", { bubbles: true }));
    await settled();
    s.querySelectorAll(".askseg .pkseg")[1].click();
    s.querySelector(".askswitch").click();
    await settled();
    const many = s.querySelectorAll(".askfield .askopt .askpick");
    many[0].click();
    await settled();
    many[2].click();
    await settled();
    out.free = !primary().disabled;
    out.after = text(s.querySelector(".askformnote"));
    primary().click();
    await until(() => taken("session.answer").length);
    out.sent = taken("session.answer");
    render(null, root);

    render(wrap(html`<${Ask} ask=${{ ...form, toolUseId: "elicit-8" }} name=${thread.session} exec=${exec} stream codex />`), root);
    if (!await until(() => sheet() && sheet().querySelector(".askfoot .btn:not(.primary)"))) throw new Error("no decline");
    await settled();
    sheet().querySelector(".askfoot .btn:not(.primary)").click();
    await confirm();
    await until(() => taken("session.dismiss").length);
    out.decline = taken("session.dismiss");
    render(null, root);
    return out;
}

window.done = (async () => {
    await document.fonts.ready;
    return { round: await round(), closed: await closedRound(), form: await filled() };
})();
</script>
