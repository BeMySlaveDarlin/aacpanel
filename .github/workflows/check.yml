# The checks that a foreign machine can run. Not all of make check fits here: the
# rest is named out loud in the summary step rather than left for the green tick
# to cover.
name: check

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the running check pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest

    # The same major version as the delivery runs, so that a difference in
    # behaviour is a difference in the code and not in the database.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -q -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      AACP_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      # The version comes from go.mod: the project is delivered as one image with
      # one toolchain, and a matrix here would check what production never sees.
      #
      # Its latest patch, though, and not the exact line written there. go.mod
      # holds a floor, setup-go would take it literally, and govulncheck then
      # reports every fix the standard library has had since — while the image is
      # built from the golang:1.26 tag and gets those fixes. The runner's own
      # copy of the line lags behind a fresh patch by days, so setup-go asks for
      # the latest one rather than taking what the runner has cached.
      - name: which go the module asks for
        id: goline
        run: echo "spec=$(sed -n 's/^go \([0-9]\+\.[0-9]\+\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goline.outputs.spec }}
          check-latest: true
          cache: true

      - name: gofmt
        run: make fmt

      - name: vet
        run: make vet

      - name: build
        run: make build

      # The bundle is built as a check: an error in the screen markup is caught by
      # no test, and there is no npm here either.
      - name: front
        run: make front

      # The frontend fixtures run in a job of their own, beside this one.
      - name: tests
        run: |
          set -o pipefail
          make test-go GOTEST_FLAGS="-v" 2>&1 | tee /tmp/go-test.log

      - name: what ran and what was skipped
        if: always()
        run: |
          deploy/ci/test-summary.sh /tmp/go-test.log --database
          echo
          echo "not in this log at all: the frontend fixtures, which run in the job web;"
          echo "agent-confined, which needs a user systemd manager; and the install from"
          echo "scratch onto a foreign machine."

      - name: govulncheck
        run: make vuln

  # The frontend fixtures are the longest part of the tests and need neither
  # the database nor the rest of the packages: runners of their own take them
  # off the length of the job go, half of the tests on each, every other one
  # by name.
  web:
    name: web ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      - name: which go the module asks for
        id: goline
        run: echo "spec=$(sed -n 's/^go \([0-9]\+\.[0-9]\+\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goline.outputs.spec }}
          check-latest: true
          cache: true

      # The fixtures read the bundle.
      - name: front
        run: make front

      # A runner has four cores, and a fixture keeps about one busy.
      - name: tests
        run: |
          set -o pipefail
          share=$(go test -list . ./web/check/ | grep '^Test' | awk -v n=${{ matrix.shard }} 'NR % 2 == n % 2' | paste -sd'|')
          test -n "$share" || { echo "no tests listed for this share"; exit 1; }
          GOTEST_RUN="^($share)\$" make test-web GOTEST_PARALLEL=4 GOTEST_FLAGS="-v" 2>&1 | tee /tmp/web-test.log

      - name: what ran and what was skipped
        if: always()
        run: deploy/ci/test-summary.sh /tmp/web-test.log --chrome

  scripts:
    name: scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The collector is deployed from the working tree, so a module that does not
      # import is not a broken screen but a service that never starts.
      - name: the collector imports
        run: make agent-import

      - name: agent tests
        run: make agent-test

      # make shellcheck says its absence out loud instead of failing, which on a
      # foreign machine is right and here would be a silent hole.
      - name: shellcheck is present
        run: shellcheck --version

      - name: shellcheck
        run: make shellcheck
