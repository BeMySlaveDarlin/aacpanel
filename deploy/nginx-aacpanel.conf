# Sample nginx configuration for a VPS that publishes the panel. Name the file
# on the VPS after the domain rather than the project.
#
# Replace with your own:
#   panel.example.com  — the domain the certificate is issued for;
#   10.0.0.2           — the address of the panel host as seen from the VPS.
server {
    listen 80;
    server_name panel.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name panel.example.com;

    ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # A pack of files from a phone travels base64 in the body, and this ceiling has
    # to be above what the service counts: uploadBodyMax and maxRequest come from
    # action.FilesBytesMax as FilesBytesMax/3*4 + 64K. The nginx default is one
    # megabyte, and a larger file never reaches the service at all.
    client_max_body_size 48m;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://10.0.0.2:8776;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The tree and the logs come over SSE: buffering would collect them and hand
        # them over in batches, so it is off and the timeout is raised.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
